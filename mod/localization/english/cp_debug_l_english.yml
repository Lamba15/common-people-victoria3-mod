l_english:
 cp_debug.1.t:0 "A Quick Look"
 cp_debug.1.d:0 "A diagnostic dump of Layla's current state — age §Y$cp_age$§!, SoL §Y$cp_sol$§!, literacy §Y$cp_literacy$§!, hope §Y$cp_hope$§!, exhaustion §Y$cp_exhaustion$§!, radicalism §Y$cp_radical$§!, loyalism §Y$cp_loyalist$§!. Tick §Y$cp_debug_tick$§!."
 cp_debug.1.f:0 "This event exists to verify that Layla's country variables are being maintained across save/reload and that the journal entry's monthly pulse is firing. If the §Ytick§! value is not incrementing when you advance months, the pulse hook is silently failing. If the §Yage§! value is not incrementing when you advance years, the yearly pulse is silently failing. Remove this event from the build before v0.2.0 ships."
 cp_debug.1.a:0 "Noted."
