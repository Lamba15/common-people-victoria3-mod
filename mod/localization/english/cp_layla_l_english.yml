l_english:
 # Names
 cp_name_layla:0 "Layla"
 cp_name_alsharif:0 "al-Sharif"
 cp_name_ahmed:0 "Ahmed"

 # ----- Journal entry: cp_je_layla -----
 cp_je_layla:0 "Layla al-Sharif"
 cp_je_layla_reason:0 "@clock! #b age#! #v [Country.MakeScope.Var('cp_age').GetValue|D]#!  ·  [ROOT.GetCountry.GetCustom('cp_layla_sol_tier_icon')] #b SoL#! #v [Country.MakeScope.Var('cp_sol').GetValue|1]#![ROOT.GetCountry.GetCustom('cp_layla_sol_delta_label')]  ·  @popularity! #b hope#! #v [Country.MakeScope.Var('cp_hope').GetValue|D]#!  ·  @paper! #b literacy#! #v [ROOT.GetCountry.GetCustom('cp_layla_literacy_label')]#!  ·  [ROOT.GetCountry.GetCustom('cp_layla_stance_icon')] #b politics#! #v [ROOT.GetCountry.GetCustom('cp_layla_stance_label')]#!  ·  @state! #b home#! #v [ROOT.GetCountry.GetCustom('cp_layla_home_state_label')][ROOT.GetCountry.GetCustom('cp_layla_urban_label')]#!  ·  @peasants! #b pop#! #v [ROOT.GetCountry.GetCustom('cp_layla_pop_group_label')]#!\n\n[ROOT.GetCountry.GetCustom('cp_layla_housing_desc')]\n\n[ROOT.GetCountry.GetCustom('cp_layla_possessions_desc')]\n\n[ROOT.GetCountry.GetCustom('cp_layla_routine_desc')]\n\n[ROOT.GetCountry.GetCustom('cp_layla_savings_desc')]"

 # ----- Events -----

 # cp_layla.1 -- "The Farmer's Daughter" (intro)
 cp_layla.1.t:0 "The Farmer's Daughter"
 cp_layla.1.d:0 "She is awake before the muezzin. She has been awake before the muezzin every morning of her adult life."
 cp_layla.1.f:0 "Her name is Layla al-Sharif and she is twenty-two years old. She would like, if anyone ever asked her — and no one ever has — a roof that does not leak when the flood comes, children who live past the first year, and a slip of paper with her name written on it saying this patch of earth belongs to her. The bey says the earth belongs to the bey. The bey says many things. The sky begins to turn the color of the inside of a pomegranate. She has not asked, in any voice anyone could hear, to be seen. But somewhere, in a small private way she will never know about, she is being seen now."
 cp_layla.1.a:0 "Watch her."

 # cp_layla.2 -- "The Deed" (homesteading granted)
 cp_layla.2.t:0 "The Deed"
 cp_layla.2.d:0 "She holds it. She has waited her whole life to hold it. Her grandmothers waited too."
 cp_layla.2.f:0 "The wax is still warm where the seal pressed it. It is the color of dried blood and it carries her name. Her name. Layla bint Mohamed al-Sharif, of Lower Egypt, on a paper that the law says cannot be taken from her. She stands in the middle of the field and her hands will not stop shaking and the field — green, hers, hers — keeps blurring at the edges. She does not weep. She has not wept for anything before, not the babies she has lost or the brother who never came back, and she will not weep now. But the field will not stop blurring. Somewhere, in a village she will never visit, a man with a name like hers walks past with a paper of his own, and he is also not weeping. The sun is high. The wax is warm. The earth is hers."
 cp_layla.2.a:0 "She holds it carefully."

 # cp_layla.3 -- "The Bey Returns" (serfdom restored)
 cp_layla.3.t:0 "The Bey Returns"
 cp_layla.3.d:0 "He came back today. The law brought him back."
 cp_layla.3.f:0 "She knew before she saw him. The doors of the lane were already shut and the dogs had stopped barking and the boys who play in the dust had been called inside. Then the dust rose at the village edge — the wrong kind of dust, the dust that means horses — and she put her back against the wall and she put her hand on Ahmed's wrist and she did not look up. She has spent her whole life being good at not looking up. There are things one learns in this country that one does not unlearn. The deed is folded in her chest, against the bone, and the deed does not matter today. The bey rides through the lane. He does not need to look at her. He knows she is there. He has always known she was there."
 cp_layla.3.a:0 "She does not look up."

 # cp_layla.4 -- "He Marches" (Ahmed conscripted)
 cp_layla.4.t:0 "He Marches"
 cp_layla.4.d:0 "He left at dawn. He looked back once. War is a thing that, in this country, happens to other people's husbands until one day it does not."
 cp_layla.4.f:0 "He carried a small bundle and a piece of bread wrapped in cloth, and he wore his grey gallabiya because there was no uniform yet — they would give him one in Cairo, or perhaps later, or perhaps never. The other men of the village walked beside him. None of them spoke. She stood at the wall with the other women and she did not lift her hand and she did not call his name, and when the column turned at the bend in the road she watched the dust settle for a long time before she walked back to the house. The house was quiet in a new way. The way a house is quiet when it has begun to understand what it might become. Somewhere, in a city she has never seen, a clerk is writing his name in a ledger no one in this village will ever read."
 cp_layla.4.a:0 "She watches until the column turns."

 # cp_layla.5 -- "The First Cry" (childbirth, mother survives)
 cp_layla.5.t:0 "The First Cry"
 cp_layla.5.d:0 "She lived. The child lived. In this country, in this year, that is two miracles in the same hour."
 cp_layla.5.f:0 "The lamp guttered. She held the small wet weight of him and she did not feel what they had told her she would feel. Her mother had said: you will know him at once, you will feel a love that has no end. She felt instead a slow surprise — a kind of disbelief that her own breath was still moving in her own chest. The midwife dried her hands in the shadow at the foot of the bed. Ahmed, kneeling, would not look at the baby; he would not stop looking at her. She thought, with a clarity that frightened her: I am still here. I am still here, and there is a person in my arms now who needs me to stay. The lamp guttered again. She let it burn."
 cp_layla.5.a:0 "She lets the lamp burn."

 # ----- JE: monthly status, check-on button -----

 # Status variants: three lines each (thinking / doing / hoping). The JE's
 # first_valid block picks one per month based on her life situation and
 # cp_mood_roll (rerolled by on_monthly_pulse, range 1-10; low <=3, high >=7).

 # --- Ahmed at war ---
 cp_je_layla_status_war_high:0 "She is thinking about the letter the postman will bring this month. She is sure of it today.\nShe is kneading dough for two loaves instead of one, because she has decided to believe he is coming home.\nShe is hoping the war will end before the next flood, and she is permitting herself, today, a small hope."
 cp_je_layla_status_war_mid:0 "She is thinking about Ahmed's bread-bowl, which she has not moved from its place.\nShe is grinding dhurra that she used to grind with him kneeling beside her, and the grinding is slower now.\nShe is hoping no official with a clipboard rides into the village this month."
 cp_je_layla_status_war_low:0 "She is thinking about the shaving-water he left in its clay jar. It has gone green. She has not emptied it.\nShe is sweeping a floor that is already swept, because sitting still is the worst of the hours.\nShe is hoping, in the quietest part of her, only to know. Either way. Only to know."

 # --- Under the restored serfdom ---
 cp_je_layla_status_serfdom_high:0 "She is thinking about the deed folded in a pot behind a loose brick, which the bey does not know about.\nShe is plaiting a palm-frond basket in the doorway as the overseer passes, and she has not looked up.\nShe is hoping the laws will turn again — they have turned before — and she means to be alive when they do."
 cp_je_layla_status_serfdom_mid:0 "She is thinking about which of the neighbour women will weep first at the harvest. One of them always does.\nShe is carrying water from the canal. Her back is sore in the old place and also in a new place.\nShe is hoping the yield stretches past the bey's portion — barely — and leaves a handful of grain for her own pot."
 cp_je_layla_status_serfdom_low:0 "She is thinking about her grandmother, who lived under a bey and died under a bey, and is free of beys now.\nShe is doing what she is told, in the order she is told, without looking up. It is an old discipline, and her body remembers it.\nShe is hoping, carefully, not to hope. Hoping is a thing she has learned to ration."

 # --- She owns the field ---
 cp_je_layla_status_homesteader_high:0 "She is thinking about the heron that stands in her irrigation channel, and which belongs, in some way, to the field, and therefore to her.\nShe is walking the border stones in the order she walks them every morning — north, east, south, the crooked one by the canal.\nShe is hoping for a second donkey, and a small school for her children if they live, and she is letting herself say both out loud."
 cp_je_layla_status_homesteader_mid:0 "She is thinking about the word \"mine\", which still does not sit correctly in her mouth, but which she is beginning to say.\nShe is checking the dhurra at the north corner, where the soil is thinnest, and judging whether to bring manure this week or next.\nShe is hoping the flood is kind this year — not too shy, not too fierce — and that the palm-frond roof will hold."
 cp_je_layla_status_homesteader_low:0 "She is thinking about the paper folded against her chest, and whether she has checked it enough times today. She has not.\nShe is inspecting the seam of the wedding chest where the wood has cracked, because she has not yet told Ahmed about the crack.\nShe is hoping nothing will come and take this from her. It is not a specific fear; it is every fear, compressed."

 # --- Widow (Ahmed is gone) ---
 cp_je_layla_status_widow_high:0 "She is thinking about Ahmed's laugh, which she did not write down while he was alive, and which she has begun to forget the exact shape of. Today she remembered a piece of it.\nShe is kneading bread for three instead of four, and the three has begun, this month, to feel like a number she can actually live inside.\nShe is hoping the morning call to prayer comes at the exact hour she expects it. That hour is the one she has taught herself to begin the day at."
 cp_je_layla_status_widow_high_alt:0 "She is thinking about her oldest, who looks more and more like his father with each passing season — and this morning, for the first time, like a man she would like to meet.\nShe is grinding dhurra with the motion Ahmed's mother taught her, which is the motion she has ended up teaching her daughter.\nShe is hoping to have, this week, a small ordinary day of the kind she forgot to enjoy when Ahmed was alive."
 cp_je_layla_status_widow_high_alt2:0 "She is thinking about the year before he left — the quiet year — and permitting herself, this morning, to remember it without grief.\nShe is opening the shutters onto a courtyard she has, year by year, made into a courtyard she likes.\nShe is hoping the daughter-in-law she will have one day is a woman her son chooses, not a woman arranged for him, and she is hoping also to live to see it."
 cp_je_layla_status_widow_mid:0 "She is thinking about the stool he used to sit on, which she has moved to a different corner, and which still knows that it is the stool he used to sit on.\nShe is walking to the well at the hour she used to walk with him, because the hour remains hers even when the walk is now alone.\nShe is hoping the week passes the way a week should pass — with small things in the right order."
 cp_je_layla_status_widow_mid_alt:0 "She is thinking about the widow across the lane, who was widowed before Layla was, and whose face today looks both very lonely and very free.\nShe is dusting the shelf where Ahmed's tobacco-jar used to sit and where it no longer sits, and the dusting has lost almost all of its sharp edge.\nShe is hoping the widow across the lane will come for tea, which is a thing they do now, once or twice a month."
 cp_je_layla_status_widow_mid_alt2:0 "She is thinking about the day the official came to the door, and the particular colour of his donkey, which she remembers more clearly than she remembers what he said.\nShe is doing the daily things at the daily pace, and the pace is hers now — neither his, nor theirs, nor the pace they had together.\nShe is hoping her son writes from wherever he is, which will probably be next week if it is to be any week."
 cp_je_layla_status_widow_low:0 "She is thinking about the shaving-water he left in its clay jar the week he died. It has gone green. She has not emptied it. She is not sure, today, whether she will ever empty it.\nShe is sitting at the quern without working it, with her hands in her lap, and the quiet in the room is the quiet she is learning to live with.\nShe is hoping, only, for the day to pass. Some days are only days to pass."
 cp_je_layla_status_widow_low_alt:0 "She is thinking about the argument they had the month before he left for the war — a small argument, about nothing in particular, which has somehow stayed louder in her memory than any of the good hours.\nShe is sweeping the floor in the pattern his mother used to sweep it, because that pattern has become the only shape her grief is permitted to take.\nShe is hoping nobody comes to the door today. She does not have the strength today for nobody."
 cp_je_layla_status_widow_low_alt2:0 "She is thinking about how the second year of widowhood is harder than the first, in ways she was not warned about, in ways nobody warned anyone about.\nShe is holding a cup of tea that has gone cold, and she is not yet ready to stand and make a fresh one.\nShe is hoping, without quite meaning to, for her mother — who has been dead for longer than her husband has — to walk into the room and sit beside her. It is not a prayer. It is a wish. She knows the difference."


 # --- Wealthy (SoL 30+, Affluent and above) ---
 cp_je_layla_status_wealthy_high:0 "She is thinking about the clock on the wall, whose ticking she does not yet accept as part of the house's natural sound.\nShe is pouring tea into two small cups and adding a pinch of sugar to her own, today, as a thing she permits herself.\nShe is hoping her daughter, who has begun to read in the afternoon, does not yet notice that her mother watches her read."
 cp_je_layla_status_wealthy_high_alt:0 "She is thinking about the merchant in Alexandria who sent Ahmed a letter last week and addressed her by name, which has happened exactly twice in her life.\nShe is sitting by the window — the glass one — with a piece of fabric in her lap that she has not decided whether to sew into.\nShe is hoping the quiet Friday stretches into a quiet Saturday. Two quiet days in a row is new, and she is learning the taste of it."
 cp_je_layla_status_wealthy_high_alt2:0 "She is thinking about the servant-woman, who is on her way, and whose face Layla does not look at for too long because the face is her own from fifteen years ago.\nShe is folding the clean laundry herself, because she has not decided whether to stop folding laundry herself.\nShe is hoping nothing breaks today that she would have to explain to anyone."
 cp_je_layla_status_wealthy_mid:0 "She is thinking about her sister, who visited last month and barely ate, and whether the barely-eating was diplomacy or something else.\nShe is sweeping the courtyard, which has tiles now, and which she could ask the servant-woman to sweep but prefers to sweep herself.\nShe is hoping the postman does not bring the letter from her cousin in the old village that she has, for the third week, failed to answer."
 cp_je_layla_status_wealthy_mid_alt:0 "She is thinking about Ahmed's pocket watch, which he winds every morning with the concentration of a man who does not yet trust the watch.\nShe is preparing dinner with meat in it on a day that is not a festival — a thing she has done for years now, and still notices.\nShe is hoping the children, at supper, will tell her what they did today, and that she will understand most of what they say."
 cp_je_layla_status_wealthy_mid_alt2:0 "She is thinking about the village woman who did not recognise her when she visited last year, and about the particular politeness that was not unkindness but was also not recognition.\nShe is turning over, twice in her hands, an envelope whose inside she cannot read, before putting it on the table for Ahmed.\nShe is hoping her mother's grave, which now has a stone, is the right kind of stone. She does not know who she would ask."
 cp_je_layla_status_wealthy_low:0 "She is thinking about the nine-year-old at the quern, who does not know yet what the afternoon will contain. Layla would like to tell her, and cannot.\nShe is sitting in the middle of a room she has not learned, after some years, to consider hers.\nShe is hoping, without knowing what to hope for, that something will come and restore the proportion of her life."
 cp_je_layla_status_wealthy_low_alt:0 "She is thinking about money — specifically, about how money has a way of making the old griefs smaller in the wrong way, and the old joys smaller in a related way.\nShe is straightening the cushion on the chair that nobody uses, because it is a chair, and because the arranging gives her hands something to do.\nShe is hoping, privately, for a small hardship. It is a thing a woman like her is not supposed to hope for, and she has hoped for it anyway."
 cp_je_layla_status_wealthy_low_alt2:0 "She is thinking about the empty hour between three and four, which in the village used to be full of something — she can no longer remember what.\nShe is rearranging, for the third time this week, the small objects on the low table, because the low table does not know yet how she wants it to look.\nShe is hoping the evening call to prayer comes early today. It is her favourite sound in the house, because it is the only sound she recognises from before."


 # --- Pensioner (age 65+, pension law active) ---
 cp_je_layla_status_pensioner_high:0 "She is thinking about the clerk at the post-office, who greets her by name now — the first man outside the family to do so.\nShe is unfolding the envelope slowly, because the slowness is part of the ritual, and the ritual is part of the month.\nShe is hoping her grandchildren come this Friday. Two of the coins in the envelope are already set aside for sweets they do not know she has bought."
 cp_je_layla_status_pensioner_high_alt:0 "She is thinking about her mother, who died before any such envelope was written, and whose hands were the same shape as her own.\nShe is carrying the coins home in the same cloth pouch she has carried coins home in for forty years, which is an old habit and which she has decided not to change.\nShe is hoping the sun stays as it is today. On days like this the walk back from the post-office is the best hour of the week."
 cp_je_layla_status_pensioner_high_alt2:0 "She is thinking about the queue at the post-office, in which there were seven other women and two men, and about how the seven women did not used to be there.\nShe is counting the coins at the kitchen table, twice, as her father used to count the harvest — not out of distrust, but out of respect for the count.\nShe is hoping her neighbour, who was in the queue behind her today, got what she was owed. She could not see clearly enough to tell."
 cp_je_layla_status_pensioner_mid:0 "She is thinking about the younger women at the post-office, who do not yet know what thirty more years will do to their hands.\nShe is walking slowly, because walking slowly is what this age permits her to do, and she has learned to like the permission.\nShe is hoping the envelope is the usual amount. It has been the usual amount for eleven months, and she has stopped dreading the twelfth."
 cp_je_layla_status_pensioner_mid_alt:0 "She is thinking about Ahmed, or about the absence-shape of Ahmed, depending on the week she is in.\nShe is making tea for one, which is a thing one learns, and which becomes its own small proficiency.\nShe is hoping the postman passes at his usual hour. Mondays he is late; Thursdays he is exact. Today is Thursday."
 cp_je_layla_status_pensioner_mid_alt2:0 "She is thinking about the word §Ypension§!, which she had to learn to say and which still feels foreign on her tongue.\nShe is mending a stocking she has mended four times, because mending it is better than not mending it, and because throwing a thing away has never been her habit.\nShe is hoping the weather holds for the Friday visit. If it rains the children do not come, and she pretends not to mind."
 cp_je_layla_status_pensioner_low:0 "She is thinking about the month the envelope was half what it should have been, and the official letter that explained it in a language she did not quite follow.\nShe is stirring the thin soup that is all the kitchen has today, adding a pinch of the spices her daughter-in-law brought from the market.\nShe is hoping her back stops aching by evening. It has been aching since the second call to prayer, which is earlier than it used to."
 cp_je_layla_status_pensioner_low_alt:0 "She is thinking about dying, not with fear but with the practical interest of a woman who has outlived most of her equals.\nShe is sitting by the window in the chair that has become §Iher§! chair without anyone saying so.\nShe is hoping the envelope this month is not late. Last month's was four days late, and four days, at her age, is a long time to wait."
 cp_je_layla_status_pensioner_low_alt2:0 "She is thinking about the pension that did not exist when her mother was her age, and about the years in which her mother was her age, which were not many.\nShe is refusing to ask for help with the water jar, though the jar is heavier than it was last year.\nShe is hoping the country does not undo this law before her body is done with it. She has seen laws undone before."


 # --- Voter (cp_has_voted, permanent identity shift) ---
 cp_je_layla_status_voter_high:0 "She is thinking about the morning she walked to the polling place, and how the walk was longer than she had remembered when she rehearsed it.\nShe is folding a piece of paper — not the ballot, a different one, but her fingers have learned a new particular fold.\nShe is hoping the result, which will not arrive for weeks, includes at least one name she marked."
 cp_je_layla_status_voter_high_alt:0 "She is thinking about her daughter, for whom the walk to the polling place will one day be a walk not worth remarking on.\nShe is humming under her breath, for no reason her face discloses.\nShe is hoping she lives to see the second vote. The first vote was earned; the second vote is the proof."
 cp_je_layla_status_voter_high_alt2:0 "She is thinking about the men in the queue, some of whom did not meet her eye, and some of whom did — the second group was larger than she had feared.\nShe is walking past the polling place on her errands this morning, glancing at the door, not stopping.\nShe is hoping her name on the rolls has not been crossed off by any clerk between then and now. She will not check, but she will hope."
 cp_je_layla_status_voter_mid:0 "She is thinking about the word §Ycitizen§!, which she has begun to use silently and has not yet dared say aloud.\nShe is kneading the dough with the particular confidence of a woman who now has more names than she used to.\nShe is hoping the next election is a calm one. The last one was calm, by some accounts. By other accounts, less so."
 cp_je_layla_status_voter_mid_alt:0 "She is thinking about the older women in the village who did not live to see this, and about the older women in the village who did live to see it and voted for the wrong man.\nShe is drinking tea at the window, the same cup she drank tea at the window the morning after the day she voted.\nShe is hoping the paper on which her vote was recorded has been kept somewhere. She has not asked where."
 cp_je_layla_status_voter_mid_alt2:0 "She is thinking about Ahmed, who would have had opinions about her vote — some of them useful, most of them predictable.\nShe is folding clothes at the table the day before the market day, the folded pile growing with the slow steadiness of things that can be counted on.\nShe is hoping the boys in the lane, who are loud about politics, have learned by now that the women in the lane have opinions too. They have not. Not yet."
 cp_je_layla_status_voter_low:0 "She is thinking about whether her vote counted, and about how the question, asked silently, has become part of every paper she signs now.\nShe is sitting in the kitchen with the door half-open to the lane, a pose she did not take before the vote but has taken since.\nShe is hoping the papers in the capital are not lost. It is a small hope. She has not grown large hopes in this direction."
 cp_je_layla_status_voter_low_alt:0 "She is thinking about the money she did not have, growing up, to learn to read — and about the particular difficulty of voting for names you cannot read.\nShe is carrying water from the canal with the new awareness that the water is canal water and that the canal was dug by men who did not have to vote to do it.\nShe is hoping the next ballot has the names she knows. If it does not, she will ask the young girl with the school bag to read it for her, and pretend she asked only to hear the girl read."
 cp_je_layla_status_voter_low_alt2:0 "She is thinking about the thin man with the big voice in the village square, who claims to speak for the women of the village, and whom no woman of the village has ever asked to speak for her.\nShe is going on with the work of the kitchen, the same work as yesterday, which is the work that does not know yet that she has voted.\nShe is hoping, without much conviction, that the vote meant something. She will find out in her lifetime or she will not."


 # --- City-laborer's wife (urban + laborer profession, below wealthy) ---
 cp_je_layla_status_citylaborer_high:0 "She is thinking about the shift that ends at six, and about the hour between six and seven when the city is quieter than it is at any other hour, and which is hers.\nShe is walking home from the mill with the specific ache of a good day's work, which is a different ache from the ache of a bad day's work.\nShe is hoping the Friday meal has a piece of meat in it. Sometimes it does, now, which is more than it used to."
 cp_je_layla_status_citylaborer_high_alt:0 "She is thinking about the boy in the tenement across the landing, whose mother works the night shift at the cotton mill and whose door Layla keeps an eye on without being asked.\nShe is climbing the three flights of stairs to the room she shares with her family, which is smaller than the village house was but which, for most hours of most days, has enough in it.\nShe is hoping the letter from the village arrives this week. Her cousin writes about the field, which she has begun, without noticing, to call §Itheir§! field."
 cp_je_layla_status_citylaborer_high_alt2:0 "She is thinking about the new word she heard at the tea-house last night, which was foreign and which everyone pretended to know.\nShe is mending the hem of a work-smock by lamplight, and the lamplight is steadier than it used to be in the village because the lamp is better.\nShe is hoping her daughter, who has learned to read faster than Layla did, reads something tonight that lets her, Layla, hear her daughter's voice reading."
 cp_je_layla_status_citylaborer_mid:0 "She is thinking about the sound the looms make, which she has begun to hear in her sleep, and which she is not sure whether she minds.\nShe is waiting in the line at the water-pump, talking with the widow from Upper Egypt whose stories about her village Layla has come to look forward to.\nShe is hoping the landlord does not knock on the door this month. He is not a cruel man. He is a man who has other cruel men above him."
 cp_je_layla_status_citylaborer_mid_alt:0 "She is thinking about the bread in the city, which is not the bread she used to bake, and which she has begun, this year, to prefer in a way she would not say aloud.\nShe is carrying water up three flights of stairs, the jar balanced on her shoulder the way it used to be balanced on her head, because the stairs will not permit the head.\nShe is hoping the boy at the factory does not lose another finger this month. The manager does not count the fingers. Layla does."
 cp_je_layla_status_citylaborer_mid_alt2:0 "She is thinking about the woman from the next building whose husband was arrested last Tuesday, and who is still in the building, and who still comes down to the courtyard at the usual hour.\nShe is folding clothes in the shared room and trying not to count the clothes, because counting them makes the room feel too small.\nShe is hoping the street tomorrow is quieter than the street today. Some streets are weeks. Some are days."
 cp_je_layla_status_citylaborer_low:0 "She is thinking about the village, specifically the particular evening light in the courtyard of her grandmother's house — a light the city does not have.\nShe is lying in the room after the shift, not yet willing to get up and start the second shift that is dinner and the children.\nShe is hoping, only, that the city does not notice her today. To be noticed by the city is to be taken by it in a small specific way, and she does not have the strength today to be taken."
 cp_je_layla_status_citylaborer_low_alt:0 "She is thinking about the cough that has been in Ahmed's chest for three weeks, which the foreman will not give him leave for, and which the physician will not see without coins.\nShe is climbing the stairs slowly, with the jar against her shoulder, because her knee today is in a bad arrangement with her hip.\nShe is hoping the rent does not go up next month, because the rent going up last month has used the margin they had."
 cp_je_layla_status_citylaborer_low_alt2:0 "She is thinking about the cousin's boy who was hurt at the machine next to hers last year, and whom nobody in the building will name in her presence now, because naming him would be to name the foreman.\nShe is sitting in the dusk with the window open, listening to the street, which is a street that neither hides grief nor honours it.\nShe is hoping for quiet of a kind that does not exist in the city, and knowing this, and wanting it anyway."


 # --- Default: tenant's wife ---
 cp_je_layla_status_tenant_high:0 "She is thinking about the small silver coin under the loose brick, which is closer to a copper pot than it was last month.\nShe is putting a mint leaf in her tea because the plant on the window-ledge has thickened out, and today she is allowed to.\nShe is hoping the merchant in town gives her a fair price for the surplus onions. It does happen, sometimes."
 cp_je_layla_status_tenant_high_alt:0 "She is thinking about the small shoots of mint that have come back on the window-ledge, thicker this year than last.\nShe is grinding a little more dhurra than she needs, because the week will stretch, and it is good to have a second loaf just in case.\nShe is hoping the next two weeks stay as quiet as this one. Two quiet weeks in a row is a luxury she has forgotten to expect."
 cp_je_layla_status_tenant_high_alt2:0 "She is thinking about Ahmed's small laugh last night at something one of the children said — she has not heard the laugh in some months.\nShe is rolling out dough a little thinner than usual, which is a thing one only does on a morning that has room for it.\nShe is hoping, tentatively, for a cool evening and the bread to come out right and the donkey not to bray before dawn."
 cp_je_layla_status_tenant_mid:0 "She is thinking about whether the beans will stretch to Friday, and how long the sack has been thinning for.\nShe is kneading dough on the flat stone, and the stone is warm from the sun.\nShe is hoping the hen that has stopped laying has only stopped for a little while."
 cp_je_layla_status_tenant_mid_alt:0 "She is thinking about Fatma's youngest, who has been coughing for three days, and about whether three days is too long not to fetch the midwife.\nShe is winnowing the dhurra on the flat stone, the dust rising in a slanted beam of morning sun.\nShe is hoping the cough passes on its own. In this village, most of them do, and a few of them do not."
 cp_je_layla_status_tenant_mid_alt2:0 "She is thinking about the mud-brick along the eastern wall, which has begun to crumble where the neighbour's goat rubs against it.\nShe is carrying water from the canal in the smaller jar today, because her right shoulder has been aching in the old place.\nShe is hoping Ahmed has time on Friday to look at the wall before the first rain, which is always earlier than expected."
 cp_je_layla_status_tenant_low:0 "She is thinking about the two babies she lost, and the day each of them would have been born if they had waited to be born.\nShe is sweeping the packed-earth floor in the pattern Ahmed's mother used to sweep it, because the pattern is what the floor wants.\nShe is hoping, only, for a quiet day. A day with nothing in it is a kind of mercy in this village."
 cp_je_layla_status_tenant_low_alt:0 "She is thinking about her younger brother Kareem, whom she has not heard from in eight months — and about the cousin-of-a-cousin who was the last thread she had to him.\nShe is sweeping very slowly today, because the sweeping is the one thing that keeps her hands from shaking.\nShe is hoping, without quite believing it, that Thursday's post-cart carries something for her."
 cp_je_layla_status_tenant_low_alt2:0 "She is thinking about her mother, who died on a day exactly like this one — no wind, the same flat light in the courtyard, the same particular smell of dust.\nShe is doing nothing in particular, and the nothing is not helping.\nShe is hoping only for the afternoon call to prayer to come sooner than it usually does."

 # --- Homesteader: alternate variants ---
 cp_je_layla_status_homesteader_high_alt:0 "She is thinking about the north corner of the field, where the soil has come up darker this spring than it did last spring.\nShe is walking the edge with her sandals off, which is a thing she has not done since girlhood.\nShe is hoping the good years have some depth to them — that they are not only a surface."
 cp_je_layla_status_homesteader_high_alt2:0 "She is thinking about the word §Iours§!, which is plural, and which she has begun to use without rehearsing it first.\nShe is carrying an armful of dhurra stalks toward the threshing floor and she is not counting them as she carries them.\nShe is hoping the youngest, when he is grown, does not remember the year before the deed, and that he takes the field for granted the way free men do."
 cp_je_layla_status_homesteader_mid_alt:0 "She is thinking about the border stones in the south corner, which have moved slightly this season — by whose hand, she does not yet know.\nShe is marking each of the four corners in the morning, the way her grandfather once marked corners she never saw him mark.\nShe is hoping no one at the village council tries to say the stones have moved in the wrong direction."
 cp_je_layla_status_homesteader_mid_alt2:0 "She is thinking about the plough, whose handle split last week, and whether the carpenter can mend it for another season or two.\nShe is oiling the handle of the scythe she has been using for four years, firmly, the way Ahmed's father taught her.\nShe is hoping the wheat stays thick across the whole harvest, not only the first week of it."
 cp_je_layla_status_homesteader_low_alt:0 "She is thinking about the deed, folded in the chest, and whether she has taken it out too many times today. She has.\nShe is inspecting the palm-frond roof where the north edge has begun to leak again, and calculating whether it can wait one more month.\nShe is hoping the landowners in the next village, who have begun riding through at odd hours, are not coming to this village soon."
 cp_je_layla_status_homesteader_low_alt2:0 "She is thinking about the baby they lost in the spring, whose name she does not say aloud, not even to Ahmed.\nShe is standing in the doorway watching the heron in the irrigation channel, who stands in the particular stillness that herons stand in.\nShe is hoping, in a small private way, that the second baby comes."

 # --- Serfdom restored: alternate variants ---
 cp_je_layla_status_serfdom_high_alt:0 "She is thinking about the thinness of the bey's voice lately, and the way the overseer's right hand has begun to shake in the morning.\nShe is plaiting palm-fronds in the corner of the courtyard where she can watch the lane without appearing to watch it.\nShe is hoping the laws turn again — they have turned before — and she means to be alive when they do."
 cp_je_layla_status_serfdom_high_alt2:0 "She is thinking about her grandmother's brother, who died under a bey, and her grandmother's grandson, who might not have to.\nShe is carrying water from the canal at the pace she has carried it all her life — steady, unhurried, not looking at the overseer.\nShe is hoping the next generation does not have to learn the particular silence that she has learned."
 cp_je_layla_status_serfdom_mid_alt:0 "She is thinking about Fatma, who said something yesterday in the lane that was almost political, and about whether Fatma knows she said it.\nShe is sweeping the courtyard slowly, because sweeping is what one does when the overseer has passed in the last hour.\nShe is hoping the words Fatma said do not reach the wrong ears before the week is out."
 cp_je_layla_status_serfdom_mid_alt2:0 "She is thinking about the old women at the market, who have started speaking more quietly even among themselves.\nShe is buying onions from the merchant who does not ask questions, because there are merchants now, she has noticed, who do.\nShe is hoping nothing changes in the next fortnight, which is all the time she can plan for."
 cp_je_layla_status_serfdom_low_alt:0 "She is thinking about the boy from the next village, who was taken last month for something he did not do — and whose father has not been seen since.\nShe is grinding dhurra in the corner of the courtyard where the wall is thickest, the way her mother would have in a year like this one.\nShe is hoping the law's hand reaches past this village in some direction before it reaches this village."
 cp_je_layla_status_serfdom_low_alt2:0 "She is thinking about the taste of grain with fear in it, which is a taste she had forgotten she could recognise.\nShe is doing what she is told, in the order she is told, without looking up — an old discipline, and her body remembers it.\nShe is hoping, carefully, not to hope. Hoping is a thing she has rationed before, and she has been rationing it again."

 # --- Ahmed at war: alternate variants ---
 cp_je_layla_status_war_high_alt:0 "She is thinking about the three men from the village two miles east who came home last week — it is not nothing.\nShe is kneading dough for two loaves instead of one, because she has decided, for today, to believe.\nShe is hoping Thursday's post-cart has a letter with his name on it, or the Thursday after, or the one after that."
 cp_je_layla_status_war_high_alt2:0 "She is thinking about the morning he left, which was a morning like this one in the weather but in no other way at all.\nShe is grinding the dhurra finer than usual, because it was him who used to grind the coarse grain.\nShe is hoping, with some discipline, that this war is shorter than her mother's was."
 cp_je_layla_status_war_mid_alt:0 "She is thinking about the bread-bowl, which she has not moved from the shelf where he set it the morning he left.\nShe is pouring a second cup of tea that she does not drink, because pouring two has become a habit she has not broken.\nShe is hoping the army pays when it says it pays, and that the payment reaches this village this month."
 cp_je_layla_status_war_mid_alt2:0 "She is thinking about the list she keeps in her head — his height, the way he laughed, the small scar above his left eye — which she is refreshing daily so that she does not lose it.\nShe is plaiting a small rug in the evenings because her hands want something to do after dark.\nShe is hoping the weather wherever he is, in the mountains or elsewhere, is kinder than the weather here."
 cp_je_layla_status_war_low_alt:0 "She is thinking about the government clerk somewhere who might be writing his name into a ledger nobody in this village will ever read.\nShe is carrying water she does not need to carry, because sitting still is worse than carrying water.\nShe is hoping the post-cart does not stop at this house, and she is hoping it does."
 cp_je_layla_status_war_low_alt2:0 "She is thinking about the shaving-water he left in the clay jar by the door, which has gone green again. She still has not emptied it.\nShe is sweeping the doorway a third time today. The doorway has been swept, and swept, and swept.\nShe is hoping, in the quietest part of her, only for clarity. Either direction."

