 # ----- cp_layla.7 -- "The Tax Collector" -----
 cp_layla.7.t:0 "The Tax Collector"
 cp_layla.7.d:0 "He comes with a ledger, an inkhorn, and two guards. He comes when the harvest is measured."
 cp_layla.7.f:0 "She knows him by sight, though he would not recognise her if she passed his house in the city. He is younger than Ahmed and he is older than the bey. He reads the number off the page as though the number were the weather — something that simply is, and is not his doing. Ahmed hands across what he has, wrapped in the best cloth they own, which is not very good cloth. The assessor does not look at him. He makes a mark. He makes another mark. He does not look up when he says #italic This year the rate is higher.#! She is standing in the door. She is holding the youngest child on her hip. The child does not yet know the word #italic tax#!. It will be one of the first words the child learns."
 cp_layla.7.a:0 "Pay what is asked."
 cp_layla.7.b:0 "#italic She meets his eyes.#!"

 # ----- cp_layla.8 -- "The Price of the Loaf" -----
 cp_layla.8.t:0 "The Price of the Loaf"
 cp_layla.8.d:0 "The bread costs the same coin this week. There is less bread in it."
 cp_layla.8.f:0 "Ahmed brings home the loaf. He has bought it from Hajj Rashid on the corner, the way he buys the loaf every week. Hajj Rashid had, Ahmed reports, apologised as he handed it across — not in words, exactly, but in the particular way the baker's eyes had refused to meet Ahmed's eyes, which is the way a man communicates an apology he is not, in the current political weather, permitted to say aloud. She takes the loaf in both hands — the weight is wrong. She does not weigh bread; her hands weigh bread. Her hands have been weighing bread since she was nine. She says nothing. She tears a piece for the children. She tears a piece for Ahmed. The piece she tears for herself is smaller than usual and she does not announce this and neither does anyone notice, which is how it has always gone. That night, lying awake, she thinks about the word #italic tax#! and how for the first time in her life she is sure she knows what it means. It means something has been taken from between her teeth before she got there. It means Hajj Rashid has been given, without being asked, a role in taking it."
 cp_layla.8.a:0 "Go to sleep."
 cp_layla.8.b:0 "#italic Curse the ones who decide such things.#!"

 # ----- cp_layla.93 -- "The Law Catches Up to Us" (law_women_in_the_fields) -----
 cp_layla.93.t:0 "The Law Catches Up to Us"
 cp_layla.93.d.peasant:0 "A man from the town reads a paper in the square. The women, he says, are required now. She listens from the doorway, holding the water jar. She has been required since she was seven."
 cp_layla.93.d.city:0 "A notice is posted on the wall of the alley. The women of the household are to be counted among the workers. Her hours — which had been nobody's business — are now, by paper, the state's."
 cp_layla.93.d.default:0 "A paper goes up on the wall. The women, it says, are required. It is not a new thing. It is only that someone has written it down."
 cp_layla.93.f:0 "Ahmed is at the mosque. The children are at her feet. The water jar is on her hip. The man with the paper is speaking slowly because he is speaking to women and he has been told to speak slowly to women, which is the same mistake all such men make — she hears every word the first time and she hears also what lies between them. The paper in his hand is a law. The law says that she, and her sister-in-law, and her neighbour, and her mother when she was young, and her grandmother who was sold to the bey's house and died there, and every woman in the lane and the next lane and the country — that all of them are required, now, to give their hands to the field when the field asks. She has given her hands to the field since she was seven. The difference, she thinks, is that before, the field asked. Now the paper asks. She is not sure which is worse. The paper does not have to sleep at night. The paper cannot be reasoned with at dusk when the water is low and the child is feverish. The paper simply stays — a thing written — and comes back in the morning when you have forgotten it. She turns to go inside. The man finishes his reading. Nobody thanks him. Nobody needs to. He folds the paper. He goes away."
 cp_layla.93.a:0 "#italic Yes. We were already doing it.#!"
 cp_layla.93.b:0 "#italic The state's name for what I do is still not payment.#!"

 # ----- cp_layla.94 -- "A Paper with My Name" (law_women_own_property) -----
 cp_layla.94.t:0 "A Paper with My Name"
 cp_layla.94.d.already_owns:0 "The deed is not a new thing. The law is. Until yesterday she held what was hers on sufferance. Today she holds it by right."
 cp_layla.94.d.widow:0 "The paper is brought to her house. It bears her name. It bears no man's name. She is told that the house is hers — that it has been hers — and that the law now says so out loud."
 cp_layla.94.d.default:0 "The village is told at the well. A woman may now hold a deed, a shop, a field, in her own name. The older women make small sounds — half scoffing, half something else. She makes no sound."
 cp_layla.94.f:0 "She turns the word over in her mouth: #italic deed#!. She has not owned a thing in her life that was not given to her by a man — the water jar was her mother's, the shawl was Ahmed's mother's, the bed was her father's, the house is in Ahmed's name though it was her dowry that helped build the eastern wall. The law says: this can change. She is not naïve enough to think the law is the village. The village is not the law. The village will go on calling her Ahmed's wife when the deed says otherwise. But paper is paper. Paper outlives a man. Paper lasts longer than a harvest; paper lasts longer than a quarrel between brothers. If a day comes — she does not let herself think of that day, and yet she thinks of it — when Ahmed is not here, a paper with her name on it will mean that the house will not be carried off by his brothers. She does not say this aloud. She only turns the word over: #italic deed#!. It sits oddly in her mouth, like a fruit she has not tasted, and is not sure yet whether she will like."
 cp_layla.94.a:0 "#italic So now it is mine.#!"
 cp_layla.94.b:0 "#italic Paper is paper. The village will see.#!"

 # ----- cp_layla.95 -- "They Are Hiring Women Now" (law_women_in_the_workplace) -----
 cp_layla.95.t:0 "They Are Hiring Women Now"
 cp_layla.95.d.city:0 "At the mill gate, a foreman calls the names. A name she knows answers. A woman she knows walks through."
 cp_layla.95.d.village:0 "A letter comes from a cousin in the city. The mills, she writes, have begun to hire women. She writes it twice, underlined both times, so that the pen's meaning cannot be mistaken."
 cp_layla.95.f:0 "She is at the window — of the tenement flat, or the village door; both are the same window in the telling — and she sees her neighbour walk through a gate she had not been allowed to walk through before. The neighbour does not look back. The neighbour does not wave. The neighbour has a lunch tin in one hand and a headscarf tied the way her mother never tied one, and she walks into the mill yard the way men walk into mill yards: without asking. Layla does not know whether she will ever walk through such a gate herself. She is older than the neighbour. She has children. She has Ahmed, or she does not. The question of whether she #italic will#! is separate from the question of whether she #italic can#!. For the first time in her life, the second question has been answered, and she has not been the one who answered it. Somebody in a room she has never seen has answered it. She sits with this a long time. She does not finish her tea."
 cp_layla.95.a:0 "#italic A gate has opened. I will look at it.#!"
 cp_layla.95.b:0 "#italic Ahmed will not like this.#!"
 cp_layla.95.c:0 "#italic The older women will say she has forgotten who she is.#!"

 # ----- cp_layla.96 -- "I Am on the Rolls" (law_womens_suffrage) -----
 cp_layla.96.t:0 "I Am on the Rolls"
 cp_layla.96.d.literate:0 "She can read it herself. Her name is in the list. It is spelled correctly. The ink is fresh enough to smudge if a finger lingers on it."
 cp_layla.96.d.village:0 "A man comes from the town with a book. He reads the names of the women. He reads hers. She does not know what it means, except that he has said her name aloud in a book, which has never happened before."
 cp_layla.96.d.default:0 "The announcement is shouted in the square. The women of the country, they say, are on the rolls. The women in the square do not cheer. They look at each other. They do not know yet what cheering would mean."
 cp_layla.96.f:0 "It is a small thing and it is a great thing. It is a line of ink in a book she will never see, in a building she has never entered, in a city whose streets she has walked in only in her imagination. It says her name. Her name — not her father's name with hers attached at the end, not her husband's name with hers in the margin, but her name, standing alone, the way it has stood only on her tongue all her life. She repeats the name to herself, quietly, the way she repeats a prayer. She thinks: #italic I am on the rolls.#! She thinks: #italic Somewhere in the country, a man is reading my name.#! She thinks of her mother, who died before any such book was written, and whose name is only in her own mouth and in the mouths of the daughters she left, and she thinks: if my mother could have stood beside me this morning, she would have smiled. That is enough. The rest is argument. The rest is the slow walk down a long road. The first stone has been laid. She touches the wall of her house as she goes inside, the way she touched the jamb when she came here as a bride, and the year she was a bride feels, for the first time in a long time, like a shorter distance from today than she had been told."
 cp_layla.96.a:0 "#italic So it has come. Let them read the name.#!"
 cp_layla.96.b:0 "#italic A line in a book. We will see what it is worth.#!"
 cp_layla.96.c:0 "#italic Ink does not fill the stove.#!"

 # ----- cp_layla.97 -- "Her Own Stall" (self-employment crossroads) -----
 cp_layla.97.t:0 "Her Own Stall"
 cp_layla.97.d.forced_widow:0 "The widow's days are counted in small coins. The house will not feed itself on prayer. She must set up at the market, or send the children to a door they will knock on and find closed."
 cp_layla.97.d.forced_poor:0 "Ahmed's wages have not been enough for some months now. The children are not the only ones who go to bed a little hungry. She looks at the kitchen and at the lane and at her hands, and she begins to think."
 cp_layla.97.d.chosen_city:0 "The law has opened the door. Her neighbours are walking through it. The question is not whether it is open; it is whether she will walk."
 cp_layla.97.d.chosen_village:0 "News comes slowly to the village, but it comes. The law that was passed in the city reaches the lane. She hears it at the well, from the older woman who has outlived everyone else and is therefore the first to know everything."
 cp_layla.97.f.widow:0 "She has been a widow for long enough now that the word no longer catches in her throat when she uses it silently of herself. She has also been hungry long enough. The house is a house but a house needs bread in it, and bread needs coin, and coin — this is the part she has been slow to accept — needs labour that she, and not another, performs. The cloth she weaves is good. The bread she bakes is good. The small pickled things she makes with her mother's hand keep for weeks and improve for the keeping. She has been giving these away, in the old habit, to neighbours who were kinder than they needed to be. She thinks now: I will set a stall. A small one. The corner where her cousin used to sell the leather goods, before his son was born and his son became what his son became — that corner is free in the afternoons. She will take it. She is afraid. She is also, for the first time in the months since Ahmed did not come home from wherever Ahmed did not come home from, something that is not afraid."
 cp_layla.97.f.poor:0 "Ahmed's hands are tired. Ahmed's wages are what Ahmed's wages are, and they are not going up. The children are growing. The children are eating more than the children used to eat. The rent on the room, which was once the part of the month she did not think about, is now the first thing she thinks about on the morning the rent is due. She has been turning something over in her head for weeks and she has not spoken it aloud, because to speak it aloud was to have decided. Now she speaks it. She tells Ahmed. Ahmed, to his credit — for all his faults, and they are real — does not say no. He says #italic If it is what you think.#! It is not approval and it is not refusal; it is permission turned inside out, and she takes it. She begins, that afternoon, to lay out on the floor what she has that can be sold."
 cp_layla.97.f.chosen:0 "The law has been passed. The gate has been opened. She has a little money — not a lot, but a little — that she has set aside over the years for no particular reason, which is the only way she has learned to set anything aside. She has a skill. She has, even, a spare hour of the afternoon, which is the rarest thing a married woman with children owns. She thinks about the corner of the market where the women of her mother's generation were never permitted to stand. She thinks about the stall she would set. She thinks about the sign she would paint, if she could paint — which she cannot, not yet. She thinks about whether it would be a shame or a victory, or both, and she suspects that the word for it will not be given to her by any tongue she has grown up with. It will be a word she coins herself, in a language of her own making. For now, the word is simply: #italic yes#!. Or simply: #italic no.#!"
 cp_layla.97.a:0 "#italic Set the stall.#!"
 cp_layla.97.b:0 "#italic Not yet. The house has enough to handle.#!"

 # ----- cp_layla.24 -- "Election Day" (first vote) -----
 cp_layla.24.t:0 "Election Day"
 cp_layla.24.d.literate:0 "The ballot is in her hand. She can read the names. That she can read them at all is its own small election she has already won."
 cp_layla.24.d.default:0 "The ballot is in her hand. She cannot read all the names; the man at the table reads them to her, slowly, so there is no confusion about whose mark goes next to which."
 cp_layla.24.f:0 "She has rehearsed this morning for weeks. She has rehearsed it in her head at the well, at the stove, in the moments before sleep. She had thought the walk to the polling place would feel the way the first walk to her husband's house felt, or the walk to her first child's grave — a walk where the feet know something the mind does not. It does not feel like that. It feels like a walk to the post office on a Thursday. The polling place is smaller than she had imagined. The room is warm. There are men at the table, who are polite; the one who is not polite is outside, muttering, and she does not look at him. She is given the paper. She is given a pencil. She takes a long time to look at the paper. The man at the table waits, because he is paid to wait. She marks one name. She marks another, in the line below. She folds the paper. She hands it back. She is not asked to say whom she voted for; she is not asked anything at all. She is given a word — #italic recorded#! — and the word is meant to be the end of the matter. She walks out. The lane is the same lane. The sky is the same sky. Somewhere inside her, though, a small fact has changed position, the way a pebble in a shoe makes itself known to the foot at the eighth step. She has voted. She will never not have voted. That part is done."
 cp_layla.24.a:0 "#italic So. It is done. I have voted.#!"
 cp_layla.24.b:0 "#italic Too late by a generation. But done.#!"

 # ----- cp_layla.98 -- "The Month Without" (absence-bite: no welfare) -----
 cp_layla.98.t:0 "The Month Without"
 cp_layla.98.d.widow:0 "The rent is due on Thursday. The grain is half what it was last month. The envelope she has heard of, from her cousin who heard of it from a traveller, does not arrive. It does not exist in this country."
 cp_layla.98.d.old:0 "She is old enough that in another country — she has been told — there would be an envelope. There is not an envelope. The month is sixty years of Thursdays, and she has learned the arithmetic of each."
 cp_layla.98.d.default:0 "The rent. The grain. The kerosene. The small repair on the door. She sets the coins on the table in four small stacks. The stacks are smaller than the stacks were last month, and smaller than the stacks were the month before."
 cp_layla.98.f:0 "Her cousin's husband, the one who travels, came through last year. He told them about a country — he named it, she cannot now recall the name — where a woman of her age, in her state, receives an envelope. The envelope arrives, he said, on the first Friday. The envelope contains coins. Not many. Enough. The coins in the envelope, he said, are given by the government — not loaned, not advanced, not charged at harvest, but §Igiven#! — and the word §Igiven#! is a word she had to turn over in her mouth several times before she could swallow it. She has thought of this country since. She has thought of it when she is counting coins on the kitchen table, as she is counting them tonight. She has thought of it when the second-born child is looking at the bread she has cut and pretending the piece is enough. She has thought of it when the door squeaks on its hinge, which she has not had the coin to oil since Ramadan. She is not a woman who fills her head with what does not exist; she is a woman who counts what does. But the word §Igiven#! has lodged somewhere. She is thinking of it tonight. She is thinking also: if an envelope can exist in another country, an envelope can be made to exist in this one. She folds the cloth back over the four small stacks. She will think more, tomorrow, about who in this country might be persuaded to make such a thing. She is not a persuader. She has never persuaded anyone in her life. But she can count. She can count, and she can name what the count comes up short by, and she can — she realises, with a small hot flicker in her chest — she can teach the count to her daughter, who is louder than she is."
 cp_layla.98.a:0 "#italic Let the count be taught.#!"
 cp_layla.98.b:0 "#italic Mother had no envelope either. The grief is old.#!"

 # ----- cp_layla.99 -- "Her Name Is Not on the Deed" (absence-bite: no property rights) -----
 cp_layla.99.t:0 "Her Name Is Not on the Deed"
 cp_layla.99.d.field:0 "The deed to the field is in the chest, folded, and it bears Ahmed's name. It has never borne her name. Under the country's law, it will not bear her name. The field, however, is hers — in every way but this one."
 cp_layla.99.d.shop:0 "The stall she set at the market, which she has stood at every morning for two years, is registered in Ahmed's name, because Ahmed's name is the only name the country's paper accepts. Her stall has her hands on every surface. Her stall has Ahmed's name on the paper."
 cp_layla.99.d.default:0 "The thing she owns in practice — the house, the hearth, the small savings in the jar behind the brick — belongs, under the country's law, to a name that is not her name."
 cp_layla.99.f:0 "She is sorting beans at the kitchen table when the thought comes, uninvited. If Ahmed died tonight — she spits three times over her shoulder, superstitiously, because she does not wish it — the deed would pass to his brother, not to her. The house would pass to his brother, not to her. The field she has worked for thirty years, whose every furrow she knows the way she knows the inside of her mouth, would pass to a man who has come to the village twice in his life and left each time without thanking her for the meal she set. She stops sorting beans. The bean in her right hand is a good bean; the bean in her left hand is a weevilled bean. She sets them both down. She thinks: a deed is a paper, and a paper can be written. A paper can also be changed. The paper that was written before she was born does not have to be the paper that is written when her daughter is married. She picks up the beans. She sorts them more quickly now, the way one sorts beans when one has had a thought one cannot yet speak aloud. She has not said the thought to Ahmed. She will not say it to Ahmed this week. She will, perhaps, say it to her daughter, who is eleven, and who will remember it."
 cp_layla.99.a:0 "#italic The paper can be changed. A daughter will remember.#!"
 cp_layla.99.b:0 "#italic Let the thought go. The beans will not sort themselves.#!"

 # ----- cp_layla.100 -- "A School in the Next Village" (law_public_schools) -----
 cp_layla.100.t:0 "A School in the Next Village"
 cp_layla.100.d.has_kids:0 "The teacher is coming, they say. He will bring the alphabet and a tin of ink. The older children — her older children — may be in the room where the teacher stands."
 cp_layla.100.d.default:0 "The teacher is coming, they say. He will bring the alphabet and a tin of ink. Nobody in the lane has yet seen him, but his name has been spoken at the well."
 cp_layla.100.f:0 "It is the older women who bring the news from the next village. They come back from the Tuesday market with a new word in their mouths: §Imadrasa#!. A school. A room with a roof and a door, and chairs, and a man in a clean shirt with an inkhorn. They tell Layla he has been promised. The country has passed a law, they say, in a voice that carries the old suspicion of anything a country passes, and the room will be built, and a teacher will come, and the children will — well. The older women leave off the end of the sentence. The children will what, Layla thinks, rinsing the basin. The children will know something their mothers did not. The children will, perhaps, read a letter without asking a neighbour to read it for them, the way she has had to ask for every letter that has come to this house since she was a bride. The thought lands somewhere in her chest that is not a place she has let thoughts land before. She does not sit with it long. But she sets the basin down, and she lets herself, for a minute, imagine the room. The room has chairs. The room has a blackboard. The room has her daughter in it."
 cp_layla.100.a:0 "#italic Let the room be built.#!"
 cp_layla.100.b:0 "#italic We will see if the teacher comes.#!"

 # ----- cp_layla.101 -- "They Will Be Taken to the School" (law_compulsory_primary_school) -----
 cp_layla.101.t:0 "They Will Be Taken to the School"
 cp_layla.101.d.has_kids:0 "The notice is read in the square: every child will go. Not some. Every. The field will lose hands. The children will gain letters. She sits with this."
 cp_layla.101.d.default:0 "The notice is read in the square: every child will go. She has no child to send; she imagines the child she did not have, in a chair with ink on her fingers."
 cp_layla.101.f:0 "The man from the town reads it at noon. His voice is formal. The law is formal too. Every child, he says, between seven and eleven years, male or female, will attend the school. Exemptions will be granted — rarely. Fines will be levied — readily. She hears the word §Ifines#! and she knows, in her bones, what §Ireadily#! means when it comes to the collecting of fines from families like hers. She hears also the words §Imale or female#!, and she notices that she has not heard those two words in that arrangement before, in any statement made by a government, in any year of her life. She rolls the dough flat on the board without looking at it. Nūr is eight. The boy, if he had lived, would have been five. She had imagined, quietly and without speaking of it, that Nūr would go to school — if the rumour of the teacher became a teacher, if the promised room became a room, if the years and the harvests and the coins allowed. She had not imagined that Nūr would go because the law required it. There is a difference. The difference has cost. Nūr's hands, after school, will come home without the calluses they would have had. The field will need a hand Nūr is no longer providing. Another daughter-to-be, she thinks, may not be born this winter — they will not be able to afford a new dependent with a worker leaving. The arithmetic rearranges, in her head, on the board, while she rolls. But Nūr, she thinks, will read."
 cp_layla.101.a:0 "#italic Let her be taken. Let her read.#!"
 cp_layla.101.b:0 "#italic The field will feel her absence. So will we all.#!"

 # ----- cp_layla.102 -- "The Daughter's Letter" (daughter reads to her) -----
 cp_layla.102.t:0 "The Daughter Reads"
 cp_layla.102.d:0 "Nūr sits cross-legged on the floor with a letter in her hand. The letter is from Mariam, Layla's cousin in Cairo, whose name Layla cannot herself read. Nūr, eight years old, reads the letter aloud."
 cp_layla.102.f:0 "Nūr's voice is careful. She does not know, yet, that the voice she uses for the reading is a voice she has inherited from her mother — from every grandmother before her mother — who for generations leaned over the shoulder of a literate neighbour and whispered §Iwhat does it say, what does it say#!. Nūr uses the voice unconsciously. Layla, listening, knows what it is. The letter is nothing particular. Mariam writes about a field, and about a boy who has been ill, and about a funeral she was not able to attend because of the distance. Nūr reads the words slowly — she does not yet have the fluency her mother will not live to see her achieve, which will come in another year, perhaps two — and Layla closes her eyes, which is the thing a blind woman does, and which she is not blind but has the same reason. She does not want to look at Nūr. She does not want Nūr to see the face she is making. The face is the face a woman makes when a thing she did not know she had been waiting for arrives, and arrives early, and arrives through the mouth of her own child. When Nūr finishes, Layla opens her eyes. She says: §IThank you.#! Nūr shrugs the shrug of a child who has been thanked for something that was small to her and very large to the thanking. Nūr, she realises, does not yet understand that the reading was not small. Nūr will understand. Nūr will, God willing, have a daughter of her own, who will not require the explanation."
 cp_layla.102.a:0 "#italic Let the reading continue. Let it carry, past me, into her.#!"

 # ----- cp_layla.103 -- "The Chains Are Cut" (law_slavery_banned) -----
 cp_layla.103.t:0 "The Chains Are Cut"
 cp_layla.103.d:0 "The decree is read in the square. The compound at the edge of the village — the one nobody in the lane has ever entered — is to open its doors. The people inside are to walk out."
 cp_layla.103.f:0 "She has walked past the compound since she was five. She has never entered. She has never, before today, thought about whether the wall she walked past was a wall her own village built, or a wall someone else built and her village agreed not to notice. Today the gate is open. She goes, because everyone goes. She goes carrying water, so that she has something in her hands if anyone asks what she is doing there. A number of people she does not know come out of the gate. Some of them are older than her. One is her age, exactly. One is a child. The child is holding the hand of a woman the child looks nothing like, and Layla understands that the woman is not the child's mother, and that the two of them will, now, have to find a way to be people in a country that was not prepared for them to be people outside that gate. The child looks at Layla. Layla meets the look. She does not know what to say. She says §Ipeace be upon you#! — she says it the way she says it at the mosque, at the grave of her mother, to the stranger on the road at dusk — and the child, who has probably not heard the phrase said in that tone to the child's face, nods. Layla nods back. She walks home. At home she does not speak of it. She holds it in her chest the way she holds the best news and the worst news equally, until she has decided which it is. She decides, by evening, that it is both."
 cp_layla.103.a:0 "#italic Peace be upon them. Peace upon the country that finally chose this.#!"
 cp_layla.103.b:0 "#italic I was never in that gate. But I was never very far.#!"

 # ----- cp_layla.104 -- "The Compound on the Edge of the Village" (pulse: slavery legal) -----
 cp_layla.104.t:0 "The Compound on the Edge of the Village"
 cp_layla.104.d.child:0 "She passes the wall again today, carrying water, and today she looks at it. She has not always looked at it. Today she does."
 cp_layla.104.d.older:0 "She has walked past this wall for forty years. She has stopped making a study of not noticing it. Today she notices it. Tomorrow she will likely not."
 cp_layla.104.f:0 "The wall is high but not that high. A person could, in theory, see over it if the person were tall enough, which she is not. The wall is plaster over mud-brick, the ordinary construction of this ordinary country, and behind the wall there are people whose lives are not ordinary and who are owned by other people who are ordinary. She carries the water. She does not slow down. She has never, in her life, slowed down at this wall. Slowing down at this wall, she has been taught — not explicitly, but the way one is taught most things — is a way of asking a question one does not yet have the right to ask. She thinks, as she walks: I am a peasant. I have been a peasant since I was born, and my mother was a peasant before me, and her mother, and the ancestor whose name is carried in the family line like a long breath. I have been worked hard and I have been fed thinly and I have buried children and I have stood in the doorway when the bailiff came. I am not a slave. I know, without examining it closely, that not being a slave is a thing. I know, also, that the knowing is uncomfortable, and I do not examine it more closely than I have just now examined it. She passes the wall. She does not look at it. She carries the water home."
 cp_layla.104.a:0 "#italic Peace upon them. God remembers.#!"
 cp_layla.104.b:0 "#italic I am a peasant. I am not that. And the thinness of the comfort is its own knowledge.#!"

 # ----- cp_layla.25 -- "The First Day of Ramadan" -----
 cp_layla.25.t:0 "The First Day of Ramadan"
 cp_layla.25.d:0 "The call to dawn has been adjusted. The mouth remembers what it is not doing before the mind does. The first day of Ramadan is a small argument between the body and the calendar, and the calendar wins."
 cp_layla.25.f:0 "She has done this forty times. Her body does not, each year, remember doing it. Each year, on the first day, the body is surprised. It looks around noon for the water it has had at noon for the other eleven months of the year, and the water is not there, and the body — her body, the body of a woman who knows her body as she knows the kitchen — the body sulks briefly, and then remembers. The remembering takes until the third day. From the third day to the last day it will be the ordinary discipline. From the last day to the feast it will be the ordinary anticipation, like the last hour of a long walk home. But the first day is the first day. She is sitting in the courtyard. She is not working; she is letting herself, for the morning of the first day, do nothing. She watches the neighbour's cat stretch in the one patch of sun that reaches the ground here this hour. She notices that her own stretching, when she does it, is shorter than the cat's. She thinks: §IThe cat has not been told what the month is, and the cat does not care what the month is.#! She thinks: §IAnd yet the cat's day is not wrong. The cat's day is not less the day, for not being told.#! It is the kind of thought the first day of Ramadan gives her. She does not share it with anyone. By the second day she will have forgotten she thought it. By the third day she will have begun the ordinary thirty."
 cp_layla.25.a:0 "#italic The first day. The hardest. Also the most remembered.#!"

 # ----- cp_layla.26 -- "The Nile Rises" -----
 cp_layla.26.t:0 "The Nile Rises"
 cp_layla.26.d.good:0 "The water is high. The silt is the dark colour of a good flood year. The men in the lane are quieter than usual, which is how they are when they are grateful."
 cp_layla.26.d.bad:0 "The water is not as high as it should be. It is not the failure year, but it is not the year her grandfather would have boasted about either. The men are careful about what they say aloud."
 cp_layla.26.f:0 "She has lived long enough to know the four kinds of flood year: the year too much (the bad year — the river takes houses), the year too little (the bad year — the river takes harvests), the year ordinary (the word the older women use, which her mother used, which means §Inothing to complain of, nothing to boast of, carry on#!), and the year good, which is what happens when the river does what the river did when the ancestors were young, and the silt comes up the colour of wet tea leaves, and the edge of the field is lined with a richness that will carry into the next harvest and the one after that. She walks with Ahmed — or with the memory of Ahmed; the walk is the same either way — along the edge of the irrigation channel. The water is the water, and she reads its colour, as she reads every year, with the slow attention she would bring to a letter from an old friend. She says nothing. He — or his memory — says nothing. The river has been doing this for thousands of years before Layla's family was a family, and it will be doing this thousands of years after she is gone. The respect she feels, walking here, is not sentimental; it is the respect of one person passing another who has outlived and will outlive her."
 cp_layla.26.a:0 "#italic The river will do what the river does. God willing, the silt is dark.#!"

 # ----- cp_layla.27 -- "The Hajj Returnees" -----
 cp_layla.27.t:0 "The Hajj Returnees"
 cp_layla.27.d:0 "The cousin is back from Mecca. The lane is fuller today than on ordinary days. Everyone with a hand free carries sweets."
 cp_layla.27.f:0 "The cousin is two lanes over — not actually her cousin, by blood, but the word §Icousin#! has the elasticity that it has everywhere in this village — and he has come back from the Hajj with a changed face and a slightly lighter gait, which are the two things Layla has learned to look for in a returnee. He embraces Ahmed. He embraces Layla's uncle. He does not embrace Layla, who is a married woman; he greets her from across the courtyard with the upheld palm that means §Ipeace#! in a way that does not cross the threshold of her kitchen. She understands the gesture. She returns it, from the threshold. He distributes dates. The dates are not from Mecca — dates from Mecca would be a theatrical lie — but they are dates, and they are given with the right hand, and they are eaten with the right hand, and the gesture of giving and receiving is itself a kind of small pilgrimage between two hands that is supposed to remember the large one. She takes a date. She eats it slowly. She does not say anything aloud about whether she wishes, privately, that she could have made the journey herself. She has wished this. She has wished this for years. She has not wished it loudly. The date, she notices, is good."
 cp_layla.27.a:0 "#italic Peace upon the returnee. Peace upon the journey he made for us all.#!"

 # ----- cp_layla.28 -- "The Midwife's Lamp" -----
 cp_layla.28.t:0 "The Midwife's Lamp"
 cp_layla.28.d:0 "A lamp moves along the lane in the small hours. The midwife is going somewhere. Layla wakes, as the women of the lane wake, at the shape of the light through the slats."
 cp_layla.28.f:0 "It is the third hour after midnight. The wick in the lamp is the wick Layla herself trimmed for Badr last Tuesday, because her hands are better at the trimming than Badr's hands are any more, which is a thing neither of them has said aloud. The lamp moves. It pauses at a door — she can tell whose door, by the angle of the pause — and the door opens, and the lamp goes in, and the lane goes dark again. Layla lies awake for a moment longer. She does not get up. There is nothing, in this hour, for her to do. But she says, in her head, the small prayer she says when a woman in the lane is beginning the hours that are hers alone and no one else's. The prayer is for the mother, because the mother is what Layla was three times (or four times, or two — depending on the year she is in), and because she knows the hours. The prayer is also for the child, because the child is the thing the mother is doing the hours for. The lamp does not come back out before Layla sleeps. In the morning she will ask, at the well, and the woman at the well will tell her, and Layla will add whichever name she is told to the long list in her head of names she has prayed beside, across forty years of this village's quiet dawns."
 cp_layla.28.a:0 "#italic God keep the mother. God keep the child.#!"

 # ----- cp_layla.29 -- "The Date Harvest" -----
 cp_layla.29.t:0 "The Date Harvest"
 cp_layla.29.d:0 "The boys have gone up the palms. The dates have fallen onto the cloths. The women sit in the courtyard and sort the good from the split."
 cp_layla.29.f:0 "The boys are not very good at going up palms. They have not had enough palms to practise on. Her grandfather would have been appalled by the clumsiness. Her grandfather also did not live long enough to be appalled by much, which is a fact she carries — not bitterly, not any more — the way she carries her mother's age at death, the way she carries the exact height her uncle reached when the fever finished him. The boys, for all their clumsiness, come down with cloths that are heavy enough. They tip the dates onto the large mat in the courtyard. The women begin. Layla's hands sort the way her mother's hands sorted. Good into this basket. Split into this basket (for the goats). Soft into this basket (for the sweet for Eid). Black-spotted into the small basket (for the medicine she will make and trade with the woman at the south end of the lane for the one thing that woman makes that Layla cannot). The sorting is unhurried. The sorting is conversation, or it is silence — whichever the afternoon wants. Today it is mostly silence. The sound is the sound of dates falling through fingers into baskets, and the sound of the palm fronds in the low breeze, and the sound, distant, of one boy laughing at another boy at the top of a tree. She thinks: §IThe year the last date is sorted in this courtyard will not be a year I see.#! She thinks: §IAnd the sorting will go on.#! It is a thought that, at her age, does not hurt."
 cp_layla.29.a:0 "#italic Let the sorting go on.#!"

 # ----- cp_layla.33 -- "The Cup of Coffee" (coffee circulating) -----
 cp_layla.33.t:0 "The Cup of Coffee"
 cp_layla.33.d:0 "It has arrived in the market, they say. Black. Bitter. Drunk from tiny cups. The old men in the coffeehouse have begun to smell of it."
 cp_layla.33.f:0 "She has heard of it for years. Her uncle came back from Cairo once with a small cloth sack that smelled strange, and he brewed it on her mother's stove, and her mother tasted it once, carefully, and said — with a straight face that took Layla three days to read properly — that she preferred tea. Layla's uncle laughed. The sack was finished within the week, shared among the men in the coffeehouse, and the sack was the end of the coffee in Layla's life until this afternoon. This afternoon there is coffee in the market. Not Cairo coffee — Yemeni, apparently, or something close — but coffee. She buys a small measure. She has it in a paper twist in her pocket. She will brew it after supper, on the small brazier in the corner. She will drink one cup slowly. She will decide, after the cup, whether it is a thing she likes, or a thing she does not like, or a thing she is not yet ready to know whether she likes. The decision will be hers. That — the decision will be hers — is a thought she has, turning it on her tongue the way she will, in an hour, turn the liquid on it."
 cp_layla.33.a:0 "#italic Let the cup come. Let me decide alone.#!"

 # ----- cp_layla.34 -- "The White Sugar" (sugar cheap) -----
 cp_layla.34.t:0 "The White Sugar"
 cp_layla.34.d:0 "The sugar at the merchant's was a quarter what it was last year. She bought a hand of it. In the kitchen it sits on the shelf in a clean jar, an impossibly white powder that looks, she thinks, like nothing she has ever eaten."
 cp_layla.34.f:0 "Her mother taught her to sweeten things with dates, or date-syrup, or the occasional small spoon of honey the bee-keeper's son traded for the barley she set aside for him every spring. Her mother did not use sugar. Sugar was for the bey's table. Sugar was a substance in other women's stories, along with the coral earrings and the silk thread. Now there is sugar in her kitchen. The jar is white. The powder is white. She adds a pinch to the bread dough on Friday — a pinch, no more — and the bread on Friday tastes, to her surprise, not like her mother's bread, but like the bread she will, she realises, make from now on. She wonders whether her daughter will know, one day, that there was a kitchen — Layla's mother's kitchen — where the sugar was not. She wonders whether she should tell her. She decides she will tell her. Some things should be remembered, even the ones that are losses. Especially those."
 cp_layla.34.a:0 "#italic Let the sugar stay in the jar. Let the memory of the kitchen without it stay too.#!"

 # ----- cp_layla.35 -- "The Cloth from the Port" (fabric affordable) -----
 cp_layla.35.t:0 "The Cloth from the Port"
 cp_layla.35.d:0 "A bolt has arrived at the merchant's. It is thin, well-woven, dyed a blue she has not seen on a body in this village. She touches it once. She thinks about it for three days."
 cp_layla.35.f:0 "The bolt was brought up-river from Alexandria. The merchant says — she has no way of verifying — that it was woven in a mill near Manchester, which is a word that means nothing to her except that she has heard it in her husband's brother's stories about Cairo, where men know such words. The bolt is cheaper than any cloth she has owned. She has not yet decided whether to buy a length of it. She has already, in her head, decided what she would sew from the length: a shirt for Ahmed, or for her daughter, or an overdress for Friday, depending on the week. She will go back to the merchant tomorrow. She will touch the bolt again. She will, probably, buy one length. She has learned, this year, that she is allowed to buy one length of cloth a year that is not strictly needed. It is a thing the stall has taught her. She is, she thinks — folding the apron at the end of the day — a woman who has permissions her mother did not have. Not many. A few. And the permissions are hers not because the country gave them to her, but because she worked for them. The cloth, when she sews from it, will carry the memory."
 cp_layla.35.a:0 "#italic Tomorrow I will buy one length. One length is a thing a woman can do.#!"

 # ----- cp_layla.72 -- "The Suitor" (daughter's marriage crossroads) -----
 cp_layla.72.t:0 "The Suitor"
 cp_layla.72.d.literate:0 "Nūr is nearly sixteen. She can read. She has an opinion about the two suitors at the door, and she has not been shy about it. The three women of the house — mother, grandmother, Nūr — are sorting lentils together, which is the cover the kitchen is using for the conversation that is actually happening."
 cp_layla.72.d.default:0 "Nūr is nearly sixteen. Two suitors have come. The mother and the grandmother are sorting lentils together at the low table, which is the cover the kitchen is using for the conversation that is actually happening."
 cp_layla.72.f:0 "The first is the second son of the family three lanes over — the family whose mother died the year Layla's own mother died, and whose father married again within the year, which Layla's mother would not have done. The boy is twenty. He has all his teeth. He works the field with his uncle. He is, by the standards Layla grew up being told to apply, a good match: close by, of the same class, of a family Nūr already knows the kitchen of. The second is a cousin of Ahmed's cousin — the city one — a boy she has never met. He works in a merchant's shop in Cairo. He is nineteen. He reads, they say. He has a small room above the shop that he will, one day, own. The question is whether the small room becomes a whole house. The question is whether Nūr, who has been taught by Layla to knead dough and to weigh a weevilled bean against a sound one, will be at home in a small room in a city she has not yet seen. The question is also, Layla thinks, whether Nūr is already a slightly different woman than the village would have her be. She looks across the lentils. Nūr is looking at her. The grandmother, who is from another generation and has opinions, is — for once, thank God — keeping them until asked. The decision is Layla's and Ahmed's. Ahmed has said — privately, last night — that the decision is hers. She looks at the lentils. She thinks about the village. She thinks about the city. She thinks about Nūr's face."
 cp_layla.72.a:0 "Marry her to the village boy. She will be in the lane."
 cp_layla.72.b:0 "Marry her to the city boy. She will rise."
 cp_layla.72.c:0 "Refuse them both. She is not ready. Or we are not."

 # ----- cp_layla.105 -- "Every Man, They Say" (law_universal_suffrage) -----
 cp_layla.105.t:0 "Every Man, They Say"
 cp_layla.105.d.voter:0 "The country has opened the vote to every man. She, who already votes, stands at the door with her work-basket and watches the men of the lane absorb what has just become theirs."
 cp_layla.105.d.not_yet:0 "The country has opened the vote to every man. The women, they say, will come after. She stores the sentence the way she stores a dried herb — folded, labelled, on a high shelf."
 cp_layla.105.f:0 "The man from the town reads the decree in the square. The men of the lane stand quietly as he reads. When he finishes, nobody cheers. Some of them, the younger ones, look at each other and almost smile. The older ones, the ones who remember the last three times a decree was read and what followed — the taxes, the conscription, the bailiff's demands — do not smile. They do the little nodding gesture that means §Ilet us wait and see what this actually means#!. Layla, who is standing at the door of her house with the basket on her hip, thinks: §IThe men have gotten what they have always assumed they deserved and had been, on paper, withheld from having. My mother's brother will now vote for the man his cousin tells him to vote for. The bey's steward, who has always voted, will now vote alongside my mother's brother, which is different from what the bey's steward is accustomed to, and which will adjust — over the decades — something in both of them.#! She thinks: §IThis is a slow thing. This is not a celebration. This is the start of a settling.#! She turns back into the kitchen. She has bread to bake. The country's arithmetic has, on paper, been adjusted. The bread, she notes, is unaffected."
 cp_layla.105.a:0 "#italic Let the arithmetic settle. It will, over years.#!"
 cp_layla.105.b:0 "#italic The men did not vote before. They do now. I will see what they do with it.#!"

 # ----- cp_layla.106 -- "The Poster on the Wall" (law_single_party_state) -----
 cp_layla.106.t:0 "The Poster on the Wall"
 cp_layla.106.d:0 "The poster is new. The paper is the colour of old cream. The slogan is short. The man at the coffeehouse reads it aloud and then, having read it, nods as though he had said it himself."
 cp_layla.106.f:0 "She walks past the poster three times on the Tuesday market morning — once going, once returning, once again on the errand she had forgotten to do on the first pass. The poster is pasted to the wall of the post office. The paper is good; it will not come down in the rain. The letters are large. The slogan — she can make out about half of it; her literacy is still imperfect at large-letter script — says something about unity and something about the nation and something about the father of the country. The father of the country is the ruler, or someone the ruler has placed, or someone who replaced the ruler; she no longer follows the exact arithmetic. She finds, on her third pass, a man from the town, whom she does not know, standing before the poster with a clipboard and counting the people who stop to read it. She does not stop. She walks on. In the coffeehouse, on the way home — she is not going in, but she passes the open door — she hears a man she has known since he was six years old saying, too loudly, that the country is now one body with one heart. She recognises the sentence. She has heard it before, in other months, in other years, from different mouths. The sentences that are repeated aloud by many mouths are often not the sentences the mouths would have chosen on their own. She notes who else is in the coffeehouse. She walks home. She does not repeat the sentence to Ahmed. Ahmed, who is sorting the small things from the morning, does not ask."
 cp_layla.106.a:0 "#italic Lower the head. Carry on. The poster will peel, or it will not.#!"
 cp_layla.106.b:0 "#italic Mark the faces of the ones who shout loudest.#!"

 # ----- cp_layla.107 -- "The Coptic Neighbour Exhales" (law_multicultural) -----
 cp_layla.107.t:0 "The Coptic Neighbour Exhales"
 cp_layla.107.d:0 "Um Yusuf, the Coptic woman on the north end of the lane, is fetching water at the same hour as Layla today. She is fetching it more slowly than usual, and with — Layla notices — a set to her shoulders that Layla has not seen in thirty years."
 cp_layla.107.f:0 "Layla has shared this well with Um Yusuf since they were both brides. Um Yusuf's Arabic is the Arabic of the quarters behind the old church; Layla's is the Arabic of the fields above the canal; the two dialects differ in the small ways that two women who have lived four houses apart for thirty-two years have long since stopped noticing. Today, at the well, Um Yusuf does not do the two specific things Layla has seen her do every other week: Um Yusuf does not look back over her shoulder when a man she does not know passes on the road; and Um Yusuf does not, when the bucket is full, hurry. She takes her time. She fills two jars instead of one. She sets one jar on her hip with the left hand, the way Layla has also learned to set a jar on her hip with the left hand, and she walks back toward her house at the pace of a woman who is not being rushed. Layla, filling her own jar, thinks: §ISomething has shifted for her. Not in the lane — the lane has not changed today — but somewhere upstream of the lane, in the country, a paper has moved.#! She thinks: §IMy neighbour's shoulders have gone down. That is the test. That is always the test.#! She nods to Um Yusuf. Um Yusuf nods back, slightly longer than she did last week. The two women go, each to her own house, each with the knowledge that the day was slightly better than the day before it had been."
 cp_layla.107.a:0 "#italic Let her shoulders stay low. Let the country keep the law.#!"
 cp_layla.107.b:0 "#italic A paper law is not a village. We will see.#!"

 # ----- cp_layla.108 -- "The Doctor at the Mosque" (law_charitable_health_system) -----
 cp_layla.108.t:0 "The Doctor at the Mosque"
 cp_layla.108.d:0 "A doctor has been installed at the mosque. He sees the sick on Fridays, after prayer. He does not charge. His instruments are old. His hands are steady."
 cp_layla.108.f:0 "The news travels in the way health news travels: by a woman at the well saying §IUm Khaled took her boy there, you know,#! and another woman nodding slowly, as one nods at a thing that is not yet sure. Layla has, this week, taken her own uncle Khaled there — Khaled with the cough that has not shifted in two winters. The doctor at the mosque, a young man with an older man's eyes and a bag of instruments older than his own face, gave Khaled an infusion and a blessing. The cough has not, by the next week, fully gone. But it has, Layla notes, quieted a little. And quieted a little is more than the cough has done in any of the other winters Khaled has had it. Layla knows that §Ipaid nothing#! is a partial truth. She knows the mosque is paid by a ledger she has not read, and the doctor by a sheikh who is paid by a committee she has never met, and somewhere upstream of all of that there is a country that has decided to let this money flow toward the doctor at the mosque rather than into a road, or a cannon, or a palace repair. That is a choice. She is glad the choice was made. She does not mistake the choice for love. She files the doctor at the mosque in the column in her head marked §Ithings that the country does, which the country could choose not to do, and which today the country is doing.#! It is not a long column. It is a little longer now."
 cp_layla.108.a:0 "#italic Bless the doctor. Bless the mosque. Bless the committee that sent him.#!"
 cp_layla.108.b:0 "#italic Only Fridays. Only one hand at a time. We will see what it becomes.#!"

 # ----- cp_layla.109 -- "The Man with the Bag" (law_private_health_insurance) -----
 cp_layla.109.t:0 "The Man with the Bag"
 cp_layla.109.d.can_afford:0 "The insurance-man comes through the lane with a leather bag and a printed contract. He explains, twice, what she is signing. She signs. The premium is not small, but neither is it ruinous."
 cp_layla.109.d.cannot:0 "The insurance-man comes through the lane. He shakes her hand, politely. He tells her, politely, that her household does not qualify. He moves on to the house with the better door."
 cp_layla.109.f:0 "He is a man of about forty, wearing the clean shirt and the small hat that marks a man from the town. He carries his bag on the left shoulder. He walks with the slightly bent-over posture of a man who has walked a great deal and has begun, lately, to notice it. Layla watches him from her step. She does not call him over. She does not need to. He has a list. The list tells him whose houses to stop at and whose houses to walk past. Today he walks past hers. He walks past Khaled's, too — Khaled, whose cough has not shifted, whose house is the one after Umm Mariam's — and Khaled watches from his own step as the man with the bag walks past, and Khaled says nothing, because Khaled has been Khaled all his life and is not about to begin, at sixty-three, to call across a lane at a man who has decided not to stop. Tomorrow — if things go the way things have lately been going, which she has learned not to presume — tomorrow the man may stop at hers. He does not stop today. She does not resent him for it. She resents, in a low and steady way, the list. The list was written in a room she will not enter, by a clerk she will not meet, based on a rule she has not read. The rule decided, this morning, that she was a person whose door to walk past, and Khaled's door also. The rule is a thing the country has made. The country, she has been learning — in decades now, decades — is a thing made of rules that are made in rooms."
 cp_layla.109.a:0 "#italic The list is the country. I will learn to read it someday.#!"
 cp_layla.109.b:0 "#italic I signed. Let the premium be paid. Let the doctor come when needed.#!"

 # ----- cp_layla.110 -- "The Doctor in the Next Village" (law_public_health_insurance) -----
 cp_layla.110.t:0 "The Doctor in the Next Village"
 cp_layla.110.d:0 "A doctor is stationed in the next village. He sees anyone who comes. The state pays him. Nothing is signed. Nothing is asked of the visitor except the symptom."
 cp_layla.110.f:0 "She walks the four miles to the next village because Khaled, on Saturday, went blue around the mouth, and because Khaled's wife, weeping, said that there was, in the next village, a man who might help. Khaled — the uncle with the cough that neither the mosque doctor nor the insurance man ever reached — has, over the years, become Layla's private ledger of the country's mercies. The mosque doctor gave him a blessing. The insurance man walked past his door. Tonight the road she is walking leads to a third man, whom the country is paying, for whom no list has been drawn. Layla has walked the road many times. The road does not change. The road has, today, a different weight under her feet, because at the end of it is a man she is going to see whom she has not paid to see and will not need to pay. She does not know, precisely, whether she believes this. She has walked to men at the end of roads before — bailiffs, beys, money-lenders — and she has learned what those men cost. She expects, as she walks, to be asked for something at the door. At the door she is asked only §Iwho is ill#!. She says: my uncle Khaled. She says: he has gone blue at the mouth. The doctor — a man younger than her, with steady hands and an older man's eyes — nods. He comes. He brings his bag. He stays three hours. He leaves a tincture and a schedule of when to administer it. He takes, at the door, only the gesture of her hand pressed briefly between his hands, and the word §Ipeace#!, and he is gone. Khaled, over three days, gets up from the bed. Khaled, over three weeks, walks again. Khaled, in the small cold hours of her own night, gets from her a prayer she has never said before — a prayer that is addressed, not to God exactly, but to the country, which today is a thing she has a prayer for."
 cp_layla.110.a:0 "#italic Bless the country that paid him. Bless the man who came the four miles.#!"
 cp_layla.110.b:0 "#italic Good that he came. Later than he should have been sent. We shall not forget.#!"

 # ----- cp_layla.111 -- "The Guard Has Been Installed" (law_worker_protections) -----
 cp_layla.111.t:0 "The Guard Has Been Installed"
 cp_layla.111.d:0 "The new guards are iron. They are bolted over the worst of the machines at the mill. Ahmed says — she hears him say it quietly to his brother — that the guards are not perfect, but that the guards are more than the guards were last month."
 cp_layla.111.f:0 "The mill is not hers to see inside. She has been inside once, briefly, with Ahmed, on a day when the mill was not running, for a reason she no longer remembers. She remembers the machines. The machines had, in the place where a hand might slip into them, no guard. Ahmed had explained, that day, that the guards cost money, that the money was not going to come from the owner, that if her husband or any other man were to lose a hand to the machine the owner would feel about it the way the owner felt about losing a broom. She had asked, at the time, whether there was any law. He had laughed, not unkindly. He had said: there is the law that says §Iif you do not like it, do not work here#!, and she had understood. Today — many years later, or a few; she does not measure time by the mill — today the guards have been installed. She has not been inside to see them. She has been told. The telling is the gesture. Ahmed, who does not often allow himself pleasure at the country's behaviour, is — she can tell — slightly pleased. He does not say so. She does not ask. They sit, that evening, on the step, drinking tea, and he does not complain of the mill, which is how a laborer says §Itoday was not worse.#! That is enough for tonight."
 cp_layla.111.a:0 "#italic Let the guards hold. Let his hands come home.#!"
 cp_layla.111.b:0 "#italic Late, late. My husband's father lost his arm because this law was not written when he was alive.#!"

 # ----- cp_layla.112 -- "The Meeting After Shift" (law_right_to_associate) -----
 cp_layla.112.t:0 "The Meeting After Shift"
 cp_layla.112.d:0 "Ahmed comes home late. He has been at a meeting. The men, he says, are calling themselves a §Iunion#! now, and the word is not — he says it twice, so she remembers — a thing one whispers."
 cp_layla.112.f:0 "She has heard the word §Iunion#! before, whispered. She has heard it at the market from the younger men, and at the coffeehouse through the open door, and once, from a traveller's mouth, spoken loudly as though the traveller had forgotten where he was. Today the word is not whispered. The country has — on paper — permitted it. Ahmed tells her the shape of the meeting: a dozen men from the mill, a handful of men from the workshops two streets over, a printer's apprentice who can read fast enough to draft a letter in the time a man takes to eat a piece of bread. They have elected someone to speak for them. They have collected, among them, a small amount of money — he says the amount; she memorises it — for a lawyer when one is needed. They have — and this is the part Ahmed stands up from the step to say — they have drawn up a list. The list is of things they want. The list has the kerosene-lamp quality of a thing drawn up by men who had not drawn up such a list before and had to invent the form as they went. She listens. She does not interrupt. When he is done she says, carefully: §IThe list has a number on it that is not there.#! He asks what number. She says: §IThe number of the women who were not at the meeting and whose work you are, nevertheless, asking for improvements to.#! He sits back down. He does not argue. He asks her what she would put on the list. She tells him. He writes it down — carefully, because his letters are not fluent — on the back of the original list, and he folds the original list into his pocket, and he says, still without looking up: §IThey will not like this.#! She says: §ILet them not like it. Bring it anyway.#! He nods. He does, the following Tuesday, bring it."
 cp_layla.112.a:0 "#italic Let the meeting continue. Let my list be on the paper.#!"
 cp_layla.112.b:0 "#italic The men will not listen the first three times. On the fourth, they will.#!"

 # ----- cp_layla.113 -- "The Strike" (pulse) -----
 cp_layla.113.t:0 "The Strike"
 cp_layla.113.d:0 "The gate of the mill is closed on a Tuesday morning. It is not supposed to be closed on a Tuesday morning. The men, she can see from the lane, are standing in a loose ring with their arms crossed."
 cp_layla.113.f:0 "She has been expecting this, or something like it, for months. The wages have been thinning; the rent has not; Ahmed has been home later and later for reasons he gives only partially. This morning the gate is closed, and the men are in the ring, and the foreman — she recognises him by the hat, from two streets away — is pacing. He is speaking. The men are not answering. There is a sign somewhere. She can see the top of it over a shoulder. She cannot read what is on the sign. At the far end of the banner, a man she has never properly seen before is doing a small hopping step of excitement — a short man, a clipped black moustache, his cap pushed back at an angle no foreman would permit on any ordinary shift — and the hopping step is the shape of a kind of hope she had stopped expecting to see performed bodily in a Cairo street. She finds, to her own quiet surprise, that she cannot look away from him. The short man is not a leader. He is simply one of those one-in-thirty men whose faith outruns his caution. She hopes, without planning to, that nothing happens to him this morning. Ahmed, she sees after a moment, is in the ring. He is not in the front. He is not in the back. He is in the ordinary middle place, where a man stands when he wants to be counted without being noticed. She approves of this. She approves of him. She walks past without waving. She has errands. The errands are real errands — the baker, the merchant, the water — and she does them. When she walks back past the gate on the return, the gate is still closed, the foreman is still pacing, and Ahmed — she looks, without appearing to look — Ahmed is still in the ring. The short man with the clipped moustache is still at the end of the banner. He is, this time, not hopping — only standing, which is, she decides, the second-best thing he could be doing. She nods, once, at no one in particular, and walks home. She will not speak of it at the well tomorrow. Some things, in this country, are carried in the chest."
 cp_layla.113.a:0 "#italic Let him stand in the middle. Let the gate stay closed.#!"
 cp_layla.113.b:0 "#italic Let them bring it back with what they went in asking for.#!"

 # ----- cp_layla.73 -- "The Mill Closes" (crossroads) -----
 cp_layla.73.t:0 "The Mill Closes"
 cp_layla.73.d:0 "The notice was pinned to the gate this morning. The owner has — in the shortest paragraph Ahmed has ever had to read aloud to her — decided to close. The mill will be silent in three weeks."
 cp_layla.73.f:0 "She has been expecting it for eight months. The wages have been thinning; the foreman has been harsher; the men at the coffeehouse have been muttering about a buyer who was supposed to come and did not come. This morning the notice arrived. Three weeks. After the three weeks the mill will be silent, the gate will be padlocked, the machines will be sold — or not sold, and will stand rusting through the seasons — and the men who have been, for many years, the mill's men will be nothing in particular. Ahmed has read the notice twice. He has folded it. He has placed it on the low table. He has looked at her. The look, she knows, is the look of a man handing a decision to his wife because he has looked at the decision long enough to know it is not his alone. She has, in her head, three things she could say. She has, in her hands, the small account-book of the stall, which she brought out when Ahmed was reading. She lays it on the table next to the notice. She looks at him. §IWhat is in front of us,#! she says, §Iis three weeks. Let us decide what we do in the three weeks, and not in four.#! He nods. She opens the book. The two of them lean over it, the way they leaned over the first deed when she was a bride, the way they leaned over the prescription the time the doctor came for the second-born. The decision is not a small one. But at least — she thinks, turning the page — at least they will make it together."
 cp_layla.73.a:0 "Go back to the village. The field will take us in."
 cp_layla.73.b:0 "Ahmed re-skills. Take the cut. Apprentice as a machinist."
 cp_layla.73.c:0 "Make the stall the household. I will earn."

