 # ----- Customizable-localization variants for cp_je_layla_reason -----
 # See mod/common/customizable_localization/cp_custom_loc.txt for the
 # branching logic. Each block below is referenced by exactly one branch.

 # Housing
 cp_layla_housing_tenant_default:0 "She lives in a single-room mud-brick house at the edge of a village on the Nile in the Delta. She has never left the Delta. She has never seen Cairo. The house has one window covered with a wooden lattice, a packed-earth floor that Ahmed's mother swept every morning for thirty years until she did not wake up, and a palm-frond roof that leaks along the north edge when the flood comes."
 cp_layla_housing_serf_restored:0 "She lives in the same single-room mud-brick house she has always lived in — but the lane outside is quieter now, and the walls feel thinner. The bey's overseer passes twice a day and he does not look at her. She does not look back. A palm-frond roof, a packed-earth floor, a wooden lattice in the single window; and, behind a loose brick in the wall, a pot that does not exist."
 cp_layla_housing_homesteader:0 "She lives in the house she has always lived in — single-room, mud-brick, the palm-frond roof she once patched by hand — but there is a deed folded in a cloth inside the wedding chest, a deed that says the earth outside the doorway belongs to her. She walks the border stones in the same order every morning. The heron stands in her irrigation channel. She still does not say §Imine§! out loud, but she is beginning to say it in her head."
 cp_layla_housing_cairo_tenement:0 "She lives on the second floor of a brick tenement off a side-street in Cairo, above a tinsmith whose hammer begins at dawn. Two rooms: one for sleeping, one for everything else. The window opens onto an airshaft where the neighbours' washing hangs; below, a cat and the smell of kerosene. The floor is wooden and creaks in a particular place she has not yet fixed. When the trams go by the teacup rattles on the low table."
 cp_layla_housing_alexandria_tenement:0 "She lives two streets back from the harbour in Alexandria, in a rented room above a Greek woman who leaves honey-smelling bread on the landing. The window faces east, inland, away from the sea she has still not gone to look at properly. A tiled floor that the landlady washes on Thursdays. The gulls are loud in the mornings. The salt gets into everything — the sheets, the bread, the eventual rust on the hinges."
 cp_layla_housing_cairo_middling:0 "She lives in a four-room apartment on a proper Cairo street — not wide, not narrow — with a balcony that faces the mosque's minaret and catches the evening call to prayer cleanly. There is a framed photograph above the table (Ahmed, stiff-shouldered, in a grey suit he does not wear except for the photograph). A servant girl comes in the mornings. The ceiling has a small plaster flower at its centre, and Layla still notices it, every day."
 cp_layla_housing_alexandria_middling:0 "She lives in a four-room apartment two blocks from the Corniche, and she has learned, finally, to keep a window open to the sea. Tiled floors, a proper iron stove, a clock on the wall that Ahmed winds on Saturday nights. There is a pair of small shoes by the door that she has not been able to throw out, though the child who wore them has outgrown them by three sizes."

 # Possessions (SoL-tiered)
 cp_layla_possessions_struggling:0 "She owns three clay pots, a copper cup that was her grandmother's, two cotton head-scarves, a small stone grinding-bowl, one wooden chest holding her wedding clothes, and three hens who share the courtyard with her at night because they do not trust the jackals in the lane."
 cp_layla_possessions_impoverished:0 "She owns four clay pots now, a small cast-iron pan Ahmed bought at the town market last autumn, the copper cup that was her grandmother's, three head-scarves — the third is newer, and softer — the grinding-bowl, the wedding chest, five hens, and a thin rug she spread on the floor for winter."
 cp_layla_possessions_middling:0 "She owns two proper copper pots now, the cast-iron pan, a kerosene lamp that works on most nights, a set of glazed cups from the Friday market, four head-scarves including one patterned with small green birds, a wooden chair Ahmed made last spring, the wedding chest, a rag rug, and the three hens who have begun to behave like old women."
 cp_layla_possessions_secure:0 "She owns a proper kitchen now — two copper pots, a cast-iron pan, a brass teapot, a set of matching cups and saucers, a small Primus stove she is still a little afraid of — and two good cotton dresses, a kashmir shawl folded in the chest, a pair of worn leather sandals kept by the door for going to market, and a small wall clock that Ahmed wound every Friday until last Friday, when he forgot."
 cp_layla_possessions_prosperous:0 "The kitchen has a metal stove now, and a cabinet with doors. She has a proper wardrobe of perhaps six dresses, two pairs of shoes (one for weekdays, one for the mosque and weddings), a silver-plated spoon that was a gift, a sewing machine she does not yet use very often, a framed portrait of Ahmed's father, and — on the shelf above the bed, so the children cannot reach it — a small glass-stoppered bottle of rosewater that Ahmed brings home every new year."
 cp_layla_possessions_affluent:0 "The apartment has a proper dining set, a china cabinet with glass doors, a Persian-style rug that a cousin picked up in Port Said, a standing clock in the hallway, an icebox, a gramophone with perhaps nine records, a sewing machine she uses now, a telephone she has learned to speak to without raising her voice, and an electric light fixture in each of the four rooms — all of which, she is aware, would have been unimaginable to her mother."

 # Routine (profession / class)
 cp_layla_routine_peasant_default:0 "She rises before the muezzin. She grinds dhurra for bread and bakes aish baladi on the clay oven in the courtyard before the sun is high enough to stand in. She drinks tea with mint. Most evenings she cooks ful medames with onions — beans from a sack Ahmed carried from the town, which will last the family eleven weeks if she is careful. On Fridays there is sometimes fish from the Nile."
 cp_layla_routine_homesteader:0 "She rises before the muezzin and walks the field before the sun is high. Grind, knead, bake. She bakes a little more generously now — two loaves some days, because the flour sack is not thinning in the old way. She drinks tea with mint from the plant on the window ledge, which has thickened out since the spring. On Fridays there is fish from the Nile — and, once a month, a little meat, which she slices thin so that everyone has a piece."
 cp_layla_routine_laborers_wife:0 "She rises before the muezzin, because Ahmed must be out the door before six. She packs him a bundle — bread, a wedge of cheese, a boiled egg if the hens have been kind. She sweeps the courtyard. She walks to the canal for water, which has become, inexplicably, the thing in her day she most looks forward to. The tea has changed — she takes it darker now, from a Turkish kettle, because Ahmed has learned to like it that way from the men at the mill."
 cp_layla_routine_cairo_laborers_wife:0 "She rises at five because the factory siren goes at six and Ahmed must be at the gate by then. She wraps his bread in a cloth and boils water for tea. The stairwell smells of the tinsmith's workshop. By seven she has swept, washed, and gone down for bread; by eight she is at the window watching the women at their washing in the court below. The city noise has stopped surprising her. She finds, without meaning to, that she no longer thinks about the canal at home."
 cp_layla_routine_machinists_wife:0 "She rises at five. Ahmed leaves at six with a tin pail — bread, cheese, the thermos of tea she has learned to trust not to leak. He comes home at seven smelling of iron filings and coal smoke, and he eats while she tells him the day's small news. Her hands are no longer hard in the places her mother's were hard. They are hard in new places — around the handle of the iron stove, across the pad of the thumb."
 cp_layla_routine_shopkeepers:0 "The shop opens at eight. Ahmed is below unlocking the shutters before she has finished the tea. She comes down at nine with the ledger under her arm — she writes the day's totals in Arabic numerals now, and has learned to add in columns. The customers are mostly women from the quarter, and mostly she knows their children's names. The bread comes from the baker two doors down, the cheese from a Greek, the sugar from a Turk whose price is fair enough that she has stopped bargaining every week."
 cp_layla_routine_clerks_wife:0 "Ahmed leaves at eight-fifteen for the ministry, in a grey suit she presses on Sunday evenings. She spends her mornings at the table by the balcony window, writing — letters to her mother's sister in the village, notes for the household ledger, sometimes a line she is trying out in a blank margin because she is beginning, very privately, to write poems. The servant girl makes tea at ten. The boy goes to school in a starched collar that Layla can remember never having seen as a girl."

 # Savings (what she counts, privately)
 cp_layla_savings_village_default:0 "She keeps a small clay pot behind a loose brick in the wall. She counts what is in it on Friday nights, when Ahmed is asleep. She does not name what she is counting toward."
 cp_layla_savings_homesteader:0 "She keeps the deed folded in a cloth inside the wedding chest, and twice a week she takes it out and reads her name aloud to the empty room. Beside the deed there is a small pouch — coins, more of them than last spring — and she has started, with some embarrassment, to count in piastres instead of paras."
 cp_layla_savings_middling:0 "There is a tin box on the top shelf now, with a tiny key she wears around her neck on a string. It holds coins — mostly piastres, a few small silver — and a folded paper that lists, in her own handwriting, the things she is saving toward. She has not shown the paper to Ahmed."
 cp_layla_savings_secure:0 "She has a savings book from the Crédit Foncier now. A clerk with a thin moustache stamps it when she makes deposits, and she has been taught to recognise her own signature on the top of the first page. The book lives in a flat metal tin under the bed. She has stopped counting on Friday nights — the total is in the book, and the book is in the tin, and the tin is where she put it."
 cp_layla_savings_urban_prosperous:0 "There is an account at the Bank of Egypt in Ahmed's name with both their signatures on the card. A small green passbook; the teller greets her by name. She has begun to think in pounds instead of piastres, which is a translation she is still practising and which still sometimes surprises her when she hears herself do it cleanly."

 # cp_layla.15 -- "Her Mother's Left Hand" (always available)
 cp_layla.15.t:0 "Her Mother's Left Hand"
 cp_layla.15.d:0 "Her mother used to reach for bread with her left hand, always. The right hand was always busy."
 cp_layla.15.f:0 "Stirring a pot, wiping a child's face, adjusting a scarf — the right hand was doing something more important. Layla has begun, without noticing, to reach with her left hand too. She notices today because the bread slips from her fingers and falls on the mat, and the mat is not clean, and she has to brush it off and re-examine it before it goes into her mouth. She thinks of her mother's hand. Her mother's hand is buried now, in the cemetery on the western edge of the village, under a rectangle of stones no larger than a loaf. Layla has not been to the grave since the forty-day mourning ended. She will go on Friday, she tells herself. She has been telling herself this every week for four years. This week too, she thinks, she will go. This week too, she will probably not."
 cp_layla.15.a:0 "She eats the bread, left-handed."

 # cp_layla.16 -- "The Hen That Will Not Lay"
 cp_layla.16.t:0 "The Hen That Will Not Lay"
 cp_layla.16.d:0 "The red hen has not laid in eleven days. She has counted. The other two have, but not her."
 cp_layla.16.f:0 "It is the oldest of the three, the red one with the pale feathers on her left wing. Layla has been feeding her the usual handful of dhurra scraps and the usual thought of the pot has been arriving, every morning, more plainly. Today she crouches in the courtyard and looks at the hen and the hen does not look back. There is a decision to be made and Layla has been not quite making it for a week. She thinks of her mother-in-law, who would have made the decision a week ago. She thinks of the broth. She picks up the hen. The hen does not object. Layla carries her to the shaded corner, sets her down gently, brushes a feather from her own lap, and walks away. Another day, she tells herself. Another day."
 cp_layla.16.a:0 "She gives the hen another day."

 # cp_layla.17 -- "The Merchant's Scale"
 cp_layla.17.t:0 "The Merchant's Scale"
 cp_layla.17.d:0 "She has been watching the merchant's scale for three weeks. She has started to believe it."
 cp_layla.17.f:0 "The onions come home heavier than they leave the market. She has weighed them on her own small stone, the one that was her grandmother's, and the numbers have not been agreeing. The merchant is a man of a certain age with a stutter and a wife who is kind; Layla does not want to be the woman who accuses him. Still. This morning she sets one onion on his scale and, on the way home, she sets the same onion on her stone. The difference is small. But the difference is there. She will not say anything, not this week, not next week. But she will begin to buy her onions from the other merchant, the one from the next village, whose hands are quicker and whose eyes do not rest on the scale the way the first man's do."
 cp_layla.17.a:0 "She changes merchants, quietly."

 # cp_layla.18 -- "Friday, the River Low"
 cp_layla.18.t:0 "Friday, the River Low"
 cp_layla.18.d:0 "The river is low this Friday — not dangerously, but noticeably. The old men are already talking."
 cp_layla.18.f:0 "She goes to the bank after the midday prayer and stands there a long while, looking. The water is the color it usually is but there is more of the bank visible than there should be — the pale stripe along the mud, the one that is not supposed to be visible this time of year. She does not know, exactly, what a low river means in the months ahead, but her mother would have, and her grandmother certainly would have. The old men on the bank are speaking in a low register she recognises from her childhood — the register that precedes decisions about grain stores and the slaughter of animals. Layla walks home slowly. She will say nothing to Ahmed tonight. But she will, quietly, buy an extra sack of beans at the market on Monday."
 cp_layla.18.a:0 "She will buy an extra sack of beans."

 # cp_layla.19 -- "The Old Woman Who Sees Through Walls"
 cp_layla.19.t:0 "The Old Woman Who Sees Through Walls"
 cp_layla.19.d:0 "Umm Saad came by the house today. Umm Saad does not come by the house for no reason."
 cp_layla.19.f:0 "She is ninety, or so everyone says; she herself is vague about it. She has a white plait down her back and a right eye that looks at you and a left eye that looks slightly past you, which is the eye the village believes in. She asks for a cup of water. Layla gives her a cup of water. She drinks it slowly and she looks, for a long time, at the brick behind which Layla keeps the pot, and she does not mention the brick, and then she gets up and thanks Layla and says §Iyour hens are in good health§! and leaves. Layla stands in the doorway after she has gone. Nothing has been said. Everything has been said. She will see Umm Saad at the next funeral and they will pretend this visit did not happen, and Layla will, for the rest of her life, believe in the left eye."
 cp_layla.19.a:0 "She lets Umm Saad see what she will see."

 # cp_layla.20 -- "The Bread That Did Not Rise"
 cp_layla.20.t:0 "The Bread That Did Not Rise"
 cp_layla.20.d:0 "The dough is dense this morning. She knows the moment she presses her thumb into it. Something is wrong."
 cp_layla.20.f:0 "She cannot say what exactly — the water was the right temperature, the flour was from the same sack as yesterday, the yeast was from the same corner of the same pot. But the dough is wrong. She shapes it anyway and bakes it anyway, and the loaves come out flat and heavy, and they taste like the bread of a year she does not want to remember: the year of her second lost baby, the year the rains were slow. She sets the loaves on the rack and sits on the step of the courtyard and does not weep, because she does not weep; but she sits there for a long time, longer than it takes the loaves to cool. Ahmed will ask nothing. The loaves will be eaten."
 cp_layla.20.a:0 "She lets the loaves cool."

 # cp_layla.21 -- "Dust on the Water"
 cp_layla.21.t:0 "Dust on the Water"
 cp_layla.21.d:0 "The khamaseen came through before dawn. She closed the cistern in time. Most of the dust is outside — most, not all."
 cp_layla.21.f:0 "She has been at it for two hours now: the swept floor, the re-swept floor, the shaken-out rug, the wiped-clean shelf, the bread-bowl that she has had to rinse three times because the dust finds its way into the flour the way water finds its way into a cracked clay pot. Her head-scarf is grey with the dust. So are her forearms, up to the elbow. She does not mind, quite, the work — the work has a shape, an end, a measurable quantity — but she minds the helplessness of the wind, which can undo six hours of a woman's week in twenty minutes and does not owe her an explanation. She goes out once more to the cistern to check that the lid held. The lid held."
 cp_layla.21.a:0 "She sweeps again."

 # cp_layla.22 -- "The Younger Brother's Letter"
 cp_layla.22.t:0 "The Younger Brother's Letter"
 cp_layla.22.d:0 "Kareem has written from somewhere. She will need the baker's son to read it to her."
 cp_layla.22.f:0 "Her younger brother has not been home in five years — he went to Alexandria, or so the family story goes, to work with a cousin of a cousin, and the letters have been, until now, rare. The baker's son is sixteen and can read, and he reads to her in the lane, with the letter held close to his eyes because the writing is small and the paper is thin. Kareem is alive. Kareem is not in Alexandria. Kareem is somewhere in Greece, working in a warehouse, and he sends four piastres folded into the paper, which he asks her to give to their mother, who is dead, which he does not know. Layla folds the four piastres back into the letter and walks home holding the letter like a thing that could shatter. She will write nothing back. She will not know, for three more years, whether he is still alive."
 cp_layla.22.a:0 "She folds the letter into the chest."

 # cp_layla.23 -- "The Mule That Will Not Move"
 cp_layla.23.t:0 "The Mule That Will Not Move"
 cp_layla.23.d:0 "The village mule has stopped in the lane, and the village mule will not be persuaded to start again."
 cp_layla.23.f:0 "He belongs to nobody in particular — the village owns him, or he owns the village, depending on whom one asks — and this afternoon he is standing squarely in the lane between Layla's door and the well with a cart of straw behind him and a young boy who is too small to whip him with any seriousness pleading with him in a reedy voice. Layla leans in the doorway with the bucket under her arm, waiting. She is not in a hurry. The mule is. Eventually the young boy gives up and goes to find his father and the mule, unobserved, takes one thoughtful step forward, then another, then begins, at his own leisurely pace, to walk. Layla picks up the bucket and follows him toward the well. She has learned, over the years, that the village moves at the speed of the village, and that impatience is a thing for other women in other places."
 cp_layla.23.a:0 "She walks behind the mule."


 # ----- Tech arrival reactions (cp_layla.30..32) -----

 # cp_layla.30 -- "The Iron Horse" (railways arrive in Egypt)
 cp_layla.30.t:0 "The Iron Horse"
 cp_layla.30.d:0 "Word has come up the canal road. A machine that pulls itself. No mule, no ox. Black smoke against the morning."
 cp_layla.30.f:0 "She does not go to see it. She is told, by the boy who delivers bread, that it makes a noise like the end of the world and moves faster than a horse at full gallop. He is twelve and has been crying, and he does not know why. She asks him if he liked it. He thinks for a while. He says he does not know. That evening, washing turnips in the shade of the wall, she tries to picture a mule made of iron and cannot, and then she tries to picture nothing pulling it at all, and she cannot picture that either. The world is getting bigger. She is not sure yet whether a bigger world is a better one."
 cp_layla.30.a:0 "She decides, next time the bread-boy comes, to walk with him to the canal road."
 cp_layla.30.b:0 "The world is larger than she thought. She says nothing."

 # cp_layla.31 -- "A Word From Beyond" (electric telegraph)
 cp_layla.31.t:0 "A Word From Beyond"
 cp_layla.31.d:0 "The news from Istanbul reached Cairo before the afternoon prayer. Not by courier. By a wire."
 cp_layla.31.f:0 "Nobody in the village has seen the wire, but the man from the next village says he has touched one where the road bends past his cousin's mill. It is cold, he says, and nothing moves inside it. And yet. Yesterday the Sultan decreed and today the Pasha knows. She tries to picture it — a word travelling on a string, not stopping for mountains, not stopping for the sea — and the picture refuses. A word is made in a mouth. A word needs a mouth to catch it. She asks the imam, because she is not sure who else to ask. He says it is permitted. He does not say whether he understands it."
 cp_layla.31.a:0 "She believes it. She does not understand it."
 cp_layla.31.b:0 "She says nothing to anyone, and she prays that night for clarity."

 # cp_layla.32 -- "Voices in the Air" (radio)
 cp_layla.32.t:0 "Voices in the Air"
 cp_layla.32.d:0 "A box, in the shopkeeper's house. A voice comes out of it. A woman's voice, singing — and no woman there."
 cp_layla.32.f:0 "She sits outside with the other women, on the bench the shopkeeper has dragged out for them, and the song comes through the open door. None of them will go inside. It is not the song, exactly. It is that she cannot tell whether the woman singing it is alive, now, at this very hour, or was alive once and is gone. Perhaps she is in Cairo. Perhaps she is in Europe. Perhaps she is in a grave, and the grave is singing. The shopkeeper's wife keeps bringing them tea and they keep not drinking it. The song ends. Another begins. Layla realises she has been holding her breath."
 cp_layla.32.a:0 "She asks, quietly, whether the singer knows we are listening."
 cp_layla.32.b:0 "She goes home before the next song. It is too much, all at once."


 # ----- War-end reactions (cp_layla.40..41) -----

 # cp_layla.40 -- "The Column Returns" (Ahmed comes home)
 cp_layla.40.t:0 "The Column Returns"
 cp_layla.40.d:0 "The dust on the canal road is a different dust today. Horses. Men. The shape of him, smaller than she remembered, at the back of the column."
 cp_layla.40.f:0 "He stands in the doorway before he comes in. He is looking at the doorway as if he is deciding whether he is still permitted to cross it. She puts down the bread. She says his name once. He nods. He does not speak. That will come later — in weeks, perhaps, or in months — and when it comes it will arrive in small pieces at odd hours, about things she was not expecting to hear. For now he sits on the stool where he used to sit. He eats what she puts in front of him. He asks if the well is still the well. He asks if the neighbour woman with the bad hip is still the neighbour woman with the bad hip. She says yes, and yes. He nods, and nods, and the afternoon passes. At dusk she understands that her husband is home, and that he is not entirely the husband she sent away, and that she does not mind."
 cp_layla.40.a:0 "She sets an extra plate at the table."

 # cp_layla.41 -- "The Clerk's Letter" (Ahmed killed)
 cp_layla.41.t:0 "The Clerk's Letter"
 cp_layla.41.d:0 "An official on a donkey came through the village today. He had a ledger and a list of names. He had one name for Layla's house."
 cp_layla.41.f:0 "He did not dismount. He asked in a tired voice, in a formal Arabic too flat for the village's ear, whether this was the house of Ahmed son of Mahmoud. She said that it was. He said: then I have news, and I am sorry to carry it. He read the line from the ledger. It was a single line. The village women gathered behind her, not close. When he had read it he put the ledger back in his saddlebag and said — not unkindly — that the country was grateful. Then he rode on to the next name. Layla went inside and she did not close the door. She did not sit down. She stood at the wall where he used to hang his coat. She did not weep yet, because weeping would come later, and she wanted first to be alone with this."
 cp_layla.41.a:0 "She closes the door."


 # ----- Industrial-building reactions (cp_layla.50..) -----

 # cp_layla.50 -- "The Smoke Above the Palm" (first textile mill in her state)
 cp_layla.50.t:0 "The Smoke Above the Palm"
 cp_layla.50.d:0 "There is a new tall thing on the horizon, past the canal. It has a chimney. The chimney gives off smoke in a pillar so straight it looks like it has been painted there."
 cp_layla.50.f:0 "She passes near it once, on the way to her aunt's house. The ground vibrates — not an earthquake vibration, a steady one, continuous, as if the earth itself has become a slow drum. A few men stand at the gates in clean clothes. Many more men, in less clean clothes, walk in at dawn and do not come out until after sunset. One of her cousins works there now. He sends a little money home and he does not come back for Friday prayers anymore. The cousin says the machines are from Manchester. He says the word 'Manchester' as if it is a place, not far off, where bigger things happen. She nods. She does not know where Manchester is. She does not ask."
 cp_layla.50.a:0 "The world is getting bigger. She is not certain that it is getting better."
 cp_layla.50.b:0 "She wonders whether her sons, when they come, will walk to that gate at dawn."


 # ============================================================================
 # Imagined audience with the Pasha
 # See documentation/characters/layla/conversation.md
 # Reference to the actual ruler via [ROOT.GetCountry.GetRuler.GetFullName]
 # so this prose ages with the game -- Muhammad Ali in 1836, Isma'il in 1867,
 # whoever holds power when the audience is imagined.
 # ============================================================================

 # cp_conversation.1 -- Root: she goes to Cairo in her mind
 cp_conversation.1.t:0 "An Audience in Cairo"
 cp_conversation.1.d:0 "She is kneading the second loaf and she has decided, tonight, to go to Cairo in her mind."
 cp_conversation.1.f:0 "She has never been. She will never be. The dough is on the board in front of her, and her hands are working it with the turn and fold she has been doing since she was eleven, and the kitchen is quiet except for the soft rhythm of the dough. And then, between one fold and the next, she is not in the kitchen. She is at the end of a long carpet the colour of old blood, in a room with a ceiling she cannot see, and at the far end of the carpet [ROOT.GetCountry.GetRuler.GetFullName] is waiting for her. She does not know what he looks like. She has invented a face: a man of some age, a beard the colour of ashes, eyes she cannot read. She has invented the room too. She does not know what the palace is really like, and so she has built one from rumour and from the stories travellers brought through the village when she was small — gold thread on the cushions, brass lamps, a secretary at a low table with ink on his fingers. She takes one step forward on the carpet. She is wearing a dress she does not own. Her hands, she notices, are clean. She has an hour, perhaps. She has rehearsed this, kneading bread, a hundred times. Tonight she lets it happen. What does she speak of tonight?"
 cp_conversation.1.a:0 "Tell him about the land."
 cp_conversation.1.z:0 "The courage leaves her. She returns to the oven."

 # cp_conversation.10 -- Her opening speech (THE LAND)
 cp_conversation.10.t:0 "The Land"
 cp_conversation.10.d:0 "She stands at the end of the carpet. [ROOT.GetCountry.GetRuler.GetFullName] is waiting for her to speak."
 cp_conversation.10.f:0 "Effendim, she says — and her voice is smaller than she rehearsed, smaller than she meant, smaller than the room — I have come about the land. She clears her throat. The room is enormous. She is aware of the secretary's pen at the edge of her vision, scratching. She begins again. My name is Layla, daughter of Mohamed al-Sharif, of a village in the Delta you have never heard of. My grandfather planted in this soil. His grandfather planted in this soil. His grandfather before him planted in this soil. They are in the soil now. I will be in the soil. My children, if I have children who live, will be in the soil. I have known that field for thirty years. I have known it in the flood year that was good, when the silt was the colour of dark tea, and in the flood year that failed, when we ate less in every month until Ramadan came, and in the year the locust took the eastern strip and left the western strip, and in the year my mother died with her hand on the dry earth at the edge of the canal. She pauses. She is not looking at him. She is looking somewhere past his shoulder, at a window she has also invented, which lets in an imagined sun. The field is ours, Effendim. The field has always been ours. The ledgers in Cairo say otherwise. The ledgers say the field belongs to a man none of us have seen, who sends his bailiff at harvest with a donkey and a book, and the bailiff takes what the ledger tells him to take, which is never what was agreed at planting, which is never what leaves us enough for winter. I am not a woman of the city. I do not know the laws. I know only that the field is ours, and the paper is not, and I have come — she looks at him now, truly — I have come to ask you for a paper. One paper. With my name on it. With my husband's name on it, if the law requires that. With the name of the field on it. That my grandchildren, when they are old, can show to the bailiff and say, the field is ours. Because it has always been ours. That is what I have come to say. She stops. Her hands, she realises, have been gripping the folds of the dress she does not own. She unclenches them. She waits."
 cp_conversation.10.a:0 "#italic as the Pasha:#! \"The land has owners. You are not one of them.\""
 cp_conversation.10.b:0 "#italic as the Pasha:#! \"Speak on. I am listening.\""
 cp_conversation.10.c:0 "#italic as the Pasha:#! \"A peasant woman should not be in this room.\""

 # cp_conversation.11 -- She faces the dismissive Pasha
 cp_conversation.11.t:0 "He Does Not Look Up"
 cp_conversation.11.d:0 "He says it without lifting his head. The secretary's pen does not pause."
 cp_conversation.11.f:0 "The words land in the room and do not ask permission to land. The land has owners. You are not one of them. She feels the breath go out of her in a long quiet way, as if she had been struck in the chest by something soft and heavy, like a wet cloth, like grief. She stands on the carpet. She does not move. She is aware that in the real kitchen, her hands have stopped working the dough, and she forces them to begin again. In the imagined room, she stays. She had prepared herself for anger. She had prepared herself for indifference. She had not prepared herself for the efficiency of it — the way he said it, as if stating the time, as if telling the secretary to bring tea. Effendim, she says, and she hears her voice now with a kind of distance, as if she were listening to another woman speak. Effendim, perhaps I have not been clear. We work the land. We have always worked the land. My grandfather — I said, he says, without looking up, the land has owners. You are not one of them. The bailiff collects what the ledger requires. The ledger was drawn up correctly. Your name, and your husband's name, are on the ledger in the appropriate column. The column for those who work the land. Not for those who own it. That column is filled. That column has been filled, in some cases, since before your grandfather's grandfather. There is a silence. Effendim, she says again — and now there is something in her voice she did not plan to put there — Effendim, what if the column were wrong? He lifts his head for the first time. What does he do next?"
 cp_conversation.11.a:0 "#italic as the Pasha:#! \"There is a small parcel near the canal road. Take it. Go home.\""
 cp_conversation.11.b:0 "#italic as the Pasha:#! \"Enough. The audience is over. Secretary — show her out.\""

 # cp_conversation.12 -- She faces the engaged Pasha
 cp_conversation.12.t:0 "He Is Listening"
 cp_conversation.12.d:0 "He leans forward very slightly. The secretary stops writing."
 cp_conversation.12.f:0 "Speak on, he says, and the voice is warmer than she expected, and she cannot tell if the warmth is real or if it is something men like him have learned to put into their voices when peasants come before them, and for a long moment she cannot remember what she had meant to say next. She is aware of her own breath. She is aware of the sweat on the back of her neck, which in the imagined room should not be there but is. She collects herself. Effendim, she says — and this time she hears her own voice clearly, clearly enough that the secretary, she notices, has begun to write again — Effendim, I know that the wars need men. I know that the men need arms. I know that the arms need steel, and the steel needs money, and the money comes from somewhere, and I am not a fool. I know that most of where the money comes from is us. The villages. The wheat. The cotton the bey makes us plant instead of wheat now, because it fetches a better price in the port. I am not angry about this. No — that is not true. I am angry. But I understand. A country is a thing that costs. She pauses. She has never said this aloud, not to Ahmed, not to her mother when her mother was alive, not to herself before tonight. But Effendim, she continues, when the cost is paid and paid and paid again, and the ones who pay have no paper saying that the field they water with their backs is their field — then one day something will break. I do not know what will break. I do not know what year. But I know my grandmother knew what it was like when the floods failed, and I know my mother knew, and I know I have known. And I know that the paper, Effendim, would be a cheap thing for you to give. Cheaper than the steel. Cheaper than the wars. Cheaper than the next revolt you will have to crush. She stops. She has said more than she meant to. The room is still. He has been listening. He makes a small gesture — the kind of gesture a man makes when he has decided something. What does he say?"
 cp_conversation.12.a:0 "#italic as the Pasha:#! \"I will consider what you have said. We will speak of this again.\""
 cp_conversation.12.b:0 "#italic as the Pasha:#! \"Let me ask you this: what if I gave this land to a soldier?\""

 # cp_conversation.13 -- She faces the cruel Pasha
 cp_conversation.13.t:0 "He Says the Quiet Thing"
 cp_conversation.13.d:0 "The warmth she had imagined in his voice is not there. Something else is."
 cp_conversation.13.f:0 "A peasant woman, he says, should not be in this room. He is not cruel the way the bailiff is cruel, which is a small cruelty in service of small appetites. He is cruel the way a man is cruel who has never been told no, and who believes that the reason he has never been told no is that he has always been right. You have come to me, he says, with the dust of your village still on your skirt, and you believe — he makes a small motion with two fingers, a dismissing motion, the kind one makes at a fly — that I am in need of your opinion on the disposition of land which is not yours. Tell me, he says — and now there is something worse than cruelty in his voice, there is amusement — tell me who it was that dressed you this morning and put these ideas in your head. Was it your husband? Your bey? A French traveller? She stands on the carpet. She feels the sting of his words as if someone had slapped her face and then held a cloth to it, soft and heavy. In the real kitchen her hands are still. She has stopped pretending. In the imagined room she has a choice. She can curtsey. She can go. She can — and she does — open her mouth. Nobody dressed me, Effendim, she says. Nobody put ideas in my head. I have been putting them there myself, in the time between fetching water and waiting for my husband to come home, for thirty years. The ideas are mine. The dust is mine. The room is yours. If you will not hear me, I will go. If you will hear me — one more sentence — I will say the sentence, and then I will go, and I will not trouble you again. She waits. He is looking at her. His face has not changed. But something has."
 cp_conversation.13.a:0 "#italic as the Pasha:#! \"Say your one sentence. Then go.\""
 cp_conversation.13.b:0 "#italic Turn and leave. The audience is over in her mind.#!"

 # cp_conversation.14 -- Dismissive branch: Pasha offers a token
 cp_conversation.14.t:0 "The Parcel by the Canal Road"
 cp_conversation.14.d:0 "He speaks without warmth, without cruelty either. He speaks the way one disposes of a small matter in order to return to larger ones."
 cp_conversation.14.f:0 "There is a small parcel, he says, near the canal road. Unworked for years. The soil is poor. It is too close to the salt. Take it. It is a small thing. I will instruct the secretary. Go home. He is already looking down at his papers again. The audience has ended, although she is still standing in the room. She understands, with the clarity of a woman who has stood in more doorways than she can count, what has happened. He has given her nothing. He has given her a scrap that nobody else wants — a piece of land too salt for wheat, too far from the village to walk, a parcel that will belong to her on paper and on no other axis of the real world. The paper itself, she knows, will not come. A man in Cairo will be told to prepare it. The man will not prepare it. Or the man will prepare it, and another man will misplace it, and she will hear of it again in fifteen years when the bey's bailiff arrives at harvest with a new ledger and no memory of her visit. She stands on the carpet. She thinks of her field, the real one, green and hers and not hers. She thinks of her grandfather's grandmother. She does not say any of this. Thank you, Effendim, she says, because her mother taught her that one always thanks a man who has given you something, even if the thing is not what you asked for, even if the thing is nothing. She turns. She walks the long carpet. Behind her, she does not hear the secretary's pen resume. She knows, in a way she cannot explain, that no parcel will be waiting when she gets home."
 cp_conversation.14.a:0 "#italic She walks the long carpet back.#!"

 # cp_conversation.15 -- Dismissive branch: audience ends abruptly
 cp_conversation.15.t:0 "The Secretary Shows Her Out"
 cp_conversation.15.d:0 "He does not look at her again. The pen is already scratching a new line."
 cp_conversation.15.f:0 "The secretary stands. He is a small man in a dark robe and he has the kind of face that has been trained not to have an expression. He does not touch her. He does not need to. He gestures, politely, toward the door at the far end of the carpet, and he waits, politely, for her to walk. She walks. She walks a long time. The carpet, she realises, is much longer than she had imagined when she came in — or perhaps she is walking more slowly now. She does not look back. She does not know if he has already begun the next audience, with a man who has brought a gift, or with a bey who has come to complain of a neighbour, or with a general who has a war to discuss. She is one woman. There is no gift on the low table beside the carpet where she thought a gift should go. She had not thought to bring one. She did not know gifts were required. At the door she pauses, and she turns, and she says — more to the room than to him — I am Layla al-Sharif. You may forget me. My field will not forget what I said here. The door closes behind her. In the real kitchen, the dough is resting. Her hands are folded in her lap. She has not noticed."
 cp_conversation.15.a:0 "#italic She stands in the kitchen. She does not move for a while.#!"

 # cp_conversation.16 -- Engaged branch: vague promise
 cp_conversation.16.t:0 "I Will Consider It"
 cp_conversation.16.d:0 "He says the words he has said a thousand times to petitioners from the provinces. She can hear, underneath, that he means something by them."
 cp_conversation.16.f:0 "I will consider what you have said, he says. We will speak of this again. She has heard this phrase, in the mouths of lesser men, all her life. From the bey, when the roof of the grain store collapsed. From the bailiff, when the weights at the scale were in his favour by an obvious margin. From the headman of the village, when a woman came to complain about her husband. I will consider it. We will speak of this again. It is the phrase a man uses when he wants the woman to leave. But in this room, Effendim, it is different. She does not know whether it is different because he means it, or because she wants to believe he means it, or because she has worked so hard to imagine the version of him who would mean it that the imagined version is now standing in front of her, wearing his face. Thank you, Effendim, she says. I will wait. She does not know what she is waiting for. She does not know if it will ever come. But as she walks back down the long carpet she feels a small stupid hope inside her chest, the size of a wheat-grain, the kind of hope a woman is wiser to refuse and never can. In the real kitchen her hands have returned to the dough. The dough is ready to rise. She puts the cloth over the bowl. She says nothing to the empty room."
 cp_conversation.16.a:0 "#italic She covers the dough. She lets it rise.#!"

 # cp_conversation.17 -- Engaged branch: hard question
 cp_conversation.17.t:0 "What If I Gave This Land to a Soldier?"
 cp_conversation.17.d:0 "He asks it with something like curiosity. She had not prepared for curiosity."
 cp_conversation.17.f:0 "What if, he says, I gave this land to a soldier? A man who fought for Egypt. A man who lost a leg at Nezib, say, or a son at Konya. A man who earned, by the blood his family has shed for the country, the right to a field. What would you say to him, when he came to your door with a paper in his hand and said, madam, this field is mine now? She stands on the carpet. It is the hardest question anyone has ever asked her, including the midwife when the child would not come. Effendim, she says, after a long moment — I would say to him, may God be merciful to your son. I would say to him, come in, and drink water in the shade. I would say to him, the water of this well is good. And then — she lifts her head and looks at him, truly, for the first time — and then, Effendim, I would ask him to show me the paper. And I would read it. Except that I cannot read. So I would ask him to read it to me. And then I would ask whether the paper named the field, or whether the paper named a field. And if the paper named a field only in general, Effendim, I would say to him, soldier, there are many fields. Let us walk out together and find you one that is not already worked by a woman whose grandfather's grandfather is in the ground. She pauses. The thing I would not say, Effendim, is that this is fair. It is not fair. Fair is not a word I am certain belongs in this room. I would say only: the field is mine. It has always been mine. Find him a different field. There are many. Someone in your secretary's ledger will know where they are. He looks at her. The secretary's pen has stopped again."
 cp_conversation.17.a:0 "#italic She has answered. She is shaking a little. She waits.#!"

 # cp_conversation.18 -- Cruel branch: one sentence
 cp_conversation.18.t:0 "One Sentence"
 cp_conversation.18.d:0 "He lifts one finger. Speak, he says. She has been given the sentence she asked for."
 cp_conversation.18.f:0 "She has rehearsed, standing at the oven, a hundred different sentences. Some of them were angry. Some of them were pleading. Some of them were the kind of sentence a scholar would build, with a beginning and a middle and a closing. She has forgotten all of them. She stands on the carpet and her mouth opens before she has told it to open and she hears herself say — Effendim, if you will not give me the paper, then let my daughter — if I ever have a daughter, if a daughter of mine ever lives past her second year — let my daughter come to this room in my place, in thirty years, and speak the same words, and receive the same nothing, and go home. Because I will teach her to come. I will teach her the names of the fields and the names of her grandmothers and the sound of the quern-stone and the smell of the silt, and when she stands on this carpet she will not be smaller than the room. She will be the size of the room. She will be the size of the river. She will be the size of the whole of Egypt, which is made of women like her, women like me, women who have been standing on carpets like this one forever, waiting for a paper that does not come. That is my sentence, Effendim. I am going now. She has not asked permission. She has already turned. He does not stop her. Perhaps she imagines that, on her walk back down the carpet, he makes a small mark in his own book. Perhaps she imagines wrong."
 cp_conversation.18.a:0 "#italic She walks out on her own feet.#!"

 # cp_conversation.19 -- Cruel branch: she leaves without the sentence
 cp_conversation.19.t:0 "She Leaves"
 cp_conversation.19.d:0 "She does not speak. She turns. She walks."
 cp_conversation.19.f:0 "She had a sentence prepared. She had prepared it at the oven, at the quern, at the well, in the dark of the first hour of the first watch of the night. She had prepared it so often that the sentence had come to feel like a stone in her pocket — a thing she could touch to know was real. In the imagined room, with him looking at her with that face that had not changed, with that amusement still at the edges of his mouth, she chooses not to give him the stone. He does not deserve the stone. The stone is hers. She turns on the carpet. She does not curtsey. She does not thank him. She does not even lift her chin. She simply walks, and the walk takes longer than it should take, and she does not look back to see whether he is watching her go, because she has decided — and this is a decision she will remember, in the real kitchen, for the rest of her life — that his watching or not watching is no longer a fact she will organise her life around. The door opens for her. She passes through. In the real kitchen her hands have finished with the dough and her hands are folded and she is looking out the small window, at the line of the canal, at the palm trees along the canal, at the flat sky. Something in her chest is quiet in a new way. It is not triumph. It is not despair. It is something smaller and steadier, the kind of quiet that follows a decision one has been carrying without knowing it for a long time. She begins to wash her hands in the basin. The water is cold. The quiet stays."
 cp_conversation.19.a:0 "#italic She washes her hands. The quiet stays.#!"

 # cp_conversation.90 -- Closer: the fantasy dissolves
 cp_conversation.90.t:0 "The Kitchen Returns"
 cp_conversation.90.d:0 "She is not in Cairo. She has never been. The dough is in front of her. The light has not changed."
 cp_conversation.90.f:0 "She is in her kitchen. The dough is on the board, covered with a cloth, rising. The light through the small window is the same light it was before she went to Cairo in her mind. Outside, the lane is quiet. A goat complains in the far distance. Ahmed is wherever Ahmed is — in the far field, on a road she cannot see, in a country she has never learned the map of. She looks at her hands. They are the hands of a woman who has been kneading dough, not the hands of a woman who has stood on a carpet. The dress she was wearing in the imagined room is not in the house and never was. She permits herself — just for a breath — the question of whether any of it counted. Whether a sentence spoken in the privacy of one's own head, to an audience of one's own making, is a sentence at all. The answer, she decides, is the one her mother gave her when she was eight years old and asked whether the prayers counted when spoken quietly: they count. They count to the one who speaks them. That is enough. She turns the cloth back and checks the dough. It has risen well. She lifts the bowl to the oven. She puts the kettle over the small fire. Somewhere in the country, [ROOT.GetCountry.GetRuler.GetFullName] is not thinking of her. The secretary is not thinking of her. The bey is not thinking of her. She is thinking of the tea that will be ready in a moment, and of the bread that will be baked by the time the sun is at the palms, and of Ahmed, who will come home, or will not, or will come home changed. She is thinking, also, in a small stubborn corner of her chest, that one day the sentence will be said aloud in a real room, by a real woman, and that the room will change when the sentence arrives. Perhaps the real woman will be her daughter. Perhaps it will be someone else's daughter. Perhaps it will not be for a hundred years. She does not know. The kettle begins to hiss. She reaches for it. The day continues."
 cp_conversation.90.a:0 "#italic The day continues.#!"

 # ----- cp_layla.7 -- "The Tax Collector" -----
 cp_layla.7.t:0 "The Tax Collector"
 cp_layla.7.d:0 "He comes with a ledger, an inkhorn, and two guards. He comes when the harvest is measured."
 cp_layla.7.f:0 "She knows him by sight, though he would not recognise her if she passed his house in the city. He is younger than Ahmed and he is older than the bey. He reads the number off the page as though the number were the weather — something that simply is, and is not his doing. Ahmed hands across what he has, wrapped in the best cloth they own, which is not very good cloth. The assessor does not look at him. He makes a mark. He makes another mark. He does not look up when he says #italic This year the rate is higher.#! She is standing in the door. She is holding the youngest child on her hip. The child does not yet know the word #italic tax#!. It will be one of the first words the child learns."
 cp_layla.7.a:0 "Pay what is asked."
 cp_layla.7.b:0 "#italic She meets his eyes.#!"

 # ----- cp_layla.8 -- "The Price of the Loaf" -----
 cp_layla.8.t:0 "The Price of the Loaf"
 cp_layla.8.d:0 "The bread costs the same coin this week. There is less bread in it."
 cp_layla.8.f:0 "Ahmed brings home the loaf. It is the loaf she has bought, or watched him buy, every week of her married life. She takes it in both hands — the weight is wrong. She does not weigh bread; her hands weigh bread. Her hands have been weighing bread since she was nine. She says nothing. She tears a piece for the children. She tears a piece for Ahmed. The piece she tears for herself is smaller than usual and she does not announce this and neither does anyone notice, which is how it has always gone. That night, lying awake, she thinks about the word #italic tax#! and how for the first time in her life she is sure she knows what it means. It means something has been taken from between her teeth before she got there."
 cp_layla.8.a:0 "Go to sleep."
 cp_layla.8.b:0 "#italic Curse the ones who decide such things.#!"

