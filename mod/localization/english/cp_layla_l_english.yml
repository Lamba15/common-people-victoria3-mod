 # ----- Customizable-localization variants for cp_je_layla_reason -----
 # See mod/common/customizable_localization/cp_custom_loc.txt for the
 # branching logic. Each block below is referenced by exactly one branch.

 # Housing
 cp_layla_housing_tenant_default:0 "She lives in a single-room mud-brick house at the edge of a village on the Nile in the Delta. She has never left the Delta. She has never seen Cairo. The house has one window covered with a wooden lattice, a packed-earth floor that Ahmed's mother swept every morning for thirty years until she did not wake up, and a palm-frond roof that leaks along the north edge when the flood comes."
 cp_layla_housing_serf_restored:0 "She lives in the same single-room mud-brick house she has always lived in — but the lane outside is quieter now, and the walls feel thinner. The bey's overseer passes twice a day and he does not look at her. She does not look back. A palm-frond roof, a packed-earth floor, a wooden lattice in the single window; and, behind a loose brick in the wall, a pot that does not exist."
 cp_layla_housing_homesteader:0 "She lives in the house she has always lived in — single-room, mud-brick, the palm-frond roof she once patched by hand — but there is a deed folded in a cloth inside the wedding chest, a deed that says the earth outside the doorway belongs to her. She walks the border stones in the same order every morning. The heron stands in her irrigation channel. She still does not say §Imine§! out loud, but she is beginning to say it in her head."
 cp_layla_housing_cairo_tenement:0 "She lives on the second floor of a brick tenement off a side-street in Cairo, above a tinsmith whose hammer begins at dawn. Two rooms: one for sleeping, one for everything else. The window opens onto an airshaft where the neighbours' washing hangs; below, a cat and the smell of kerosene. The floor is wooden and creaks in a particular place she has not yet fixed. When the trams go by the teacup rattles on the low table."
 cp_layla_housing_alexandria_tenement:0 "She lives two streets back from the harbour in Alexandria, in a rented room above a Greek woman who leaves honey-smelling bread on the landing. The window faces east, inland, away from the sea she has still not gone to look at properly. A tiled floor that the landlady washes on Thursdays. The gulls are loud in the mornings. The salt gets into everything — the sheets, the bread, the eventual rust on the hinges."
 cp_layla_housing_cairo_middling:0 "She lives in a four-room apartment on a proper Cairo street — not wide, not narrow — with a balcony that faces the mosque's minaret and catches the evening call to prayer cleanly. There is a framed photograph above the table (Ahmed, stiff-shouldered, in a grey suit he does not wear except for the photograph). A servant girl comes in the mornings. The ceiling has a small plaster flower at its centre, and Layla still notices it, every day."
 cp_layla_housing_alexandria_middling:0 "She lives in a four-room apartment two blocks from the Corniche, and she has learned, finally, to keep a window open to the sea. Tiled floors, a proper iron stove, a clock on the wall that Ahmed winds on Saturday nights. There is a pair of small shoes by the door that she has not been able to throw out, though the child who wore them has outgrown them by three sizes."

 # Possessions (SoL-tiered)
 cp_layla_possessions_struggling:0 "She owns three clay pots, a copper cup that was her grandmother's, two cotton head-scarves, a small stone grinding-bowl, one wooden chest holding her wedding clothes, and three hens who share the courtyard with her at night because they do not trust the jackals in the lane."
 cp_layla_possessions_impoverished:0 "She owns four clay pots now, a small cast-iron pan Ahmed bought at the town market last autumn, the copper cup that was her grandmother's, three head-scarves — the third is newer, and softer — the grinding-bowl, the wedding chest, five hens, and a thin rug she spread on the floor for winter."
 cp_layla_possessions_middling:0 "She owns two proper copper pots now, the cast-iron pan, a kerosene lamp that works on most nights, a set of glazed cups from the Friday market, four head-scarves including one patterned with small green birds, a wooden chair Ahmed made last spring, the wedding chest, a rag rug, and the three hens who have begun to behave like old women."
 cp_layla_possessions_secure:0 "She owns a proper kitchen now — two copper pots, a cast-iron pan, a brass teapot, a set of matching cups and saucers, a small Primus stove she is still a little afraid of — and two good cotton dresses, a kashmir shawl folded in the chest, a pair of worn leather sandals kept by the door for going to market, and a small wall clock that Ahmed wound every Friday until last Friday, when he forgot."
 cp_layla_possessions_prosperous:0 "The kitchen has a metal stove now, and a cabinet with doors. She has a proper wardrobe of perhaps six dresses, two pairs of shoes (one for weekdays, one for the mosque and weddings), a silver-plated spoon that was a gift, a sewing machine she does not yet use very often, a framed portrait of Ahmed's father, and — on the shelf above the bed, so the children cannot reach it — a small glass-stoppered bottle of rosewater that Ahmed brings home every new year."
 cp_layla_possessions_affluent:0 "The apartment has a proper dining set, a china cabinet with glass doors, a Persian-style rug that a cousin picked up in Port Said, a standing clock in the hallway, an icebox, a gramophone with perhaps nine records, a sewing machine she uses now, a telephone she has learned to speak to without raising her voice, and an electric light fixture in each of the four rooms — all of which, she is aware, would have been unimaginable to her mother."

 # Routine (profession / class)
 cp_layla_routine_peasant_default:0 "She rises before the muezzin. She grinds dhurra for bread and bakes aish baladi on the clay oven in the courtyard before the sun is high enough to stand in. She drinks tea with mint. Most evenings she cooks ful medames with onions — beans from a sack Ahmed carried from the town, which will last the family eleven weeks if she is careful. On Fridays there is sometimes fish from the Nile."
 cp_layla_routine_homesteader:0 "She rises before the muezzin and walks the field before the sun is high. Grind, knead, bake. She bakes a little more generously now — two loaves some days, because the flour sack is not thinning in the old way. She drinks tea with mint from the plant on the window ledge, which has thickened out since the spring. On Fridays there is fish from the Nile — and, once a month, a little meat, which she slices thin so that everyone has a piece."
 cp_layla_routine_laborers_wife:0 "She rises before the muezzin, because Ahmed must be out the door before six. She packs him a bundle — bread, a wedge of cheese, a boiled egg if the hens have been kind. She sweeps the courtyard. She walks to the canal for water, which has become, inexplicably, the thing in her day she most looks forward to. The tea has changed — she takes it darker now, from a Turkish kettle, because Ahmed has learned to like it that way from the men at the mill."
 cp_layla_routine_cairo_laborers_wife:0 "She rises at five because the factory siren goes at six and Ahmed must be at the gate by then. She wraps his bread in a cloth and boils water for tea. The stairwell smells of the tinsmith's workshop. By seven she has swept, washed, and gone down for bread; by eight she is at the window watching the women at their washing in the court below. The city noise has stopped surprising her. She finds, without meaning to, that she no longer thinks about the canal at home."
 cp_layla_routine_machinists_wife:0 "She rises at five. Ahmed leaves at six with a tin pail — bread, cheese, the thermos of tea she has learned to trust not to leak. He comes home at seven smelling of iron filings and coal smoke, and he eats while she tells him the day's small news. Her hands are no longer hard in the places her mother's were hard. They are hard in new places — around the handle of the iron stove, across the pad of the thumb."
 cp_layla_routine_shopkeepers:0 "The shop opens at eight. Ahmed is below unlocking the shutters before she has finished the tea. She comes down at nine with the ledger under her arm — she writes the day's totals in Arabic numerals now, and has learned to add in columns. The customers are mostly women from the quarter, and mostly she knows their children's names. The bread comes from the baker two doors down, the cheese from a Greek, the sugar from a Turk whose price is fair enough that she has stopped bargaining every week."
 cp_layla_routine_clerks_wife:0 "Ahmed leaves at eight-fifteen for the ministry, in a grey suit she presses on Sunday evenings. She spends her mornings at the table by the balcony window, writing — letters to her mother's sister in the village, notes for the household ledger, sometimes a line she is trying out in a blank margin because she is beginning, very privately, to write poems. The servant girl makes tea at ten. The boy goes to school in a starched collar that Layla can remember never having seen as a girl."

 # Savings (what she counts, privately)
 cp_layla_savings_village_default:0 "She keeps a small clay pot behind a loose brick in the wall. She counts what is in it on Friday nights, when Ahmed is asleep. She does not name what she is counting toward."
 cp_layla_savings_homesteader:0 "She keeps the deed folded in a cloth inside the wedding chest, and twice a week she takes it out and reads her name aloud to the empty room. Beside the deed there is a small pouch — coins, more of them than last spring — and she has started, with some embarrassment, to count in piastres instead of paras."
 cp_layla_savings_middling:0 "There is a tin box on the top shelf now, with a tiny key she wears around her neck on a string. It holds coins — mostly piastres, a few small silver — and a folded paper that lists, in her own handwriting, the things she is saving toward. She has not shown the paper to Ahmed."
 cp_layla_savings_secure:0 "She has a savings book from the Crédit Foncier now. A clerk with a thin moustache stamps it when she makes deposits, and she has been taught to recognise her own signature on the top of the first page. The book lives in a flat metal tin under the bed. She has stopped counting on Friday nights — the total is in the book, and the book is in the tin, and the tin is where she put it."
 cp_layla_savings_urban_prosperous:0 "There is an account at the Bank of Egypt in Ahmed's name with both their signatures on the card. A small green passbook; the teller greets her by name. She has begun to think in pounds instead of piastres, which is a translation she is still practising and which still sometimes surprises her when she hears herself do it cleanly."

 # cp_layla.15 -- "Her Mother's Left Hand" (always available)
 cp_layla.15.t:0 "Her Mother's Left Hand"
 cp_layla.15.d:0 "Her mother used to reach for bread with her left hand, always. The right hand was always busy."
 cp_layla.15.f:0 "Stirring a pot, wiping a child's face, adjusting a scarf — the right hand was doing something more important. Layla has begun, without noticing, to reach with her left hand too. She notices today because the bread slips from her fingers and falls on the mat, and the mat is not clean, and she has to brush it off and re-examine it before it goes into her mouth. She thinks of her mother's hand. Her mother's hand is buried now, in the cemetery on the western edge of the village, under a rectangle of stones no larger than a loaf. Layla has not been to the grave since the forty-day mourning ended. She will go on Friday, she tells herself. She has been telling herself this every week for four years. This week too, she thinks, she will go. This week too, she will probably not."
 cp_layla.15.a:0 "She eats the bread, left-handed."

 # cp_layla.16 -- "The Hen That Will Not Lay"
 cp_layla.16.t:0 "The Hen That Will Not Lay"
 cp_layla.16.d:0 "The red hen has not laid in eleven days. She has counted. The other two have, but not her."
 cp_layla.16.f:0 "It is the oldest of the three, the red one with the pale feathers on her left wing. Layla has been feeding her the usual handful of dhurra scraps and the usual thought of the pot has been arriving, every morning, more plainly. Today she crouches in the courtyard and looks at the hen and the hen does not look back. There is a decision to be made and Layla has been not quite making it for a week. She thinks of her mother-in-law, who would have made the decision a week ago. She thinks of the broth. She picks up the hen. The hen does not object. Layla carries her to the shaded corner, sets her down gently, brushes a feather from her own lap, and walks away. Another day, she tells herself. Another day."
 cp_layla.16.a:0 "She gives the hen another day."

 # cp_layla.17 -- "The Merchant's Scale"
 cp_layla.17.t:0 "The Merchant's Scale"
 cp_layla.17.d:0 "She has been watching the merchant's scale for three weeks. She has started to believe it."
 cp_layla.17.f:0 "The onions come home heavier than they leave the market. She has weighed them on her own small stone, the one that was her grandmother's, and the numbers have not been agreeing. The merchant is a man of a certain age with a stutter and a wife who is kind; Layla does not want to be the woman who accuses him. Still. This morning she sets one onion on his scale and, on the way home, she sets the same onion on her stone. The difference is small. But the difference is there. She will not say anything, not this week, not next week. But she will begin to buy her onions from the other merchant, the one from the next village, whose hands are quicker and whose eyes do not rest on the scale the way the first man's do."
 cp_layla.17.a:0 "She changes merchants, quietly."

 # cp_layla.18 -- "Friday, the River Low"
 cp_layla.18.t:0 "Friday, the River Low"
 cp_layla.18.d:0 "The river is low this Friday — not dangerously, but noticeably. The old men are already talking."
 cp_layla.18.f:0 "She goes to the bank after the midday prayer and stands there a long while, looking. The water is the color it usually is but there is more of the bank visible than there should be — the pale stripe along the mud, the one that is not supposed to be visible this time of year. She does not know, exactly, what a low river means in the months ahead, but her mother would have, and her grandmother certainly would have. The old men on the bank are speaking in a low register she recognises from her childhood — the register that precedes decisions about grain stores and the slaughter of animals. Layla walks home slowly. She will say nothing to Ahmed tonight. But she will, quietly, buy an extra sack of beans at the market on Monday."
 cp_layla.18.a:0 "She will buy an extra sack of beans."

 # cp_layla.19 -- "The Old Woman Who Sees Through Walls"
 cp_layla.19.t:0 "The Old Woman Who Sees Through Walls"
 cp_layla.19.d:0 "Umm Saad came by the house today. Umm Saad does not come by the house for no reason."
 cp_layla.19.f:0 "She is ninety, or so everyone says; she herself is vague about it. She has a white plait down her back and a right eye that looks at you and a left eye that looks slightly past you, which is the eye the village believes in. She asks for a cup of water. Layla gives her a cup of water. She drinks it slowly and she looks, for a long time, at the brick behind which Layla keeps the pot, and she does not mention the brick, and then she gets up and thanks Layla and says §Iyour hens are in good health§! and leaves. Layla stands in the doorway after she has gone. Nothing has been said. Everything has been said. She will see Umm Saad at the next funeral and they will pretend this visit did not happen, and Layla will, for the rest of her life, believe in the left eye."
 cp_layla.19.a:0 "She lets Umm Saad see what she will see."

 # cp_layla.20 -- "The Bread That Did Not Rise"
 cp_layla.20.t:0 "The Bread That Did Not Rise"
 cp_layla.20.d:0 "The dough is dense this morning. She knows the moment she presses her thumb into it. Something is wrong."
 cp_layla.20.f:0 "She cannot say what exactly — the water was the right temperature, the flour was from the same sack as yesterday, the yeast was from the same corner of the same pot. But the dough is wrong. She shapes it anyway and bakes it anyway, and the loaves come out flat and heavy, and they taste like the bread of a year she does not want to remember: the year of her second lost baby, the year the rains were slow. She sets the loaves on the rack and sits on the step of the courtyard and does not weep, because she does not weep; but she sits there for a long time, longer than it takes the loaves to cool. Ahmed will ask nothing. The loaves will be eaten."
 cp_layla.20.a:0 "She lets the loaves cool."

 # cp_layla.21 -- "Dust on the Water"
 cp_layla.21.t:0 "Dust on the Water"
 cp_layla.21.d:0 "The khamaseen came through before dawn. She closed the cistern in time. Most of the dust is outside — most, not all."
 cp_layla.21.f:0 "She has been at it for two hours now: the swept floor, the re-swept floor, the shaken-out rug, the wiped-clean shelf, the bread-bowl that she has had to rinse three times because the dust finds its way into the flour the way water finds its way into a cracked clay pot. Her head-scarf is grey with the dust. So are her forearms, up to the elbow. She does not mind, quite, the work — the work has a shape, an end, a measurable quantity — but she minds the helplessness of the wind, which can undo six hours of a woman's week in twenty minutes and does not owe her an explanation. She goes out once more to the cistern to check that the lid held. The lid held."
 cp_layla.21.a:0 "She sweeps again."

 # cp_layla.22 -- "The Younger Brother's Letter"
 cp_layla.22.t:0 "The Younger Brother's Letter"
 cp_layla.22.d:0 "Kareem has written from somewhere. She will need the baker's son to read it to her."
 cp_layla.22.f:0 "Her younger brother has not been home in five years — he went to Alexandria, or so the family story goes, to work with a cousin of a cousin, and the letters have been, until now, rare. The baker's son is sixteen and can read, and he reads to her in the lane, with the letter held close to his eyes because the writing is small and the paper is thin. Kareem is alive. Kareem is not in Alexandria. Kareem is somewhere in Greece, working in a warehouse, and he sends four piastres folded into the paper, which he asks her to give to their mother, who is dead, which he does not know. Layla folds the four piastres back into the letter and walks home holding the letter like a thing that could shatter. She will write nothing back. She will not know, for three more years, whether he is still alive."
 cp_layla.22.a:0 "She folds the letter into the chest."

 # cp_layla.23 -- "The Mule That Will Not Move"
 cp_layla.23.t:0 "The Mule That Will Not Move"
 cp_layla.23.d:0 "The village mule has stopped in the lane, and the village mule will not be persuaded to start again."
 cp_layla.23.f:0 "He belongs to nobody in particular — the village owns him, or he owns the village, depending on whom one asks — and this afternoon he is standing squarely in the lane between Layla's door and the well with a cart of straw behind him and a young boy who is too small to whip him with any seriousness pleading with him in a reedy voice. Layla leans in the doorway with the bucket under her arm, waiting. She is not in a hurry. The mule is. Eventually the young boy gives up and goes to find his father and the mule, unobserved, takes one thoughtful step forward, then another, then begins, at his own leisurely pace, to walk. Layla picks up the bucket and follows him toward the well. She has learned, over the years, that the village moves at the speed of the village, and that impatience is a thing for other women in other places."
 cp_layla.23.a:0 "She walks behind the mule."


 # ----- Tech arrival reactions (cp_layla.30..32) -----

 # cp_layla.30 -- "The Iron Horse" (railways arrive in Egypt)
 cp_layla.30.t:0 "The Iron Horse"
 cp_layla.30.d:0 "Word has come up the canal road. A machine that pulls itself. No mule, no ox. Black smoke against the morning."
 cp_layla.30.f:0 "She does not go to see it. She is told, by the boy who delivers bread, that it makes a noise like the end of the world and moves faster than a horse at full gallop. He is twelve and has been crying, and he does not know why. She asks him if he liked it. He thinks for a while. He says he does not know. That evening, washing turnips in the shade of the wall, she tries to picture a mule made of iron and cannot, and then she tries to picture nothing pulling it at all, and she cannot picture that either. The world is getting bigger. She is not sure yet whether a bigger world is a better one."
 cp_layla.30.a:0 "She decides, next time the bread-boy comes, to walk with him to the canal road."
 cp_layla.30.b:0 "The world is larger than she thought. She says nothing."

 # cp_layla.31 -- "A Word From Beyond" (electric telegraph)
 cp_layla.31.t:0 "A Word From Beyond"
 cp_layla.31.d:0 "The news from Istanbul reached Cairo before the afternoon prayer. Not by courier. By a wire."
 cp_layla.31.f:0 "Nobody in the village has seen the wire, but the man from the next village says he has touched one where the road bends past his cousin's mill. It is cold, he says, and nothing moves inside it. And yet. Yesterday the Sultan decreed and today the Pasha knows. She tries to picture it — a word travelling on a string, not stopping for mountains, not stopping for the sea — and the picture refuses. A word is made in a mouth. A word needs a mouth to catch it. She asks the imam, because she is not sure who else to ask. He says it is permitted. He does not say whether he understands it."
 cp_layla.31.a:0 "She believes it. She does not understand it."
 cp_layla.31.b:0 "She says nothing to anyone, and she prays that night for clarity."

 # cp_layla.32 -- "Voices in the Air" (radio)
 cp_layla.32.t:0 "Voices in the Air"
 cp_layla.32.d:0 "A box, in the shopkeeper's house. A voice comes out of it. A woman's voice, singing — and no woman there."
 cp_layla.32.f:0 "She sits outside with the other women, on the bench the shopkeeper has dragged out for them, and the song comes through the open door. None of them will go inside. It is not the song, exactly. It is that she cannot tell whether the woman singing it is alive, now, at this very hour, or was alive once and is gone. Perhaps she is in Cairo. Perhaps she is in Europe. Perhaps she is in a grave, and the grave is singing. The shopkeeper's wife keeps bringing them tea and they keep not drinking it. The song ends. Another begins. Layla realises she has been holding her breath."
 cp_layla.32.a:0 "She asks, quietly, whether the singer knows we are listening."
 cp_layla.32.b:0 "She goes home before the next song. It is too much, all at once."


 # ----- War-end reactions (cp_layla.40..41) -----

 # cp_layla.40 -- "The Column Returns" (Ahmed comes home)
 cp_layla.40.t:0 "The Column Returns"
 cp_layla.40.d:0 "The dust on the canal road is a different dust today. Horses. Men. The shape of him, smaller than she remembered, at the back of the column."
 cp_layla.40.f:0 "He stands in the doorway before he comes in. He is looking at the doorway as if he is deciding whether he is still permitted to cross it. She puts down the bread. She says his name once. He nods. He does not speak. That will come later — in weeks, perhaps, or in months — and when it comes it will arrive in small pieces at odd hours, about things she was not expecting to hear. For now he sits on the stool where he used to sit. He eats what she puts in front of him. He asks if the well is still the well. He asks if the neighbour woman with the bad hip is still the neighbour woman with the bad hip. She says yes, and yes. He nods, and nods, and the afternoon passes. At dusk she understands that her husband is home, and that he is not entirely the husband she sent away, and that she does not mind."
 cp_layla.40.a:0 "She sets an extra plate at the table."

 # cp_layla.41 -- "The Clerk's Letter" (Ahmed killed)
 cp_layla.41.t:0 "The Clerk's Letter"
 cp_layla.41.d:0 "An official on a donkey came through the village today. He had a ledger and a list of names. He had one name for Layla's house."
 cp_layla.41.f:0 "He did not dismount. He asked in a tired voice, in a formal Arabic too flat for the village's ear, whether this was the house of Ahmed son of Mahmoud. She said that it was. He said: then I have news, and I am sorry to carry it. He read the line from the ledger. It was a single line. The village women gathered behind her, not close. When he had read it he put the ledger back in his saddlebag and said — not unkindly — that the country was grateful. Then he rode on to the next name. Layla went inside and she did not close the door. She did not sit down. She stood at the wall where he used to hang his coat. She did not weep yet, because weeping would come later, and she wanted first to be alone with this."
 cp_layla.41.a:0 "She closes the door."


 # ----- Industrial-building reactions (cp_layla.50..) -----

 # cp_layla.50 -- "The Smoke Above the Palm" (first textile mill in her state)
 cp_layla.50.t:0 "The Smoke Above the Palm"
 cp_layla.50.d:0 "There is a new tall thing on the horizon, past the canal. It has a chimney. The chimney gives off smoke in a pillar so straight it looks like it has been painted there."
 cp_layla.50.f:0 "She passes near it once, on the way to her aunt's house. The ground vibrates — not an earthquake vibration, a steady one, continuous, as if the earth itself has become a slow drum. A few men stand at the gates in clean clothes. Many more men, in less clean clothes, walk in at dawn and do not come out until after sunset. One of her cousins works there now. He sends a little money home and he does not come back for Friday prayers anymore. The cousin says the machines are from Manchester. He says the word 'Manchester' as if it is a place, not far off, where bigger things happen. She nods. She does not know where Manchester is. She does not ask."
 cp_layla.50.a:0 "The world is getting bigger. She is not certain that it is getting better."
 cp_layla.50.b:0 "She wonders whether her sons, when they come, will walk to that gate at dawn."


 # ----- Revolution reactions (cp_layla.60..) -----

 # cp_layla.60 -- "The Shutters Close"
 cp_layla.60.t:0 "The Shutters Close"
 cp_layla.60.d:0 "Riders came through the village at dusk with rifles on their backs and a flag she did not recognise. They did not stop. They rode on toward the river."
 cp_layla.60.f:0 "She put out the lamp without needing to be told. She sat with the children in the dark, on the far side of the room from the window, and she did not speak, and she did not let them speak. Across the lane, the neighbour woman had done the same — Layla could tell by the dark where there should have been a lamp. Somewhere, not far enough, a rifle was fired, and then another, and then nothing. They sat in the dark for a long time. The country had split open. She had heard the word — inqilab — from her grandfather once, about a thing that happened when he was young, and now the word was here, in her lane, on the road to the river. In the morning she would sweep, and she would draw water, and she would give the children their bread, because that is what one does, because the country does not know her name and therefore the country cannot come for her directly — only through her husband, her sons, her door. But tonight she sat in the dark, and she did not hope, and she did not pray, because hoping and praying were both noises and tonight she had learned the value of silence."
 cp_layla.60.a:0 "She sits in the dark until dawn."
 cp_layla.60.b:0 "She listens for hoofbeats. She begins, quietly, to calculate."


 # ----- Crossroads (cp_layla.70..) -----

 # cp_layla.70 -- "Cairo Is Calling" (migration crossroads)
 cp_layla.70.t:0 "Cairo Is Calling"
 cp_layla.70.d:0 "Word has come from a cousin who lives in the city. The mills are hiring. Ahmed's hands, the cousin writes, are the right hands. The pay is in coins, weekly. There is a room, small, in a building with many rooms."
 cp_layla.70.f:0 "She sits with Ahmed in the dark after the children have been put to bed. The lamp is low. The letter the cousin dictated to a friend's son sits on the low table between them. The son's handwriting is careful — he writes like a boy practising for an exam he hopes to pass. Ahmed has read the letter aloud to her twice. She has not asked him to read it a third time, because she does not want him to know she is trying to memorise it. The letter says: we can help. There is work. There is a room. She stares at the lamp. She stares at the letter. She thinks of her field, which is not theirs on paper, which may never be theirs on paper, which has fed her family and may not always. She thinks of the mill she saw once from the far bank of the canal, the one with the smoke, the one that vibrated the ground. She thinks of her mother's grave, and of Ahmed's mother's grave, and of the heron that stands in the irrigation channel, and of a room she has never seen, and of a city she has never seen, and of the sound — imagined — of children she has not yet had, speaking a kind of Arabic she does not yet know, in a kind of street she cannot picture. What do they decide?"
 cp_layla.70.a:0 "All of us go. We will learn the city. The family stays together."
 cp_layla.70.b:0 "Ahmed goes alone. I stay with the children. We will see each other when we can."
 cp_layla.70.c:0 "We stay. The field has been ours for generations. It will have to keep being ours."

 # cp_layla.71 -- "The Small Concern" (ownership crossroads)
 cp_layla.71.t:0 "The Small Concern"
 cp_layla.71.d.laborer:0 "A cousin-in-law has come by with a proposal written on two sheets of paper in careful handwriting. He needs a partner. The partner would own — on paper — half."
 cp_layla.71.d.machinist:0 "A foreman Ahmed respects has come by after the shift with a proposal on two sheets of paper. He has watched Ahmed on the machines for six years. He wants Ahmed as a partner in a small workshop he is buying out. The partner would own — on paper — half."
 cp_layla.71.d.clerk:0 "A senior clerk at the office has come by in the evening with a proposal written in the steady hand of a man who has written a great many contracts. He needs a partner who can read one. The partner would own — on paper — half."
 cp_layla.71.d.engineer:0 "A workshop owner has come by the flat with a proposal — specifications, drawings, and a column of numbers — and has laid them on the table the way a man lays down a hand of cards. He needs an engineer who is also, for once in his life, a partner. The partner would own — on paper — half."
 cp_layla.71.f.laborer:0 "She sits with Ahmed in the evening, at the small table. The cousin-in-law has been and gone. The two sheets of paper are between them. He is a steady man, the cousin-in-law — not a schemer. The workshop makes felt for hats. It has three looms and two women who come in for the day shift and go home at dusk. He needs capital. He has been refused by the bank, as he was always going to be refused, because his name is what it is. If they have saved — and they have, for four years now, in the pot behind the loose brick — they could be the capital. They would be, on paper, the owners of half. She thinks: I am the wife of a man who tends a machine for wages. She thinks: I have never owned a thing larger than a donkey. She thinks: if the felt business fails, the pot is empty, and we are back where we began, and we are older. She also thinks: if it does not fail, my daughter might go to school past the age her cousins went, and my son might be a man who signs his own name on a contract, and I might — in the time I have left — learn what it is to sit on the owner's side of a table."
 cp_layla.71.f.middle:0 "She sits with Ahmed in the evening, at the table they now have — the one with four matched chairs. The papers are between them. She reads the first sheet herself, slowly, because she can; the second sheet she asks Ahmed to read aloud, because the numbers on the second sheet are the kind that go wrong when you read them quietly. The workshop has six machines — or four looms and two presses, depending on what has happened in the last month — and a small yard behind it, and twelve employees on paper and fourteen in practice. The owner is a man with no sons. He wants a partner who understands the work and who can read the books. Ahmed, when he finishes the second sheet, does not say yes and does not say no. He is looking at her. She thinks: I am, tonight, being asked whether we should become a different kind of household. She thinks: we could afford to say no, and keep our Friday quiet, and grow old in this flat. She thinks: we could afford to say yes, and become a different kind of people, and learn the weight of it. She also thinks — a thing she has not said to Ahmed in all the years of their marriage — that her grandmother, who was a peasant in a village you have never heard of, would laugh at the question. Not unkindly. The way one laughs at a door one is about to walk through."
 cp_layla.71.a:0 "They invest. The pot comes out from behind the brick. They become the capital."
 cp_layla.71.b:0 "Ahmed takes a loan to match the savings. They bet on the partnership."
 cp_layla.71.c:0 "They refuse. The pot stays. They remain where they are."


 # ----- Mortality events (cp_layla.80..82) -----

 # cp_layla.80 -- "The Last Morning" (Layla dies)
 cp_layla.80.t:0 "The Last Morning"
 cp_layla.80.d:0 "The morning has the quality of a morning that does not require her to make it go. She lies on her bed and she listens to the first call to prayer and she does not get up."
 cp_layla.80.f:0 "A daughter — or a neighbour, or her younger sister who came after the last funeral and has not yet left — comes in with water. Layla says a small thing about the water. The daughter, or the neighbour, or the sister, says a small thing back, and goes out again, because the morning has the kind of sunlight in it that does not require speech. She thinks, unhurriedly, of the woman at the quern at nine years old. She thinks of the seventeen-year-old at the wedding. She thinks of the one who stood, once, in an imagined room in Cairo, with a sentence in her mouth, and who came back from that room without having been afraid. She thinks of Ahmed. She thinks of a heron in the irrigation channel whose particular stillness she has never, in all the years since, stopped being grateful for. The light on the wall is the light she has known. Outside, the day is beginning. She closes her eyes. The day will go on without her, the way days do, and the carpet in the imagined room will still be long, and somewhere another woman — younger, in a village Layla has never seen — is thinking of saying the sentence aloud for the first time. She trusts the sentence to her. She lets go. The light does not change."
 cp_layla.80.a:0 "#italic The morning continues.#!"

 # cp_layla.81 -- "The Foreman's Runner" (Ahmed dies at the mill)
 cp_layla.81.t:0 "The Foreman's Runner"
 cp_layla.81.d:0 "A boy from the mill has come up the three flights of stairs with a message he does not know how to deliver."
 cp_layla.81.f:0 "He knocks at the wrong door first. The neighbour sends him to hers. He stands in her doorway and he cannot get the first word out, and he does not need to. She has understood from his face before she understood from his mouth. There was an accident, he says, eventually. The machine. The belt. The manager is very sorry. The manager has asked the boy to tell her that the manager is very sorry. The boy delivers the manager's regret as if it were a parcel and she is the cabinet in which the parcel is to be stored. He goes. She does not close the door. She stands in the doorway. She does not weep yet, because weeping would come later, and she wants first to be alone with this. Somewhere below, in a room she has never seen, her husband's body is being waited for by a physician who will write a death certificate with a category in it — workplace incident — and a number, and the number will be added to a column in a ledger in Cairo, and the column, in the following year, will be discussed or not discussed in a chamber Ahmed never entered. Above her head the lamp is not lit. It is still morning. She stands in the doorway. The manager is very sorry."
 cp_layla.81.a:0 "#italic She closes the door when she has decided to close the door.#!"

 # cp_layla.82 -- "The Child" (a child dies of illness)
 cp_layla.82.t:0 "The Child"
 cp_layla.82.d:0 "The fever came in from the lane two streets over and it moved, in the way these fevers move, from house to house and then into theirs. Tonight the fever is in the small body on the pallet, and the small body is thinner than it was this morning."
 cp_layla.82.f:0 "She has sat with the small body for two days. Ahmed is at the mill because the mill is where one is on the days it is not the Friday. A neighbour woman has sat with her for parts of both days, taking over when Layla's hands shake too badly to hold the cloth. The midwife came in the afternoon yesterday. She looked at the small face and she did not say anything, which is what the midwife says when there is nothing to say. Layla has boiled the herbs her mother boiled, and her mother's mother boiled, and she has held the small body against her chest, and she has sung — the first night, because singing was what she remembered; the second night, because singing had become the thing her hands did while her mind was doing something else. In the hour before dawn the small body stops being hot. It stops being hot, and then it stops being anything, and Layla — who is forty-two years old and who has held many small bodies in her life — understands this particular quiet and does not, at first, do anything about it. She holds on for a while longer. The morning call to prayer comes from the mosque four streets over. She lays the small body down. She folds the hands. She covers the face. She sits with her own hands in her lap. It is quiet. She has not yet told Ahmed. She will tell Ahmed when Ahmed comes home. Until then the child is hers alone, for one more hour, in the quiet before the lane wakes up."
 cp_layla.82.a:0 "#italic She sits with the child until Ahmed comes home.#!"


 # ----- Welfare (cp_layla.90) -----

 # cp_layla.90 -- "The First Envelope" (first welfare receipt)
 cp_layla.90.t:0 "The First Envelope"
 cp_layla.90.d.pension:0 "A clerk from the district office has come up the stairs on his Thursday rounds. He is carrying a list and a canvas satchel with envelopes in it. One of the envelopes, he says, has her name on it."
 cp_layla.90.d.subsidy:0 "Ahmed has come home from the mill tonight with his wage envelope — and a second, thinner envelope — which he lays on the table with the careful puzzlement of a man who has been asked to carry something he does not understand."
 cp_layla.90.d.poor:0 "The woman who comes to the lane on Tuesdays with bread for the women who have nothing has brought, today, a paper with a stamp on it — and a small coin tied in a cloth — and her name."
 cp_layla.90.f:0 "She has not, before today, been the person the country intended to hand a thing to. The country has handed things to men before — a uniform, a rifle, a ledger with a farm's name in it. The country has handed things, occasionally, through men — a bride-price, a tax receipt, a burial permit. Today the country is handing a thing directly to her. She takes the envelope, or the paper, or the coin tied in the cloth. She does not know what face to wear while doing this. Her mother never had this face to practise. Her grandmother had not imagined this expression would be needed. She tries a small polite nod. She tries a small stiff thank-you. She holds the envelope in both hands as if it might fly off. The clerk — or the subsidy officer, or the bread-woman — goes on to the next name. Something in her chest has shifted. She is not sure, yet, whether the shift is in the direction of gratitude or in the direction of quiet offence that the country had decided to send this envelope only now, and not in any of the years before."
 cp_layla.90.a:0 "She takes it with thanks. The country has, at last, seen her."
 cp_layla.90.b:0 "She takes it without thanks. The silence before the envelope does not un-happen."

 # cp_layla.91 -- "The New Law" (welfare tier up)
 cp_layla.91.t:0 "The New Law"
 cp_layla.91.d.pension:0 "They have passed a pension. Word came up the lane at midday. An old woman — nobody Layla knows — will receive, beginning next month, a sum of money from the country every Thursday until she dies."
 cp_layla.91.d.subsidies:0 "They have passed a subsidy. The foreman at Ahmed's mill announced it at the end of the shift, unwilling to meet the men's eyes as he did. The wages will be topped up. The country is paying."
 cp_layla.91.d.poor:0 "They have passed a relief law. The bread-woman in the lane will come now with paper and a stamp, not only with bread, and the paper will entitle the destitute households to a small fixed sum."
 cp_layla.91.d.default:0 "A new law has passed. Word has reached the lane that the country intends, from next month, to pay money directly to certain households it had not paid money to before."
 cp_layla.91.f:0 "She sits with the news on the threshold in the late light. She thinks of her mother, who died on a Friday because there was no physician and no money to fetch one. She thinks of the widow two lanes over whose children walked barefoot for three winters and who would, under this new law, not have walked barefoot. She thinks of her own household, and of whether this law will reach her, and of whether her gratitude — if it comes — will be clean gratitude or the complicated kind that has, underneath it, a quiet resentment that the law came now and not earlier. She does not know yet. She will have to wait to see it happen. Laws on paper are not the same as envelopes in the hand; she has lived long enough to know that."
 cp_layla.91.a:0 "She allows herself a small hope. The country, for once, has moved in the right direction."
 cp_layla.91.b:0 "She'll believe it when an envelope reaches her door."

 # cp_layla.92 -- "They Have Taken It Back" (welfare tier down)
 cp_layla.92.t:0 "They Have Taken It Back"
 cp_layla.92.d.none:0 "The welfare law has been repealed. No replacement. The news came up the lane in the evening and by the time it reached her door it had been told by four mouths, and every mouth had added something, and the something had always been worse than what came before."
 cp_layla.92.d.partial:0 "The welfare law has been rolled back. A smaller law replaces it — enough, still, for some; not enough for others. Which side of the line her household sits on, the lane will learn in the coming weeks, not today."
 cp_layla.92.f:0 "She stands in the doorway. She thinks of the envelope the country had, recently, taught her hand to hold — and of what it had been like, however brief, to be the person the country intended to hand a thing to. She thinks of her mother's grave, which is what she always thinks of when the country takes a thing back. She thinks of the widow two lanes over, whose children had begun, under the law, to wear shoes. She thinks of the lane itself — which is, tonight, darker than it was last night, and which will be darker still by next week. A country's direction, she has learned, is a thing that can be reversed. It is a thing that HAS been reversed. She had, foolishly, allowed herself to think this one particular reversal would not come. She was wrong. She will not be wrong in the same way again. Something in her chest, tonight, becomes harder than it was this morning."
 cp_layla.92.a:0 "She turns. She finds the neighbour in the lane who organises. She asks when the next meeting is."
 cp_layla.92.b:0 "She closes the door. She keeps the thought to herself — for now."


 # ============================================================================
 # Imagined audience with the Pasha
 # See documentation/characters/layla/conversation.md
 # Reference to the actual ruler via [ROOT.GetCountry.GetRuler.GetFullName]
 # so this prose ages with the game -- Muhammad Ali in 1836, Isma'il in 1867,
 # whoever holds power when the audience is imagined.
 # ============================================================================

 # cp_conversation.1 -- Root: she goes to Cairo in her mind
 cp_conversation.1.t:0 "An Audience in Cairo"
 cp_conversation.1.d.default:0 "She is kneading the second loaf and she has decided, tonight, to go to Cairo in her mind."
 cp_conversation.1.d.at_war:0 "She is kneading the second loaf — Ahmed's loaf, though Ahmed has not been home to eat it for longer than she likes to count — and she has decided, tonight, to go to Cairo in her mind."
 cp_conversation.1.d.widow:0 "She is kneading the second loaf, which she kneads alone now, and she has decided tonight to go to Cairo in her mind."
 cp_conversation.1.f:0 "She has never been. She will never be. The dough is on the board in front of her, and her hands are working it with the turn and fold she has been doing since she was eleven, and the kitchen is quiet except for the soft rhythm of the dough. And then, between one fold and the next, she is not in the kitchen. She is at the end of a long carpet the colour of old blood, in a room with a ceiling she cannot see, and at the far end of the carpet [ROOT.GetCountry.GetRuler.GetFullName] is waiting for her. She does not know what he looks like. She has invented a face: a man of some age, a beard the colour of ashes, eyes she cannot read. She has invented the room too. She does not know what the palace is really like, and so she has built one from rumour and from the stories travellers brought through the village when she was small — gold thread on the cushions, brass lamps, a secretary at a low table with ink on his fingers. She takes one step forward on the carpet. She is wearing a dress she does not own. Her hands, she notices, are clean. She has an hour, perhaps. She has rehearsed this, kneading bread, a hundred times. Tonight she lets it happen. What does she speak of tonight?"
 cp_conversation.1.a:0 "Tell him about the land."
 cp_conversation.1.b:0 "Tell him about Ahmed."
 cp_conversation.1.c:0 "Tell him about the children."
 cp_conversation.1.d:0 "Tell him about the city, and the room."
 cp_conversation.1.e:0 "Tell him about the paper."
 cp_conversation.1.f:0 "Tell him what she thinks of the country."
 cp_conversation.1.g:0 "Tell him about the mill, and the foreman."
 cp_conversation.1.h:0 "Tell him a small thing."
 cp_conversation.1.i:0 "Tell him how distant her old life has become."
 cp_conversation.1.z:0 "The courage leaves her. She returns to the oven."

 # cp_conversation.10 -- Her opening speech (THE LAND)
 cp_conversation.10.t:0 "The Land"
 cp_conversation.10.d.default:0 "She stands at the end of the carpet. [ROOT.GetCountry.GetRuler.GetFullName] is waiting for her to speak."
 cp_conversation.10.d.serf:0 "She stands at the end of the carpet. Her hands, she notices, are shaking. The bey does not know she is here. She hopes, in the real world, the bey will never know."
 cp_conversation.10.d.owner:0 "She stands at the end of the carpet with a paper folded in her imagined hand. The paper says the field is hers. She has come to thank him — and to ask, perhaps, for something more."
 cp_conversation.10.f:0 "Effendim, she says — and her voice is smaller than she rehearsed, smaller than she meant, smaller than the room — I have come about the land. She clears her throat. The room is enormous. She is aware of the secretary's pen at the edge of her vision, scratching. She begins again. My name is Layla, daughter of Mohamed al-Sharif, of a village in the Delta you have never heard of. My grandfather planted in this soil. His grandfather planted in this soil. His grandfather before him planted in this soil. They are in the soil now. I will be in the soil. My children, if I have children who live, will be in the soil. I have known that field for thirty years. I have known it in the flood year that was good, when the silt was the colour of dark tea, and in the flood year that failed, when we ate less in every month until Ramadan came, and in the year the locust took the eastern strip and left the western strip, and in the year my mother died with her hand on the dry earth at the edge of the canal. She pauses. She is not looking at him. She is looking somewhere past his shoulder, at a window she has also invented, which lets in an imagined sun. The field is ours, Effendim. The field has always been ours. The ledgers in Cairo say otherwise. The ledgers say the field belongs to a man none of us have seen, who sends his bailiff at harvest with a donkey and a book, and the bailiff takes what the ledger tells him to take, which is never what was agreed at planting, which is never what leaves us enough for winter. I am not a woman of the city. I do not know the laws. I know only that the field is ours, and the paper is not, and I have come — she looks at him now, truly — I have come to ask you for a paper. One paper. With my name on it. With my husband's name on it, if the law requires that. With the name of the field on it. That my grandchildren, when they are old, can show to the bailiff and say, the field is ours. Because it has always been ours. That is what I have come to say. She stops. Her hands, she realises, have been gripping the folds of the dress she does not own. She unclenches them. She waits."
 cp_conversation.10.a:0 "#italic as the Pasha:#! \"The land has owners. You are not one of them.\""
 cp_conversation.10.b:0 "#italic as the Pasha:#! \"Speak on. I am listening.\""
 cp_conversation.10.c:0 "#italic as the Pasha:#! \"A peasant woman should not be in this room.\""

 # cp_conversation.11 -- She faces the dismissive Pasha
 cp_conversation.11.t:0 "He Does Not Look Up"
 cp_conversation.11.d:0 "He says it without lifting his head. The secretary's pen does not pause."
 cp_conversation.11.f:0 "The words land in the room and do not ask permission to land. The land has owners. You are not one of them. She feels the breath go out of her in a long quiet way, as if she had been struck in the chest by something soft and heavy, like a wet cloth, like grief. She stands on the carpet. She does not move. She is aware that in the real kitchen, her hands have stopped working the dough, and she forces them to begin again. In the imagined room, she stays. She had prepared herself for anger. She had prepared herself for indifference. She had not prepared herself for the efficiency of it — the way he said it, as if stating the time, as if telling the secretary to bring tea. Effendim, she says, and she hears her voice now with a kind of distance, as if she were listening to another woman speak. Effendim, perhaps I have not been clear. We work the land. We have always worked the land. My grandfather — I said, he says, without looking up, the land has owners. You are not one of them. The bailiff collects what the ledger requires. The ledger was drawn up correctly. Your name, and your husband's name, are on the ledger in the appropriate column. The column for those who work the land. Not for those who own it. That column is filled. That column has been filled, in some cases, since before your grandfather's grandfather. There is a silence. Effendim, she says again — and now there is something in her voice she did not plan to put there — Effendim, what if the column were wrong? He lifts his head for the first time. What does he do next?"
 cp_conversation.11.a:0 "#italic as the Pasha:#! \"There is a small parcel near the canal road. Take it. Go home.\""
 cp_conversation.11.b:0 "#italic as the Pasha:#! \"Enough. The audience is over. Secretary — show her out.\""

 # cp_conversation.12 -- She faces the engaged Pasha
 cp_conversation.12.t:0 "He Is Listening"
 cp_conversation.12.d:0 "He leans forward very slightly. The secretary stops writing."
 cp_conversation.12.f:0 "Speak on, he says, and the voice is warmer than she expected, and she cannot tell if the warmth is real or if it is something men like him have learned to put into their voices when peasants come before them, and for a long moment she cannot remember what she had meant to say next. She is aware of her own breath. She is aware of the sweat on the back of her neck, which in the imagined room should not be there but is. She collects herself. Effendim, she says — and this time she hears her own voice clearly, clearly enough that the secretary, she notices, has begun to write again — Effendim, I know that the wars need men. I know that the men need arms. I know that the arms need steel, and the steel needs money, and the money comes from somewhere, and I am not a fool. I know that most of where the money comes from is us. The villages. The wheat. The cotton the bey makes us plant instead of wheat now, because it fetches a better price in the port. I am not angry about this. No — that is not true. I am angry. But I understand. A country is a thing that costs. She pauses. She has never said this aloud, not to Ahmed, not to her mother when her mother was alive, not to herself before tonight. But Effendim, she continues, when the cost is paid and paid and paid again, and the ones who pay have no paper saying that the field they water with their backs is their field — then one day something will break. I do not know what will break. I do not know what year. But I know my grandmother knew what it was like when the floods failed, and I know my mother knew, and I know I have known. And I know that the paper, Effendim, would be a cheap thing for you to give. Cheaper than the steel. Cheaper than the wars. Cheaper than the next revolt you will have to crush. She stops. She has said more than she meant to. The room is still. He has been listening. He makes a small gesture — the kind of gesture a man makes when he has decided something. What does he say?"
 cp_conversation.12.a:0 "#italic as the Pasha:#! \"I will consider what you have said. We will speak of this again.\""
 cp_conversation.12.b:0 "#italic as the Pasha:#! \"Let me ask you this: what if I gave this land to a soldier?\""

 # cp_conversation.13 -- She faces the cruel Pasha
 cp_conversation.13.t:0 "He Says the Quiet Thing"
 cp_conversation.13.d:0 "The warmth she had imagined in his voice is not there. Something else is."
 cp_conversation.13.f:0 "A peasant woman, he says, should not be in this room. He is not cruel the way the bailiff is cruel, which is a small cruelty in service of small appetites. He is cruel the way a man is cruel who has never been told no, and who believes that the reason he has never been told no is that he has always been right. You have come to me, he says, with the dust of your village still on your skirt, and you believe — he makes a small motion with two fingers, a dismissing motion, the kind one makes at a fly — that I am in need of your opinion on the disposition of land which is not yours. Tell me, he says — and now there is something worse than cruelty in his voice, there is amusement — tell me who it was that dressed you this morning and put these ideas in your head. Was it your husband? Your bey? A French traveller? She stands on the carpet. She feels the sting of his words as if someone had slapped her face and then held a cloth to it, soft and heavy. In the real kitchen her hands are still. She has stopped pretending. In the imagined room she has a choice. She can curtsey. She can go. She can — and she does — open her mouth. Nobody dressed me, Effendim, she says. Nobody put ideas in my head. I have been putting them there myself, in the time between fetching water and waiting for my husband to come home, for thirty years. The ideas are mine. The dust is mine. The room is yours. If you will not hear me, I will go. If you will hear me — one more sentence — I will say the sentence, and then I will go, and I will not trouble you again. She waits. He is looking at her. His face has not changed. But something has."
 cp_conversation.13.a:0 "#italic as the Pasha:#! \"Say your one sentence. Then go.\""
 cp_conversation.13.b:0 "#italic Turn and leave. The audience is over in her mind.#!"

 # cp_conversation.14 -- Dismissive branch: Pasha offers a token
 cp_conversation.14.t:0 "The Parcel by the Canal Road"
 cp_conversation.14.d:0 "He speaks without warmth, without cruelty either. He speaks the way one disposes of a small matter in order to return to larger ones."
 cp_conversation.14.f:0 "There is a small parcel, he says, near the canal road. Unworked for years. The soil is poor. It is too close to the salt. Take it. It is a small thing. I will instruct the secretary. Go home. He is already looking down at his papers again. The audience has ended, although she is still standing in the room. She understands, with the clarity of a woman who has stood in more doorways than she can count, what has happened. He has given her nothing. He has given her a scrap that nobody else wants — a piece of land too salt for wheat, too far from the village to walk, a parcel that will belong to her on paper and on no other axis of the real world. The paper itself, she knows, will not come. A man in Cairo will be told to prepare it. The man will not prepare it. Or the man will prepare it, and another man will misplace it, and she will hear of it again in fifteen years when the bey's bailiff arrives at harvest with a new ledger and no memory of her visit. She stands on the carpet. She thinks of her field, the real one, green and hers and not hers. She thinks of her grandfather's grandmother. She does not say any of this. Thank you, Effendim, she says, because her mother taught her that one always thanks a man who has given you something, even if the thing is not what you asked for, even if the thing is nothing. She turns. She walks the long carpet. Behind her, she does not hear the secretary's pen resume. She knows, in a way she cannot explain, that no parcel will be waiting when she gets home."
 cp_conversation.14.a:0 "#italic She walks the long carpet back.#!"

 # cp_conversation.15 -- Dismissive branch: audience ends abruptly
 cp_conversation.15.t:0 "The Secretary Shows Her Out"
 cp_conversation.15.d:0 "He does not look at her again. The pen is already scratching a new line."
 cp_conversation.15.f:0 "The secretary stands. He is a small man in a dark robe and he has the kind of face that has been trained not to have an expression. He does not touch her. He does not need to. He gestures, politely, toward the door at the far end of the carpet, and he waits, politely, for her to walk. She walks. She walks a long time. The carpet, she realises, is much longer than she had imagined when she came in — or perhaps she is walking more slowly now. She does not look back. She does not know if he has already begun the next audience, with a man who has brought a gift, or with a bey who has come to complain of a neighbour, or with a general who has a war to discuss. She is one woman. There is no gift on the low table beside the carpet where she thought a gift should go. She had not thought to bring one. She did not know gifts were required. At the door she pauses, and she turns, and she says — more to the room than to him — I am Layla al-Sharif. You may forget me. My field will not forget what I said here. The door closes behind her. In the real kitchen, the dough is resting. Her hands are folded in her lap. She has not noticed."
 cp_conversation.15.a:0 "#italic She stands in the kitchen. She does not move for a while.#!"

 # cp_conversation.16 -- Engaged branch: vague promise
 cp_conversation.16.t:0 "I Will Consider It"
 cp_conversation.16.d:0 "He says the words he has said a thousand times to petitioners from the provinces. She can hear, underneath, that he means something by them."
 cp_conversation.16.f:0 "I will consider what you have said, he says. We will speak of this again. She has heard this phrase, in the mouths of lesser men, all her life. From the bey, when the roof of the grain store collapsed. From the bailiff, when the weights at the scale were in his favour by an obvious margin. From the headman of the village, when a woman came to complain about her husband. I will consider it. We will speak of this again. It is the phrase a man uses when he wants the woman to leave. But in this room, Effendim, it is different. She does not know whether it is different because he means it, or because she wants to believe he means it, or because she has worked so hard to imagine the version of him who would mean it that the imagined version is now standing in front of her, wearing his face. Thank you, Effendim, she says. I will wait. She does not know what she is waiting for. She does not know if it will ever come. But as she walks back down the long carpet she feels a small stupid hope inside her chest, the size of a wheat-grain, the kind of hope a woman is wiser to refuse and never can. In the real kitchen her hands have returned to the dough. The dough is ready to rise. She puts the cloth over the bowl. She says nothing to the empty room."
 cp_conversation.16.a:0 "#italic She covers the dough. She lets it rise.#!"

 # cp_conversation.17 -- Engaged branch: hard question
 cp_conversation.17.t:0 "What If I Gave This Land to a Soldier?"
 cp_conversation.17.d:0 "He asks it with something like curiosity. She had not prepared for curiosity."
 cp_conversation.17.f:0 "What if, he says, I gave this land to a soldier? A man who fought for Egypt. A man who lost a leg at Nezib, say, or a son at Konya. A man who earned, by the blood his family has shed for the country, the right to a field. What would you say to him, when he came to your door with a paper in his hand and said, madam, this field is mine now? She stands on the carpet. It is the hardest question anyone has ever asked her, including the midwife when the child would not come. Effendim, she says, after a long moment — I would say to him, may God be merciful to your son. I would say to him, come in, and drink water in the shade. I would say to him, the water of this well is good. And then — she lifts her head and looks at him, truly, for the first time — and then, Effendim, I would ask him to show me the paper. And I would read it. Except that I cannot read. So I would ask him to read it to me. And then I would ask whether the paper named the field, or whether the paper named a field. And if the paper named a field only in general, Effendim, I would say to him, soldier, there are many fields. Let us walk out together and find you one that is not already worked by a woman whose grandfather's grandfather is in the ground. She pauses. The thing I would not say, Effendim, is that this is fair. It is not fair. Fair is not a word I am certain belongs in this room. I would say only: the field is mine. It has always been mine. Find him a different field. There are many. Someone in your secretary's ledger will know where they are. He looks at her. The secretary's pen has stopped again."
 cp_conversation.17.a:0 "#italic She has answered. She is shaking a little. She waits.#!"

 # cp_conversation.18 -- Cruel branch: one sentence
 cp_conversation.18.t:0 "One Sentence"
 cp_conversation.18.d:0 "He lifts one finger. Speak, he says. She has been given the sentence she asked for."
 cp_conversation.18.f:0 "She has rehearsed, standing at the oven, a hundred different sentences. Some of them were angry. Some of them were pleading. Some of them were the kind of sentence a scholar would build, with a beginning and a middle and a closing. She has forgotten all of them. She stands on the carpet and her mouth opens before she has told it to open and she hears herself say — Effendim, if you will not give me the paper, then let my daughter — if I ever have a daughter, if a daughter of mine ever lives past her second year — let my daughter come to this room in my place, in thirty years, and speak the same words, and receive the same nothing, and go home. Because I will teach her to come. I will teach her the names of the fields and the names of her grandmothers and the sound of the quern-stone and the smell of the silt, and when she stands on this carpet she will not be smaller than the room. She will be the size of the room. She will be the size of the river. She will be the size of the whole of Egypt, which is made of women like her, women like me, women who have been standing on carpets like this one forever, waiting for a paper that does not come. That is my sentence, Effendim. I am going now. She has not asked permission. She has already turned. He does not stop her. Perhaps she imagines that, on her walk back down the carpet, he makes a small mark in his own book. Perhaps she imagines wrong."
 cp_conversation.18.a:0 "#italic She walks out on her own feet.#!"

 # cp_conversation.19 -- Cruel branch: she leaves without the sentence
 cp_conversation.19.t:0 "She Leaves"
 cp_conversation.19.d:0 "She does not speak. She turns. She walks."
 cp_conversation.19.f:0 "She had a sentence prepared. She had prepared it at the oven, at the quern, at the well, in the dark of the first hour of the first watch of the night. She had prepared it so often that the sentence had come to feel like a stone in her pocket — a thing she could touch to know was real. In the imagined room, with him looking at her with that face that had not changed, with that amusement still at the edges of his mouth, she chooses not to give him the stone. He does not deserve the stone. The stone is hers. She turns on the carpet. She does not curtsey. She does not thank him. She does not even lift her chin. She simply walks, and the walk takes longer than it should take, and she does not look back to see whether he is watching her go, because she has decided — and this is a decision she will remember, in the real kitchen, for the rest of her life — that his watching or not watching is no longer a fact she will organise her life around. The door opens for her. She passes through. In the real kitchen her hands have finished with the dough and her hands are folded and she is looking out the small window, at the line of the canal, at the palm trees along the canal, at the flat sky. Something in her chest is quiet in a new way. It is not triumph. It is not despair. It is something smaller and steadier, the kind of quiet that follows a decision one has been carrying without knowing it for a long time. She begins to wash her hands in the basin. The water is cold. The quiet stays."
 cp_conversation.19.a:0 "#italic She washes her hands. The quiet stays.#!"

 # ----- Ahmed topic (cp_conversation.20..23) -----

 # cp_conversation.20 -- Her opening speech about Ahmed
 cp_conversation.20.t:0 "Ahmed"
 cp_conversation.20.d.home:0 "She stands at the end of the carpet. Ahmed, she says, is in our fields. I bring him water in the morning. I am not a widow and I know there are widows. I am telling you this because I am grateful, and because gratitude is a thing a country's ruler should be told, sometimes, to his face."
 cp_conversation.20.d.at_war:0 "She stands at the end of the carpet. Ahmed is gone — she does not say this aloud; she means for [ROOT.GetCountry.GetRuler.GetFullName] to hear it in the pauses — and I do not know what country he is in tonight, nor whether he has eaten, nor whether the letter he said he would write has been written and lost, or not been written. I am waiting. I have become, between the kitchen and the well, a woman whose full occupation is waiting."
 cp_conversation.20.d.widow:0 "She stands at the end of the carpet. #italic My husband is dead,#! she says, and her voice does not break. His name was Ahmed son of Mahmoud. He was twenty-six when he left. I do not know the name of the place where he died. I want you to know his name, because somebody should know it, and the official who brought the letter had forgotten it before his donkey turned the corner."
 cp_conversation.20.f:0 "She had not planned to speak of him tonight. She had thought she would only ever speak of the land. But the bread is done and the children are asleep and the kitchen is very quiet, and the quiet has a shape, and the shape is Ahmed's. She stands on the carpet. The secretary turns a page. He is waiting, she thinks, to write her husband's name — because in this country the names of husbands are the nouns the clerks know, and the names of wives are the margins. [ROOT.GetCountry.GetRuler.GetFullName] is waiting for her. What does he say back?"
 cp_conversation.20.a:0 "#italic as the Pasha:#! \"I am sorry. Tell me his name again.\""
 cp_conversation.20.b:0 "#italic as the Pasha:#! \"The country may ask more of him. I will not pretend otherwise.\""
 cp_conversation.20.c:0 "#italic as the Pasha:#! \"Many men serve. Many wives wait. You are not singular.\""

 # cp_conversation.21 -- The compassionate Pasha
 cp_conversation.21.t:0 "He Says His Name"
 cp_conversation.21.d.default:0 "He asks for the name again. She says: Ahmed son of Mahmoud. The secretary writes it. The writing takes a long time."
 cp_conversation.21.d.widow:0 "He asks for the name again. She says: Ahmed son of Mahmoud. The secretary writes it. The writing takes longer than the other names he has written today, and she knows — without being able to say how she knows — that the secretary is writing it more carefully, on purpose."
 cp_conversation.21.f:0 "He says it softly. #italic Tell me his name.#! And when she has said it, he nods, and the secretary writes, and the room — which she had imagined as cold — is not cold. The Pasha looks at her the way a man looks at a woman he is trying to understand, not to dismiss. He does not promise anything. He does not need to. He has done the one thing she came here, tonight, without quite knowing it, to have done. He has looked at her. She has been looked at, and her husband's name has been written, and that is more than she had arranged for. She stands in the imagined room and she finds she is not weeping the way she had thought she would weep. She is only standing. She is only being seen. She is breathing the breath of a woman who, for one imagined hour, has been recognised by the country she lives in."
 cp_conversation.21.a:0 "#italic She lets herself be seen.#!"

 # cp_conversation.22 -- The political Pasha (only if Ahmed alive)
 cp_conversation.22.t:0 "The Country Will Ask"
 cp_conversation.22.d:0 "He does not look at her while he says it. He speaks as if dictating to the secretary. The country may ask more of him. He will not pretend otherwise."
 cp_conversation.22.f:0 "He is not cruel. He is worse than cruel — he is honest. He tells her: there will be another war. There is always another war. Your husband is of fighting age. He will serve. If he survives, he will serve again, until he does not. This is not a thing I can change. This is not a thing I would change if I could. A country that does not send its men does not remain a country. She stands on the carpet. She feels, for the first time in the imagined room, the quiet surge of a thing she has not named in herself before. It is not anger, exactly. It is the sense that one has walked into a room and discovered that the walls are made of something one can, eventually, lean against hard enough to break. She does not speak. She nods. But in the nod she is saying — he cannot hear it, but she is saying it — then I will send him. And I will hate you, a little, for making me. And I will teach my sons, if they live, to read, and to count, and to know the word that was not in my vocabulary when I came into this room tonight."
 cp_conversation.22.a:0 "#italic She says nothing. Her silence has weight.#!"

 # cp_conversation.23 -- The cruel Pasha
 cp_conversation.23.t:0 "Not Singular"
 cp_conversation.23.d:0 "He speaks the words she has been dreading to hear. Many wives. Many men. She is not singular."
 cp_conversation.23.f:0 "#italic Many men serve,#! he says. #italic Many wives wait. Many wives grieve. You are not singular. Do not cry for what every wife has carried since the first war.#! She stands on the carpet. She does not cry. The tears, if they come, will come later, in the kitchen, over the dough, where nobody in the country he governs will see them and no secretary in his service will write them down. Effendim, she says — and she is surprised, a little, to find that she still has a voice in this room — Effendim. My grief is not for the country. My grief is for Ahmed. He was a man, not a category. My waiting is not for the country. My waiting is for Ahmed. He was a man. He was not a category. I will go now. She does not wait for him to dismiss her. She turns. She walks the carpet. The secretary does not write what she said. That is fine. She will say it again, somewhere, to someone who matters more."
 cp_conversation.23.a:0 "#italic She turns. She walks.#!"


 # ----- Children topic (cp_conversation.30..33) -----

 cp_conversation.30.t:0 "The Children"
 cp_conversation.30.d.one:0 "She stands at the end of the carpet. There is one, she says. A girl. She is four. She asks questions at night that have the shape of grown-up questions, and I answer them as truthfully as the hour allows."
 cp_conversation.30.d.many:0 "She stands at the end of the carpet. There are several, she says. They are loud. I wanted to tell you about them because, [ROOT.GetCountry.GetRuler.GetFullName], they are citizens of your country and you have never seen their faces."
 cp_conversation.30.d.grown:0 "She stands at the end of the carpet. My children are grown, she says. I want to tell you what I tried to teach them, and what they learned instead."
 cp_conversation.30.f:0 "She did not plan to speak of them tonight. She had other things rehearsed. But the oldest had cried at bedtime, and the crying had the shape of a question he did not yet have words for, and the question has followed her into the imagined room, uninvited. The secretary turns a page. [ROOT.GetCountry.GetRuler.GetFullName] is waiting. She has not yet decided what she is going to ask for. A school, perhaps. An honest teacher. A schoolbook that is not forty years old. A future for her daughter that does not end at the quern. She will see what comes out of her mouth. What does he say back?"
 cp_conversation.30.a:0 "#italic as the Pasha:#! \"Tell me their names.\""
 cp_conversation.30.b:0 "#italic as the Pasha:#! \"The country needs them. We have plans for their generation.\""
 cp_conversation.30.c:0 "#italic as the Pasha:#! \"Every woman has children. Do not waste your hour on them.\""

 cp_conversation.31.t:0 "He Asks Their Names"
 cp_conversation.31.d:0 "He leans forward a fraction. Tell me their names, he says. She does."
 cp_conversation.31.f:0 "She had not expected to be asked. She says the names in the order of their births. He repeats each one after her, quietly, as if committing them to memory — or as if doing her the courtesy of pretending to. The secretary writes the names down. Under each name he writes the mother's name, because the mother's name is the only name he has. It occurs to her that somewhere, in some actual ledger in the palace, there might be, one day, a page with her children's names on it, written because she asked for nothing more than to have them read aloud. That is not nothing. That is more than their grandmother was given. She stands in the room and she is no longer shaking. Her hands are folded. She is herself, entirely, and her children exist in a country that has heard their names."
 cp_conversation.31.a:0 "#italic She says their names once more, quietly, for herself.#!"

 cp_conversation.32.t:0 "We Have Plans"
 cp_conversation.32.d:0 "He speaks of their generation as one speaks of a harvest. Schools, he says. Factories. A new order of things."
 cp_conversation.32.f:0 "By the time your children are the age you are now, he tells her, they will not recognise the country you grew up in. They will read. They will work with machines. They will go where the work is, instead of staying where their grandfathers happened to die. She listens carefully. She cannot tell, yet, whether what he is describing is a blessing or a theft. Some of the things he says sound like a future she would want for them. Some sound like the loss of a thing she has not finished loving. She nods. She will think on it, she says. She will not say the thing she is thinking, which is: yes, but will they remember us? And if they remember us, will they be ashamed? And if they are ashamed, is that their failing or is it ours — for being the country that is being replaced?"
 cp_conversation.32.a:0 "#italic She nods. She does not say what she is thinking.#!"

 cp_conversation.33.t:0 "Every Woman Has Children"
 cp_conversation.33.d:0 "He waves a hand. #italic Every woman has children. Do not waste your hour on them.#!"
 cp_conversation.33.f:0 "She feels the sting the way she has learned to feel the stings of men who have decided that the women in front of them are shorthand for all the women they have ever met. She does not cry. She does not apologise. She had been going to ask for a school. She had been going to ask whether the school in the next village might have a teacher who could be paid, honestly, a wage the teacher could live on. She does not ask now. She will not give him her question if he has already decided not to hear it. Effendim, she says — and she hears, in her own voice, something she has not heard before — my children are not every woman's children. They are mine. Their names are the names I have given them. Their questions are the questions I answer. I will waste my hour on whatever I want to waste my hour on. Thank you for your time. She turns. She leaves him there. The secretary does not write what she said."
 cp_conversation.33.a:0 "#italic She walks out of her own fantasy.#!"


 # ----- The Room in the City (cp_conversation.40..43) -----

 cp_conversation.40.t:0 "The Room"
 cp_conversation.40.d.fresh:0 "She stands at the end of the carpet. The room, she says. We have a room. It is on the third floor of a building I do not yet know the name of. We are six in a room that held four people before we arrived. I am telling you this because I do not yet know how to tell it to myself."
 cp_conversation.40.d.settled:0 "She stands at the end of the carpet. I live in the city now, she says. It has been a while. I can walk to the river without getting lost. I have a neighbour — a Copt woman, our age, who lost her husband the same year I did — whose door is the only door I knock on without thinking."
 cp_conversation.40.d.struggling:0 "She stands at the end of the carpet. The city is hard, she says. The rent goes up and the wages do not. I do not tell you this to complain. I tell you because the walls here are thinner than the walls of the village, and what happens behind them travels faster than you may realise, Effendim."
 cp_conversation.40.f:0 "She has not yet learned, in the imagined room, to speak of the city without flinching. The walls of the palace are smooth and cold; the walls of her building flake plaster onto the stairs if she is not careful going up. She had expected the city, after enough years, to become a place. It has become, instead, a kind of weather — something to endure, to accommodate, to sometimes enjoy in a specific hour of a specific day. The secretary turns a page. [ROOT.GetCountry.GetRuler.GetFullName] waits. What does he say?"
 cp_conversation.40.a:0 "#italic as the Pasha:#! \"Tell me what the street looks like.\""
 cp_conversation.40.b:0 "#italic as the Pasha:#! \"You are one more body in the streets of a city the country is feeding. Do not expect thanks for arriving.\""
 cp_conversation.40.c:0 "#italic as the Pasha:#! \"Your neighbourhood is restive. Have you noticed?\""

 cp_conversation.41.t:0 "Tell Me What the Street Looks Like"
 cp_conversation.41.d:0 "He asks, and he seems to mean it. Tell me the street, he says. The smell. What you hear at dawn."
 cp_conversation.41.f:0 "She is surprised. She had not expected the Pasha to be curious. She tells him: the street is narrow. There is a baker on the corner whose oven wall is warm against her shoulder when she passes before sunrise. A cart goes by with glass bottles in it, rattling, and the bottles sing the way the quern-stone used to sing in the village, only faster and in a different pitch. The fish-seller has a cry that is half a melody and half a complaint. Somewhere above her head a woman hangs wet laundry out of a window. A cat goes past on some cat's errand. A boy who is too young to be working is already working. She tells him these things. He listens. She cannot tell whether he is listening because he cares or because he is the kind of man who files what he hears and uses it later. She decides, for tonight, that it does not matter. The street has been named in this room. That is something."
 cp_conversation.41.a:0 "#italic She hears her own city in a new way walking home the next morning.#!"

 cp_conversation.42.t:0 "One More Body"
 cp_conversation.42.d:0 "He does not look at her. The city, he says, has absorbed many such arrivals. You are one more."
 cp_conversation.42.f:0 "The words do not surprise her, exactly. She has heard, from men who run smaller rooms than this one — foremen, landlords, the corner policeman — the same arithmetic. We have more of you than we needed. Be grateful you are fed. She stands on the carpet and she does not argue the arithmetic, because the arithmetic is his arithmetic and she has come to know that arguing the arithmetic of men who run rooms is a way of losing one's afternoon. But Effendim, she says — and she is surprised to find her voice is steady — a body that arrives is also a body that works. My Ahmed weaves the cloth you wear. My neighbour stitches it. My cousin's boy loads it onto the cart. We are bodies, yes. We are also the thing that is holding this city up. If we are dust to you, we are dust with hands. She stops. She does not know where the sentence came from. She walks out. She does not wait for him to dismiss her."
 cp_conversation.42.a:0 "#italic She walks out. She finds Ahmed has already come home from the shift.#!"

 cp_conversation.43.t:0 "Your Neighbourhood Is Restive"
 cp_conversation.43.d:0 "He watches her as he says it. She understands, with a small cold clarity, that he is asking a question, not making a remark."
 cp_conversation.43.f:0 "Have you noticed, he says. She has. She has noticed the pamphlets that appear under her door and are gone before sunrise. She has noticed the meeting at the tea-house that ends when a man she does not know walks in. She has noticed the new word the boys use in the street — a word she had not heard in the village, a word that sounds like a thing one could be arrested for knowing. She does not tell him these things. She says, instead: I have noticed that the rent has gone up, Effendim, and the wages have not. I have noticed that the foreman at my husband's mill fines the men for talking at the machines. I have noticed that bread is smaller this year than last year. She does not know, when she has finished saying it, whether she has told him anything useful or whether she has given him the names of her neighbours. She turns. She walks. On the way back down the carpet she learns, in her chest, the feeling of having said a careful thing in a room where there is no such thing as a careful thing, only careful silences."
 cp_conversation.43.a:0 "#italic She walks back with more care in her step than she had on the way in.#!"


 # ----- The Paper (cp_conversation.50..53) -----

 cp_conversation.50.t:0 "The Paper"
 cp_conversation.50.d.fresh:0 "She stands at the end of the carpet with a paper folded in her imagined hand. The ink on it is new enough that she is still afraid to fold it the wrong way. The field is ours, she says. On paper. I came tonight to say thank you, and to ask — she pauses — whether the paper holds."
 cp_conversation.50.d.settled:0 "She stands at the end of the carpet. The field is ours, she says. It has been, on paper, for some years now. I have grown old enough that I have begun to worry about whether my children will inherit the paper, and whether the paper will inherit the field. I have come tonight to ask."
 cp_conversation.50.f:0 "She had not planned to come about the paper. She had come about other things, once, and had got nothing. This time she has something — she has the paper itself, or the memory of it, folded behind a loose brick at home — and she has realised, standing over bread this afternoon, that she has never thanked anyone for it. Thanking a law is difficult. Laws are not people. But a Pasha is a person, and this Pasha is who she thanks. And then — she realises as she stands — thanking is not the only thing she came to say. The worry came in with the thanks. Thanks first, then the worry. That is the order. [ROOT.GetCountry.GetRuler.GetFullName] is waiting. What does he say back?"
 cp_conversation.50.a:0 "#italic as the Pasha:#! \"The country is proud. Keep the field. Work it well.\""
 cp_conversation.50.b:0 "#italic as the Pasha:#! \"And what of your neighbours — those who did not receive a paper?\""
 cp_conversation.50.c:0 "#italic as the Pasha:#! \"Papers can be un-written. You understand.\""

 cp_conversation.51.t:0 "The Country Is Proud"
 cp_conversation.51.d:0 "He says it plainly, without flourish. The country is proud. Keep the field."
 cp_conversation.51.f:0 "She had not expected plainness. She had expected either the extravagance of a man who thinks words are coins, or the indifference of a man who thinks they are not worth spending. She gets, instead, a sentence: the country is proud. Keep the field. Work it well. She does not know if the country is proud. She suspects the country does not think of her at all. But that a man who holds the country's name in his mouth has said the sentence, and had the secretary write it, is enough to make her, for one imagined moment, believe that the field is truly hers — not just on the paper behind the brick, but in the ledger of whatever larger thing a country is. She bows, slightly. She does not bow in the village. She does tonight. She walks the long carpet back and she feels, for the first time in this imagined room, that she belongs to something larger than the field and that the larger thing has, at last, acknowledged her back."
 cp_conversation.51.a:0 "#italic She bows. She walks back light.#!"

 cp_conversation.52.t:0 "And Your Neighbours?"
 cp_conversation.52.d:0 "He asks it not cruelly, not gently — accurately. It is the question she had not prepared for."
 cp_conversation.52.f:0 "And what of your neighbours, he says, who did not receive a paper? She stands on the carpet. The name of her neighbour across the lane comes to her — Umm Mariam, who had worked the field next to theirs for thirty years, and who had not been granted a paper because the bailiff had written Umm Mariam's husband's name incorrectly in the ledger and no one had corrected it. She says the name. Her neighbour, she says, did not receive a paper because a clerk put the wrong letter in the wrong box. The field she works is not hers. It will not be her sons' either. I am proud of my paper, Effendim. I am also ashamed of it. I do not know how to hold both at once. But I have come to say: if the paper is real, make more papers. Make one for Umm Mariam. Make one for every woman in my village whose husband's name was entered correctly or incorrectly. Paper is cheap. The country can afford it. She does not know if he will answer. She does not think he will. She has said it anyway."
 cp_conversation.52.a:0 "#italic She has named a neighbour to the country. It matters more than the answer.#!"

 cp_conversation.53.t:0 "Papers Can Be Un-Written"
 cp_conversation.53.d:0 "He says it softly. She hears in the softness the shape of a warning she had hoped not to hear."
 cp_conversation.53.f:0 "Papers can be un-written, he says. You understand. A law passes. Another law, in a different year, repeals it. A new Pasha sits in this chair. A new assembly meets. A war strains the treasury. A revolt in one province changes the temper of the next. Your paper is a good paper, today. Today is a day. Tomorrow is another. She stands on the carpet. She hears, underneath his words, both a threat and something that is not a threat — a weary accuracy. She does not argue. She nods. She says: then, Effendim, I will teach my children that the paper is real, and I will teach them also that paper burns. I will teach them the shape of the field and the names of the wells and the song that marks the boundary with the neighbour's. The paper may go. The knowing will stay. She walks out. She does not look back. At home, that night, she does not take the paper out of the pot behind the brick. She does not need to. She has memorised it."
 cp_conversation.53.a:0 "#italic She goes home and teaches her oldest the song of the boundary.#!"


 # ----- The Politics (cp_conversation.60..63) -----

 cp_conversation.60.t:0 "What I Think of the Country"
 cp_conversation.60.d.radical_strong:0 "She stands at the end of the carpet. Effendim, she says — and her voice is not small tonight — I have not come to ask for a thing. I have come to tell you what I have learned about the country you run. I have learned that it is fed by the backs of people who do not eat first. I have come to say this to your face because there is nowhere else in this country to say it, and because if I do not say it, the saying will rot in me, and I have decided tonight that I will not be the woman who rots."
 cp_conversation.60.d.radical_soft:0 "She stands at the end of the carpet. I have questions, she says. I did not have them a year ago. I have them now. I do not know whether the questions mean I am becoming a different woman than I used to be, or whether the country is becoming a different country, or both. I have come tonight to ask them aloud."
 cp_conversation.60.d.loyalist:0 "She stands at the end of the carpet. I have come, she says, to say that the country has been good to me. That is not a common thing for a woman like me to say. I want to say it to you because I do not want it to die with me unsaid."
 cp_conversation.60.f:0 "She had not imagined this audience would happen, a year ago. The woman who stands on this carpet tonight is not quite the woman who first stepped onto it. She has been reading — or being read to, by a neighbour's boy who has the patience of neighbours' boys — and she has been talking, in the evenings after the children are asleep, with other women in her lane who used not to talk of such things aloud. She has acquired vocabulary. She has not yet decided, entirely, how to use it. [ROOT.GetCountry.GetRuler.GetFullName] is waiting. What does he say back?"
 cp_conversation.60.a:0 "#italic as the Pasha:#! \"Speak on. I will hear you.\""
 cp_conversation.60.b:0 "#italic as the Pasha:#! \"You have been taught by someone. You repeat their words. They are not yours.\""
 cp_conversation.60.c:0 "#italic as the Pasha:#! \"You understand that saying this in the wrong room will cost you.\""

 cp_conversation.61.t:0 "He Will Hear Her"
 cp_conversation.61.d:0 "He sits back. He crosses one hand over the other in his lap. The secretary stops writing. Speak on, he says."
 cp_conversation.61.f:0 "She does not expect it. In every version she has rehearsed at the oven, he interrupts her; he dismisses her; he threatens her. She has not rehearsed the version in which he simply lets her speak. She does not know how to begin again. She takes a breath. She tells him about the grain the bailiff takes. About the cotton the bey made them plant instead of wheat, which cannot be eaten, which must be sold to someone, which pays less than they were told it would pay. She tells him about the rent on the room, and the foreman at the mill, and the man on the corner who sells pamphlets that are not allowed to be sold. She tells him about her neighbour whose husband was beaten at a meeting for saying less than she has just said here. She tells him that she is not sure if she is a radical or if the country has simply become a place where saying true things is considered radical. She stops. He has not interrupted. The secretary is not writing. Neither of these, she understands, is necessarily a good sign. But she has said it. The saying was not rotted in her. That is already more than she had yesterday."
 cp_conversation.61.a:0 "#italic She goes home feeling both lighter and less safe than she did when she set out.#!"

 cp_conversation.62.t:0 "You Repeat Their Words"
 cp_conversation.62.d.radical:0 "He cuts her off without raising his voice. You have been taught, he says. The words are not yours."
 cp_conversation.62.d.loyalist:0 "He cuts her off without raising his voice. Your gratitude, he says, is the expected kind. It does not move me."
 cp_conversation.62.f:0 "She stands on the carpet. She is surprised to find that she is not wounded by what he has said. She has been wounded by other things in other rooms, but this particular wound — the accusation that her thoughts are not her thoughts — she finds she can answer. Effendim, she says, and her voice is steady, who in this country has taught me my thoughts, then? The village? The bailiff? The imam? Ahmed? None of them taught me to come into this room tonight. None of them would approve. The thoughts are mine. If they have been corrected, shaped, sharpened by other mouths — so have yours, Effendim. So have any man's, who has ever listened to another man. The question is not whose mouths shaped the thought. The question is whether the thought is true. She stops. She has not asked for his answer, because she is not expecting an answer worth having. She turns. She walks."
 cp_conversation.62.a:0 "#italic She walks out hardened, not softer, than she came in.#!"

 cp_conversation.63.t:0 "It Will Cost You"
 cp_conversation.63.d.radical:0 "He looks at her the way a man looks when he has recognised the danger in the room with him."
 cp_conversation.63.d.loyalist:0 "He looks at her the way a man looks when he has recognised the usefulness of a thing standing in front of him."
 cp_conversation.63.f:0 "In the radical version — the version where she came to accuse him, or to ask questions that felt like accusations — he meets her eyes, and she understands, in a long cold moment, that a woman who says aloud what she has said aloud is, in the real world, the kind of woman who disappears. He does not threaten. He does not need to. He says only: you understand that saying this in the wrong room will cost you. The wrong room, she realises, may be any room but this one. In the loyalist version — the version where she came to thank him — he holds her gaze and measures her like a man measuring a sack of grain. He is calculating what her loyalty is worth, not to her, but to him. Whether she can be deployed. Whether her village can. Whether her gratitude can be quoted in a proclamation. Either way, she has been seen, for what she is, by a man who runs the country. She does not know, in the moment, whether to be flattered or afraid. She is both. She leaves the room with the taste of both on her tongue, and she walks the long carpet with the slow careful footsteps of a woman who knows that she has been recognised, and who knows that recognition is not the same as protection."
 cp_conversation.63.a:0 "#italic She walks back knowing she has been seen, and that this is not safe.#!"


 # ----- The Boss (cp_conversation.70..73) -----

 cp_conversation.70.t:0 "The Mill"
 cp_conversation.70.d.angry:0 "She stands at the end of the carpet. The foreman, she says. The foreman at the mill fined Ahmed two days' pay yesterday for stopping his machine to cough. He had a fever. The foreman knew. Another man passed out on his feet last week and was carried to the gate and not allowed back. I am telling you about the foreman because the foreman is the face of your country, Effendim, to the people who make the cloth you wear."
 cp_conversation.70.d.settled:0 "She stands at the end of the carpet. The mill, she says. Let me tell you what a day at the mill is. The shifts are twelve hours. The air is thick with cotton dust. The children sweep between the machines for half a man's wage. I have been at the mill for a while now. I have learned that what I thought was the worst of it, when I arrived, was not the worst of it. Each month teaches you a new worst thing."
 cp_conversation.70.f:0 "She had not expected, when she moved to the city, to become a woman who spoke this way. She had expected to become a woman who kept her head down and worked. She kept her head down. She worked. And then one week she had raised her head, because a cousin's boy had been hurt at the machine next to hers and she had seen — clearly, as if for the first time — that nobody in the building was coming to help him. That the foreman had stepped over him. That the manager, in his office above, had not come down. She stands on the carpet. She is telling this man who she was before and she is telling him who she has become and she is asking him — indirectly, in the shape of the telling — whether his country can bear to look at what it has made of her. [ROOT.GetCountry.GetRuler.GetFullName] is waiting. What does he say?"
 cp_conversation.70.a:0 "#italic as the Pasha:#! \"There will be laws. We are considering them.\""
 cp_conversation.70.b:0 "#italic as the Pasha:#! \"The mill pays what the mill pays. It is a market. Nobody forced you to the gate.\""
 cp_conversation.70.c:0 "#italic as the Pasha:#! \"Who at the mill has been speaking to you of these things?\""

 cp_conversation.71.t:0 "There Will Be Laws"
 cp_conversation.71.d:0 "He says it the way a man says a thing he has been saying for years. Laws are being considered. We are studying the problem."
 cp_conversation.71.f:0 "She has heard this phrase also. From the same mouths, in the same register, for the same number of years. Studying the problem. Considering the laws. Her mother said it, in the village, about the rate the bailiff took. Her aunt said it, in the city, about the rent. Now the man who runs the country says it. Laws take a long time to be considered. Coughs take a day to become pneumonia. She does not say this. She only nods. She says: please consider faster, Effendim. Your country is losing its lungs while it is being studied. She turns. She walks. And somewhere in the long walk she decides that the work of her life, if she is to have any work at her age besides the mill, will be to bring the considering forward by hours and days and weeks and months, using whatever tools are given to a woman in a cotton mill, and this decision does not announce itself with thunder. It announces itself with the quiet of a woman folding a sentence into her chest to keep warm."
 cp_conversation.71.a:0 "#italic She folds the sentence into her chest and walks.#!"

 cp_conversation.72.t:0 "Nobody Forced You"
 cp_conversation.72.d:0 "Nobody forced you to the gate, he says. The mill pays what it pays. That is a market."
 cp_conversation.72.f:0 "She stands on the carpet. She had been prepared for many things tonight, but not for the word market to be used, by the country's own Pasha, as if the word were a reason. Effendim, she says, and her voice has a new hard thing in it that she did not put there on purpose — nobody forced me to the gate. That is true. The field behind my grandfather's grandfather's house was sold to a company we had never heard of, and the bey's bailiff told us, when we asked, that this was a matter between ledgers in Cairo. Nobody forced me. I was forced, in the way that a stream is forced down a hill. Not by any hand. By the shape of the slope. And the slope, Effendim — the slope is yours. It runs downhill to the gate you have named a market. She stops. The secretary has not written it. She does not expect him to. She turns. She walks. In the city, tomorrow, there is a meeting at the back of the tea-house, and she has decided — not tonight, not in this imagined room, but in the hard walk down the carpet — that she will attend."
 cp_conversation.72.a:0 "#italic She will attend the meeting at the back of the tea-house.#!"

 cp_conversation.73.t:0 "Who Has Been Speaking to You"
 cp_conversation.73.d:0 "He asks it not curiously. He asks it the way a magistrate asks it. He waits for a name."
 cp_conversation.73.f:0 "She stands on the carpet. She does not give a name. She had prepared, over the years, a list of people whose names she would not give, and she has been practising the shape of not giving names, and the shape of not giving names has become a muscle in her jaw. Nobody has spoken to me, Effendim, she says. The mill has spoken to me. The foreman has spoken to me, through his fines. The cotton dust in the lungs of my cousin's boy has spoken to me. Ahmed's pay envelope, which has three fewer coins in it this month than last, has spoken to me. The rent, which the landlord raised without warning, has spoken to me. If the country would like to know the names of these speakers, I have given you their names. If the country would like the names of the human teachers I have listened to — I do not have those names to give. Not tonight. She turns. She walks. Her jaw aches. She understands, for the first time, that not giving a name is a thing one does with one's whole body."
 cp_conversation.73.a:0 "#italic She walks out having given no names. The jaw will ache all the way home.#!"


 # ----- The Distance (cp_conversation.100..103) -----

 cp_conversation.100.t:0 "The Distance"
 cp_conversation.100.d.default:0 "She stands at the end of the carpet. Effendim, she says, I have come to tell you about the distance. The distance between the woman I was and the woman I am. It is large. I have lived long enough to have travelled it, and I have not lived long enough to have made peace with it."
 cp_conversation.100.d.landowner:0 "She stands at the end of the carpet. Effendim, she says, I have come from a field that is now mine. I have a second donkey. My daughter wears shoes to the water. I eat meat on a day that is not a festival. I did not imagine, when I was nine, that these would be the sentences I would one day say to a Pasha. I have come to tell you how strange it is to say them."
 cp_conversation.100.d.urban:0 "She stands at the end of the carpet. She is wearing, in the imagined room, a dress that — for the first time in her life — resembles a dress the imagined dress is usually imagined to be. My husband, she says, is not the man he was. His hands are clean. The children read. There is a servant-woman who comes twice a week and who is, I notice when I look at her, the woman I was fifteen years ago. I did not know what to do with this. I have come tonight to say so."
 cp_conversation.100.d.widow:0 "She stands at the end of the carpet. Ahmed left us, she says — not cruelly, not unexpectedly — and he left us with enough. Enough has a different shape than I had imagined, when I was young and had none. Enough means a room that does not flood. A grave with a stone. A child who can choose to marry or not to marry. I did not know enough could mean these things, Effendim. I have come tonight to tell you that it can."
 cp_conversation.100.f:0 "She had not been able to speak of this with anyone. Not with Ahmed — whose relationship to the money, while he had it, was a thing he would not discuss with her. Not with her sister — who had not crossed the same distance and who had begun, Layla thought, to look at her with a kind of careful reserve she had not looked at her with before. Not with the women in her new street — who had always had more and who assumed, wrongly, that Layla had too. The imagined room is the only room in which she has been able to say the sentence: I did not expect to become this woman. I do not know whether she is better than the one she used to be. I know only that she is further along. [ROOT.GetCountry.GetRuler.GetFullName] waits. What does he say?"
 cp_conversation.100.a:0 "#italic as the Pasha:#! \"You are the country's success. Tell me how to make more like you.\""
 cp_conversation.100.b:0 "#italic as the Pasha:#! \"Many peasants do not come to have what you have. What did you take that you should not have taken?\""
 cp_conversation.100.c:0 "#italic as the Pasha:#! \"Did you imagine this, when you were young? Tell me the truth.\""

 cp_conversation.101.t:0 "The Country's Success"
 cp_conversation.101.d:0 "He leans forward. You are, he says, what the country has been trying to produce. Tell me — how did it happen? What can we replicate?"
 cp_conversation.101.f:0 "She stands on the carpet. She thinks about it carefully. She could tell him: homesteading. She could tell him: a husband who did not drink, and did not gamble, and died of an ordinary sickness that left the household intact. She could tell him: a daughter who married a man whose brother was literate. She could tell him: luck — plain luck, which the country's planners cannot replicate because it is by definition the residue of everything they failed to plan for. She tells him this last one. Effendim, she says, you are asking the wrong woman. I did not produce this life through effort. I produced it through effort and through luck, in a ratio I cannot measure. If you want more like me, give the women like I was the laws like mine, and the luck will find whom it finds. It will not be the same woman every time. It will not be my daughter. She stops. She is not sure whether she is being truthful because she believes it or because it is the truth she wants to install in the man. Either way — she has said it. The secretary has written it. Perhaps, somewhere in a policy paper in Cairo, next year, a sentence of hers will live inside a sentence that was written by a clerk who never met her and cannot remember her name."
 cp_conversation.101.a:0 "#italic She allows herself, for the first time in this imagined room, to be proud.#!"

 cp_conversation.102.t:0 "What Did You Take"
 cp_conversation.102.d:0 "He does not quite accuse her. He does almost accuse her."
 cp_conversation.102.f:0 "Many peasants, he says, do not come to have what you have. What did you take, he asks, that you should not have taken? She stands on the carpet. It is the question she had half-expected, at some hour of this hour. The country, even as it lifts a handful of the people it had forgotten, remains suspicious of them for having been lifted. Effendim, she says — and her voice has cooled; she has not chosen for it to cool, but it has — I took nothing I was not offered. I took the paper. I took the wage. I took the rent my husband paid for the room on the third floor. I did not take, from any neighbour or any field or any ledger, a coin that was not his to give. If the country's arithmetic now finds my household inexplicable — if the country looked at my hands fifteen years ago and decided that these hands should not end up attached to a woman with a second donkey — then the arithmetic is the country's problem. It is not mine. She turns. She walks. She does not ask for his permission to walk. Behind her, the secretary does not write what she said."
 cp_conversation.102.a:0 "#italic She walks with the hot straightness of a woman who has been accused and did not bend.#!"

 cp_conversation.103.t:0 "Did You Imagine This"
 cp_conversation.103.d:0 "He asks it the way a man asks a thing he himself has been asking. Did you imagine this, he says, when you were young?"
 cp_conversation.103.f:0 "She thinks about it. She thinks about the nine-year-old at the quern. The seventeen-year-old at her wedding with a husband she had only seen twice. The twenty-four-year-old with a child on her hip and the door of the house she would live in for the next fifteen years propped open with a brick because the brick was not yet a loose brick but was just a brick. She thinks about the woman at twenty-eight who heard her mother die behind her while she, Layla, stood at the edge of the canal looking for a heron that was not there. She thinks about each of those women, in turn, and she tries to ask each of them whether they imagined this. The nine-year-old shakes her head, amused. The seventeen-year-old shakes her head, tired. The twenty-four-year-old says: I imagined survival. Nothing further. The woman at twenty-eight says: I was looking for a heron. That was all I could see past. No, Effendim, she says to the Pasha — who is still there in her imagined room, still waiting — I did not imagine this. I could not have. None of the women I used to be had the language for it. If I had tried, from any of them, to describe tonight to any of them, I would have sounded like a woman lying to her own past. She pauses. But they are all here with me, she says. The nine-year-old. The seventeen-year-old. The twenty-four-year-old. The woman at twenty-eight who had lost her mother. They are here in the room, behind me, on this carpet, and the carpet — I think, tonight, finally — is wide enough for all of us."
 cp_conversation.103.a:0 "#italic She walks back with all the women she used to be behind her.#!"


 # ----- A Small Thing (cp_conversation.80..82) -----

 cp_conversation.80.t:0 "A Small Thing"
 cp_conversation.80.d:0 "She stands at the end of the carpet. She has no grievance tonight — or she has, always, but she is tired of grievances. Tonight she wants to tell him about something small. She has not made a speech of it. She is going to say the things as they come."
 cp_conversation.80.f:0 "This is new for her. She has always imagined this room as a place for asking. For explaining, at least. For demanding, on the nights when she could find the courage for it. Tonight she wants to tell a story that is not an argument. The heron in the irrigation channel. The loaf that came out of the oven with a perfect crust on one side and not the other. The way her youngest pronounced a word wrong, in a way that was beautiful, and then forever changed because the child was corrected by an aunt and never pronounced it that way again. These are the real things of her life. She says them out of order. She says them as they come. [ROOT.GetCountry.GetRuler.GetFullName] is, she imagines, listening. Whether he is or not, she is telling the stories for herself. What does he do?"
 cp_conversation.80.a:0 "#italic as the Pasha:#! \"Go on. I have the hour.\""
 cp_conversation.80.b:0 "#italic as the Pasha:#! \"I am not sure why you tell me these things.\""

 cp_conversation.81.t:0 "He Has the Hour"
 cp_conversation.81.d:0 "Go on, he says. She does."
 cp_conversation.81.f:0 "She tells him about the heron, and about the loaf, and about the mispronounced word. She tells him about a cousin who fixed a fishing net with a stitch nobody in the village could name and who refused to explain it. She tells him about the time lightning hit the palm tree at the edge of the canal, and about the silence that followed — not an absence of sound, but a new quality of sound, as if the air itself had learned something it had not known before. She tells him about her mother, who had died while a heron was standing in the irrigation channel. She tells him these things slowly. She is not in a hurry. The secretary is not writing. Perhaps the secretary has been told not to write. Perhaps the secretary knows, the way all careful men know, when writing would cheapen the hour. When she is done she is somehow lighter than she was when she came in. She has told a man about her life, and the man has not asked her to justify it, and the man has not told her it should have been different, and the man has not offered to improve it. He has simply had the hour."
 cp_conversation.81.a:0 "#italic She thanks him, not for anything he did — for the hour.#!"

 cp_conversation.82.t:0 "Why Do You Tell Me This"
 cp_conversation.82.d:0 "He does not hide his boredom. She had not expected him to."
 cp_conversation.82.f:0 "He asks her — not rudely, but with the bluntness of a man who has other appointments — why she is telling him these things. She thinks about it. She could lie. She could say she has a point, and she is building to it, and if he will just give her a moment more she will make the stories serve whatever argument the imagined room requires. She does not lie. She says: because they are mine, Effendim. Because in the country you run, there is almost nowhere where a woman like me can tell a story that is about nothing but itself. The story has to be evidence. The story has to support a request. The story has to be pointed at a bey, or at a tax, or at a law. I wanted — tonight, just this once — to tell a story that is not pointed at anything. If you do not want to hear it, I will stop. If you do not want to hear it, I will tell it to the walls, and the walls will hear it as well as any other man in this building. She stops. He is looking at her. He has not dismissed her. He has not told her to continue either. The hour is not yet over."
 cp_conversation.82.a:0 "#italic She tells the rest of the story to the walls.#!"


 # cp_conversation.90 -- Closer: the fantasy dissolves
 cp_conversation.90.t:0 "The Kitchen Returns"
 cp_conversation.90.d.default:0 "She is not in Cairo. She has never been. The dough is in front of her. The light has not changed."
 cp_conversation.90.d.widow:0 "She is not in Cairo. She has never been. The dough is in front of her. The chair across the table is still empty. The light has not changed."
 cp_conversation.90.f:0 "She is in her kitchen. The dough is on the board, covered with a cloth, rising. The light through the small window is the same light it was before she went to Cairo in her mind. Outside, the lane is quiet. A goat complains in the far distance. Ahmed is wherever Ahmed is — in the far field, on a road she cannot see, in a country she has never learned the map of. She looks at her hands. They are the hands of a woman who has been kneading dough, not the hands of a woman who has stood on a carpet. The dress she was wearing in the imagined room is not in the house and never was. She permits herself — just for a breath — the question of whether any of it counted. Whether a sentence spoken in the privacy of one's own head, to an audience of one's own making, is a sentence at all. The answer, she decides, is the one her mother gave her when she was eight years old and asked whether the prayers counted when spoken quietly: they count. They count to the one who speaks them. That is enough. She turns the cloth back and checks the dough. It has risen well. She lifts the bowl to the oven. She puts the kettle over the small fire. Somewhere in the country, [ROOT.GetCountry.GetRuler.GetFullName] is not thinking of her. The secretary is not thinking of her. The bey is not thinking of her. She is thinking of the tea that will be ready in a moment, and of the bread that will be baked by the time the sun is at the palms, and of Ahmed, who will come home, or will not, or will come home changed. She is thinking, also, in a small stubborn corner of her chest, that one day the sentence will be said aloud in a real room, by a real woman, and that the room will change when the sentence arrives. Perhaps the real woman will be her daughter. Perhaps it will be someone else's daughter. Perhaps it will not be for a hundred years. She does not know. The kettle begins to hiss. She reaches for it. The day continues."
 cp_conversation.90.a:0 "#italic The day continues.#!"

 # ----- cp_layla.7 -- "The Tax Collector" -----
 cp_layla.7.t:0 "The Tax Collector"
 cp_layla.7.d:0 "He comes with a ledger, an inkhorn, and two guards. He comes when the harvest is measured."
 cp_layla.7.f:0 "She knows him by sight, though he would not recognise her if she passed his house in the city. He is younger than Ahmed and he is older than the bey. He reads the number off the page as though the number were the weather — something that simply is, and is not his doing. Ahmed hands across what he has, wrapped in the best cloth they own, which is not very good cloth. The assessor does not look at him. He makes a mark. He makes another mark. He does not look up when he says #italic This year the rate is higher.#! She is standing in the door. She is holding the youngest child on her hip. The child does not yet know the word #italic tax#!. It will be one of the first words the child learns."
 cp_layla.7.a:0 "Pay what is asked."
 cp_layla.7.b:0 "#italic She meets his eyes.#!"

 # ----- cp_layla.8 -- "The Price of the Loaf" -----
 cp_layla.8.t:0 "The Price of the Loaf"
 cp_layla.8.d:0 "The bread costs the same coin this week. There is less bread in it."
 cp_layla.8.f:0 "Ahmed brings home the loaf. It is the loaf she has bought, or watched him buy, every week of her married life. She takes it in both hands — the weight is wrong. She does not weigh bread; her hands weigh bread. Her hands have been weighing bread since she was nine. She says nothing. She tears a piece for the children. She tears a piece for Ahmed. The piece she tears for herself is smaller than usual and she does not announce this and neither does anyone notice, which is how it has always gone. That night, lying awake, she thinks about the word #italic tax#! and how for the first time in her life she is sure she knows what it means. It means something has been taken from between her teeth before she got there."
 cp_layla.8.a:0 "Go to sleep."
 cp_layla.8.b:0 "#italic Curse the ones who decide such things.#!"

 # ----- cp_layla.93 -- "The Law Catches Up to Us" (law_women_in_the_fields) -----
 cp_layla.93.t:0 "The Law Catches Up to Us"
 cp_layla.93.d.peasant:0 "A man from the town reads a paper in the square. The women, he says, are required now. She listens from the doorway, holding the water jar. She has been required since she was seven."
 cp_layla.93.d.city:0 "A notice is posted on the wall of the alley. The women of the household are to be counted among the workers. Her hours — which had been nobody's business — are now, by paper, the state's."
 cp_layla.93.d.default:0 "A paper goes up on the wall. The women, it says, are required. It is not a new thing. It is only that someone has written it down."
 cp_layla.93.f:0 "Ahmed is at the mosque. The children are at her feet. The water jar is on her hip. The man with the paper is speaking slowly because he is speaking to women and he has been told to speak slowly to women, which is the same mistake all such men make — she hears every word the first time and she hears also what lies between them. The paper in his hand is a law. The law says that she, and her sister-in-law, and her neighbour, and her mother when she was young, and her grandmother who was sold to the bey's house and died there, and every woman in the lane and the next lane and the country — that all of them are required, now, to give their hands to the field when the field asks. She has given her hands to the field since she was seven. The difference, she thinks, is that before, the field asked. Now the paper asks. She is not sure which is worse. The paper does not have to sleep at night. The paper cannot be reasoned with at dusk when the water is low and the child is feverish. The paper simply stays — a thing written — and comes back in the morning when you have forgotten it. She turns to go inside. The man finishes his reading. Nobody thanks him. Nobody needs to. He folds the paper. He goes away."
 cp_layla.93.a:0 "#italic Yes. We were already doing it.#!"
 cp_layla.93.b:0 "#italic The state's name for what I do is still not payment.#!"

 # ----- cp_layla.94 -- "A Paper with My Name" (law_women_own_property) -----
 cp_layla.94.t:0 "A Paper with My Name"
 cp_layla.94.d.already_owns:0 "The deed is not a new thing. The law is. Until yesterday she held what was hers on sufferance. Today she holds it by right."
 cp_layla.94.d.widow:0 "The paper is brought to her house. It bears her name. It bears no man's name. She is told that the house is hers — that it has been hers — and that the law now says so out loud."
 cp_layla.94.d.default:0 "The village is told at the well. A woman may now hold a deed, a shop, a field, in her own name. The older women make small sounds — half scoffing, half something else. She makes no sound."
 cp_layla.94.f:0 "She turns the word over in her mouth: #italic deed#!. She has not owned a thing in her life that was not given to her by a man — the water jar was her mother's, the shawl was Ahmed's mother's, the bed was her father's, the house is in Ahmed's name though it was her dowry that helped build the eastern wall. The law says: this can change. She is not naïve enough to think the law is the village. The village is not the law. The village will go on calling her Ahmed's wife when the deed says otherwise. But paper is paper. Paper outlives a man. Paper lasts longer than a harvest; paper lasts longer than a quarrel between brothers. If a day comes — she does not let herself think of that day, and yet she thinks of it — when Ahmed is not here, a paper with her name on it will mean that the house will not be carried off by his brothers. She does not say this aloud. She only turns the word over: #italic deed#!. It sits oddly in her mouth, like a fruit she has not tasted, and is not sure yet whether she will like."
 cp_layla.94.a:0 "#italic So now it is mine.#!"
 cp_layla.94.b:0 "#italic Paper is paper. The village will see.#!"

 # ----- cp_layla.95 -- "They Are Hiring Women Now" (law_women_in_the_workplace) -----
 cp_layla.95.t:0 "They Are Hiring Women Now"
 cp_layla.95.d.city:0 "At the mill gate, a foreman calls the names. A name she knows answers. A woman she knows walks through."
 cp_layla.95.d.village:0 "A letter comes from a cousin in the city. The mills, she writes, have begun to hire women. She writes it twice, underlined both times, so that the pen's meaning cannot be mistaken."
 cp_layla.95.f:0 "She is at the window — of the tenement flat, or the village door; both are the same window in the telling — and she sees her neighbour walk through a gate she had not been allowed to walk through before. The neighbour does not look back. The neighbour does not wave. The neighbour has a lunch tin in one hand and a headscarf tied the way her mother never tied one, and she walks into the mill yard the way men walk into mill yards: without asking. Layla does not know whether she will ever walk through such a gate herself. She is older than the neighbour. She has children. She has Ahmed, or she does not. The question of whether she #italic will#! is separate from the question of whether she #italic can#!. For the first time in her life, the second question has been answered, and she has not been the one who answered it. Somebody in a room she has never seen has answered it. She sits with this a long time. She does not finish her tea."
 cp_layla.95.a:0 "#italic A gate has opened. I will look at it.#!"
 cp_layla.95.b:0 "#italic Ahmed will not like this.#!"
 cp_layla.95.c:0 "#italic The older women will say she has forgotten who she is.#!"

 # ----- cp_layla.96 -- "I Am on the Rolls" (law_womens_suffrage) -----
 cp_layla.96.t:0 "I Am on the Rolls"
 cp_layla.96.d.literate:0 "She can read it herself. Her name is in the list. It is spelled correctly. The ink is fresh enough to smudge if a finger lingers on it."
 cp_layla.96.d.village:0 "A man comes from the town with a book. He reads the names of the women. He reads hers. She does not know what it means, except that he has said her name aloud in a book, which has never happened before."
 cp_layla.96.d.default:0 "The announcement is shouted in the square. The women of the country, they say, are on the rolls. The women in the square do not cheer. They look at each other. They do not know yet what cheering would mean."
 cp_layla.96.f:0 "It is a small thing and it is a great thing. It is a line of ink in a book she will never see, in a building she has never entered, in a city whose streets she has walked in only in her imagination. It says her name. Her name — not her father's name with hers attached at the end, not her husband's name with hers in the margin, but her name, standing alone, the way it has stood only on her tongue all her life. She repeats the name to herself, quietly, the way she repeats a prayer. She thinks: #italic I am on the rolls.#! She thinks: #italic Somewhere in the country, a man is reading my name.#! She thinks of her mother, who died before any such book was written, and whose name is only in her own mouth and in the mouths of the daughters she left, and she thinks: if my mother could have stood beside me this morning, she would have smiled. That is enough. The rest is argument. The rest is the slow walk down a long road. The first stone has been laid. She touches the wall of her house as she goes inside, the way she touched the jamb when she came here as a bride, and the year she was a bride feels, for the first time in a long time, like a shorter distance from today than she had been told."
 cp_layla.96.a:0 "#italic So it has come. Let them read the name.#!"
 cp_layla.96.b:0 "#italic A line in a book. We will see what it is worth.#!"
 cp_layla.96.c:0 "#italic Ink does not fill the stove.#!"

 # ----- cp_layla.97 -- "Her Own Stall" (self-employment crossroads) -----
 cp_layla.97.t:0 "Her Own Stall"
 cp_layla.97.d.forced_widow:0 "The widow's days are counted in small coins. The house will not feed itself on prayer. She must set up at the market, or send the children to a door they will knock on and find closed."
 cp_layla.97.d.forced_poor:0 "Ahmed's wages have not been enough for some months now. The children are not the only ones who go to bed a little hungry. She looks at the kitchen and at the lane and at her hands, and she begins to think."
 cp_layla.97.d.chosen_city:0 "The law has opened the door. Her neighbours are walking through it. The question is not whether it is open; it is whether she will walk."
 cp_layla.97.d.chosen_village:0 "News comes slowly to the village, but it comes. The law that was passed in the city reaches the lane. She hears it at the well, from the older woman who has outlived everyone else and is therefore the first to know everything."
 cp_layla.97.f.widow:0 "She has been a widow for long enough now that the word no longer catches in her throat when she uses it silently of herself. She has also been hungry long enough. The house is a house but a house needs bread in it, and bread needs coin, and coin — this is the part she has been slow to accept — needs labour that she, and not another, performs. The cloth she weaves is good. The bread she bakes is good. The small pickled things she makes with her mother's hand keep for weeks and improve for the keeping. She has been giving these away, in the old habit, to neighbours who were kinder than they needed to be. She thinks now: I will set a stall. A small one. The corner where her cousin used to sell the leather goods, before his son was born and his son became what his son became — that corner is free in the afternoons. She will take it. She is afraid. She is also, for the first time in the months since Ahmed did not come home from wherever Ahmed did not come home from, something that is not afraid."
 cp_layla.97.f.poor:0 "Ahmed's hands are tired. Ahmed's wages are what Ahmed's wages are, and they are not going up. The children are growing. The children are eating more than the children used to eat. The rent on the room, which was once the part of the month she did not think about, is now the first thing she thinks about on the morning the rent is due. She has been turning something over in her head for weeks and she has not spoken it aloud, because to speak it aloud was to have decided. Now she speaks it. She tells Ahmed. Ahmed, to his credit — for all his faults, and they are real — does not say no. He says #italic If it is what you think.#! It is not approval and it is not refusal; it is permission turned inside out, and she takes it. She begins, that afternoon, to lay out on the floor what she has that can be sold."
 cp_layla.97.f.chosen:0 "The law has been passed. The gate has been opened. She has a little money — not a lot, but a little — that she has set aside over the years for no particular reason, which is the only way she has learned to set anything aside. She has a skill. She has, even, a spare hour of the afternoon, which is the rarest thing a married woman with children owns. She thinks about the corner of the market where the women of her mother's generation were never permitted to stand. She thinks about the stall she would set. She thinks about the sign she would paint, if she could paint — which she cannot, not yet. She thinks about whether it would be a shame or a victory, or both, and she suspects that the word for it will not be given to her by any tongue she has grown up with. It will be a word she coins herself, in a language of her own making. For now, the word is simply: #italic yes#!. Or simply: #italic no.#!"
 cp_layla.97.a:0 "#italic Set the stall.#!"
 cp_layla.97.b:0 "#italic Not yet. The house has enough to handle.#!"

 # ----- cp_layla.24 -- "Election Day" (first vote) -----
 cp_layla.24.t:0 "Election Day"
 cp_layla.24.d.literate:0 "The ballot is in her hand. She can read the names. That she can read them at all is its own small election she has already won."
 cp_layla.24.d.default:0 "The ballot is in her hand. She cannot read all the names; the man at the table reads them to her, slowly, so there is no confusion about whose mark goes next to which."
 cp_layla.24.f:0 "She has rehearsed this morning for weeks. She has rehearsed it in her head at the well, at the stove, in the moments before sleep. She had thought the walk to the polling place would feel the way the first walk to her husband's house felt, or the walk to her first child's grave — a walk where the feet know something the mind does not. It does not feel like that. It feels like a walk to the post office on a Thursday. The polling place is smaller than she had imagined. The room is warm. There are men at the table, who are polite; the one who is not polite is outside, muttering, and she does not look at him. She is given the paper. She is given a pencil. She takes a long time to look at the paper. The man at the table waits, because he is paid to wait. She marks one name. She marks another, in the line below. She folds the paper. She hands it back. She is not asked to say whom she voted for; she is not asked anything at all. She is given a word — #italic recorded#! — and the word is meant to be the end of the matter. She walks out. The lane is the same lane. The sky is the same sky. Somewhere inside her, though, a small fact has changed position, the way a pebble in a shoe makes itself known to the foot at the eighth step. She has voted. She will never not have voted. That part is done."
 cp_layla.24.a:0 "#italic So. It is done. I have voted.#!"
 cp_layla.24.b:0 "#italic Too late by a generation. But done.#!"

 # ----- cp_layla.98 -- "The Month Without" (absence-bite: no welfare) -----
 cp_layla.98.t:0 "The Month Without"
 cp_layla.98.d.widow:0 "The rent is due on Thursday. The grain is half what it was last month. The envelope she has heard of, from her cousin who heard of it from a traveller, does not arrive. It does not exist in this country."
 cp_layla.98.d.old:0 "She is old enough that in another country — she has been told — there would be an envelope. There is not an envelope. The month is sixty years of Thursdays, and she has learned the arithmetic of each."
 cp_layla.98.d.default:0 "The rent. The grain. The kerosene. The small repair on the door. She sets the coins on the table in four small stacks. The stacks are smaller than the stacks were last month, and smaller than the stacks were the month before."
 cp_layla.98.f:0 "Her cousin's husband, the one who travels, came through last year. He told them about a country — he named it, she cannot now recall the name — where a woman of her age, in her state, receives an envelope. The envelope arrives, he said, on the first Friday. The envelope contains coins. Not many. Enough. The coins in the envelope, he said, are given by the government — not loaned, not advanced, not charged at harvest, but §Igiven#! — and the word §Igiven#! is a word she had to turn over in her mouth several times before she could swallow it. She has thought of this country since. She has thought of it when she is counting coins on the kitchen table, as she is counting them tonight. She has thought of it when the second-born child is looking at the bread she has cut and pretending the piece is enough. She has thought of it when the door squeaks on its hinge, which she has not had the coin to oil since Ramadan. She is not a woman who fills her head with what does not exist; she is a woman who counts what does. But the word §Igiven#! has lodged somewhere. She is thinking of it tonight. She is thinking also: if an envelope can exist in another country, an envelope can be made to exist in this one. She folds the cloth back over the four small stacks. She will think more, tomorrow, about who in this country might be persuaded to make such a thing. She is not a persuader. She has never persuaded anyone in her life. But she can count. She can count, and she can name what the count comes up short by, and she can — she realises, with a small hot flicker in her chest — she can teach the count to her daughter, who is louder than she is."
 cp_layla.98.a:0 "#italic Let the count be taught.#!"
 cp_layla.98.b:0 "#italic Mother had no envelope either. The grief is old.#!"

 # ----- cp_layla.99 -- "Her Name Is Not on the Deed" (absence-bite: no property rights) -----
 cp_layla.99.t:0 "Her Name Is Not on the Deed"
 cp_layla.99.d.field:0 "The deed to the field is in the chest, folded, and it bears Ahmed's name. It has never borne her name. Under the country's law, it will not bear her name. The field, however, is hers — in every way but this one."
 cp_layla.99.d.shop:0 "The stall she set at the market, which she has stood at every morning for two years, is registered in Ahmed's name, because Ahmed's name is the only name the country's paper accepts. Her stall has her hands on every surface. Her stall has Ahmed's name on the paper."
 cp_layla.99.d.default:0 "The thing she owns in practice — the house, the hearth, the small savings in the jar behind the brick — belongs, under the country's law, to a name that is not her name."
 cp_layla.99.f:0 "She is sorting beans at the kitchen table when the thought comes, uninvited. If Ahmed died tonight — she spits three times over her shoulder, superstitiously, because she does not wish it — the deed would pass to his brother, not to her. The house would pass to his brother, not to her. The field she has worked for thirty years, whose every furrow she knows the way she knows the inside of her mouth, would pass to a man who has come to the village twice in his life and left each time without thanking her for the meal she set. She stops sorting beans. The bean in her right hand is a good bean; the bean in her left hand is a weevilled bean. She sets them both down. She thinks: a deed is a paper, and a paper can be written. A paper can also be changed. The paper that was written before she was born does not have to be the paper that is written when her daughter is married. She picks up the beans. She sorts them more quickly now, the way one sorts beans when one has had a thought one cannot yet speak aloud. She has not said the thought to Ahmed. She will not say it to Ahmed this week. She will, perhaps, say it to her daughter, who is eleven, and who will remember it."
 cp_layla.99.a:0 "#italic The paper can be changed. A daughter will remember.#!"
 cp_layla.99.b:0 "#italic Let the thought go. The beans will not sort themselves.#!"

 # ----- cp_layla.100 -- "A School in the Next Village" (law_public_schools) -----
 cp_layla.100.t:0 "A School in the Next Village"
 cp_layla.100.d.has_kids:0 "The teacher is coming, they say. He will bring the alphabet and a tin of ink. The older children — her older children — may be in the room where the teacher stands."
 cp_layla.100.d.default:0 "The teacher is coming, they say. He will bring the alphabet and a tin of ink. Nobody in the lane has yet seen him, but his name has been spoken at the well."
 cp_layla.100.f:0 "It is the older women who bring the news from the next village. They come back from the Tuesday market with a new word in their mouths: §Imadrasa#!. A school. A room with a roof and a door, and chairs, and a man in a clean shirt with an inkhorn. They tell Layla he has been promised. The country has passed a law, they say, in a voice that carries the old suspicion of anything a country passes, and the room will be built, and a teacher will come, and the children will — well. The older women leave off the end of the sentence. The children will what, Layla thinks, rinsing the basin. The children will know something their mothers did not. The children will, perhaps, read a letter without asking a neighbour to read it for them, the way she has had to ask for every letter that has come to this house since she was a bride. The thought lands somewhere in her chest that is not a place she has let thoughts land before. She does not sit with it long. But she sets the basin down, and she lets herself, for a minute, imagine the room. The room has chairs. The room has a blackboard. The room has her daughter in it."
 cp_layla.100.a:0 "#italic Let the room be built.#!"
 cp_layla.100.b:0 "#italic We will see if the teacher comes.#!"

 # ----- cp_layla.101 -- "They Will Be Taken to the School" (law_compulsory_primary_school) -----
 cp_layla.101.t:0 "They Will Be Taken to the School"
 cp_layla.101.d.has_kids:0 "The notice is read in the square: every child will go. Not some. Every. The field will lose hands. The children will gain letters. She sits with this."
 cp_layla.101.d.default:0 "The notice is read in the square: every child will go. She has no child to send; she imagines the child she did not have, in a chair with ink on her fingers."
 cp_layla.101.f:0 "The man from the town reads it at noon. His voice is formal. The law is formal too. Every child, he says, between seven and eleven years, male or female, will attend the school. Exemptions will be granted — rarely. Fines will be levied — readily. She hears the word §Ifines#! and she knows, in her bones, what §Ireadily#! means when it comes to the collecting of fines from families like hers. She hears also the words §Imale or female#!, and she notices that she has not heard those two words in that arrangement before, in any statement made by a government, in any year of her life. She rolls the dough flat on the board without looking at it. The girl is eight. The boy, if he had lived, would have been five. She had imagined, quietly and without speaking of it, that the girl would go to school — if the rumour of the teacher became a teacher, if the promised room became a room, if the years and the harvests and the coins allowed. She had not imagined that the girl would go because the law required it. There is a difference. The difference has cost. The girl's hands, after school, will come home without the calluses they would have had. The field will need a hand the girl is no longer providing. Another daughter-to-be, she thinks, may not be born this winter — they will not be able to afford a new dependent with a worker leaving. The arithmetic rearranges, in her head, on the board, while she rolls. But the girl, she thinks, will read."
 cp_layla.101.a:0 "#italic Let her be taken. Let her read.#!"
 cp_layla.101.b:0 "#italic The field will feel her absence. So will we all.#!"

 # ----- cp_layla.102 -- "The Daughter's Letter" (daughter reads to her) -----
 cp_layla.102.t:0 "The Daughter Reads"
 cp_layla.102.d:0 "The girl sits cross-legged on the floor with a letter in her hand. The letter is from a relative Layla cannot herself read the name of. The girl, eight years old, reads the letter aloud."
 cp_layla.102.f:0 "The girl's voice is careful. The girl does not know, yet, that the voice she uses for the reading is a voice she has inherited from her mother — from every grandmother before her mother — who for generations leaned over the shoulder of a literate neighbour and whispered §Iwhat does it say, what does it say#!. The girl uses the voice unconsciously. Layla, listening, knows what it is. The letter is nothing particular. It is a cousin writing about a field, and about a boy who has been ill, and about a funeral she was not able to attend because of the distance. The girl reads the words slowly — she does not yet have the fluency her mother will not live to see her achieve, which will come in another year, perhaps two — and Layla closes her eyes, which is the thing a blind woman does, and which she is not blind but has the same reason. She does not want to look at her daughter. She does not want her daughter to see the face she is making. The face is the face a woman makes when a thing she did not know she had been waiting for arrives, and arrives early, and arrives through the mouth of her own child. When the girl finishes, Layla opens her eyes. She says: §IThank you.#! The girl shrugs the shrug of a child who has been thanked for something that was small to her and very large to the thanking. The girl, she realises, does not yet understand that the reading was not small. The girl will understand. The girl will, God willing, have a daughter of her own, who will not require the explanation."
 cp_layla.102.a:0 "#italic Let the reading continue. Let it carry, past me, into her.#!"

 # ----- cp_layla.103 -- "The Chains Are Cut" (law_slavery_banned) -----
 cp_layla.103.t:0 "The Chains Are Cut"
 cp_layla.103.d:0 "The decree is read in the square. The compound at the edge of the village — the one nobody in the lane has ever entered — is to open its doors. The people inside are to walk out."
 cp_layla.103.f:0 "She has walked past the compound since she was five. She has never entered. She has never, before today, thought about whether the wall she walked past was a wall her own village built, or a wall someone else built and her village agreed not to notice. Today the gate is open. She goes, because everyone goes. She goes carrying water, so that she has something in her hands if anyone asks what she is doing there. A number of people she does not know come out of the gate. Some of them are older than her. One is her age, exactly. One is a child. The child is holding the hand of a woman the child looks nothing like, and Layla understands that the woman is not the child's mother, and that the two of them will, now, have to find a way to be people in a country that was not prepared for them to be people outside that gate. The child looks at Layla. Layla meets the look. She does not know what to say. She says §Ipeace be upon you#! — she says it the way she says it at the mosque, at the grave of her mother, to the stranger on the road at dusk — and the child, who has probably not heard the phrase said in that tone to the child's face, nods. Layla nods back. She walks home. At home she does not speak of it. She holds it in her chest the way she holds the best news and the worst news equally, until she has decided which it is. She decides, by evening, that it is both."
 cp_layla.103.a:0 "#italic Peace be upon them. Peace upon the country that finally chose this.#!"
 cp_layla.103.b:0 "#italic I was never in that gate. But I was never very far.#!"

 # ----- cp_layla.104 -- "The Compound on the Edge of the Village" (pulse: slavery legal) -----
 cp_layla.104.t:0 "The Compound on the Edge of the Village"
 cp_layla.104.d.child:0 "She passes the wall again today, carrying water, and today she looks at it. She has not always looked at it. Today she does."
 cp_layla.104.d.older:0 "She has walked past this wall for forty years. She has stopped making a study of not noticing it. Today she notices it. Tomorrow she will likely not."
 cp_layla.104.f:0 "The wall is high but not that high. A person could, in theory, see over it if the person were tall enough, which she is not. The wall is plaster over mud-brick, the ordinary construction of this ordinary country, and behind the wall there are people whose lives are not ordinary and who are owned by other people who are ordinary. She carries the water. She does not slow down. She has never, in her life, slowed down at this wall. Slowing down at this wall, she has been taught — not explicitly, but the way one is taught most things — is a way of asking a question one does not yet have the right to ask. She thinks, as she walks: I am a peasant. I have been a peasant since I was born, and my mother was a peasant before me, and her mother, and the ancestor whose name is carried in the family line like a long breath. I have been worked hard and I have been fed thinly and I have buried children and I have stood in the doorway when the bailiff came. I am not a slave. I know, without examining it closely, that not being a slave is a thing. I know, also, that the knowing is uncomfortable, and I do not examine it more closely than I have just now examined it. She passes the wall. She does not look at it. She carries the water home."
 cp_layla.104.a:0 "#italic Peace upon them. God remembers.#!"
 cp_layla.104.b:0 "#italic I am a peasant. I am not that. And the thinness of the comfort is its own knowledge.#!"

 # ----- cp_layla.25 -- "The First Day of Ramadan" -----
 cp_layla.25.t:0 "The First Day of Ramadan"
 cp_layla.25.d:0 "The call to dawn has been adjusted. The mouth remembers what it is not doing before the mind does. The first day of Ramadan is a small argument between the body and the calendar, and the calendar wins."
 cp_layla.25.f:0 "She has done this forty times. Her body does not, each year, remember doing it. Each year, on the first day, the body is surprised. It looks around noon for the water it has had at noon for the other eleven months of the year, and the water is not there, and the body — her body, the body of a woman who knows her body as she knows the kitchen — the body sulks briefly, and then remembers. The remembering takes until the third day. From the third day to the last day it will be the ordinary discipline. From the last day to the feast it will be the ordinary anticipation, like the last hour of a long walk home. But the first day is the first day. She is sitting in the courtyard. She is not working; she is letting herself, for the morning of the first day, do nothing. She watches the neighbour's cat stretch in the one patch of sun that reaches the ground here this hour. She notices that her own stretching, when she does it, is shorter than the cat's. She thinks: §IThe cat has not been told what the month is, and the cat does not care what the month is.#! She thinks: §IAnd yet the cat's day is not wrong. The cat's day is not less the day, for not being told.#! It is the kind of thought the first day of Ramadan gives her. She does not share it with anyone. By the second day she will have forgotten she thought it. By the third day she will have begun the ordinary thirty."
 cp_layla.25.a:0 "#italic The first day. The hardest. Also the most remembered.#!"

 # ----- cp_layla.26 -- "The Nile Rises" -----
 cp_layla.26.t:0 "The Nile Rises"
 cp_layla.26.d.good:0 "The water is high. The silt is the dark colour of a good flood year. The men in the lane are quieter than usual, which is how they are when they are grateful."
 cp_layla.26.d.bad:0 "The water is not as high as it should be. It is not the failure year, but it is not the year her grandfather would have boasted about either. The men are careful about what they say aloud."
 cp_layla.26.f:0 "She has lived long enough to know the four kinds of flood year: the year too much (the bad year — the river takes houses), the year too little (the bad year — the river takes harvests), the year ordinary (the word the older women use, which her mother used, which means §Inothing to complain of, nothing to boast of, carry on#!), and the year good, which is what happens when the river does what the river did when the ancestors were young, and the silt comes up the colour of wet tea leaves, and the edge of the field is lined with a richness that will carry into the next harvest and the one after that. She walks with Ahmed — or with the memory of Ahmed; the walk is the same either way — along the edge of the irrigation channel. The water is the water, and she reads its colour, as she reads every year, with the slow attention she would bring to a letter from an old friend. She says nothing. He — or his memory — says nothing. The river has been doing this for thousands of years before Layla's family was a family, and it will be doing this thousands of years after she is gone. The respect she feels, walking here, is not sentimental; it is the respect of one person passing another who has outlived and will outlive her."
 cp_layla.26.a:0 "#italic The river will do what the river does. God willing, the silt is dark.#!"

 # ----- cp_layla.27 -- "The Hajj Returnees" -----
 cp_layla.27.t:0 "The Hajj Returnees"
 cp_layla.27.d:0 "The cousin is back from Mecca. The lane is fuller today than on ordinary days. Everyone with a hand free carries sweets."
 cp_layla.27.f:0 "The cousin is two lanes over — not actually her cousin, by blood, but the word §Icousin#! has the elasticity that it has everywhere in this village — and he has come back from the Hajj with a changed face and a slightly lighter gait, which are the two things Layla has learned to look for in a returnee. He embraces Ahmed. He embraces Layla's uncle. He does not embrace Layla, who is a married woman; he greets her from across the courtyard with the upheld palm that means §Ipeace#! in a way that does not cross the threshold of her kitchen. She understands the gesture. She returns it, from the threshold. He distributes dates. The dates are not from Mecca — dates from Mecca would be a theatrical lie — but they are dates, and they are given with the right hand, and they are eaten with the right hand, and the gesture of giving and receiving is itself a kind of small pilgrimage between two hands that is supposed to remember the large one. She takes a date. She eats it slowly. She does not say anything aloud about whether she wishes, privately, that she could have made the journey herself. She has wished this. She has wished this for years. She has not wished it loudly. The date, she notices, is good."
 cp_layla.27.a:0 "#italic Peace upon the returnee. Peace upon the journey he made for us all.#!"

 # ----- cp_layla.28 -- "The Midwife's Lamp" -----
 cp_layla.28.t:0 "The Midwife's Lamp"
 cp_layla.28.d:0 "A lamp moves along the lane in the small hours. The midwife is going somewhere. Layla wakes, as the women of the lane wake, at the shape of the light through the slats."
 cp_layla.28.f:0 "It is the third hour after midnight. The wick in the lamp is the wick Layla herself trimmed for the midwife last Tuesday, because her hands are better at the trimming than the midwife's hands are any more, which is a thing neither of them has said aloud. The lamp moves. It pauses at a door — she can tell whose door, by the angle of the pause — and the door opens, and the lamp goes in, and the lane goes dark again. Layla lies awake for a moment longer. She does not get up. There is nothing, in this hour, for her to do. But she says, in her head, the small prayer she says when a woman in the lane is beginning the hours that are hers alone and no one else's. The prayer is for the mother, because the mother is what Layla was three times (or four times, or two — depending on the year she is in), and because she knows the hours. The prayer is also for the child, because the child is the thing the mother is doing the hours for. The lamp does not come back out before Layla sleeps. In the morning she will ask, at the well, and the woman at the well will tell her, and Layla will add whichever name she is told to the long list in her head of names she has prayed beside, across forty years of this village's quiet dawns."
 cp_layla.28.a:0 "#italic God keep the mother. God keep the child.#!"

 # ----- cp_layla.29 -- "The Date Harvest" -----
 cp_layla.29.t:0 "The Date Harvest"
 cp_layla.29.d:0 "The boys have gone up the palms. The dates have fallen onto the cloths. The women sit in the courtyard and sort the good from the split."
 cp_layla.29.f:0 "The boys are not very good at going up palms. They have not had enough palms to practise on. Her grandfather would have been appalled by the clumsiness. Her grandfather also did not live long enough to be appalled by much, which is a fact she carries — not bitterly, not any more — the way she carries her mother's age at death, the way she carries the exact height her uncle reached when the fever finished him. The boys, for all their clumsiness, come down with cloths that are heavy enough. They tip the dates onto the large mat in the courtyard. The women begin. Layla's hands sort the way her mother's hands sorted. Good into this basket. Split into this basket (for the goats). Soft into this basket (for the sweet for Eid). Black-spotted into the small basket (for the medicine she will make and trade with the woman at the south end of the lane for the one thing that woman makes that Layla cannot). The sorting is unhurried. The sorting is conversation, or it is silence — whichever the afternoon wants. Today it is mostly silence. The sound is the sound of dates falling through fingers into baskets, and the sound of the palm fronds in the low breeze, and the sound, distant, of one boy laughing at another boy at the top of a tree. She thinks: §IThe year the last date is sorted in this courtyard will not be a year I see.#! She thinks: §IAnd the sorting will go on.#! It is a thought that, at her age, does not hurt."
 cp_layla.29.a:0 "#italic Let the sorting go on.#!"

 # ----- cp_layla.33 -- "The Cup of Coffee" (coffee circulating) -----
 cp_layla.33.t:0 "The Cup of Coffee"
 cp_layla.33.d:0 "It has arrived in the market, they say. Black. Bitter. Drunk from tiny cups. The old men in the coffeehouse have begun to smell of it."
 cp_layla.33.f:0 "She has heard of it for years. Her uncle came back from Cairo once with a small cloth sack that smelled strange, and he brewed it on her mother's stove, and her mother tasted it once, carefully, and said — with a straight face that took Layla three days to read properly — that she preferred tea. Layla's uncle laughed. The sack was finished within the week, shared among the men in the coffeehouse, and the sack was the end of the coffee in Layla's life until this afternoon. This afternoon there is coffee in the market. Not Cairo coffee — Yemeni, apparently, or something close — but coffee. She buys a small measure. She has it in a paper twist in her pocket. She will brew it after supper, on the small brazier in the corner. She will drink one cup slowly. She will decide, after the cup, whether it is a thing she likes, or a thing she does not like, or a thing she is not yet ready to know whether she likes. The decision will be hers. That — the decision will be hers — is a thought she has, turning it on her tongue the way she will, in an hour, turn the liquid on it."
 cp_layla.33.a:0 "#italic Let the cup come. Let me decide alone.#!"

 # ----- cp_layla.34 -- "The White Sugar" (sugar cheap) -----
 cp_layla.34.t:0 "The White Sugar"
 cp_layla.34.d:0 "The sugar at the merchant's was a quarter what it was last year. She bought a hand of it. In the kitchen it sits on the shelf in a clean jar, an impossibly white powder that looks, she thinks, like nothing she has ever eaten."
 cp_layla.34.f:0 "Her mother taught her to sweeten things with dates, or date-syrup, or the occasional small spoon of honey the bee-keeper's son traded for the barley she set aside for him every spring. Her mother did not use sugar. Sugar was for the bey's table. Sugar was a substance in other women's stories, along with the coral earrings and the silk thread. Now there is sugar in her kitchen. The jar is white. The powder is white. She adds a pinch to the bread dough on Friday — a pinch, no more — and the bread on Friday tastes, to her surprise, not like her mother's bread, but like the bread she will, she realises, make from now on. She wonders whether her daughter will know, one day, that there was a kitchen — Layla's mother's kitchen — where the sugar was not. She wonders whether she should tell her. She decides she will tell her. Some things should be remembered, even the ones that are losses. Especially those."
 cp_layla.34.a:0 "#italic Let the sugar stay in the jar. Let the memory of the kitchen without it stay too.#!"

 # ----- cp_layla.35 -- "The Cloth from the Port" (fabric affordable) -----
 cp_layla.35.t:0 "The Cloth from the Port"
 cp_layla.35.d:0 "A bolt has arrived at the merchant's. It is thin, well-woven, dyed a blue she has not seen on a body in this village. She touches it once. She thinks about it for three days."
 cp_layla.35.f:0 "The bolt was brought up-river from Alexandria. The merchant says — she has no way of verifying — that it was woven in a mill near Manchester, which is a word that means nothing to her except that she has heard it in her husband's brother's stories about Cairo, where men know such words. The bolt is cheaper than any cloth she has owned. She has not yet decided whether to buy a length of it. She has already, in her head, decided what she would sew from the length: a shirt for Ahmed, or for her daughter, or an overdress for Friday, depending on the week. She will go back to the merchant tomorrow. She will touch the bolt again. She will, probably, buy one length. She has learned, this year, that she is allowed to buy one length of cloth a year that is not strictly needed. It is a thing the stall has taught her. She is, she thinks — folding the apron at the end of the day — a woman who has permissions her mother did not have. Not many. A few. And the permissions are hers not because the country gave them to her, but because she worked for them. The cloth, when she sews from it, will carry the memory."
 cp_layla.35.a:0 "#italic Tomorrow I will buy one length. One length is a thing a woman can do.#!"

 # ----- Root additions for Envelope + Vote conversation topics -----
 cp_conversation.1.j:0 "Tell him about the envelope."
 cp_conversation.1.k:0 "Tell him about her name on the rolls."

 # ----- cp_conversation.110..113 -- The Envelope -----
 cp_conversation.110.t:0 "The Envelope"
 cp_conversation.110.d.pension:0 "She stands at the end of the carpet with the envelope, folded small, in the palm of her imagined hand. She has come to speak about the thin paper that keeps her alive."
 cp_conversation.110.d.subsidy:0 "She stands at the end of the carpet with the small brown envelope that arrives the first Friday of each month. She has come to speak about what is in it, and what is not."
 cp_conversation.110.d.default:0 "She stands at the end of the carpet, empty-handed, because the envelope she has come to speak of is thin enough that imagining it in her hand would be cruelty."
 cp_conversation.110.f:0 "Effendim, she says — her voice is steadier tonight than it was the night she spoke about the land. I have come about the envelope. She pauses. She has rehearsed this while carrying water from the canal, this week, because the envelope was four days late last month, and four days of wondering is a thing she would like the Pasha to understand. You do not know what the envelope is, she thinks — but does not say. She says, instead: the envelope arrives the first Friday of the month. In it there are coins. Not many. Fewer than the rent. Fewer than the bread. Fewer than the kerosene, which I buy now on the last day of the month because the lamp in the alley is broken and the alley is a lane where a woman does not walk at dusk without a light. The envelope does not live in a box. It lives on the shelf above the flour, where I put it the day it arrives and where it stays until the day I have to open it, which is always sooner than I had hoped. The day I open it is a day I recount the coins twice, because I do not trust myself, not because I do not trust you. I have come here, Effendim, because the envelope has changed my life, and I wanted the man who sent it to know the shape of the change. She stops. She waits."
 cp_conversation.110.a:0 "#italic as the Pasha:#! \"Yes. I sent it. You are welcome.\""
 cp_conversation.110.b:0 "#italic as the Pasha:#! \"It is only a coin. Do not make a speech of it.\""
 cp_conversation.110.c:0 "#italic as the Pasha:#! \"I did not know. Tell me more.\""

 # cp_conversation.111 -- He takes credit
 cp_conversation.111.t:0 "He Accepts the Thanks"
 cp_conversation.111.d:0 "He smooths his robes. He smiles as a man smiles when a thing he has done has been noticed. He has forgotten, for a moment, that the envelope is a law and not a gift."
 cp_conversation.111.f:0 "#italic You are welcome#!, he says. He says it with the confidence of a man who has been thanked for things all his life. He does not ask how many coins were in the envelope. He does not ask what the rent is. He does not ask what she spends the coins on, though if he asked she would tell him, and she has the list ready: kerosene, a quarter of flour, the small repair on the door that has been waiting since Ramadan, a piece of cloth for the child who outgrew the older piece. She nods, in her fantasy, the way her mother used to nod when the bey accepted her thanks for the loan of the mule at planting — the nod that meant #italic I have heard you; I have not agreed with you; I will not say so#!. She backs one step from the carpet. She says, in a voice smaller than the one she began with, #italic Thank you, Effendim.#! The secretary, in the corner, writes something down. She does not know what."
 cp_conversation.111.a:0 "#italic She steps back. She does not curtsy.#!"

 # cp_conversation.112 -- He is dismissive
 cp_conversation.112.t:0 "It Is Only a Coin"
 cp_conversation.112.d:0 "He waves a hand. He does not understand what the envelope buys. He does not understand what arrives and does not arrive when the envelope is late."
 cp_conversation.112.f:0 "#italic It is only a coin#!, he says. #italic You have made a speech of it. Peasant women have a way of making speeches of coins.#! The sentence lands as a slap. She does not reach for her face — she is in a fantasy, her hands are where her hands are, on the carpet she is imagining — but she feels, in the same fantasy, the blood come up in her cheeks, and she feels also, underneath it, a cold place where a fire lights. The coin, she thinks, buys four days of kerosene, and the kerosene is the reason my son can read his Quran after supper, and the reason my daughter does not trip down the step in the dark, and the reason I can see the flour is not weevilled before I pour it into the dough. The coin is not a coin, Effendim. It is a month. You have not had to know this, because you have not been hungry in a month in your life. She does not say these things. She sets her jaw. She thinks them, with specificity. The secretary, in the corner, looks up. She thinks for a moment he might say something. He does not."
 cp_conversation.112.a:0 "#italic Her jaw sets. She does not speak further. She turns.#!"

 # cp_conversation.113 -- He admits ignorance
 cp_conversation.113.t:0 "He Did Not Know"
 cp_conversation.113.d:0 "He leans forward. He does not pretend to understand what the envelope is. He asks her to tell him."
 cp_conversation.113.f:0 "#italic I did not know#!, he says, with the directness that she has been imagining for weeks and has never fully trusted. #italic Tell me more.#! She does not know, at first, what to tell him. She has been waiting for the other Pasha — the one who waves his hand, the one who accepts her thanks. She is not ready for this one. She gathers herself. She says: the envelope comes on the first Friday. It lives on the shelf above the flour. It has, this month, thirteen coins in it. The rent is twenty-two. The flour is five. The kerosene is two. The remaining two are for the door that has been waiting since Ramadan. She lists these things the way a bailiff lists a harvest, not slowly, not dramatically, just in the voice a woman uses when she has memorised the arithmetic of her own life. He listens. He does not interrupt. He asks, at the end, only: #italic How long has the kerosene been two?#! She tells him: since the autumn. He nods. He is quiet. He writes something himself — not the secretary — on the edge of a page. She cannot read what he writes; she does not need to. She understands that something has been heard. She backs from the carpet, this time, with a straighter spine."
 cp_conversation.113.a:0 "#italic She steps back. The envelope has been seen.#!"

 # ----- cp_conversation.120..123 -- The Vote -----
 cp_conversation.120.t:0 "The Rolls"
 cp_conversation.120.d.literate:0 "She stands at the end of the carpet with her name, she is certain, written somewhere in a book she has read with her own eyes. She has come to speak about what that was like."
 cp_conversation.120.d.default:0 "She stands at the end of the carpet with her name, she has been told, written somewhere in a book in a building she has never entered. She has come to speak about what that was like."
 cp_conversation.120.f:0 "Effendim, she says — her voice is different tonight. It is the voice of a woman who has walked to a polling place and walked home. I have come about my name. Not about my father's name, which is my name, nor about my husband's name, which I share. About my name, which is in a book I was told about one day, and which was read by a clerk, and which was marked with a number — a number that is mine, that I cannot give to another woman, that will not be given to my daughter until my daughter is old enough. She pauses. I have voted, Effendim. I have voted in an election. I marked two names. I do not know, yet, whether the names I marked will rise; I do not know, yet, whether any of the names I marked will work for the things I marked them for; I do not know, yet, whether the men who counted the papers counted mine. But my name was there. My name was called. My name has been recorded. She is quiet a moment. She looks up, fully, at the man at the end of the carpet. I have come to tell you that this has changed something. Not in the country. I do not know yet whether it has changed the country. In me. It has changed something in me, and I wanted — I wanted the man who signed the paper to know."
 cp_conversation.120.a:0 "#italic as the Pasha:#! \"Congratulations. The country progresses.\""
 cp_conversation.120.b:0 "#italic as the Pasha:#! \"Vote carefully, child. The wrong names are dangerous.\""
 cp_conversation.120.c:0 "#italic as the Pasha:#! \"Tell me what changed.\""

 # cp_conversation.121 -- Hollow congratulation
 cp_conversation.121.t:0 "Congratulations, the Country Progresses"
 cp_conversation.121.d:0 "He is pleased the way a man is pleased when a machine he has built performs a task he assigned it. He is less interested in her than in the evidence that the machine is operating."
 cp_conversation.121.f:0 "He smiles. It is not an unkind smile. It is a smile of the kind that does not require her, specifically. #italic Congratulations#!, he says. #italic The country progresses.#! She hears the word §Ycountry§! in his mouth, and the word §Yprogresses§!, and she notices that neither word is her. There is a #italic we#! in the Pasha's sentence; she is not in it. She is outside the sentence, providing the sentence's evidence. She backs a step from the carpet. She keeps her face polite. She thinks: #italic Progress is a word he uses when he does not want to say my name.#! She files the sentence away. She will use it, later, to a woman she has not met yet, who will nod."
 cp_conversation.121.a:0 "#italic The smile is thin. She returns it, thinner.#!"

 # cp_conversation.122 -- Paternal warning
 cp_conversation.122.t:0 "Vote Carefully, Child"
 cp_conversation.122.d:0 "The word §Ichild§! lands the way the word §Ipeasant§! landed in the earlier audience. She marks it. She will carry it."
 cp_conversation.122.f:0 "#italic Vote carefully, child#!, he says. #italic The wrong names are dangerous. We would not want the wrong names at the head of the country.#! She hears the word §Ychild§!. She is fifty-four years old. She has borne five children, three of whom lived. She has buried a husband, or has not buried a husband — it depends on the week she is in — and she has carried water from the canal for forty-three years. The word §Ychild§! is a small slap. She takes it without flinching. She thinks: #italic The man at the end of the carpet does not know how old I am; he does not care; he thinks a woman is a girl until she is a widow and then she is nothing.#! She thinks: #italic He is wrong about this, and wrong about other things, and the paper with my name on it is one of the other things he is wrong about.#! She backs from the carpet. The fantasy has become colder tonight. She will not speak again to this Pasha for a long time."
 cp_conversation.122.a:0 "#italic Her face does not move. She steps back.#!"

 # cp_conversation.123 -- He listens
 cp_conversation.123.t:0 "Tell Me What Changed"
 cp_conversation.123.d:0 "He asks the one question she had not expected. He asks it without a condescension she can detect, which is its own kind of surprise."
 cp_conversation.123.f:0 "#italic Tell me what changed#!, he says, and she does not, at first, trust the question. She has rehearsed answers to the question he was supposed to ask, which was not this one. She takes a breath. She tells him the walk to the polling place. She tells him about the man at the table who read the names to her; she tells him about the one polite man and the one impolite one, and about which was which and why it matters. She tells him about the specific weight of the pencil, which was heavier than she had imagined a pencil could be, and about the smallness of the mark she made. She tells him the lane on the way home, and the sky, and the pebble in her shoe. #italic It is small#!, she says, #italic but small is not nothing. Small is a place where something has moved. I wanted the man in this room to know the thing has moved.#! He is quiet. He nods. He does not say, this time, that the country progresses. He asks the secretary, in a voice she almost cannot hear, to leave the room. The secretary leaves. The Pasha and Layla are alone on the carpet. For a long moment neither speaks. Then he says: #italic Thank you for telling me.#! The word #italic thank#! from his mouth is strange. She catches it. She will keep it. She backs from the carpet, slowly, as one leaves a prayer."
 cp_conversation.123.a:0 "#italic She leaves the carpet, slowly, as one leaves a prayer.#!"

 # ----- Root addition for Stall conversation topic -----
 cp_conversation.1.l:0 "Tell him about the stall."

 # ----- cp_conversation.130..133 -- The Stall -----
 cp_conversation.130.t:0 "The Stall"
 cp_conversation.130.d.forced:0 "She stands at the end of the carpet. She is wearing, in her fantasy, the apron she wears at the market — not the dress she does not own. Tonight the dress was not available. Tonight the apron was more honest."
 cp_conversation.130.d.chosen:0 "She stands at the end of the carpet with a small account-book in her hand — a book she cannot in fact read, but which in the fantasy she has read, cover to cover."
 cp_conversation.130.f:0 "Effendim, she says, and she is startled to hear that her voice is no longer small. The voice is the voice she uses at the market when a customer is being difficult about the change. Not loud. Not rude. But steady. §ISteady#! is the word she would use for it; §Isteady#! was not a word she could have used for her voice five years ago. I have come, she says, to tell you about the stall. She tells him: it is on the third corner from the well, on the road the carts use for the market. It is not the good corner — the good corner was taken by the man whose cousin is a deputy — but it is, she has come to believe, the better corner for what she sells, because the women walk past the third corner on their way home from the well, and the women are her customers. She tells him: she sells bread, some weeks; pickled things, other weeks; a little cloth when she has cloth to sell, which is less often now that her own hands have less time for the weaving because they have more time for the stall. She tells him: the profit is small. The profit is real. The profit goes into a jar behind a brick in the wall, and from the jar it goes into the rent, and from the rent it goes — the remaining handful, when there is a handful remaining — into the school box for the girl, who will go to school, and read, and grow up in a country that has laws Layla did not grow up under. She pauses. She looks at him. §IThat is the stall, Effendim. That is what it is.#!"
 cp_conversation.130.a:0 "#italic as the Pasha:#! \"And what does the stall pay in tax?\""
 cp_conversation.130.b:0 "#italic as the Pasha:#! \"Charming. A small enterprise. Very feminine.\""
 cp_conversation.130.c:0 "#italic as the Pasha:#! \"Show me the ledger.\""

 # cp_conversation.131 -- Tax collector voice
 cp_conversation.131.t:0 "What Does the Stall Pay"
 cp_conversation.131.d:0 "He has not asked what the stall is. He has asked what the stall owes. The two questions are not the same question, and the Pasha is not the first man to confuse them, and will not be the last."
 cp_conversation.131.f:0 "She does not flinch. She has rehearsed this question — not this exact question, but the shape of it — at the market, where it comes from the bailiff who comes every Thursday, and from the tax-assessor who comes twice a year, and from the old man in the alley who thinks he has a right to the question because he has a right to nothing else. She gives the Pasha the same answer she gives the Thursday bailiff: the stall pays what is owed. No more. No less. The Pasha waits, as tax collectors wait, for her to say more. She does not say more. She is getting better, she thinks — the §Inot saying more#! is a skill she has learned at the market, which she would not have learned had the market not been hers. The Pasha looks away first. It is a small victory. She will take it."
 cp_conversation.131.a:0 "#italic Let him ask. Let me not answer what was not asked.#!"

 # cp_conversation.132 -- Patronising
 cp_conversation.132.t:0 "Charming, Charming"
 cp_conversation.132.d:0 "He makes the face a man makes when he wants to congratulate a child. She is not a child. She is not, today, in a mood to explain the difference."
 cp_conversation.132.f:0 "§ICharming#!, he says. §ICharming. A small enterprise. Very feminine.#! The word §Ifeminine#! lands, in the Pasha's mouth, the way the word §Ipeasant#! landed at the first audience: it is not an insult in itself, but it is an insult in the arrangement. She thinks: §IYou would not call a man's shop §Amasculine.§B You would call it §Aa shop.§B#! She does not say it. She is saving the sentence for another audience, on another evening, when the Pasha may have been prepared, by the intervening months, to hear it. She is teaching this Pasha — who is, after all, her invention, and therefore ultimately teachable, even if he takes decades — by a slow method. She backs from the carpet. Her back is straight. She is still tired, afterwards, of having to teach the Pasha of her own imagination a lesson the Pasha of the real country has not yet learned. But the apron, she notices as she turns, is not a shame on her tonight. The apron is what she wore here, deliberately. She wore it because it was true."
 cp_conversation.132.a:0 "#italic Let him find the word §Ifeminine§A insulting later. I will be at the stall.#!"

 # cp_conversation.133 -- He asks about the ledger
 cp_conversation.133.t:0 "Show Me the Ledger"
 cp_conversation.133.d:0 "He asks in the voice of a man who has read ledgers and has things to say about them. He asks without condescension. She had not been ready for that."
 cp_conversation.133.f:0 "§IShow me the ledger#!, he says — and, because this is a fantasy, she has a ledger in her hand, and because this is a fantasy, she can read it. She shows him. She explains: this column is what the flour cost, this column is what the bread sold for. This column is what the bailiff took, which should not be in this column, but in this country it is. This column is what remains. He reads. He does not interrupt. He points at the fourth line, on the third page — a week in the winter when the flour cost fifteen and the bread sold for sixteen — and he asks what happened that week. She tells him: the mill was slow; the flour was expensive. He nods. He asks about the next line. She tells him. He asks about the next. After an hour — an hour that would not fit in any real audience — he closes the book. He says: §IYou keep a better ledger than most of my tax-assessors.#! She knows this is a fantasy, so she knows this Pasha is not the real one, but even so the sentence lands. She bows her head. He says: §IYou do not need to bow.#! She raises her head. She does not bow. She will remember, after the fantasy dissolves, that she raised her head. She will try, tomorrow, at the market, to hold the same shoulders she held on this imaginary evening."
 cp_conversation.133.a:0 "#italic He has read the ledger. I will carry my shoulders home.#!"

