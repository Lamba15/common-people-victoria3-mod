 # cp_layla.83 -- "The Forty Days" (post-death coda)
 cp_layla.83.t:0 "The Forty Days"
 cp_layla.83.d:0 "The forty-day mourning is over. The women of the lane have put away the black. The lamp in the back room has been allowed, this morning, to go out."
 cp_layla.83.f:0 "Um Yusuf comes through the door with a cloth-wrapped bundle. It is the flat mourning-bread the Copts of the quarter bake for the fortieth day of a Muslim household's grief — a courtesy that has existed in this lane for longer than anyone can remember, and that has been returned, in the other direction, when Um Yusuf's own husband was buried. Nūr is at the table, writing. She is writing to Mariam in Cairo, to tell her that the mother is gone. The writing is in an Arabic hand whose cleanness Layla would not have recognised as her daughter's — but then, Layla is not, this morning, here to recognise anything. On the shelf above the hook where Ahmed's coat used to hang, the tobacco-tin is still where it has been for twenty-eight years. Nobody has opened it. Nobody will open it this year either. Nūr looks up from her writing. She looks, for a long moment, at the tin. Then she puts her head down and keeps writing. Um Yusuf sets the bread on the low table. Neither of the women speaks. Behind a loose brick in the wall, in a clay pot neither of them will touch this week, a deed lies folded in a cloth. The life has been handed forward. The kitchen is quiet. The river, outside the village, continues to do the one thing the river has always done."
 cp_layla.83.a:0 "#italic The life has been handed forward. Let the kitchen continue.#!"

 # cp_layla.125 -- "The District Office" (the real audience that fails)
 cp_layla.125.t:0 "The District Office"
 cp_layla.125.d:0 "She has made the two days' walk to the provincial capital. She is sitting on a wooden bench. She has been sitting on the wooden bench for three hours. A clerk she has not yet seen is, somewhere behind a door, deciding whether to see her."
 cp_layla.125.f:0 "The bench is not padded. The light comes in at a high window that has not been washed since the previous reign. She is wearing the clean dress, the one she keeps folded for funerals and for occasions when she might be looked at by men who write things down. She has, in her hand, a folded paper — the one document of her life — which she has intended, for seven weeks, to ask the office a specific question about. The clerk, when he finally arrives, is a man of perhaps forty. His sleeve is worn at the cuff. His moustache is the small thin moustache fashionable this year in the provinces. He is not unkind. He is, she sees from the first second, tired. The tiredness is worse than cruelty; cruelty can be argued with, tiredness cannot. She shows him the paper. He reads it. He does not read it carefully. He says: §Icome back Thursday.#! She says: today is Tuesday. He says: §Ithen come back Thursday.#! She comes back Thursday. A different clerk, equally tired, equally worn at the cuff, reads the paper and says: §Ithe man who handles this is not in today. Come back next week.#! She does not come back next week. On the two-day walk home she understands — she understands cleanly, without resentment, without drama — why her mother never went to an office in her life, and why her mother's mother never went, and why the fantasy of standing on a long carpet before a ruler who would actually listen had needed, all these years, to live inside her head, because the real carpets are in real rooms whose doors are kept by men whose job is to not listen. She arrives home on the fourth evening. She kneads the bread. The kitchen receives her. She does not, tonight, go to Cairo in her mind. The fantasy is a Friday thing; tonight is Tuesday, and Tuesday is for the dough."
 cp_layla.125.a:0 "#italic So. That is what the real room looks like. Now I understand why I go to the imagined one.#!"
 cp_layla.125.b:0 "#italic I do not come back a third time. Let the paper they will not read sit in a drawer they will not open.#!"

 # cp_layla.126 -- "The Imam's Visit"
 cp_layla.126.t:0 "The Imam's Visit"
 cp_layla.126.d:0 "Sheikh Abdallah is at the door on Friday afternoon. He is not here about anything in particular. That is the point."
 cp_layla.126.f:0 "He is older than Layla by fifteen years, which means he is now the oldest man in the lane who still walks the lane on his own two feet. He delivered the Friday sermon at noon — the sermon was about patience, because the sermon is always about patience, because patience is the virtue Sheikh Abdallah has spent his life practising and teaching and, increasingly, needing — and now he has come up the lane and stopped at Layla's door. She brings him inside. She sets out the second-best cushion, not the best, because the best is reserved for suitors and marriage-brokers and does not fit the occasion, which is an occasion of the visiting kind that has no name. She makes tea. He takes the glass by the rim, the way men of the lane take a tea-glass. He drinks it slowly. He asks after Ahmed, or after Ahmed's memory, depending on which of the two is in the house this year. He asks after Nūr. He asks after the uncle with the cough — he had heard, he says, that the cough was a little better, which was a mercy. He does not preach. He does not recite. He sits for fifteen minutes, which is the length he sits at every house in the lane on the Fridays he visits. He stands. He says §Iallāh yubārik#! — God bless — and he leaves. Layla washes the glass. She sets it on the shelf. She notices, as she sets it down, that the visit did not contain a single sentence of religious instruction, and that she nevertheless feels — privately, unaccountably — as though she has, this afternoon, been to the mosque."
 cp_layla.126.a:0 "#italic God bless him. Let him make the round again next month, if the knees hold.#!"
 cp_layla.126.b:0 "#italic A coin for the zakat box. He did not ask, which is why it is given.#!"

 # cp_layla.127 -- "The Small Victory"
 cp_layla.127.t:0 "The Small Victory"
 cp_layla.127.d:0 "The nephew is back from Cairo. He is wearing a tarboosh of a colour no village tarboosh has ever been, and a jacket the cut of which is not from any tailor in the district. He stands at the well explaining the city to anyone who will listen."
 cp_layla.127.f:0 "Um Yusuf is at the well. Layla is at the well. A cousin's son — call him Fawzi, because Fawzi is what one calls a young man in this kind of story — has come home for his mother's feast-day in what is, by his account, the very latest fashion, and is explaining to the women at the well that the well is, compared to Cairo's plumbing, an archaism. Fawzi is twenty-four. Fawzi has been in Cairo for eighteen months. Fawzi is, in his own estimation, a man of the city now. Layla meets Um Yusuf's eyes across the rim of the well. Um Yusuf's mouth does the small twitch that is the beginning of a laugh Um Yusuf is managing not to have yet. Layla's mouth does the same small twitch. Fawzi, unaware, turns on his heel to demonstrate the particular way a Cairo gentleman walks when approaching a door — and in turning, his Cairo shoe meets the patch of mud that has been at the edge of the well since Layla was a bride, and the shoe, and the trouser, and the jacket, and Fawzi himself, go sideways into the mud in a single magnificent, entirely non-serious fall. He is unhurt. He is covered in mud. The tarboosh has landed three paces away. Um Yusuf laughs first. Layla follows. They laugh — both of them, properly, the way women of their age laugh when the laughter is at a young man who has, for a specific minute, deserved it — until tears come. Fawzi, to his credit, laughs also, eventually. The two women help him up. The two women, for the rest of the month, do not mention the fall, because the not-mentioning is the part of friendship that is harder than the laughing. But on the walk home, Layla notices that her shoulders are not where she usually carries them. They are lower. They have been carrying, she realises, a week of small weights, and the laugh at the well has set the week down."
 cp_layla.127.a:0 "#italic Allah, the boy fell. The boy fell into the old mud, in his new shoes. The week is better than the week was.#!"
 cp_layla.127.b:0 "#italic Help him up. Do not mention it. Give him the dignity the mud has already taken. It is enough.#!"

 # cp_layla.128 -- "Mariam Writes from Cairo"
 cp_layla.128.t:0 "Mariam Writes from Cairo"
 cp_layla.128.d:0 "A letter has come from Mariam in Cairo. Nūr sits cross-legged on the mat with the envelope unopened on the floor between them. Layla says: §Iread it slowly.#!"
 cp_layla.128.f:0 "Mariam — Layla's cousin, three years younger, who went to Cairo at nineteen with an aunt and never came back — is, these days, working at a small café in a neighbourhood Layla cannot picture because she has never been to it. The café has, Mariam writes, marble tables. The café has, Mariam writes, gas lamps that are lit at dusk by a boy whose entire job is lighting gas lamps. The café serves coffee at a price that, in piastres, makes Layla reach for her grinding-stone to check whether she has understood the number correctly. Nūr reads the letter slowly, the way she has been taught to read. When she comes to the sentence in the middle — the sentence Layla will think about for the rest of the night — Nūr pauses. The sentence says that Mariam, on certain Tuesday evenings, has begun to play the oud at a private salon where a few old friends and a few new ones gather to hear music. The sentence is short. The sentence does not say whether Mariam is paid for this. The sentence does not say whether the old friends include men. The sentence does not say whether the salon is a thing Layla's mother would have approved of, because Layla's mother is not available for comment and because Mariam, who knows this, has not offered one. Nūr, reading, looks up from the page. She asks: §Ishould I keep reading?#! Layla says: §Iyes. But read that sentence again.#! Nūr reads the sentence again, more slowly. Then she reads the rest of the letter. The rest of the letter is about a new cousin of Mariam's who has opened a tailoring shop, and about the weather, which in Cairo is, apparently, worse than in the village. Layla listens to all of it. She asks Nūr to fold the letter and put it in the drawer. That night she lies awake for a long hour. She thinks about the oud. She thinks about the private salon. She thinks about whether, in another life, she would have envied Mariam or pitied her. She decides, at some point before sleep, that she will do neither — that Mariam is Mariam, and Layla is Layla, and the point of a letter from a cousin in Cairo is that the cousin in Cairo exists, and the knowing of her existence is, for tonight, enough."
 cp_layla.128.a:0 "#italic Read the sentence again, child. The sentence is Mariam saying who she is now.#!"
 cp_layla.128.b:0 "#italic Enough for tonight. Put the letter in the drawer. Sleep first; judge in the morning, or not at all.#!"
