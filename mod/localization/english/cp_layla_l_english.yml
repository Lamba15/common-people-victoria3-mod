l_english:
 # Names
 cp_name_layla:0 "Layla"
 cp_name_alsharif:0 "al-Sharif"
 cp_name_ahmed:0 "Ahmed"


 # ----- Events -----

 # cp_layla.1 -- "The Farmer's Daughter" (intro)
 cp_layla.1.t:0 "The Farmer's Daughter"
 cp_layla.1.d:0 "She is awake before the muezzin. She has been awake before the muezzin every morning of her adult life."
 cp_layla.1.f:0 "Her name is Layla al-Sharif and she is twenty-two years old, of Mīt al-Nakhla, two days' walk from the river's eastern mouth. She would like, if anyone ever asked her — and no one ever has — a roof that does not leak when the flood comes, children who live past the first year, and a slip of paper with her name written on it saying this patch of earth belongs to her. The bey says the earth belongs to the bey. The bey says many things. The sky begins to turn the color of the inside of a pomegranate. She has not asked, in any voice anyone could hear, to be seen. But somewhere, in a small private way she will never know about, she is being seen now."
 cp_layla.1.a:0 "Watch her."

 # cp_layla.2 -- "The Deed" (homesteading granted)
 cp_layla.2.t:0 "The Deed"
 cp_layla.2.d:0 "She holds it. She has waited her whole life to hold it. Her grandmothers waited too."
 cp_layla.2.f:0 "The wax is still warm where the seal pressed it. The notary had not yet wiped his pen when he handed it over; the wax is the kind that stays warm in the hand for twenty minutes and then cools. It is the color of dried blood and it carries her name. Her name. Layla bint Mohamed al-Sharif, of Mīt al-Nakhla, on a paper that the law says cannot be taken from her. She stands in the middle of the field and her hands will not stop shaking and the field — green, hers, hers — keeps blurring at the edges. She does not weep. She has not wept for anything before, not the babies she has lost or the brother who never came back, and she will not weep now. But the field will not stop blurring. Somewhere, in a village she will never visit, a man with a name like hers walks past with a paper of his own, and he is also not weeping. Across the lane, she knows, Umm Mariam — who has worked the field next to theirs for thirty years — does not, today, have a paper. A clerk in Mansoura wrote her husband's name incorrectly in the ledger and no one, in the years since, has corrected it. The sun is high. The wax is warm. The earth is hers. The earth next door is not, today, Umm Mariam's."
 cp_layla.2.a:0 "She holds it carefully."

 # cp_layla.3 -- "The Bey Returns" (serfdom restored)
 cp_layla.3.t:0 "The Bey Returns"
 cp_layla.3.d:0 "He came back today. The law brought him back."
 cp_layla.3.f:0 "She knew before she saw him. The doors of the lane were already shut and the dogs had stopped barking and the boys who play in the dust had been called inside. Then the dust rose at the village edge — the wrong kind of dust, the dust that means horses — and she put her back against the wall and she put her hand on Ahmed's wrist and she did not look up. She has spent her whole life being good at not looking up. There are things one learns in this country that one does not unlearn. The deed is folded in her chest, against the bone, and the deed does not matter today. The bey rides through the lane. He does not need to look at her. He knows she is there. He has always known she was there."
 cp_layla.3.a:0 "She does not look up."

 # cp_layla.4 -- "He Marches" (Ahmed conscripted)
 cp_layla.4.t:0 "He Marches"
 cp_layla.4.d:0 "He left at dawn. He looked back once. War is a thing that, in this country, happens to other people's husbands until one day it does not."
 cp_layla.4.f:0 "He carried a small bundle and a piece of bread wrapped in cloth, and he wore his grey gallabiya because there was no uniform yet — they would give him one in Cairo, or perhaps later, or perhaps never. He had cleared his throat twice at the door before he said her name — the way he had always cleared it before the important sentences — and she understood, in the small second between the second clearing and his saying §ILayla#!, that she had not, in twenty years of marriage, ever counted his throat-clearings. She would count them now. The other men of the village walked beside him. None of them spoke. She stood at the wall with the other women and she did not lift her hand and she did not call his name, and when the column turned at the bend in the road she watched the dust settle for a long time before she walked back to the house. The house was quiet in a new way. The way a house is quiet when it has begun to understand what it might become. Somewhere, in a city she has never seen, a clerk is writing his name in a ledger no one in this village will ever read."
 cp_layla.4.a:0 "She watches until the column turns."

 # cp_layla.5 -- "The First Cry" (childbirth, mother survives)
 cp_layla.5.t:0 "The First Cry"
 cp_layla.5.d:0 "She lived. The child lived. In this country, in this year, that is two miracles in the same hour."
 cp_layla.5.f:0 "The lamp guttered. She held the small wet weight of him and she did not feel what they had told her she would feel. Her mother had said: you will know him at once, you will feel a love that has no end. She felt instead a slow surprise — a kind of disbelief that her own breath was still moving in her own chest. Badr — the midwife, older than her own mother had been at her own mother's death, who had caught every child born in this lane for forty years — dried her hands in the shadow at the foot of the bed. Ahmed, kneeling, would not look at the baby; he would not stop looking at her. She thought, with a clarity that frightened her: I am still here. I am still here, and there is a person in my arms now who needs me to stay. The lamp guttered again. She let it burn."
 cp_layla.5.a:0 "She lets the lamp burn."


 # ----- Layla action and ambient pool (cp_layla.10 - cp_layla.35) -----

 # cp_layla.10 -- "The Letter That Has Not Come" (Ahmed at war)
 cp_layla.10.t:0 "The Letter That Has Not Come"
 cp_layla.10.d:0 "The post-cart passes through the village once a month. She does not go out to it. That would tell the village she is waiting, and the village already knows."
 cp_layla.10.f:0 "Her hand is flat on the doorframe. She is counting: the hoof-beats, then the wheels, then the diminishing sound of them moving on without stopping. The postman has not called her name in four months. Her mother-in-law — widowed at nineteen — tells her this means nothing; letters are slow, armies are slower, men who go quiet are not always the men who have died. Layla nods. Her mother-in-law is right, or she is not right, and either way the nodding is what one does. The clay jar of Ahmed's shaving-water is where he left it. The water has gone green; a skin has formed on the top of it. She has not emptied the jar. On the narrow shelf above the hook where his coat used to hang, his tobacco-tin is where he left it too. She has not opened the tin. The tin is the more important emptiness, because the tin's owner is alive somewhere and might be coming back for it. The water is only water. There will be time to empty the jar. There will be time for a great many small things, once there is news."
 cp_layla.10.a:0 "She waits for the next cart."

 # cp_layla.11 -- "Walking the Field She Owns" (homesteader)
 cp_layla.11.t:0 "Walking the Field She Owns"
 cp_layla.11.d:0 "She walks the edge before the sun is high. Hers. The word still does not sit correctly in her mouth."
 cp_layla.11.f:0 "She has begun, without meaning to, to walk the border stones in the same order each morning — the north corner, the east corner, the south corner, the little crooked one by the canal — as if the walking of it is what keeps the field from leaving. The dhurra is coming up green and strong, and a little early this year. A heron stands one-legged in the irrigation channel and does not look at her; the heron is a creature she has begun to feel a private fondness for, in the way that one feels a fondness for a neighbour who has chosen not to pry. Ahmed is still asleep in the house. She has not told him how early she rises now. He would worry, and she would have to explain something she does not yet know how to explain to herself."
 cp_layla.11.a:0 "She walks the four corners."

 # cp_layla.12 -- "Under the Bey's Eye" (serfdom restored)
 cp_layla.12.t:0 "Under the Bey's Eye"
 cp_layla.12.d:0 "The bey's overseer passes twice a day now. Once in the morning, once in the evening. Both times with a list."
 cp_layla.12.f:0 "She does not look at the list and she does not look at him. She has learned, as all the women of the village have learned, to stand in a particular way while he is passing: the shoulders a little forward, the eyes on a fixed point at her own feet, the hands busy with something that cannot be interrupted. The something today is a basket she is plaiting from palm-fronds. The basket does not need to be plaited today. She plaits it anyway, because stopping would be to notice him, and to notice him is to be noticed back. The deed is folded in a clay pot behind a loose brick, and the brick is behind a sack of dhurra. She has not touched the brick in four months. Some things must be protected by being forgotten about, publicly, for a long time."
 cp_layla.12.a:0 "She plaits until the sound of him fades."

 # cp_layla.13 -- "A Day With No Wind" (always available)
 cp_layla.13.t:0 "A Day With No Wind"
 cp_layla.13.d:0 "The air is heavy this morning. No wind from the Nile, no wind from the desert. The palm-frond roof does not creak."
 cp_layla.13.f:0 "A day with no wind is a day when the prayers go straight up, her grandmother used to say. Layla is not certain her grandmother believed it. She is not certain she believes it either. But she finds that she is praying, quietly, while she grinds the dhurra — not for anything in particular, not for rain and not against drought, not for a child and not against losing a child. She is praying only that whoever is listening today would listen a little longer. The hens are quiet in the courtyard. A neighbour's cat walks the top of the mud wall in a thoughtful way. The dust that has risen this morning will not settle until the afternoon. There will be dust on the bread if she is not careful. She is careful."
 cp_layla.13.a:0 "She grinds, quietly."

 # cp_layla.14 -- "The Neighbour's Boy in the Lane" (always available)
 cp_layla.14.t:0 "The Neighbour's Boy in the Lane"
 cp_layla.14.d:0 "The neighbour's boy is crying in the lane again. His mother is at the well."
 cp_layla.14.f:0 "His grandmother died in the winter and there is no one in the house to pick him up. Layla listens for a long moment with her hands in the dough. The crying is the kind that is not about anything and will pass; the mother — Um Yusuf, six months older than Layla, a Copt whose new baby almost did not live last winter — will be back in a quarter-hour. Layla does not go out. She knows that if Um Yusuf returns and finds another woman holding her son, it will be a wound that does not heal the right way. But she leaves the dough and steps into the doorway, so that the boy, if he turns his head, will see that there is a face. Sometimes being seen is enough. He turns his head. She lifts her chin. He keeps crying; but he keeps crying at her, now, instead of at nothing."
 cp_layla.14.a:0 "She stays in the doorway."


 # cp_layla.15 -- "Her Mother's Left Hand" (always available)
 cp_layla.15.t:0 "Her Mother's Left Hand"
 cp_layla.15.d:0 "Her mother used to reach for bread with her left hand, always. The right hand was always busy."
 cp_layla.15.f:0 "Stirring a pot, wiping a child's face, adjusting a scarf — the right hand was doing something more important. Layla has begun, without noticing, to reach with her left hand too. She notices today because the bread slips from her fingers and falls on the mat, and the mat is not clean, and she has to brush it off and re-examine it before it goes into her mouth. She thinks of her mother's hand. Her mother's hand is buried now, in the cemetery on the western edge of the village, under a rectangle of stones no larger than a loaf. Layla has not been to the grave since the forty-day mourning ended. She will go on Friday, she tells herself. She has been telling herself this every week for four years. This week too, she thinks, she will go. This week too, she will probably not."
 cp_layla.15.a:0 "She eats the bread, left-handed."

 # cp_layla.16 -- "The Hen That Will Not Lay"
 cp_layla.16.t:0 "The Hen That Will Not Lay"
 cp_layla.16.d:0 "The red hen has not laid in eleven days. She has counted. The other two have, but not her."
 cp_layla.16.f:0 "It is the oldest of the three, the red one with the pale feathers on her left wing. Layla has been feeding her the usual handful of dhurra scraps and the usual thought of the pot has been arriving, every morning, more plainly. Today she crouches in the courtyard and looks at the hen and the hen does not look back. There is a decision to be made and Layla has been not quite making it for a week. She thinks of her mother-in-law, who would have made the decision a week ago. She thinks of the broth. She picks up the hen. The hen does not object. Layla carries her to the shaded corner, sets her down gently, brushes a feather from her own lap, and walks away. Another day, she tells herself. Another day."
 cp_layla.16.a:0 "She gives the hen another day."

 # cp_layla.17 -- "The Merchant's Scale"
 cp_layla.17.t:0 "The Merchant's Scale"
 cp_layla.17.d:0 "She has been watching the merchant's scale for three weeks. She has started to believe it."
 cp_layla.17.f:0 "The onions come home heavier than they leave the market. She has weighed them on her own small stone, the one that was her grandmother's, and the numbers have not been agreeing. Abu Hassan — the merchant who has kept the stall next to the well for as long as Layla has been married — is a man of a certain age with a stutter and a wife who is kind; Layla does not want to be the woman who accuses him. Still. This morning she sets one onion on his scale and, on the way home, she sets the same onion on her stone. The difference is small. But the difference is there. She will not say anything, not this week, not next week. But she will begin to buy her onions from the other merchant, the one from the next village, whose hands are quicker and whose eyes do not rest on the scale the way Abu Hassan's do."
 cp_layla.17.a:0 "She changes merchants, quietly."

 # cp_layla.18 -- "Friday, the River Low"
 cp_layla.18.t:0 "Friday, the River Low"
 cp_layla.18.d:0 "The river is low this Friday — not dangerously, but noticeably. The old men are already talking."
 cp_layla.18.f:0 "She goes to the bank after the midday prayer and stands there a long while, looking. The water is the color it usually is but there is more of the bank visible than there should be — the pale stripe along the mud, the one that is not supposed to be visible this time of year. She does not know, exactly, what a low river means in the months ahead, but her mother would have, and her grandmother certainly would have. The old men on the bank are speaking in a low register she recognises from her childhood — the register that precedes decisions about grain stores and the slaughter of animals. Layla walks home slowly. She will say nothing to Ahmed tonight. But she will, quietly, buy an extra sack of beans at the market on Monday."
 cp_layla.18.a:0 "She will buy an extra sack of beans."

 # cp_layla.19 -- "The Old Woman Who Sees Through Walls"
 cp_layla.19.t:0 "The Old Woman Who Sees Through Walls"
 cp_layla.19.d:0 "Umm Saad came by the house today. Umm Saad does not come by the house for no reason."
 cp_layla.19.f:0 "She is ninety, or so everyone says; she herself is vague about it. She has a white plait down her back and a right eye that looks at you and a left eye that looks slightly past you, which is the eye the village believes in. She asks for a cup of water. Layla gives her a cup of water. She drinks it slowly and she looks, for a long time, at the brick behind which Layla keeps the pot, and she does not mention the brick, and then she gets up and thanks Layla and says §Iyour hens are in good health§! and leaves. Layla stands in the doorway after she has gone. Nothing has been said. Everything has been said. She will see Umm Saad at the next funeral and they will pretend this visit did not happen, and Layla will, for the rest of her life, believe in the left eye."
 cp_layla.19.a:0 "She lets Umm Saad see what she will see."

 # cp_layla.20 -- "The Bread That Did Not Rise"
 cp_layla.20.t:0 "The Bread That Did Not Rise"
 cp_layla.20.d:0 "The dough is dense this morning. She knows the moment she presses her thumb into it. Something is wrong."
 cp_layla.20.f:0 "She cannot say what exactly — the water was the right temperature, the flour was from the same sack as yesterday, the yeast was from the same corner of the same pot. But the dough is wrong. She shapes it anyway and bakes it anyway, and the loaves come out flat and heavy, and they taste like the bread of a year she does not want to remember: the year of her second lost baby, the year the rains were slow. She sets the loaves on the rack and sits on the step of the courtyard and does not weep, because she does not weep; but she sits there for a long time, longer than it takes the loaves to cool. Ahmed will ask nothing. The loaves will be eaten."
 cp_layla.20.a:0 "She lets the loaves cool."

 # cp_layla.21 -- "Dust on the Water"
 cp_layla.21.t:0 "Dust on the Water"
 cp_layla.21.d:0 "The khamaseen came through before dawn. She closed the cistern in time. Most of the dust is outside — most, not all."
 cp_layla.21.f:0 "She has been at it for two hours now: the swept floor, the re-swept floor, the shaken-out rug, the wiped-clean shelf, the bread-bowl that she has had to rinse three times because the dust finds its way into the flour the way water finds its way into a cracked clay pot. Her head-scarf is grey with the dust. So are her forearms, up to the elbow. She does not mind, quite, the work — the work has a shape, an end, a measurable quantity — but she minds the helplessness of the wind, which can undo six hours of a woman's week in twenty minutes and does not owe her an explanation. She goes out once more to the cistern to check that the lid held. The lid held."
 cp_layla.21.a:0 "She sweeps again."

 # cp_layla.22 -- "The Younger Brother's Letter"
 cp_layla.22.t:0 "The Younger Brother's Letter"
 cp_layla.22.d:0 "Kareem has written from somewhere. She will need the baker's son to read it to her."
 cp_layla.22.f:0 "Her younger brother has not been home in five years — he went to Alexandria, or so the family story goes, to work with a cousin of a cousin, and the letters have been, until now, rare. The baker's son is sixteen and can read, and he reads to her in the lane, with the letter held close to his eyes because the writing is small and the paper is thin. Kareem is alive. Kareem is not in Alexandria. Kareem is somewhere in Greece, working in a warehouse, and he sends four piastres folded into the paper, which he asks her to give to their mother, who is dead, which he does not know. Layla folds the four piastres back into the letter and walks home holding the letter like a thing that could shatter. She will write nothing back. She will not know, for three more years, whether he is still alive."
 cp_layla.22.a:0 "She folds the letter into the chest."

 # cp_layla.23 -- "The Mule That Will Not Move"
 cp_layla.23.t:0 "The Mule That Will Not Move"
 cp_layla.23.d:0 "The village mule has stopped in the lane, and the village mule will not be persuaded to start again."
 cp_layla.23.f:0 "He belongs to nobody in particular — the village owns him, or he owns the village, depending on whom one asks — and this afternoon he is standing squarely in the lane between Layla's door and the well with a cart of straw behind him and a young boy who is too small to whip him with any seriousness pleading with him in a reedy voice. Layla leans in the doorway with the bucket under her arm, waiting. She is not in a hurry. The mule is. Eventually the young boy gives up and goes to find his father and the mule, unobserved, takes one thoughtful step forward, then another, then begins, at his own leisurely pace, to walk. Layla picks up the bucket and follows him toward the well. She has learned, over the years, that the village moves at the speed of the village, and that impatience is a thing for other women in other places."
 cp_layla.23.a:0 "She walks behind the mule."


 # ----- Tech arrival reactions (cp_layla.30..32) -----

 # cp_layla.30 -- "The Iron Horse" (railways arrive in Egypt)
 cp_layla.30.t:0 "The Iron Horse"
 cp_layla.30.d:0 "Word has come up the canal road. A machine that pulls itself. No mule, no ox. Black smoke against the morning."
 cp_layla.30.f:0 "She does not go to see it. She is told, by the boy who delivers bread, that it makes a noise like the end of the world and moves faster than a horse at full gallop. He is twelve and has been crying, and he does not know why. She asks him if he liked it. He thinks for a while. He says he does not know. That evening, washing turnips in the shade of the wall, she tries to picture a mule made of iron and cannot, and then she tries to picture nothing pulling it at all, and she cannot picture that either. The world is getting bigger. She is not sure yet whether a bigger world is a better one."
 cp_layla.30.a:0 "She decides, next time the bread-boy comes, to walk with him to the canal road."
 cp_layla.30.b:0 "The world is larger than she thought. She says nothing."

 # cp_layla.31 -- "A Word From Beyond" (electric telegraph)
 cp_layla.31.t:0 "A Word From Beyond"
 cp_layla.31.d:0 "The news from Istanbul reached Cairo before the afternoon prayer. Not by courier. By a wire."
 cp_layla.31.f:0 "Nobody in the village has seen the wire, but the man from the next village says he has touched one where the road bends past his cousin's mill. It is cold, he says, and nothing moves inside it. And yet. Yesterday the Sultan decreed and today Cairo knows. She tries to picture it — a word travelling on a string, not stopping for mountains, not stopping for the sea — and the picture refuses. A word is made in a mouth. A word needs a mouth to catch it. She asks the imam, because she is not sure who else to ask. He says it is permitted. He does not say whether he understands it."
 cp_layla.31.a:0 "She believes it. She does not understand it."
 cp_layla.31.b:0 "She says nothing to anyone, and she prays that night for clarity."

 # cp_layla.32 -- "Voices in the Air" (radio)
 cp_layla.32.t:0 "Voices in the Air"
 cp_layla.32.d:0 "A box, in the shopkeeper's house. A voice comes out of it. A woman's voice, singing — and no woman there."
 cp_layla.32.f:0 "She sits outside with the other women, on the bench the shopkeeper has dragged out for them, and the song comes through the open door. None of them will go inside. It is not the song, exactly. It is that she cannot tell whether the woman singing it is alive, now, at this very hour, or was alive once and is gone. Perhaps she is in Cairo. Perhaps she is in Europe. Perhaps she is in a grave, and the grave is singing. The shopkeeper's wife keeps bringing them tea and they keep not drinking it. The song ends. Another begins. Layla realises she has been holding her breath."
 cp_layla.32.a:0 "She asks, quietly, whether the singer knows we are listening."
 cp_layla.32.b:0 "She goes home before the next song. It is too much, all at once."


 # ----- War-end reactions (cp_layla.40..41) -----

 # cp_layla.40 -- "The Column Returns" (Ahmed comes home)
 cp_layla.40.t:0 "The Column Returns"
 cp_layla.40.d:0 "The dust on the canal road is a different dust today. Horses. Men. The shape of him, smaller than she remembered, at the back of the column."
 cp_layla.40.f:0 "He stands in the doorway before he comes in. He is looking at the doorway as if he is deciding whether he is still permitted to cross it. The last time she had seen his face it had been turned back at the bend in the canal road — the one quick look he had allowed himself and her, the morning the column took him. She has lived, these years, with that one look. Before he crosses the threshold he clears his throat — twice, the way he had always cleared it before the important sentences — and she understands, before he has said his name, that no impostor would have known to clear the throat twice, that he is indeed him, that the count she began at the gate four years ago can be extended by two. She puts down the bread. She says his name once. He nods. He does not speak. That will come later — in weeks, perhaps, or in months — and when it comes it will arrive in small pieces at odd hours, about things she was not expecting to hear. For now he sits on the stool where he used to sit. He eats what she puts in front of him. He asks if the well is still the well. He asks if the neighbour woman with the bad hip is still the neighbour woman with the bad hip. She says yes, and yes. He nods, and nods, and the afternoon passes. At dusk she understands that her husband is home, and that he is not entirely the husband she sent away, and that she does not mind."
 cp_layla.40.a:0 "She sets an extra plate at the table."

 # cp_layla.41 -- "The Clerk's Letter" (Ahmed killed)
 cp_layla.41.t:0 "The Clerk's Letter"
 cp_layla.41.d:0 "An official on a donkey came through the village today. He had a ledger and a list of names. He had one name for Layla's house."
 cp_layla.41.f:0 "He did not dismount. He asked in a tired voice, in a formal Arabic too flat for the village's ear, whether this was the house of Ahmed son of Mahmoud. She said that it was. He said: then I have news, and I am sorry to carry it. He read the line from the ledger. It was a single line. The village women gathered behind her, not close. When he had read it he put the ledger back in his saddlebag and said — not unkindly — that the country was grateful. Then he rode on to the next name. Layla went inside and she did not close the door. She did not sit down. She stood at the wall where he used to hang his coat. She did not weep yet, because weeping would come later, and she wanted first to be alone with this. She thought of the bend in the canal road where the column had turned, the one morning he had let himself look back. The back of him — the small grey gallabiya, the bundle he was carrying, the dust around his ankles — is, she understands now, the last photograph she will have of him. It will not be replaced. Above the hook where he used to hang his coat, on the narrow shelf, his tobacco-tin sits where he left it four years ago. She does not open the tin. She knows, without opening it, that she will not open it this year, and perhaps not ever."
 cp_layla.41.a:0 "She closes the door."


 # ----- Industrial-building reactions (cp_layla.50..) -----

 # cp_layla.50 -- "The Smoke Above the Palm" (first textile mill in her state)
 cp_layla.50.t:0 "The Smoke Above the Palm"
 cp_layla.50.d:0 "There is a new tall thing on the horizon, past the canal. It has a chimney. The chimney gives off smoke in a pillar so straight it looks like it has been painted there."
 cp_layla.50.f:0 "She passes near it once, on the way to her aunt's house. The ground vibrates — not an earthquake vibration, a steady one, continuous, as if the earth itself has become a slow drum. A few men stand at the gates in clean clothes. Many more men, in less clean clothes, walk in at dawn and do not come out until after sunset. One of her cousins works there now. He sends a little money home and he does not come back for Friday prayers anymore. The cousin says the machines are from Manchester. He says the word 'Manchester' as if it is a place, not far off, where bigger things happen. She nods. She does not know where Manchester is. She does not ask."
 cp_layla.50.a:0 "The world is getting bigger. She is not certain that it is getting better."
 cp_layla.50.b:0 "She wonders whether her sons, when they come, will walk to that gate at dawn."


 # ----- Revolution reactions (cp_layla.60..) -----

 # cp_layla.60 -- "The Shutters Close"
 cp_layla.60.t:0 "The Shutters Close"
 cp_layla.60.d:0 "Riders came through the village at dusk with rifles on their backs and a flag she did not recognise. They did not stop. They rode on toward the river."
 cp_layla.60.f:0 "She put out the lamp without needing to be told. She sat with the children in the dark, on the far side of the room from the window, and she did not speak, and she did not let them speak. Across the lane, the neighbour woman had done the same — Layla could tell by the dark where there should have been a lamp. Somewhere, not far enough, a rifle was fired, and then another, and then nothing. They sat in the dark for a long time. The country had split open. She had heard the word — inqilab — from her grandfather once, about a thing that happened when he was young, and now the word was here, in her lane, on the road to the river. In the morning she would sweep, and she would draw water, and she would give the children their bread, because that is what one does, because the country does not know her name and therefore the country cannot come for her directly — only through her husband, her sons, her door. But tonight she sat in the dark, and she did not hope, and she did not pray, because hoping and praying were both noises and tonight she had learned the value of silence."
 cp_layla.60.a:0 "She sits in the dark until dawn."
 cp_layla.60.b:0 "She listens for hoofbeats. She begins, quietly, to calculate."


 # ----- Crossroads (cp_layla.70..) -----

 # cp_layla.70 -- "Cairo Is Calling" (migration crossroads)
 cp_layla.70.t:0 "Cairo Is Calling"
 cp_layla.70.d:0 "Word has come from a cousin who lives in the city. The mills are hiring. Ahmed's hands, the cousin writes, are the right hands. The pay is in coins, weekly. There is a room, small, in a building with many rooms."
 cp_layla.70.f:0 "She sits with Ahmed in the dark after the children have been put to bed. The lamp is low. The letter the cousin dictated to a friend's son sits on the low table between them. The son's handwriting is careful — he writes like a boy practising for an exam he hopes to pass. Ahmed has read the letter aloud to her twice. She has not asked him to read it a third time, because she does not want him to know she is trying to memorise it. The letter says: we can help. There is work. There is a room. She stares at the lamp. She stares at the letter. She thinks of her field, which is not theirs on paper, which may never be theirs on paper, which has fed her family and may not always. She thinks of the mill she saw once from the far bank of the canal, the one with the smoke, the one that vibrated the ground. She thinks of her mother's grave, and of Ahmed's mother's grave, and of the heron that stands in the irrigation channel, and of a room she has never seen, and of a city she has never seen, and of the sound — imagined — of children she has not yet had, speaking a kind of Arabic she does not yet know, in a kind of street she cannot picture. What do they decide?"
 cp_layla.70.a:0 "All of us go. We will learn the city. The family stays together."
 cp_layla.70.b:0 "Ahmed goes alone. I stay with the children. We will see each other when we can."
 cp_layla.70.c:0 "We stay. The field has been ours for generations. It will have to keep being ours."

 # cp_layla.71 -- "The Small Concern" (ownership crossroads)
 cp_layla.71.t:0 "The Small Concern"
 cp_layla.71.d.laborer:0 "A cousin-in-law has come by with a proposal written on two sheets of paper in careful handwriting. He needs a partner. The partner would own — on paper — half."
 cp_layla.71.d.machinist:0 "A foreman Ahmed respects has come by after the shift with a proposal on two sheets of paper. He has watched Ahmed on the machines for six years. He wants Ahmed as a partner in a small workshop he is buying out. The partner would own — on paper — half."
 cp_layla.71.d.clerk:0 "A senior clerk at the office has come by in the evening with a proposal written in the steady hand of a man who has written a great many contracts. He needs a partner who can read one. The partner would own — on paper — half."
 cp_layla.71.d.engineer:0 "A workshop owner has come by the flat with a proposal — specifications, drawings, and a column of numbers — and has laid them on the table the way a man lays down a hand of cards. He needs an engineer who is also, for once in his life, a partner. The partner would own — on paper — half."
 cp_layla.71.f.laborer:0 "She sits with Ahmed in the evening, at the small table. The cousin-in-law has been and gone. The two sheets of paper are between them. He is a steady man, the cousin-in-law — not a schemer. The workshop makes felt for hats. It has three looms and two women who come in for the day shift and go home at dusk. He needs capital. He has been refused by the bank, as he was always going to be refused, because his name is what it is. If they have saved — and they have, for four years now, in the pot behind the loose brick — they could be the capital. They would be, on paper, the owners of half. She thinks: I am the wife of a man who tends a machine for wages. She thinks: I have never owned a thing larger than a donkey. She thinks: if the felt business fails, the pot is empty, and we are back where we began, and we are older. She also thinks: if it does not fail, my daughter might go to school past the age her cousins went, and my son might be a man who signs his own name on a contract, and I might — in the time I have left — learn what it is to sit on the owner's side of a table."
 cp_layla.71.f.middle:0 "She sits with Ahmed in the evening, at the table they now have — the one with four matched chairs. The papers are between them. She reads the first sheet herself, slowly, because she can; the second sheet she asks Ahmed to read aloud, because the numbers on the second sheet are the kind that go wrong when you read them quietly. The workshop has six machines — or four looms and two presses, depending on what has happened in the last month — and a small yard behind it, and twelve employees on paper and fourteen in practice. The owner is a man with no sons. He wants a partner who understands the work and who can read the books. Ahmed, when he finishes the second sheet, does not say yes and does not say no. He is looking at her. She thinks: I am, tonight, being asked whether we should become a different kind of household. She thinks: we could afford to say no, and keep our Friday quiet, and grow old in this flat. She thinks: we could afford to say yes, and become a different kind of people, and learn the weight of it. She also thinks — a thing she has not said to Ahmed in all the years of their marriage — that her grandmother, who was a peasant in a village you have never heard of, would laugh at the question. Not unkindly. The way one laughs at a door one is about to walk through."
 cp_layla.71.a:0 "They invest. The pot comes out from behind the brick. They become the capital."
 cp_layla.71.b:0 "Ahmed takes a loan to match the savings. They bet on the partnership."
 cp_layla.71.c:0 "They refuse. The pot stays. They remain where they are."


 # ----- Mortality events (cp_layla.80..82) -----

 # cp_layla.80 -- "The Last Morning" (Layla dies)
 cp_layla.80.t:0 "The Last Morning"
 cp_layla.80.d:0 "The morning has the quality of a morning that does not require her to make it go. She lies on her bed and she listens to the first call to prayer and she does not get up."
 cp_layla.80.f:0 "A daughter — or a neighbour, or her younger sister who came after the last funeral and has not yet left — comes in with water. Layla says a small thing about the water. The daughter, or the neighbour, or the sister, says a small thing back, and goes out again, because the morning has the kind of sunlight in it that does not require speech. She thinks, unhurriedly, of the woman at the quern at nine years old. She thinks of the seventeen-year-old at the wedding. She thinks of the one who stood, once, in an imagined room in Cairo, with a sentence in her mouth, and who came back from that room without having been afraid. She thinks of Ahmed. She thinks of a heron in the irrigation channel whose particular stillness she has never, in all the years since, stopped being grateful for. The light on the wall is the light she has known. Outside, the day is beginning. She closes her eyes. The day will go on without her, the way days do, and the carpet in the imagined room will still be long, and somewhere another woman — younger, in a village Layla has never seen — is thinking of saying the sentence aloud for the first time. She trusts the sentence to her. She lets go. The light does not change."
 cp_layla.80.a:0 "#italic The morning continues.#!"

 # cp_layla.81 -- "The Foreman's Runner" (Ahmed dies at the mill)
 cp_layla.81.t:0 "The Foreman's Runner"
 cp_layla.81.d:0 "A boy from the mill has come up the three flights of stairs with a message he does not know how to deliver."
 cp_layla.81.f:0 "He knocks at the wrong door first. The neighbour sends him to hers. He stands in her doorway and he cannot get the first word out, and he does not need to. Before he speaks he clears his throat — twice — and she understands, in the worst possible way, that he has learned the gesture from Ahmed, the way apprentices learn the small tics of their masters without noticing that they have learned them. She has understood, from his throat and from his face, before she understood from his mouth. There was an accident, he says, eventually. The machine. The belt. The manager is very sorry. The manager has asked the boy to tell her that the manager is very sorry. The boy delivers the manager's regret as if it were a parcel and she is the cabinet in which the parcel is to be stored. He goes. She does not close the door. She stands in the doorway. She does not weep yet, because weeping would come later, and she wants first to be alone with this. Somewhere below, in a room she has never seen, her husband's body is being waited for by a physician who will write a death certificate with a category in it — workplace incident — and a number, and the number will be added to a column in a ledger in Cairo, and the column, in the following year, will be discussed or not discussed in a chamber Ahmed never entered. Above her head the lamp is not lit. It is still morning. She stands in the doorway. The manager is very sorry."
 cp_layla.81.a:0 "#italic She closes the door when she has decided to close the door.#!"

 # cp_layla.82 -- "The Child" (a child dies of illness)
 cp_layla.82.t:0 "The Child"
 cp_layla.82.d:0 "The fever came in from the lane two streets over and it moved, in the way these fevers move, from house to house and then into theirs. Tonight the fever is in the small body on the pallet, and the small body is thinner than it was this morning."
 cp_layla.82.f:0 "She has sat with the small body for two days. Ahmed is at the mill because the mill is where one is on the days it is not the Friday. A neighbour woman has sat with her for parts of both days, taking over when Layla's hands shake too badly to hold the cloth. Badr came in the afternoon yesterday. Badr had held this child — eight years ago, in this same room — on the night the child was born. Badr, in eighty years of holding, had held every small body in the lane at the beginning and, this week, at the end. Yesterday Badr looked at the small face and she did not say anything, which is what Badr says when there is nothing to say. Layla has boiled the herbs her mother boiled, and her mother's mother boiled, and she has held the small body against her chest, and she has sung — the first night, because singing was what she remembered; the second night, because singing had become the thing her hands did while her mind was doing something else. In the hour before dawn the small body stops being hot. It stops being hot, and then it stops being anything, and Layla — who is forty-two years old and who has held many small bodies in her life — understands this particular quiet and does not, at first, do anything about it. She holds on for a while longer. The morning call to prayer comes from the mosque four streets over. She lays the small body down. She folds the hands. She covers the face. She sits with her own hands in her lap. It is quiet. She has not yet told Ahmed. She will tell Ahmed when Ahmed comes home. Until then the child is hers alone, for one more hour, in the quiet before the lane wakes up."
 cp_layla.82.a:0 "#italic She sits with the child until Ahmed comes home.#!"


 # ----- Welfare (cp_layla.90) -----

 # cp_layla.90 -- "The First Envelope" (first welfare receipt)
 cp_layla.90.t:0 "The First Envelope"
 cp_layla.90.d.pension:0 "A clerk from the district office has come up the stairs on his Thursday rounds. He is carrying a list and a canvas satchel with envelopes in it. One of the envelopes, he says, has her name on it."
 cp_layla.90.d.subsidy:0 "Ahmed has come home from the mill tonight with his wage envelope — and a second, thinner envelope — which he lays on the table with the careful puzzlement of a man who has been asked to carry something he does not understand."
 cp_layla.90.d.poor:0 "The woman who comes to the lane on Tuesdays with bread for the women who have nothing has brought, today, a paper with a stamp on it — and a small coin tied in a cloth — and her name."
 cp_layla.90.f:0 "She has not, before today, been the person the country intended to hand a thing to. The country has handed things to men before — a uniform, a rifle, a ledger with a farm's name in it. The country has handed things, occasionally, through men — a bride-price, a tax receipt, a burial permit. Today the country is handing a thing directly to her. She takes the envelope, or the paper, or the coin tied in the cloth. She does not know what face to wear while doing this. Her mother never had this face to practise. Her grandmother had not imagined this expression would be needed. She tries a small polite nod. She tries a small stiff thank-you. She holds the envelope in both hands as if it might fly off. The clerk — or the subsidy officer, or the bread-woman — goes on to the next name. The next name on the list, Layla notices, is Umm Mariam, the widow across the lane whose field is next to theirs and whose name the country's clerks have always managed to write incorrectly. Layla does not turn her head to watch. She knows — from the pause that is a fraction too long — that Umm Mariam is not, this year, on the list. Something in her chest has shifted. She is not sure, yet, whether the shift is in the direction of gratitude or in the direction of quiet offence that the country had decided to send this envelope only now, and not in any of the years before."
 cp_layla.90.a:0 "She takes it with thanks. The country has, at last, seen her."
 cp_layla.90.b:0 "She takes it without thanks. The silence before the envelope does not un-happen."

 # cp_layla.91 -- "The New Law" (welfare tier up)
 cp_layla.91.t:0 "The New Law"
 cp_layla.91.d.pension:0 "They have passed a pension. Word came up the lane at midday. An old woman — nobody Layla knows — will receive, beginning next month, a sum of money from the country every Thursday until she dies."
 cp_layla.91.d.subsidies:0 "They have passed a subsidy. The foreman at Ahmed's mill announced it at the end of the shift, unwilling to meet the men's eyes as he did. The wages will be topped up. The country is paying."
 cp_layla.91.d.poor:0 "They have passed a relief law. The bread-woman in the lane will come now with paper and a stamp, not only with bread, and the paper will entitle the destitute households to a small fixed sum."
 cp_layla.91.d.default:0 "A new law has passed. Word has reached the lane that the country intends, from next month, to pay money directly to certain households it had not paid money to before."
 cp_layla.91.f:0 "She sits with the news on the threshold in the late light. She thinks of her mother, who died on a Friday because there was no physician and no money to fetch one. She thinks of the widow two lanes over whose children walked barefoot for three winters and who would, under this new law, not have walked barefoot. She thinks of her own household, and of whether this law will reach her, and of whether her gratitude — if it comes — will be clean gratitude or the complicated kind that has, underneath it, a quiet resentment that the law came now and not earlier. She does not know yet. She will have to wait to see it happen. Laws on paper are not the same as envelopes in the hand; she has lived long enough to know that."
 cp_layla.91.a:0 "She allows herself a small hope. The country, for once, has moved in the right direction."
 cp_layla.91.b:0 "She'll believe it when an envelope reaches her door."

 # cp_layla.92 -- "They Have Taken It Back" (welfare tier down)
 cp_layla.92.t:0 "They Have Taken It Back"
 cp_layla.92.d.none:0 "The welfare law has been repealed. No replacement. The news came up the lane in the evening and by the time it reached her door it had been told by four mouths, and every mouth had added something, and the something had always been worse than what came before."
 cp_layla.92.d.partial:0 "The welfare law has been rolled back. A smaller law replaces it — enough, still, for some; not enough for others. Which side of the line her household sits on, the lane will learn in the coming weeks, not today."
 cp_layla.92.f:0 "She stands in the doorway. She thinks of the envelope the country had, recently, taught her hand to hold — and of what it had been like, however brief, to be the person the country intended to hand a thing to. She thinks of her mother's grave, which is what she always thinks of when the country takes a thing back. She thinks of Umm Mariam across the lane, whose children had begun — under the law — to wear shoes, and whose children will, by next winter, be back in the old cloth. She thinks of the lane itself — which is, tonight, darker than it was last night, and which will be darker still by next week. A country's direction, she has learned, is a thing that can be reversed. It is a thing that HAS been reversed. She had, foolishly, allowed herself to think this one particular reversal would not come. She was wrong. She will not be wrong in the same way again. Something in her chest, tonight, becomes harder than it was this morning."
 cp_layla.92.a:0 "She turns. She finds the neighbour in the lane who organises. She asks when the next meeting is."
 cp_layla.92.b:0 "She closes the door. She keeps the thought to herself — for now."


