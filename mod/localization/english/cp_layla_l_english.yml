 # cp_layla.114 -- state_atheism: the muezzin is silenced
 cp_layla.114.t:0 "The Minaret's Silence"
 cp_layla.114.d:0 "It is a Friday. She has stood in the courtyard at this hour for forty years. The hour comes. The call does not."
 cp_layla.114.f:0 "She knows before she knows. She is at the stove; she has a handful of coriander; she has lifted her head, already, a second before the hour — because for forty years her head has lifted itself at that hour, without her consulting it, the way a mother's head lifts at the smallest cough from the next room. The hour arrives. The minaret does not. There is a moment in which she believes she has simply missed it, the way one misses the first peal of a bell if one is pouring water. There is another moment in which she believes the muezzin is ill. There is a third moment in which she believes — because she has, by now, read enough between the lines of the coffeehouse gossip — that the muezzin is not ill and has not missed anything, and that the silence is the new call. She sets the coriander down. She closes the door of the house. She goes to the back room where no window faces the street, and she lays the rug out, and she makes the prayer in the voice she has always made it in, which is a voice not louder than the voice one uses to speak to an infant who has just fallen asleep. When she is finished, her youngest is watching her from the doorway. She puts a finger to her lips. The child nods, serious as a judge. The child has learned, in one afternoon, a thing Layla had hoped no child of hers would ever need to learn."
 cp_layla.114.a:0 "#italic She prays behind the door. She teaches the children the finger-on-lips. It is a thing her grandmother knew; she had hoped it would skip her generation.#!"
 cp_layla.114.b:0 "#italic Let them come for the rug if they want the rug. She sets it by the window.#!"

 # cp_layla.115 -- freedom_of_conscience: the Coptic procession passes unremarked
 cp_layla.115.t:0 "The Procession Passes"
 cp_layla.115.d:0 "On the feast day the Copts carry their icon through the lane. No stones. No catcalls. Only the ordinary traffic of a market parting and re-forming around them."
 cp_layla.115.f:0 "She is at the vegetable cart. The procession turns the corner — the icon painted on a board, the priest in his black, two boys in white holding candles whose flames lean in the wind — and it crosses her path the way a camel train crosses a dry wadi, without anyone remarking on the water. No one throws. No one shouts. A boy she does not know offers the priest a date from his own pocket, and the priest — gravely, as a priest must — accepts, and puts the date in the fold of his cassock, and continues. She stands at the cart with her fingers on a cucumber, and she discovers, with a small shock that is not displeasure, that she has said §Iallahumma sallí ʿaleihum#! under her breath. She meant the Muslims walking by. She has, without noticing, said it for the priest as well. The cart-man watches her say it. He says nothing. He weighs her vegetables. He gives her the correct change."
 cp_layla.115.a:0 "#italic Under her breath, for all of them. God is large enough; there is no reason to be stingy with His grace.#!"
 cp_layla.115.b:0 "#italic She turns her face away — what the state permits is not what the lane permits — and buys the cucumber, and goes.#!"

 # cp_layla.116 -- right_of_assembly: the first demonstration
 cp_layla.116.t:0 "The Square Fills and Does Not Empty"
 cp_layla.116.d:0 "The square that empties by mid-afternoon does not, this afternoon, empty. She stands at her window and watches it not-empty."
 cp_layla.116.f:0 "There are perhaps two hundred of them. They have a cloth banner with writing on it she cannot, from this distance, read — she cannot, at any distance, read — and a man is standing on a cart speaking in the voice one uses to speak across open water. The thing that catches her — the thing that keeps her at the window for an hour when she should be at the stove — is not what he is saying, because she cannot, at this distance, make out the words. The thing that catches her is that the square does not empty. In every other year of her life, a crowd like this one would have emptied by now, because the hour the square empties is the hour the cavalry comes through. The cavalry does not, today, come through. She watches the square, and she watches the absence of the cavalry, and the two things together make her stand at the window for an hour with her hand on the frame, the way a child stands at the window watching the first rain of a season she has not been told to expect. Ahmed comes in behind her. He watches with her. He does not say anything. She does not turn around. After a while, the banner is lowered, and the crowd disperses on its own terms, at its own hour, and the cavalry, having decided not to, does not come."
 cp_layla.116.a:0 "#italic She steps back from the window. The house has dishes to wash. The state's new permissions are not, for her, the same as her own.#!"
 cp_layla.116.b:0 "#italic She stays at the window until the last banner is folded. Something in her has taken a note. She could not, tonight, say what.#!"

 # cp_layla.117 -- outlawed_dissent: the neighbour is taken for a letter
 cp_layla.117.t:0 "The Letter That Should Not Have Been Written"
 cp_layla.117.d:0 "Hajj Rashid's son — the boy who had, as a child, run barefoot for Layla's loaves every Friday — is taken in the night. The charge, because in the morning there is always a charge, is a letter he had written to a cousin in Alexandria. The letter had not, in her opinion, said anything."
 cp_layla.117.f:0 "She had read the letter. She had read it aloud to his mother — who could not — at the oven last month, because the boy had been proud of it and had wanted his mother to know what it said. The letter had been about wheat. The letter had been about the price of wheat, and the fact that the price had gone up, and the fact that this was — the boy had written — the government's doing. She had read it aloud in the low voice one uses to read a letter at an oven, which is a voice not louder than the voice one uses to say a prayer in a back room. That had, apparently, been loud enough. This morning, the mother is at the door of Layla's kitchen. She has not slept. She is holding a cup of flour in her hand, which is a thing one holds when one does not know what one is doing with one's hands. Layla boils water. She puts the flour away. She listens. The mother does not, at any point, cry. The mother simply describes — in the cadence of a woman making a list of errands — the men at the door, the number of them, the absence of a summons, the silence in which he was taken. Layla thinks of the square that, some years ago, filled with a crowd and did not empty when the cavalry did not come. The square was a few streets from this oven. She thinks of how briefly, in this country, a square can be permitted to fill. When the mother has finished describing it, Layla goes to her own drawer, where she had kept — because she had kept things, Layla, she had kept a letter or two over the years — and she takes the letters out, and she puts them in the stove, and she watches the stove until the letters are ash, and then she goes and sits with the mother, and she does not boil any more water, and neither of them speaks, and the morning passes in the way mornings pass when they are being endured rather than lived."
 cp_layla.117.a:0 "#italic She burns the letters she kept. She had not, until this morning, realised she was keeping them.#!"
 cp_layla.117.b:0 "#italic She keeps one. She puts it under the flour-tin, where no one will look. If they come, they come; if they do not come, she will have something of his to remember him by.#!"

 # =============================================================================
 # Slice V -- children's rights + policing law reactions (cp_layla.118..120)
 # =============================================================================

 # cp_layla.118 -- restricted_child_labor: the smallest leave the floor
 cp_layla.118.t:0 "The Children Leave the Floor"
 cp_layla.118.d:0 "The foreman comes into the row on Tuesday morning and tells the children younger than twelve to go home. The order has come down from Cairo. There is no appeal."
 cp_layla.118.f:0 "She is in the row that morning because she had brought her niece's lunch and had been caught by the bell — she is not a laborer herself, this morning; she is simply a woman with a bundle of bread standing at the door. From the door she sees it happen. The foreman is not unkind. He says the thing the Ministry has given him to say, which is that children under twelve are no longer permitted on the shop floor, and that the families will have to — he spreads his hands as men spread their hands when they are delivering news they themselves did not draft — adjust. The children look at each other. There are perhaps fifteen of them in the row, of the height Layla's own daughter was when Layla still thought of her as a child. One of them — a boy of ten, with a cloth round his head the way older boys wear it — asks, in a voice that does not, at first, shake: §Imaʿaleesh, but I have been here for two years. What am I to do now?#! The foreman does not answer. There is no answer the foreman can give. The boy walks past Layla at the door, and Layla — because she is holding a bundle of bread, and because he is ten years old, and because she had not planned to — breaks off a piece of the bread and gives it to him. He takes it without thanking her. He goes out into the street, into a morning that has, this week, become very large."
 cp_layla.118.a:0 "#italic Thanks be to God. A child's place is not in a row between two looms.#!"
 cp_layla.118.b:0 "#italic One wage less. The rent does not shrink because the law has grown a conscience. Something will have to give.#!"

 # cp_layla.119 -- dedicated_police: the station in the lane
 cp_layla.119.t:0 "The Station in the Lane"
 cp_layla.119.d:0 "A whitewashed building appears at the corner where the donkey-cart used to park. It has a blue lamp above the door. The lamp is — she is told by a neighbour — a thing she will come, in time, to read as a presence."
 cp_layla.119.f:0 "She does not know, the first time she passes it, what it is. She sees the paint — too fresh — and the lamp, and she sees a man in a new uniform standing with his hands clasped behind his back in the manner of a man who has been told to stand this way and has not, yet, decided whether the instruction flatters him. On her way back from the market she asks Hajj Rashid, who on feast days sells kunafa alongside the bread and who is therefore the man in this lane one asks about anything that has just arrived, what the new building is. He tells her. He tells her it is a §Imarkaz shurṭa#! and that the men inside are §Ishurṭa nizāmiyya#! — regular officers — and that if anything happens at all in the lane, they will, now, come. The word §Ianything#! is doing a very great deal of work in that sentence. Hajj Rashid is, she can tell, not sure whether the news is good or bad. He is simply, like the corporal, standing with his hands clasped behind his back. When she gets home she tells Ahmed. Ahmed says: §Iwell, if they come quickly when they come, that is one thing. And if they come quickly when they are not wanted — that is another.#! She agrees with both of Ahmed's halves. She places them on a shelf next to one another and waits, in the manner one waits for seasons, to see which half turns out to be the truer."
 cp_layla.119.a:0 "#italic She walks past with her head down. The blue lamp does not ask after her. Let it stay a building she does not know.#!"
 cp_layla.119.b:0 "#italic The corporal on duty is her cousin's cousin. She greets him by name. He gives her a nod. The station is a building she half-owns.#!"

 # cp_layla.120 -- militarized_police: rifles in the square
 cp_layla.120.t:0 "Rifles in the Square"
 cp_layla.120.d:0 "The officers now carry what the army carries. The pistol at the hip is a pistol; the rifle on the shoulder is a rifle. The lane understands the new arithmetic without being told."
 cp_layla.120.f:0 "She sees them first on a Thursday. The two men stationed at the edge of the square are wearing the old uniform, the dark blue with the braid — and then she notices, because her eye has been trained by forty years of watching men stand in squares, that the thing on each man's shoulder is not the truncheon of a policeman. It is a rifle. It is the rifle she has seen, in her life, only on soldiers' shoulders, and the soldiers' shoulders had been, in every previous instance, on the way somewhere else — on their way to the border, on their way to the depot, on their way to a ship. These shoulders, on these men, are on their way nowhere. These shoulders are remaining in the square. The square, she thinks, before she has corrected herself out of the thought, does not need a rifle. The square is a place where onions are weighed. It is also — because she remembers, because the square is a small memory of itself — the square that had once, in some year she is now allowed to call distant, filled with two hundred people and a banner she could not read, and the cavalry had not come. The cavalry is, tonight, standing against the wall of the kunafa-seller's shop, and the cavalry has, tonight, a rifle on its shoulder. She walks past the two men with her eyes on the path, and she notices that her shoulders have made themselves, without being asked, small. She keeps her shoulders small until she has turned the corner. Around the corner she stops, sets down her basket, and finds that her hands are shaking. She had not, at her age, expected her hands to shake in a square where she has been weighing onions for forty years. She puts the basket back on her hip. She goes home."
 cp_layla.120.a:0 "#italic She takes the long way around the square. It adds ten minutes. She adds ten minutes.#!"
 cp_layla.120.b:0 "#italic She meets the corporal's eyes. She does not look away. Let him remember her face. One day, when the rifles have gone, he will remember that she was there before them.#!"

 # =============================================================================
 # Slice W -- migration + economic system reactions (cp_layla.121..124)
 # =============================================================================

 # cp_layla.121 -- no_migration_controls: strangers in the lane
 cp_layla.121.t:0 "Strangers in the Lane"
 cp_layla.121.d:0 "The lane acquires faces it did not have last year. Aleppine coffee-makers, Greek carpenters, a family from Mount Lebanon whose boys help in the dusty courtyard for a handful of copper each afternoon."
 cp_layla.121.f:0 "It begins — she will remember later — with the smell. Somebody, the first week, is roasting coffee in a way she has not smelled before; the beans are darker than what the villages around her are used to, and the grind is slower, and the aroma is a shade wetter in the air, and she follows it, in the manner of a cat, halfway down the lane before she realises that she has been following it. At the end of the lane there is a man she does not know, setting up a brass pot on a new brick, saying §Imarhabā#! to her with an accent she cannot, at first, place. Within a month there is a second household: a Greek carpenter and his two sons, who have taken the room above the bakery and made it smell of pine. Within two months, the lane is, in a way she had not, at her age, expected ever to witness, a different country. Not a larger country, exactly. A country made of more small pieces. The Syrian boys' mother sends Layla a jar of mahshi the first Ramadan; Layla sends back a plate of her mother's bamya. It is a small exchange. It is the first exchange of its kind she has made in her life. When she carries the plate across the lane she notices — she cannot help noticing — that her own hands are slightly shaking, the way a girl's hands shake on a first errand, because she has not, in forty years, crossed a lane with a plate toward a door whose occupants she does not, in some deep village sense, already know."
 cp_layla.121.a:0 "#italic She sends back the plate of bamya. The lane is larger than it was. She is — by one plate of bamya — larger too.#!"
 cp_layla.121.b:0 "#italic The lane has stopped being her lane. She keeps the door closed a beat longer on Fridays now, when she does not recognise the prayer coming from the next house.#!"

 # cp_layla.122 -- closed_borders: the cousin in Beirut cannot come
 cp_layla.122.t:0 "The Gate Closes"
 cp_layla.122.d:0 "The cousin who had written that she would travel in spring — for the wedding, to hold the baby, to finally meet the husband — writes again. She will not be coming. No one, this year, is travelling."
 cp_layla.122.f:0 "The letter arrives on a Thursday. It is short. It is not, in the way letters from that cousin usually are, decorated with news of her own children, or of the garden, or of the long complaint about the brother-in-law. It is five sentences. It says: the border is, as Layla will have heard, closed. It says: there is a new §Itaṣrīḥ#! — a permit — required to travel, and the cousin has not been able to obtain one, and will not be able to obtain one this year, and perhaps — she writes, in the sentence that is the worst sentence of the letter — not next year either. It says: please kiss the baby for me. It says: I am, still, your cousin, and I still love you. It does not say goodbye. Layla reads the letter twice. She sets it on the table. She does not, at first, cry. She simply sits with the letter on the table in front of her, and she looks at it, and she thinks: I have had a cousin in Beirut all my life. I will have, she thinks, a cousin in Beirut at the end of my life. Between those two facts, for the next span of years — for the span of years which is, she realises, the remainder of the span — I will not see her face."
 cp_layla.122.a:0 "#italic She folds the letter into the smallest square. She puts it in the drawer with the child's photograph. It goes into the category of things one has but does not use.#!"
 cp_layla.122.b:0 "#italic Quietly — she will not say it to anyone, not to Ahmed, not to her daughter — she is relieved. The lane is, once again, only the lane.#!"

 # cp_layla.123 -- laissez_faire: the market eats the village
 cp_layla.123.t:0 "The Market Eats the Village"
 cp_layla.123.d:0 "In the spring a foreign company plants a sign in the field across the canal. By summer the sign has a fence; by autumn the field has a railway siding; by winter the village is a suburb of a factory it does not, in its own name, own."
 cp_layla.123.f:0 "She does not, at first, know what the sign means. It is in French. Nūr — her literate daughter, who is, by now, the household's translator of signs — reads it for her: §ICompagnie Sucre et Engrais de la Basse-Égypte, S.A.#! Layla does not know what §IS.A.#! means. Nūr does not know either. They agree, as a household, to assume it is the name of an honoured man — §ISa.A., peace be upon him#! — because that is the manner of interpretation most consoling to them. The man, whoever he is, moves quickly. By the summer there is a fence around the field. By the autumn there is a siding for railway cars. By the winter there is a steam-whistle that goes off at dawn, and at noon, and at the end of the working day, and the rhythm of the village — which had been, for forty years, the rhythm of the muezzin and the rhythm of the ox — becomes, imperceptibly and then all at once, the rhythm of a whistle. Layla's stall does, in point of fact, sell more cucumbers this year than last. Some of the new customers are men in work-coats who come out through the factory's gate at noon with a half-hour to eat. They pay in coins newer than the coins she is used to, and some of them are polite, and some of them are not, and she — she, Layla, at her age — notices that she has stopped charging the rude ones less than the polite ones, which is a small moral adjustment she would not, at thirty, have believed herself capable of making. At night, though, when the whistle has finally stopped, she sits in the courtyard and listens to an absence that had not been an absence until the whistle made it one. The ox is not — she knows, she has counted — less happy. But the ox is, she thinks, outnumbered."
 cp_layla.123.a:0 "#italic The whistle has arrived and will not leave. The village is smaller than it was yesterday, by the weight of one whistle.#!"
 cp_layla.123.b:0 "#italic More coins come through the stall than last spring. She counts them into the tin. Some of the moral adjustments one makes at her age are, she thinks, adjustments a village should have allowed her at thirty.#!"

 # cp_layla.124 -- command_economy: the ministry comes for the stall
 cp_layla.124.t:0 "The Ministry Comes for the Stall"
 cp_layla.124.d:0 "A man in a grey suit, with a clipboard, explains that the stall is now part of the §Iittiḥād al-mawādd al-ghidhāʾiyya#! — the cooperative for foodstuffs. She will continue to sell. The tin will not continue to be hers."
 cp_layla.124.f:0 "He is polite. He is, she notices, not from the village. He addresses her as §Irafīqa#! — comrade — which is, in her lifetime, the first time she has been so addressed. He produces the papers. He reads the papers aloud to her, which she appreciates, although she could have read them herself — she chooses, tonight, not to tell him this — and he explains that the stall will continue. The cucumbers she sells will continue to be her cucumbers. The customers she greets will continue to be her customers. The coins, however, will, at the end of each day, be counted and taken by the cooperative's clerk — a young man she has known since he was a boy, and whose mother she had, once, helped with bread during a bad winter. The coins will go into a pool. The pool will be redistributed according to need. She will, in return, receive a §Imurattab thābit#! — a fixed stipend — which is, the man with the clipboard says, a higher and more reliable sum than the average of her last three years' takings. He gives her the figure. The figure is, indeed, higher. She signs the papers. She has not, before tonight, signed a paper in her life; the papers until now have been signed by Ahmed or by a thumbprint or by an X. She signs her name. She signs it in the Arabic letters Nūr taught her, three winters ago, on a piece of slate. The man with the clipboard looks at the signature. He says — with no trace of condescension — §Iallāh, Hajja, what a beautiful hand.#! She does not — tonight, at least — correct him. Her hand, in fact, is not beautiful. But it is, this evening, her own, and it has just signed away the thing she had thought she owned, in exchange for the thing she is told is better, and she does not, tonight, know which of the two she will find in the tin-box tomorrow."
 cp_layla.124.a:0 "#italic She signs. The stipend is, arithmetically, more. She will see whether a more arithmetic wage feels like a wage.#!"
 cp_layla.124.b:0 "#italic She does not sign. She closes the stall. Let the clerk come back tomorrow and find a shuttered door. The tin, at least, will be hers.#!"

