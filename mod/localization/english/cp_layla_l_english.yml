l_english:
 # Names
 cp_name_layla:0 "Layla"
 cp_name_alsharif:0 "al-Sharif"
 cp_name_ahmed:0 "Ahmed"

 # ----- Journal entry: cp_je_layla -----
 cp_je_layla:0 "Layla al-Sharif"
 cp_je_layla_reason:0 "#b age#! #v [Country.MakeScope.Var('cp_age').GetValue|D]#!  ·  #b SoL#! #v [Country.MakeScope.Var('cp_sol').GetValue|D]#!  ·  #b literacy#! #v [Country.MakeScope.Var('cp_literacy').GetValue|D]#!  ·  #b hope#! #v [Country.MakeScope.Var('cp_hope').GetValue|D]#!  ·  #b radical#! #v [Country.MakeScope.Var('cp_radical').GetValue|D]#!  ·  #b loyal#! #v [Country.MakeScope.Var('cp_loyalist').GetValue|D]#!\n\n[ROOT.GetCustom('cp_layla_housing_desc')]\n\n[ROOT.GetCustom('cp_layla_possessions_desc')]\n\n[ROOT.GetCustom('cp_layla_routine_desc')]\n\n[ROOT.GetCustom('cp_layla_savings_desc')]"

 # ----- Events -----

 # cp_layla.1 -- "The Farmer's Daughter" (intro)
 cp_layla.1.t:0 "The Farmer's Daughter"
 cp_layla.1.d:0 "She is awake before the muezzin. She has been awake before the muezzin every morning of her adult life."
 cp_layla.1.f:0 "Her name is Layla al-Sharif and she is twenty-two years old. She would like, if anyone ever asked her — and no one ever has — a roof that does not leak when the flood comes, children who live past the first year, and a slip of paper with her name written on it saying this patch of earth belongs to her. The bey says the earth belongs to the bey. The bey says many things. The sky begins to turn the color of the inside of a pomegranate. She has not asked, in any voice anyone could hear, to be seen. But somewhere, in a small private way she will never know about, she is being seen now."
 cp_layla.1.a:0 "Watch her."

 # cp_layla.2 -- "The Deed" (homesteading granted)
 cp_layla.2.t:0 "The Deed"
 cp_layla.2.d:0 "She holds it. She has waited her whole life to hold it. Her grandmothers waited too."
 cp_layla.2.f:0 "The wax is still warm where the seal pressed it. It is the color of dried blood and it carries her name. Her name. Layla bint Mohamed al-Sharif, of Lower Egypt, on a paper that the law says cannot be taken from her. She stands in the middle of the field and her hands will not stop shaking and the field — green, hers, hers — keeps blurring at the edges. She does not weep. She has not wept for anything before, not the babies she has lost or the brother who never came back, and she will not weep now. But the field will not stop blurring. Somewhere, in a village she will never visit, a man with a name like hers walks past with a paper of his own, and he is also not weeping. The sun is high. The wax is warm. The earth is hers."
 cp_layla.2.a:0 "She holds it carefully."

 # cp_layla.3 -- "The Bey Returns" (serfdom restored)
 cp_layla.3.t:0 "The Bey Returns"
 cp_layla.3.d:0 "He came back today. The law brought him back."
 cp_layla.3.f:0 "She knew before she saw him. The doors of the lane were already shut and the dogs had stopped barking and the boys who play in the dust had been called inside. Then the dust rose at the village edge — the wrong kind of dust, the dust that means horses — and she put her back against the wall and she put her hand on Ahmed's wrist and she did not look up. She has spent her whole life being good at not looking up. There are things one learns in this country that one does not unlearn. The deed is folded in her chest, against the bone, and the deed does not matter today. The bey rides through the lane. He does not need to look at her. He knows she is there. He has always known she was there."
 cp_layla.3.a:0 "She does not look up."

 # cp_layla.4 -- "He Marches" (Ahmed conscripted)
 cp_layla.4.t:0 "He Marches"
 cp_layla.4.d:0 "He left at dawn. He looked back once. War is a thing that, in this country, happens to other people's husbands until one day it does not."
 cp_layla.4.f:0 "He carried a small bundle and a piece of bread wrapped in cloth, and he wore his grey gallabiya because there was no uniform yet — they would give him one in Cairo, or perhaps later, or perhaps never. The other men of the village walked beside him. None of them spoke. She stood at the wall with the other women and she did not lift her hand and she did not call his name, and when the column turned at the bend in the road she watched the dust settle for a long time before she walked back to the house. The house was quiet in a new way. The way a house is quiet when it has begun to understand what it might become. Somewhere, in a city she has never seen, a clerk is writing his name in a ledger no one in this village will ever read."
 cp_layla.4.a:0 "She watches until the column turns."

 # cp_layla.5 -- "The First Cry" (childbirth, mother survives)
 cp_layla.5.t:0 "The First Cry"
 cp_layla.5.d:0 "She lived. The child lived. In this country, in this year, that is two miracles in the same hour."
 cp_layla.5.f:0 "The lamp guttered. She held the small wet weight of him and she did not feel what they had told her she would feel. Her mother had said: you will know him at once, you will feel a love that has no end. She felt instead a slow surprise — a kind of disbelief that her own breath was still moving in her own chest. The midwife dried her hands in the shadow at the foot of the bed. Ahmed, kneeling, would not look at the baby; he would not stop looking at her. She thought, with a clarity that frightened her: I am still here. I am still here, and there is a person in my arms now who needs me to stay. The lamp guttered again. She let it burn."
 cp_layla.5.a:0 "She lets the lamp burn."

 # ----- JE: monthly status, check-on button -----

 # Status variants: three lines each (thinking / doing / hoping). The JE's
 # first_valid block picks one per month based on her life situation and
 # cp_mood_roll (rerolled by on_monthly_pulse, range 1-10; low <=3, high >=7).

 # --- Ahmed at war ---
 cp_je_layla_status_war_high:0 "She is thinking about the letter the postman will bring this month. She is sure of it today.\nShe is kneading dough for two loaves instead of one, because she has decided to believe he is coming home.\nShe is hoping the war will end before the next flood, and she is permitting herself, today, a small hope."
 cp_je_layla_status_war_mid:0 "She is thinking about Ahmed's bread-bowl, which she has not moved from its place.\nShe is grinding dhurra that she used to grind with him kneeling beside her, and the grinding is slower now.\nShe is hoping no official with a clipboard rides into the village this month."
 cp_je_layla_status_war_low:0 "She is thinking about the shaving-water he left in its clay jar. It has gone green. She has not emptied it.\nShe is sweeping a floor that is already swept, because sitting still is the worst of the hours.\nShe is hoping, in the quietest part of her, only to know. Either way. Only to know."

 # --- Under the restored serfdom ---
 cp_je_layla_status_serfdom_high:0 "She is thinking about the deed folded in a pot behind a loose brick, which the bey does not know about.\nShe is plaiting a palm-frond basket in the doorway as the overseer passes, and she has not looked up.\nShe is hoping the laws will turn again — they have turned before — and she means to be alive when they do."
 cp_je_layla_status_serfdom_mid:0 "She is thinking about which of the neighbour women will weep first at the harvest. One of them always does.\nShe is carrying water from the canal. Her back is sore in the old place and also in a new place.\nShe is hoping the yield stretches past the bey's portion — barely — and leaves a handful of grain for her own pot."
 cp_je_layla_status_serfdom_low:0 "She is thinking about her grandmother, who lived under a bey and died under a bey, and is free of beys now.\nShe is doing what she is told, in the order she is told, without looking up. It is an old discipline, and her body remembers it.\nShe is hoping, carefully, not to hope. Hoping is a thing she has learned to ration."

 # --- She owns the field ---
 cp_je_layla_status_homesteader_high:0 "She is thinking about the heron that stands in her irrigation channel, and which belongs, in some way, to the field, and therefore to her.\nShe is walking the border stones in the order she walks them every morning — north, east, south, the crooked one by the canal.\nShe is hoping for a second donkey, and a small school for her children if they live, and she is letting herself say both out loud."
 cp_je_layla_status_homesteader_mid:0 "She is thinking about the word \"mine\", which still does not sit correctly in her mouth, but which she is beginning to say.\nShe is checking the dhurra at the north corner, where the soil is thinnest, and judging whether to bring manure this week or next.\nShe is hoping the flood is kind this year — not too shy, not too fierce — and that the palm-frond roof will hold."
 cp_je_layla_status_homesteader_low:0 "She is thinking about the paper folded against her chest, and whether she has checked it enough times today. She has not.\nShe is inspecting the seam of the wedding chest where the wood has cracked, because she has not yet told Ahmed about the crack.\nShe is hoping nothing will come and take this from her. It is not a specific fear; it is every fear, compressed."

 # --- Default: tenant's wife ---
 cp_je_layla_status_tenant_high:0 "She is thinking about the small silver coin under the loose brick, which is closer to a copper pot than it was last month.\nShe is putting a mint leaf in her tea because the plant on the window-ledge has thickened out, and today she is allowed to.\nShe is hoping the merchant in town gives her a fair price for the surplus onions. It does happen, sometimes."
 cp_je_layla_status_tenant_high_alt:0 "She is thinking about the small shoots of mint that have come back on the window-ledge, thicker this year than last.\nShe is grinding a little more dhurra than she needs, because the week will stretch, and it is good to have a second loaf just in case.\nShe is hoping the next two weeks stay as quiet as this one. Two quiet weeks in a row is a luxury she has forgotten to expect."
 cp_je_layla_status_tenant_high_alt2:0 "She is thinking about Ahmed's small laugh last night at something one of the children said — she has not heard the laugh in some months.\nShe is rolling out dough a little thinner than usual, which is a thing one only does on a morning that has room for it.\nShe is hoping, tentatively, for a cool evening and the bread to come out right and the donkey not to bray before dawn."
 cp_je_layla_status_tenant_mid:0 "She is thinking about whether the beans will stretch to Friday, and how long the sack has been thinning for.\nShe is kneading dough on the flat stone, and the stone is warm from the sun.\nShe is hoping the hen that has stopped laying has only stopped for a little while."
 cp_je_layla_status_tenant_mid_alt:0 "She is thinking about Fatma's youngest, who has been coughing for three days, and about whether three days is too long not to fetch the midwife.\nShe is winnowing the dhurra on the flat stone, the dust rising in a slanted beam of morning sun.\nShe is hoping the cough passes on its own. In this village, most of them do, and a few of them do not."
 cp_je_layla_status_tenant_mid_alt2:0 "She is thinking about the mud-brick along the eastern wall, which has begun to crumble where the neighbour's goat rubs against it.\nShe is carrying water from the canal in the smaller jar today, because her right shoulder has been aching in the old place.\nShe is hoping Ahmed has time on Friday to look at the wall before the first rain, which is always earlier than expected."
 cp_je_layla_status_tenant_low:0 "She is thinking about the two babies she lost, and the day each of them would have been born if they had waited to be born.\nShe is sweeping the packed-earth floor in the pattern Ahmed's mother used to sweep it, because the pattern is what the floor wants.\nShe is hoping, only, for a quiet day. A day with nothing in it is a kind of mercy in this village."
 cp_je_layla_status_tenant_low_alt:0 "She is thinking about her younger brother Kareem, whom she has not heard from in eight months — and about the cousin-of-a-cousin who was the last thread she had to him.\nShe is sweeping very slowly today, because the sweeping is the one thing that keeps her hands from shaking.\nShe is hoping, without quite believing it, that Thursday's post-cart carries something for her."
 cp_je_layla_status_tenant_low_alt2:0 "She is thinking about her mother, who died on a day exactly like this one — no wind, the same flat light in the courtyard, the same particular smell of dust.\nShe is doing nothing in particular, and the nothing is not helping.\nShe is hoping only for the afternoon call to prayer to come sooner than it usually does."

 # --- Homesteader: alternate variants ---
 cp_je_layla_status_homesteader_high_alt:0 "She is thinking about the north corner of the field, where the soil has come up darker this spring than it did last spring.\nShe is walking the edge with her sandals off, which is a thing she has not done since girlhood.\nShe is hoping the good years have some depth to them — that they are not only a surface."
 cp_je_layla_status_homesteader_high_alt2:0 "She is thinking about the word §Iours§!, which is plural, and which she has begun to use without rehearsing it first.\nShe is carrying an armful of dhurra stalks toward the threshing floor and she is not counting them as she carries them.\nShe is hoping the youngest, when he is grown, does not remember the year before the deed, and that he takes the field for granted the way free men do."
 cp_je_layla_status_homesteader_mid_alt:0 "She is thinking about the border stones in the south corner, which have moved slightly this season — by whose hand, she does not yet know.\nShe is marking each of the four corners in the morning, the way her grandfather once marked corners she never saw him mark.\nShe is hoping no one at the village council tries to say the stones have moved in the wrong direction."
 cp_je_layla_status_homesteader_mid_alt2:0 "She is thinking about the plough, whose handle split last week, and whether the carpenter can mend it for another season or two.\nShe is oiling the handle of the scythe she has been using for four years, firmly, the way Ahmed's father taught her.\nShe is hoping the wheat stays thick across the whole harvest, not only the first week of it."
 cp_je_layla_status_homesteader_low_alt:0 "She is thinking about the deed, folded in the chest, and whether she has taken it out too many times today. She has.\nShe is inspecting the palm-frond roof where the north edge has begun to leak again, and calculating whether it can wait one more month.\nShe is hoping the landowners in the next village, who have begun riding through at odd hours, are not coming to this village soon."
 cp_je_layla_status_homesteader_low_alt2:0 "She is thinking about the baby they lost in the spring, whose name she does not say aloud, not even to Ahmed.\nShe is standing in the doorway watching the heron in the irrigation channel, who stands in the particular stillness that herons stand in.\nShe is hoping, in a small private way, that the second baby comes."

 # --- Serfdom restored: alternate variants ---
 cp_je_layla_status_serfdom_high_alt:0 "She is thinking about the thinness of the bey's voice lately, and the way the overseer's right hand has begun to shake in the morning.\nShe is plaiting palm-fronds in the corner of the courtyard where she can watch the lane without appearing to watch it.\nShe is hoping the laws turn again — they have turned before — and she means to be alive when they do."
 cp_je_layla_status_serfdom_high_alt2:0 "She is thinking about her grandmother's brother, who died under a bey, and her grandmother's grandson, who might not have to.\nShe is carrying water from the canal at the pace she has carried it all her life — steady, unhurried, not looking at the overseer.\nShe is hoping the next generation does not have to learn the particular silence that she has learned."
 cp_je_layla_status_serfdom_mid_alt:0 "She is thinking about Fatma, who said something yesterday in the lane that was almost political, and about whether Fatma knows she said it.\nShe is sweeping the courtyard slowly, because sweeping is what one does when the overseer has passed in the last hour.\nShe is hoping the words Fatma said do not reach the wrong ears before the week is out."
 cp_je_layla_status_serfdom_mid_alt2:0 "She is thinking about the old women at the market, who have started speaking more quietly even among themselves.\nShe is buying onions from the merchant who does not ask questions, because there are merchants now, she has noticed, who do.\nShe is hoping nothing changes in the next fortnight, which is all the time she can plan for."
 cp_je_layla_status_serfdom_low_alt:0 "She is thinking about the boy from the next village, who was taken last month for something he did not do — and whose father has not been seen since.\nShe is grinding dhurra in the corner of the courtyard where the wall is thickest, the way her mother would have in a year like this one.\nShe is hoping the law's hand reaches past this village in some direction before it reaches this village."
 cp_je_layla_status_serfdom_low_alt2:0 "She is thinking about the taste of grain with fear in it, which is a taste she had forgotten she could recognise.\nShe is doing what she is told, in the order she is told, without looking up — an old discipline, and her body remembers it.\nShe is hoping, carefully, not to hope. Hoping is a thing she has rationed before, and she has been rationing it again."

 # --- Ahmed at war: alternate variants ---
 cp_je_layla_status_war_high_alt:0 "She is thinking about the three men from the village two miles east who came home last week — it is not nothing.\nShe is kneading dough for two loaves instead of one, because she has decided, for today, to believe.\nShe is hoping Thursday's post-cart has a letter with his name on it, or the Thursday after, or the one after that."
 cp_je_layla_status_war_high_alt2:0 "She is thinking about the morning he left, which was a morning like this one in the weather but in no other way at all.\nShe is grinding the dhurra finer than usual, because it was him who used to grind the coarse grain.\nShe is hoping, with some discipline, that this war is shorter than her mother's was."
 cp_je_layla_status_war_mid_alt:0 "She is thinking about the bread-bowl, which she has not moved from the shelf where he set it the morning he left.\nShe is pouring a second cup of tea that she does not drink, because pouring two has become a habit she has not broken.\nShe is hoping the army pays when it says it pays, and that the payment reaches this village this month."
 cp_je_layla_status_war_mid_alt2:0 "She is thinking about the list she keeps in her head — his height, the way he laughed, the small scar above his left eye — which she is refreshing daily so that she does not lose it.\nShe is plaiting a small rug in the evenings because her hands want something to do after dark.\nShe is hoping the weather wherever he is, in the mountains or elsewhere, is kinder than the weather here."
 cp_je_layla_status_war_low_alt:0 "She is thinking about the government clerk somewhere who might be writing his name into a ledger nobody in this village will ever read.\nShe is carrying water she does not need to carry, because sitting still is worse than carrying water.\nShe is hoping the post-cart does not stop at this house, and she is hoping it does."
 cp_je_layla_status_war_low_alt2:0 "She is thinking about the shaving-water he left in the clay jar by the door, which has gone green again. She still has not emptied it.\nShe is sweeping the doorway a third time today. The doorway has been swept, and swept, and swept.\nShe is hoping, in the quietest part of her, only for clarity. Either direction."

 # scripted_progress_bar keys (still defined in common/ for future reuse)
 cp_layla_life_bar:0 "Her Life"
 cp_layla_life_bar_desc:0 "Months lived."
 cp_layla_life_bar_tick:0 "+1"

 # scripted_button: check on Layla
 cp_layla_check_button_name:0 "Check on Layla"
 cp_layla_check_button_desc:0 "Look in on her for a moment, at whatever she happens to be doing. No decisions, no mechanics — only a witness, for a moment, to a life."

 # cp_layla.6 -- reflection event (orphan; reachable via console only now)
 cp_layla.6.t:0 "A Moment"
 cp_layla.6.d:0 "She is doing, at this moment, what she has done every day of her life. She is also, underneath that, doing something else."
 cp_layla.6.f:0 "She crouches by the clay oven in the courtyard, turning a small piece of aish baladi with the edge of her hand because the long stick is cracked and she has not yet replaced it. The sun is behind a cloud. A neighbour's boy is crying in the lane and his mother is not answering. Somewhere, in a shaded corner of her attention, she is thinking about her mother — the way her mother would reach for a piece of bread with her left hand because her right hand was always busy doing something more important, and how she has begun, without noticing, to reach for her own bread with her left hand too. It is not a large thing to notice. Most of what there is to notice about a life is not large."
 cp_layla.6.a:0 "Let her be."

 # ----- "Check on Layla" dispatch pool (cp_layla.10 - cp_layla.15) -----

 # cp_layla.10 -- "The Letter That Has Not Come" (Ahmed at war)
 cp_layla.10.t:0 "The Letter That Has Not Come"
 cp_layla.10.d:0 "The post-cart passes through the village once a month. She does not go out to it. That would tell the village she is waiting, and the village already knows."
 cp_layla.10.f:0 "Her hand is flat on the doorframe. She is counting: the hoof-beats, then the wheels, then the diminishing sound of them moving on without stopping. The postman has not called her name in four months. Her mother-in-law — widowed at nineteen — tells her this means nothing; letters are slow, armies are slower, men who go quiet are not always the men who have died. Layla nods. Her mother-in-law is right, or she is not right, and either way the nodding is what one does. The clay jar of Ahmed's shaving-water is where he left it. The water has gone green; a skin has formed on the top of it. She has not emptied the jar. There will be time to empty the jar. There will be time for a great many small things, once there is news."
 cp_layla.10.a:0 "She waits for the next cart."

 # cp_layla.11 -- "Walking the Field She Owns" (homesteader)
 cp_layla.11.t:0 "Walking the Field She Owns"
 cp_layla.11.d:0 "She walks the edge before the sun is high. Hers. The word still does not sit correctly in her mouth."
 cp_layla.11.f:0 "She has begun, without meaning to, to walk the border stones in the same order each morning — the north corner, the east corner, the south corner, the little crooked one by the canal — as if the walking of it is what keeps the field from leaving. The dhurra is coming up green and strong, and a little early this year. A heron stands one-legged in the irrigation channel and does not look at her; the heron is a creature she has begun to feel a private fondness for, in the way that one feels a fondness for a neighbour who has chosen not to pry. Ahmed is still asleep in the house. She has not told him how early she rises now. He would worry, and she would have to explain something she does not yet know how to explain to herself."
 cp_layla.11.a:0 "She walks the four corners."

 # cp_layla.12 -- "Under the Bey's Eye" (serfdom restored)
 cp_layla.12.t:0 "Under the Bey's Eye"
 cp_layla.12.d:0 "The bey's overseer passes twice a day now. Once in the morning, once in the evening. Both times with a list."
 cp_layla.12.f:0 "She does not look at the list and she does not look at him. She has learned, as all the women of the village have learned, to stand in a particular way while he is passing: the shoulders a little forward, the eyes on a fixed point at her own feet, the hands busy with something that cannot be interrupted. The something today is a basket she is plaiting from palm-fronds. The basket does not need to be plaited today. She plaits it anyway, because stopping would be to notice him, and to notice him is to be noticed back. The deed is folded in a clay pot behind a loose brick, and the brick is behind a sack of dhurra. She has not touched the brick in four months. Some things must be protected by being forgotten about, publicly, for a long time."
 cp_layla.12.a:0 "She plaits until the sound of him fades."

 # cp_layla.13 -- "A Day With No Wind" (always available)
 cp_layla.13.t:0 "A Day With No Wind"
 cp_layla.13.d:0 "The air is heavy this morning. No wind from the Nile, no wind from the desert. The palm-frond roof does not creak."
 cp_layla.13.f:0 "A day with no wind is a day when the prayers go straight up, her grandmother used to say. Layla is not certain her grandmother believed it. She is not certain she believes it either. But she finds that she is praying, quietly, while she grinds the dhurra — not for anything in particular, not for rain and not against drought, not for a child and not against losing a child. She is praying only that whoever is listening today would listen a little longer. The hens are quiet in the courtyard. A neighbour's cat walks the top of the mud wall in a thoughtful way. The dust that has risen this morning will not settle until the afternoon. There will be dust on the bread if she is not careful. She is careful."
 cp_layla.13.a:0 "She grinds, quietly."

 # cp_layla.14 -- "The Neighbour's Boy in the Lane" (always available)
 cp_layla.14.t:0 "The Neighbour's Boy in the Lane"
 cp_layla.14.d:0 "The neighbour's boy is crying in the lane again. His mother is at the well."
 cp_layla.14.f:0 "His grandmother died in the winter and there is no one in the house to pick him up. Layla listens for a long moment with her hands in the dough. The crying is the kind that is not about anything and will pass; the mother — Fatma, six months older than Layla, with the new baby who almost did not live — will be back in a quarter-hour. Layla does not go out. She knows that if Fatma returns and finds another woman holding her son, it will be a wound that does not heal the right way. But she leaves the dough and steps into the doorway, so that the boy, if he turns his head, will see that there is a face. Sometimes being seen is enough. He turns his head. She lifts her chin. He keeps crying; but he keeps crying at her, now, instead of at nothing."
 cp_layla.14.a:0 "She stays in the doorway."

 # ----- Customizable-localization variants for cp_je_layla_reason -----
 # See mod/common/customizable_localization/cp_custom_loc.txt for the
 # branching logic. Each block below is referenced by exactly one branch.

 # Housing
 cp_layla_housing_tenant_default:0 "She lives in a single-room mud-brick house at the edge of a village on the Nile in the Delta. She has never left the Delta. She has never seen Cairo. The house has one window covered with a wooden lattice, a packed-earth floor that Ahmed's mother swept every morning for thirty years until she did not wake up, and a palm-frond roof that leaks along the north edge when the flood comes."
 cp_layla_housing_serf_restored:0 "She lives in the same single-room mud-brick house she has always lived in — but the lane outside is quieter now, and the walls feel thinner. The bey's overseer passes twice a day and he does not look at her. She does not look back. A palm-frond roof, a packed-earth floor, a wooden lattice in the single window; and, behind a loose brick in the wall, a pot that does not exist."
 cp_layla_housing_homesteader:0 "She lives in the house she has always lived in — single-room, mud-brick, the palm-frond roof she once patched by hand — but there is a deed folded in a cloth inside the wedding chest, a deed that says the earth outside the doorway belongs to her. She walks the border stones in the same order every morning. The heron stands in her irrigation channel. She still does not say §Imine§! out loud, but she is beginning to say it in her head."
 cp_layla_housing_cairo_tenement:0 "She lives on the second floor of a brick tenement off a side-street in Cairo, above a tinsmith whose hammer begins at dawn. Two rooms: one for sleeping, one for everything else. The window opens onto an airshaft where the neighbours' washing hangs; below, a cat and the smell of kerosene. The floor is wooden and creaks in a particular place she has not yet fixed. When the trams go by the teacup rattles on the low table."
 cp_layla_housing_alexandria_tenement:0 "She lives two streets back from the harbour in Alexandria, in a rented room above a Greek woman who leaves honey-smelling bread on the landing. The window faces east, inland, away from the sea she has still not gone to look at properly. A tiled floor that the landlady washes on Thursdays. The gulls are loud in the mornings. The salt gets into everything — the sheets, the bread, the eventual rust on the hinges."
 cp_layla_housing_cairo_middling:0 "She lives in a four-room apartment on a proper Cairo street — not wide, not narrow — with a balcony that faces the mosque's minaret and catches the evening call to prayer cleanly. There is a framed photograph above the table (Ahmed, stiff-shouldered, in a grey suit he does not wear except for the photograph). A servant girl comes in the mornings. The ceiling has a small plaster flower at its centre, and Layla still notices it, every day."
 cp_layla_housing_alexandria_middling:0 "She lives in a four-room apartment two blocks from the Corniche, and she has learned, finally, to keep a window open to the sea. Tiled floors, a proper iron stove, a clock on the wall that Ahmed winds on Saturday nights. There is a pair of small shoes by the door that she has not been able to throw out, though the child who wore them has outgrown them by three sizes."

 # Possessions (SoL-tiered)
 cp_layla_possessions_struggling:0 "She owns three clay pots, a copper cup that was her grandmother's, two cotton head-scarves, a small stone grinding-bowl, one wooden chest holding her wedding clothes, and three hens who share the courtyard with her at night because they do not trust the jackals in the lane."
 cp_layla_possessions_impoverished:0 "She owns four clay pots now, a small cast-iron pan Ahmed bought at the town market last autumn, the copper cup that was her grandmother's, three head-scarves — the third is newer, and softer — the grinding-bowl, the wedding chest, five hens, and a thin rug she spread on the floor for winter."
 cp_layla_possessions_middling:0 "She owns two proper copper pots now, the cast-iron pan, a kerosene lamp that works on most nights, a set of glazed cups from the Friday market, four head-scarves including one patterned with small green birds, a wooden chair Ahmed made last spring, the wedding chest, a rag rug, and the three hens who have begun to behave like old women."
 cp_layla_possessions_secure:0 "She owns a proper kitchen now — two copper pots, a cast-iron pan, a brass teapot, a set of matching cups and saucers, a small Primus stove she is still a little afraid of — and two good cotton dresses, a kashmir shawl folded in the chest, a pair of worn leather sandals kept by the door for going to market, and a small wall clock that Ahmed wound every Friday until last Friday, when he forgot."
 cp_layla_possessions_prosperous:0 "The kitchen has a metal stove now, and a cabinet with doors. She has a proper wardrobe of perhaps six dresses, two pairs of shoes (one for weekdays, one for the mosque and weddings), a silver-plated spoon that was a gift, a sewing machine she does not yet use very often, a framed portrait of Ahmed's father, and — on the shelf above the bed, so the children cannot reach it — a small glass-stoppered bottle of rosewater that Ahmed brings home every new year."
 cp_layla_possessions_affluent:0 "The apartment has a proper dining set, a china cabinet with glass doors, a Persian-style rug that a cousin picked up in Port Said, a standing clock in the hallway, an icebox, a gramophone with perhaps nine records, a sewing machine she uses now, a telephone she has learned to speak to without raising her voice, and an electric light fixture in each of the four rooms — all of which, she is aware, would have been unimaginable to her mother."

 # Routine (profession / class)
 cp_layla_routine_peasant_default:0 "She rises before the muezzin. She grinds dhurra for bread and bakes aish baladi on the clay oven in the courtyard before the sun is high enough to stand in. She drinks tea with mint. Most evenings she cooks ful medames with onions — beans from a sack Ahmed carried from the town, which will last the family eleven weeks if she is careful. On Fridays there is sometimes fish from the Nile."
 cp_layla_routine_homesteader:0 "She rises before the muezzin and walks the field before the sun is high. Grind, knead, bake. She bakes a little more generously now — two loaves some days, because the flour sack is not thinning in the old way. She drinks tea with mint from the plant on the window ledge, which has thickened out since the spring. On Fridays there is fish from the Nile — and, once a month, a little meat, which she slices thin so that everyone has a piece."
 cp_layla_routine_laborers_wife:0 "She rises before the muezzin, because Ahmed must be out the door before six. She packs him a bundle — bread, a wedge of cheese, a boiled egg if the hens have been kind. She sweeps the courtyard. She walks to the canal for water, which has become, inexplicably, the thing in her day she most looks forward to. The tea has changed — she takes it darker now, from a Turkish kettle, because Ahmed has learned to like it that way from the men at the mill."
 cp_layla_routine_cairo_laborers_wife:0 "She rises at five because the factory siren goes at six and Ahmed must be at the gate by then. She wraps his bread in a cloth and boils water for tea. The stairwell smells of the tinsmith's workshop. By seven she has swept, washed, and gone down for bread; by eight she is at the window watching the women at their washing in the court below. The city noise has stopped surprising her. She finds, without meaning to, that she no longer thinks about the canal at home."
 cp_layla_routine_machinists_wife:0 "She rises at five. Ahmed leaves at six with a tin pail — bread, cheese, the thermos of tea she has learned to trust not to leak. He comes home at seven smelling of iron filings and coal smoke, and he eats while she tells him the day's small news. Her hands are no longer hard in the places her mother's were hard. They are hard in new places — around the handle of the iron stove, across the pad of the thumb."
 cp_layla_routine_shopkeepers:0 "The shop opens at eight. Ahmed is below unlocking the shutters before she has finished the tea. She comes down at nine with the ledger under her arm — she writes the day's totals in Arabic numerals now, and has learned to add in columns. The customers are mostly women from the quarter, and mostly she knows their children's names. The bread comes from the baker two doors down, the cheese from a Greek, the sugar from a Turk whose price is fair enough that she has stopped bargaining every week."
 cp_layla_routine_clerks_wife:0 "Ahmed leaves at eight-fifteen for the ministry, in a grey suit she presses on Sunday evenings. She spends her mornings at the table by the balcony window, writing — letters to her mother's sister in the village, notes for the household ledger, sometimes a line she is trying out in a blank margin because she is beginning, very privately, to write poems. The servant girl makes tea at ten. The boy goes to school in a starched collar that Layla can remember never having seen as a girl."

 # Savings (what she counts, privately)
 cp_layla_savings_village_default:0 "She keeps a small clay pot behind a loose brick in the wall. She counts what is in it on Friday nights, when Ahmed is asleep. She does not name what she is counting toward."
 cp_layla_savings_homesteader:0 "She keeps the deed folded in a cloth inside the wedding chest, and twice a week she takes it out and reads her name aloud to the empty room. Beside the deed there is a small pouch — coins, more of them than last spring — and she has started, with some embarrassment, to count in piastres instead of paras."
 cp_layla_savings_middling:0 "There is a tin box on the top shelf now, with a tiny key she wears around her neck on a string. It holds coins — mostly piastres, a few small silver — and a folded paper that lists, in her own handwriting, the things she is saving toward. She has not shown the paper to Ahmed."
 cp_layla_savings_secure:0 "She has a savings book from the Crédit Foncier now. A clerk with a thin moustache stamps it when she makes deposits, and she has been taught to recognise her own signature on the top of the first page. The book lives in a flat metal tin under the bed. She has stopped counting on Friday nights — the total is in the book, and the book is in the tin, and the tin is where she put it."
 cp_layla_savings_urban_prosperous:0 "There is an account at the Bank of Egypt in Ahmed's name with both their signatures on the card. A small green passbook; the teller greets her by name. She has begun to think in pounds instead of piastres, which is a translation she is still practising and which still sometimes surprises her when she hears herself do it cleanly."

 # cp_layla.15 -- "Her Mother's Left Hand" (always available)
 cp_layla.15.t:0 "Her Mother's Left Hand"
 cp_layla.15.d:0 "Her mother used to reach for bread with her left hand, always. The right hand was always busy."
 cp_layla.15.f:0 "Stirring a pot, wiping a child's face, adjusting a scarf — the right hand was doing something more important. Layla has begun, without noticing, to reach with her left hand too. She notices today because the bread slips from her fingers and falls on the mat, and the mat is not clean, and she has to brush it off and re-examine it before it goes into her mouth. She thinks of her mother's hand. Her mother's hand is buried now, in the cemetery on the western edge of the village, under a rectangle of stones no larger than a loaf. Layla has not been to the grave since the forty-day mourning ended. She will go on Friday, she tells herself. She has been telling herself this every week for four years. This week too, she thinks, she will go. This week too, she will probably not."
 cp_layla.15.a:0 "She eats the bread, left-handed."

 # cp_layla.16 -- "The Hen That Will Not Lay"
 cp_layla.16.t:0 "The Hen That Will Not Lay"
 cp_layla.16.d:0 "The red hen has not laid in eleven days. She has counted. The other two have, but not her."
 cp_layla.16.f:0 "It is the oldest of the three, the red one with the pale feathers on her left wing. Layla has been feeding her the usual handful of dhurra scraps and the usual thought of the pot has been arriving, every morning, more plainly. Today she crouches in the courtyard and looks at the hen and the hen does not look back. There is a decision to be made and Layla has been not quite making it for a week. She thinks of her mother-in-law, who would have made the decision a week ago. She thinks of the broth. She picks up the hen. The hen does not object. Layla carries her to the shaded corner, sets her down gently, brushes a feather from her own lap, and walks away. Another day, she tells herself. Another day."
 cp_layla.16.a:0 "She gives the hen another day."

 # cp_layla.17 -- "The Merchant's Scale"
 cp_layla.17.t:0 "The Merchant's Scale"
 cp_layla.17.d:0 "She has been watching the merchant's scale for three weeks. She has started to believe it."
 cp_layla.17.f:0 "The onions come home heavier than they leave the market. She has weighed them on her own small stone, the one that was her grandmother's, and the numbers have not been agreeing. The merchant is a man of a certain age with a stutter and a wife who is kind; Layla does not want to be the woman who accuses him. Still. This morning she sets one onion on his scale and, on the way home, she sets the same onion on her stone. The difference is small. But the difference is there. She will not say anything, not this week, not next week. But she will begin to buy her onions from the other merchant, the one from the next village, whose hands are quicker and whose eyes do not rest on the scale the way the first man's do."
 cp_layla.17.a:0 "She changes merchants, quietly."

 # cp_layla.18 -- "Friday, the River Low"
 cp_layla.18.t:0 "Friday, the River Low"
 cp_layla.18.d:0 "The river is low this Friday — not dangerously, but noticeably. The old men are already talking."
 cp_layla.18.f:0 "She goes to the bank after the midday prayer and stands there a long while, looking. The water is the color it usually is but there is more of the bank visible than there should be — the pale stripe along the mud, the one that is not supposed to be visible this time of year. She does not know, exactly, what a low river means in the months ahead, but her mother would have, and her grandmother certainly would have. The old men on the bank are speaking in a low register she recognises from her childhood — the register that precedes decisions about grain stores and the slaughter of animals. Layla walks home slowly. She will say nothing to Ahmed tonight. But she will, quietly, buy an extra sack of beans at the market on Monday."
 cp_layla.18.a:0 "She will buy an extra sack of beans."

 # cp_layla.19 -- "The Old Woman Who Sees Through Walls"
 cp_layla.19.t:0 "The Old Woman Who Sees Through Walls"
 cp_layla.19.d:0 "Umm Saad came by the house today. Umm Saad does not come by the house for no reason."
 cp_layla.19.f:0 "She is ninety, or so everyone says; she herself is vague about it. She has a white plait down her back and a right eye that looks at you and a left eye that looks slightly past you, which is the eye the village believes in. She asks for a cup of water. Layla gives her a cup of water. She drinks it slowly and she looks, for a long time, at the brick behind which Layla keeps the pot, and she does not mention the brick, and then she gets up and thanks Layla and says §Iyour hens are in good health§! and leaves. Layla stands in the doorway after she has gone. Nothing has been said. Everything has been said. She will see Umm Saad at the next funeral and they will pretend this visit did not happen, and Layla will, for the rest of her life, believe in the left eye."
 cp_layla.19.a:0 "She lets Umm Saad see what she will see."

 # cp_layla.20 -- "The Bread That Did Not Rise"
 cp_layla.20.t:0 "The Bread That Did Not Rise"
 cp_layla.20.d:0 "The dough is dense this morning. She knows the moment she presses her thumb into it. Something is wrong."
 cp_layla.20.f:0 "She cannot say what exactly — the water was the right temperature, the flour was from the same sack as yesterday, the yeast was from the same corner of the same pot. But the dough is wrong. She shapes it anyway and bakes it anyway, and the loaves come out flat and heavy, and they taste like the bread of a year she does not want to remember: the year of her second lost baby, the year the rains were slow. She sets the loaves on the rack and sits on the step of the courtyard and does not weep, because she does not weep; but she sits there for a long time, longer than it takes the loaves to cool. Ahmed will ask nothing. The loaves will be eaten."
 cp_layla.20.a:0 "She lets the loaves cool."

 # cp_layla.21 -- "Dust on the Water"
 cp_layla.21.t:0 "Dust on the Water"
 cp_layla.21.d:0 "The khamaseen came through before dawn. She closed the cistern in time. Most of the dust is outside — most, not all."
 cp_layla.21.f:0 "She has been at it for two hours now: the swept floor, the re-swept floor, the shaken-out rug, the wiped-clean shelf, the bread-bowl that she has had to rinse three times because the dust finds its way into the flour the way water finds its way into a cracked clay pot. Her head-scarf is grey with the dust. So are her forearms, up to the elbow. She does not mind, quite, the work — the work has a shape, an end, a measurable quantity — but she minds the helplessness of the wind, which can undo six hours of a woman's week in twenty minutes and does not owe her an explanation. She goes out once more to the cistern to check that the lid held. The lid held."
 cp_layla.21.a:0 "She sweeps again."

 # cp_layla.22 -- "The Younger Brother's Letter"
 cp_layla.22.t:0 "The Younger Brother's Letter"
 cp_layla.22.d:0 "Kareem has written from somewhere. She will need the baker's son to read it to her."
 cp_layla.22.f:0 "Her younger brother has not been home in five years — he went to Alexandria, or so the family story goes, to work with a cousin of a cousin, and the letters have been, until now, rare. The baker's son is sixteen and can read, and he reads to her in the lane, with the letter held close to his eyes because the writing is small and the paper is thin. Kareem is alive. Kareem is not in Alexandria. Kareem is somewhere in Greece, working in a warehouse, and he sends four piastres folded into the paper, which he asks her to give to their mother, who is dead, which he does not know. Layla folds the four piastres back into the letter and walks home holding the letter like a thing that could shatter. She will write nothing back. She will not know, for three more years, whether he is still alive."
 cp_layla.22.a:0 "She folds the letter into the chest."

 # cp_layla.23 -- "The Mule That Will Not Move"
 cp_layla.23.t:0 "The Mule That Will Not Move"
 cp_layla.23.d:0 "The village mule has stopped in the lane, and the village mule will not be persuaded to start again."
 cp_layla.23.f:0 "He belongs to nobody in particular — the village owns him, or he owns the village, depending on whom one asks — and this afternoon he is standing squarely in the lane between Layla's door and the well with a cart of straw behind him and a young boy who is too small to whip him with any seriousness pleading with him in a reedy voice. Layla leans in the doorway with the bucket under her arm, waiting. She is not in a hurry. The mule is. Eventually the young boy gives up and goes to find his father and the mule, unobserved, takes one thoughtful step forward, then another, then begins, at his own leisurely pace, to walk. Layla picks up the bucket and follows him toward the well. She has learned, over the years, that the village moves at the speed of the village, and that impatience is a thing for other women in other places."
 cp_layla.23.a:0 "She walks behind the mule."
