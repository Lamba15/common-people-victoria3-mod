 # HERSELF / GOD -- cp_layla_vox.90..99
 # Linear. Self-talk does not branch.
 # ---------------------------------------------------------------------------

 cp_layla_vox.91.t:0 "The Book on the Shelf"
 cp_layla_vox.91.d:0 "The Qur'an is on the high shelf, wrapped in the cloth her uncle brought from Madinah. She cannot read it. She looks at it."
 cp_layla_vox.91.flavor:0 "It is a shape she has not opened in months. It is a shape she has not opened in the sense of untying the cloth, she has opened it every day in her head, through the verses her mother taught her and the ones the imam says at Friday, and through the single line she has kept for herself since she was twelve — verily with hardship comes ease. Tonight she takes the book down. She unties the cloth. She holds the book without opening it. The paper is cool. She puts her forehead against the cover for one breath, two. She wraps the cloth back around it. She puts it back. This is a prayer that is not a prayer. She thinks her mother would have called it a prayer."
 cp_layla_vox.91.a:0 "Climb down from the stool."

 cp_layla_vox.92.t:0 "The Candle, Alone"
 cp_layla_vox.92.d:0 "Ahmed is at the mosque. The daughter is asleep. The candle is the only other thing alive in the room."
 cp_layla_vox.92.flavor:0 "A candle is a small fire. She watches the flame. The flame breathes — this is what candles do — and she breathes with it without deciding to. She has been awake too late. Her neck hurts. Her hands hurt. Nothing important happened today and nothing important will happen tomorrow. The candle does not care about her day. The candle burns. She watches it. This is a kind of conversation between them."
 cp_layla_vox.92.a:0 "Blow it out and sleep."

 cp_layla_vox.93.t:0 "A Line, Aloud"
 cp_layla_vox.93.d:0 "She says a line aloud, to no one. She is alone in the kitchen. Her hand is in a bowl of rice she is picking over."
 cp_layla_vox.93.flavor:0 "Ya rabb, she says — and it is not a prayer, it is an address, the way one addresses a friend one has known for fifty years — Ya rabb, look at these hands. And she holds them out, rice grains and all, and looks at them herself, and does not expect an answer because there is not an answer that this particular address needs. It is the having said it that matters. She goes back to picking over the rice. The grains are small. Some are brown. She sets those aside."
 cp_layla_vox.93.a:0 "Put the rice on the fire."

 cp_layla_vox.94.t:0 "Her Face in the Surface of the Water"
 cp_layla_vox.94.d:0 "She leans over the water jar to scoop a cup. Her face is in the water."
 cp_layla_vox.94.flavor:0 "She is older than she was last year. She knew this; she has been knowing it. The water tonight has a particular way of telling her. There are lines around her mouth. There is a thinness around her eyes. The hair at her temple is the colour of the fine flour on the shelf. She scoops the water. Her face breaks, reforms, waits for her again in the new calm of the water. She drinks. The face goes. She is not displeased. She is not pleased. She is a woman of her age, and she has the age she has, and she is still the one drinking the water."
 cp_layla_vox.94.a:0 "Put the cup down."

 cp_layla_vox.95.t:0 "Walking Home Alone"
 cp_layla_vox.95.d:0 "From the field, at dusk, by herself. Ahmed has gone ahead with the donkey."
 cp_layla_vox.95.flavor:0 "There is a kind of walk that is only hers. Her feet know the road. Her hands swing. The sky is going to apricot. A bird goes across. She is a woman of a certain age walking home at the end of a day. She is not a wife in this minute; she is not a mother; she is not a worker. She is the woman-walking. She has always, since she was a girl, loved this walk. She loved it when she was twelve and came back from the canal with a pitcher. She loved it at twenty when she came back from her mother's house on a Friday. She loves it now at forty, or fifty, or sixty, and will love it at seventy, if she is given seventy. It is her walk."
 cp_layla_vox.95.a:0 "Home."

 cp_layla_vox.96.t:0 "The Quiet After Everything"
 cp_layla_vox.96.d:0 "The dishes are washed. The lamp is low. The daughter is asleep. Ahmed is breathing the way he breathes."
 cp_layla_vox.96.flavor:0 "A day has ended. The kitchen is clean. The week's bread is wrapped in the cloth on the ledge. Her mother's prayer mat is folded behind the door. The cup she drank water from is dry on the shelf. These are the ordinary evidences. She sits on the step with her shawl around her shoulders. Somewhere in the village a donkey brays. The sound is short and familiar. Tomorrow will have its own shape. Tonight is this shape. She is satisfied — not in the way the songs say, not grandly — in the small, useful way a woman is satisfied when the loaves have risen and the family is fed and the evening is hers."
 cp_layla_vox.96.a:0 "Sit until the lamp gutters."

 cp_layla_vox.99.t:0 "Nothing Tonight"
 cp_layla_vox.99.d:0 "She is sitting. She has nothing to say. She does not say it."
 cp_layla_vox.99.flavor:0 "Some nights are empty. Not bad — empty. She sits with her hands on her knees. The lamp is low. There is a small brown moth at the lamp that she does not wave away, because it is a small brown moth, and it has its work. She has her own work tomorrow. Tonight is only tonight. It is enough."
 cp_layla_vox.99.a:0 "Sleep."

 # ---------------------------------------------------------------------------
 # THE RULER -- cp_layla_vox.100..109
 # Era-aware. Ruler title is resolved at loc time via
 # [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] and
 # [ROOT.GetCountry.GetRuler.GetFullName], so the scene adapts from monarchy
 # to republic without rewriting.
 # ---------------------------------------------------------------------------

 # cp_layla_vox.101 -- the room (framing varies by government form)
 cp_layla_vox.101.t:0 "The Room She Has Built"
 cp_layla_vox.101.d.default:0 "She is kneading bread and she has decided tonight to go to the ruler's room in her mind. She does not know the room. She has built one from rumour."
 cp_layla_vox.101.d.constitution:0 "She is kneading and she has decided tonight to go to the ministry in her mind. She has built it from the schoolteacher's stories — a corridor with a stone floor, a long desk, a clerk with ink on his fingers."
 cp_layla_vox.101.d.republic:0 "She is kneading and she has decided tonight to go to the presidential house in her mind. She has built it from a newspaper picture her daughter read her — a room with electric light, a curtain of green velvet, a telephone on a wooden stand."
 cp_layla_vox.101.flavor:0 "She takes one step forward in the built room. [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName] is somewhere at the far end. She has invented a face for this one too — a particular beard, a particular posture, eyes she cannot quite read. She is wearing a dress she does not own. Her hands, she notices, are clean. Behind her the real kitchen continues to knead, because a woman does not stop the bread to go to Cairo. She has come because she has a thing to say. She has not quite named it yet. She has always thought better on her feet. What is the first thing she does?"
 cp_layla_vox.101.a:0 "Stand at the end of the carpet. Wait to be addressed. The old way."
 cp_layla_vox.101.b:0 "Walk up the carpet without asking. She is tired of asking."
 cp_layla_vox.101.c:0 "Say her name aloud, clearly, before anything else: I am Layla, daughter of Mohamed al-Sharif."

 cp_layla_vox.1011.t:0 "The Carpet's End"
 cp_layla_vox.1011.d:0 "She stands. She waits. The carpet is long. She can hear a pen at a table she cannot see."
 cp_layla_vox.1011.flavor:0 "She waits the way her mother taught her. Her mother had never imagined a ruler, but her mother had waited at doors for landlords and tax collectors and priests and bailiffs, and the waiting at doors had a shape and Layla knows the shape. She uses it now. In the imagined room the minutes go. In the real kitchen the dough rises. Eventually [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName] will address her, or he will not, and either way she will have learned a thing. The dignity of waiting is an old kind. She lets it be her dignity tonight. She does not need the new kind yet."
 cp_layla_vox.1011.a:0 "Wait."

 cp_layla_vox.1012.t:0 "She Walks"
 cp_layla_vox.1012.d:0 "She walks up the carpet without waiting. The secretary's pen stops. The ruler lifts his head."
 cp_layla_vox.1012.flavor:0 "It is not the old way. It is the new way. It is the way her daughter walks. It is the way the schoolteacher walks. She has borrowed it from them. She does not have permission for this walk from any tradition she was raised in. She takes it anyway. In the imagined room the air is surprised. [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName] is surprised. The surprise is brief and then there is only interest. She stops three paces from his desk. She has his attention. She has earned the attention by the walking. She has not yet spoken. The pen has not resumed. It is her turn."
 cp_layla_vox.1012.a:0 "Speak, now that the room is listening."

 cp_layla_vox.1013.t:0 "Her Name"
 cp_layla_vox.1013.d:0 "She says it the way a woman of her line would say it at the door of her own house, but louder, so the whole room hears."
 cp_layla_vox.1013.flavor:0 "I am Layla, she says, daughter of Mohamed al-Sharif, of a village in the Delta whose name you may not know. My grandfather planted in this soil. His grandfather planted in this soil. The secretary's pen pauses. [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName] looks up. She has not yet asked for a thing; she has only named herself. And because she has named herself, the room has agreed to hear her. This is a lesson she will carry out of the imagined room into the real one. A woman who does not name herself cannot be heard. A woman who does name herself becomes, for a second, hard to ignore."
 cp_layla_vox.1013.a:0 "Continue the speech tomorrow. She has opened the door."

 # cp_layla_vox.102 -- THE LAND (ported from cp_conversation.10 family)
 cp_layla_vox.102.t:0 "The Land"
 cp_layla_vox.102.d.default:0 "She stands at the end of the carpet. [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName] is waiting for her to speak."
 cp_layla_vox.102.d.serf:0 "She stands at the end of the carpet. Her hands are shaking. The bey does not know she is here. She hopes the bey will never know."
 cp_layla_vox.102.d.owner:0 "She stands at the end of the carpet with a paper folded in her imagined hand. The paper says the field is hers. She has come to thank — and to ask, perhaps, for something more."
 cp_layla_vox.102.flavor:0 "Effendim, she says — and her voice is smaller than she rehearsed, smaller than the room — I have come about the land. She clears her throat. My name is Layla, daughter of Mohamed al-Sharif, of a village in the Delta you have not heard of. My grandfather planted in this soil. His grandfather planted in this soil. His grandfather before him planted in this soil. They are in the soil now. I will be in the soil. My children, if I have children who live, will be in the soil. I have known that field in the flood year that was good, and the flood year that failed, and the year the locust took the eastern strip, and the year my mother died with her hand on the dry earth at the edge of the canal. The field is ours, Effendim. The field has always been ours. The ledgers in Cairo say otherwise. I have come to ask you for a paper. One paper. With my name on it. With my husband's name. With the name of the field. That my grandchildren, when they are old, can show the bailiff and say, the field is ours. That is what I have come to say. She stops. She waits. What does the ruler do?"
 cp_layla_vox.102.a:0 "#italic \"The land has owners. You are not one of them.\"#!"
 cp_layla_vox.102.b:0 "#italic \"Speak on. I am listening.\"#!"
 cp_layla_vox.102.c:0 "#italic \"A peasant woman should not be in this room.\"#!"

 cp_layla_vox.1021.t:0 "He Does Not Look Up"
 cp_layla_vox.1021.d:0 "He says it without lifting his head. The secretary's pen does not pause."
 cp_layla_vox.1021.flavor:0 "The words land in the room and do not ask permission. The land has owners. You are not one of them. She feels the breath go out in a long quiet way, as if struck with something soft and heavy. She had prepared herself for anger and for indifference. She had not prepared herself for the efficiency of it — the way he said it, as if stating the time. Effendim, she says, perhaps I have not been clear. We work the land. My grandfather — I said, he says without looking up, the land has owners. You are not one of them. The bailiff collects what the ledger requires. The ledger was drawn up correctly. Your name, and your husband's name, are on the ledger in the column for those who work the land. Not for those who own it. That column has been filled, in some cases, since before your grandfather's grandfather. Effendim, she says, what if the column were wrong? He lifts his head for the first time."
 cp_layla_vox.1021.a:0 "She leaves the room. She does not stay."

 cp_layla_vox.1022.t:0 "He Is Listening"
 cp_layla_vox.1022.d:0 "He leans forward slightly. The secretary stops writing."
 cp_layla_vox.1022.flavor:0 "Speak on, he says, and the voice is warmer than she expected, and she cannot tell if the warmth is real or if it is something men like him learn to put into their voices. Effendim, she says — the wars need men. The men need arms. The arms need steel. The steel needs money. The money comes from somewhere, and most of where it comes from is us. The villages. The wheat. The cotton the bey makes us plant instead of wheat. I am not angry about this. No — that is not true. I am angry. But I understand. A country is a thing that costs. But when the cost is paid and paid and paid again, and the ones who pay have no paper saying the field they water with their backs is their field — then one day something will break. I do not know what will break. But the paper, Effendim, would be a cheap thing for you to give. Cheaper than the steel. Cheaper than the next revolt. He makes a small gesture — the kind a man makes when he has decided something."
 cp_layla_vox.1022.a:0 "She will come back to this room. She has been heard."

 cp_layla_vox.1023.t:0 "He Is Cruel"
 cp_layla_vox.1023.d:0 "A peasant woman should not be in this room, he says, and he says it into the room, not to her."
 cp_layla_vox.1023.flavor:0 "The secretary keeps writing. The secretary has learned not to react. Layla stands at the end of the carpet with his sentence settling into the air around her. She had expected dismissiveness. She had not expected the contempt. The contempt is not personal — this is, somehow, the hardest part — the contempt is a class contempt, delivered with no particular heat, and it reveals to her that in the mind of the man she has built in her own kitchen, she is not a person at all but a category. She could leave now. She has been dismissed. She does not leave. She says — I am in this room because no other room has a door. Where else do you suggest I go, Effendim? The secretary's pen stops for one second. Then it resumes. Layla has made herself visible. The visibility is not safe. The visibility is also the point. She stays."
 cp_layla_vox.1023.a:0 "She stays. The dough in the kitchen keeps rising."

 # cp_layla_vox.103 -- the paper (homesteader)
 cp_layla_vox.103.t:0 "She Has Come with the Paper"
 cp_layla_vox.103.d:0 "The paper is in her imagined hand. She has come to say thank you. And to say more."
 cp_layla_vox.103.flavor:0 "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName], she says, the paper came. It was given at the district office. My name is on it. My husband's name is on it. The field has a name on the paper. The name is not the name we have used. The name is the clerk's shorter version. But the paper is the paper. I have come to say thank you. She pauses. She is not, in her own heart, sure the ruler is the one she should be thanking. It was the law. It was something the schoolteacher called a reform. It was many men who wrote in offices she has never seen. But the ruler, in the imagined room, is the shape of all of them. She is thanking the shape. She is also about to say — and the water in the canal is still low, Effendim, and the water is worth a paper of its own. What does she do?"
 cp_layla_vox.103.a:0 "Thank him. Leave it there. Do not stretch the mercy."
 cp_layla_vox.103.b:0 "Ask the next question. The water."
 cp_layla_vox.103.c:0 "Withdraw. She has said enough. She does not want to tire the room."

 cp_layla_vox.1031.t:0 "Only Thanks"
 cp_layla_vox.1031.d:0 "She says thank you. She bows slightly. She backs down the carpet to the door."
 cp_layla_vox.1031.flavor:0 "A gratitude without a request is a rare thing in this room. The ruler does not know what to do with it. The secretary does not write it down. She leaves. In the real kitchen the loaves are ready. She pulls them out and sets them on the ledge. They have a particular slight gold on the top that she has been trying to get right for a year. Tonight they have it. She takes the crust between her fingers and tastes. The crust is what her mother's crust was. She smiles, to no one. The paper is on the shelf. The loaves are on the ledge. Thank you is enough sometimes."
 cp_layla_vox.1031.a:0 "Set the loaves down."

 cp_layla_vox.1032.t:0 "The Water"
 cp_layla_vox.1032.d:0 "Effendim, she says, the water in the canal — and she tells him about the low year, and the bailiff, and the night the furrow had to be cleared by lamp."
 cp_layla_vox.1032.flavor:0 "He listens. He listens longer than she expected. When she is done he says — I will write a letter to the governor of the province. She does not know whether the letter will reach the governor of the province, or whether the letter exists, or whether it is a polite way of ending the audience. She does not care. She has been heard for a second time. Two hearings in one audience is more than she dared plan for. She backs down the carpet feeling that she has spent the coin well. In the kitchen the loaves are still rising."
 cp_layla_vox.1032.a:0 "Back to the oven."

 cp_layla_vox.1033.t:0 "Withdraw"
 cp_layla_vox.1033.d:0 "She does not ask the next question. She bows and turns. The carpet is long. The door is at the far end."
 cp_layla_vox.1033.flavor:0 "She has learned from a life in the village that a mercy accepted is a mercy kept. A mercy asked to extend is a mercy that begins to feel to the giver like an obligation, and obligations go sour. She does not want the paper to go sour. She leaves. She has a single thing from the evening, and the single thing is the paper. In the real kitchen she finds she has pressed too hard on the dough, and the second loaf has a particular shape it should not have, and she laughs, quietly, at herself, and reshapes it. The loaves in the end come out fine."
 cp_layla_vox.1033.a:0 "Reshape the loaf."

 # cp_layla_vox.104 -- war
 cp_layla_vox.104.t:0 "The War"
 cp_layla_vox.104.d:0 "Her husband is somewhere in a uniform that she cannot picture. She has come to ask the ruler a question about it."
 cp_layla_vox.104.flavor:0 "Effendim, she says — and her voice is a little more tired tonight than it has been in other audiences — Effendim, my husband is in your army. He has been there for eleven months. The last letter came in the month of the date harvest and was four lines. I have not come to ask where he is. I know you will not tell me where he is, and I know the answer would not help me find him anyway. I have come to ask a smaller thing. When this war ends — and all wars end — will the men come home the way they went, or will they come home another way? Will the roll of names be read in the villages, or will the families be left to count absences until the counting is unbearable? I ask because I have watched my neighbour count. She has been counting for eight months. She is going thin in a way a woman goes thin when the counting does not stop."
 cp_layla_vox.104.a:0 "Bitter: she does not believe he has an answer."
 cp_layla_vox.104.b:0 "Obedient: she knows wars are wars. She asks only the small thing."
 cp_layla_vox.104.c:0 "Question: she asks him — why does this war need him?"

 cp_layla_vox.1041.t:0 "She Does Not Wait for an Answer"
 cp_layla_vox.1041.d:0 "Effendim, she says, you do not have an answer for me tonight. I will not stay."
 cp_layla_vox.1041.flavor:0 "She turns. She walks back down the carpet. Her shoulders are square. The pen has stopped. The ruler has stood — a rare thing in the imagined room — and watched her go. In the real kitchen the dough has overrisen. She punches it down with more force than the dough deserves and begins again. She has not wept. She will not weep. Tomorrow Um Hassan at the wall will say — anything. Layla will say — no. And she will look Um Hassan in the eye in a way she has not in months, and Um Hassan will understand, and a small ally will have been made, which is the only thing one makes during a war."
 cp_layla_vox.1041.a:0 "Punch the dough down."

 cp_layla_vox.1042.t:0 "The Smaller Thing"
 cp_layla_vox.1042.d:0 "Will the roll of names be read, Effendim? Just that."
 cp_layla_vox.1042.flavor:0 "He says — yes. He says it without the usual delay. She looks at him for a second. She does not believe him. She does not not-believe him. She curtseys the way she was taught as a girl and backs down the carpet. If the roll is read, she will be there. If it is not read, she will have asked, and the asking will be what she has. In the real kitchen the loaves are almost ready to be shaped. She shapes the first one, firmly, the way her grandmother taught. The loaf holds. It will bake. It will be eaten."
 cp_layla_vox.1042.a:0 "Shape the loaf."

 cp_layla_vox.1043.t:0 "Why Does This War Need Him"
 cp_layla_vox.1043.d:0 "Effendim, she says. Not a hard voice. A tired one. Why does this war need my husband?"
 cp_layla_vox.1043.flavor:0 "The secretary's pen stops. The ruler does not answer for a long time. In the imagined room the air is heavier than before. When he finally speaks it is to say — your husband is needed because the country is needed. That is the only answer. Layla nods. It is not an answer. She knew it would not be. She has asked the question so that the question is in the room now. Once the question is in the room, the air of the room has to contain it. She backs down the carpet. She feels — for the first time in one of these audiences — that she has brought something that was not there before, and that it cannot be removed. The kitchen is warm. The dough is right. The question is in the room. She did that."
 cp_layla_vox.1043.a:0 "Back to the oven."

 # cp_layla_vox.105 -- the vote
 cp_layla_vox.105.t:0 "The Vote She Is Given"
 cp_layla_vox.105.d:0 "There is, now, a paper they are calling a vote. She has been told she can cast one. She has come to ask the ruler what the vote is for."
 cp_layla_vox.105.flavor:0 "Effendim, she says, I have a paper. The paper says I can vote. I have been told to put a mark on it next to a name. I have been told that the name will go to the parliament in Cairo. I have been told that the parliament will speak for us. I have some questions. Does the parliament eat the wheat, or does the wheat still go to the port? Does the parliament decide when the canal is cleaned, or does the bey's son decide? Does the parliament know I exist, or is my mark on the paper the whole of its knowledge of me? I am not refusing the vote. I am asking what the vote is. I have had few things given to me in my life that were not also taking things away. I have learned to ask."
 cp_layla_vox.105.a:0 "Take the vote. It is hers. She will not give it back just because it is small."
 cp_layla_vox.105.b:0 "Refuse the vote. She will not sign a paper that does not yet feed her."
 cp_layla_vox.105.c:0 "Ask him: what does this vote buy me? Give me an honest number."

 cp_layla_vox.1051.t:0 "She Will Take It"
 cp_layla_vox.1051.d:0 "She will. She will make her mark. She will walk to the polling room on the day with her shawl over her hair."
 cp_layla_vox.1051.flavor:0 "Things are given small before they are given whole, her mother used to say. The vote is small. The vote may become whole. She will take it. She will hand it, with her mark, to the clerk at the polling table, and she will go home. In the real kitchen the loaves are done. She sets them on the ledge. She feels — briefly — a kind of pleasure that is new. The pleasure is that she has in her hand a thing she did not have last year, and that the thing was given by a law, and that laws change, and that her daughter, who is older than Layla was at her own vote, will have a larger paper, and that her granddaughter will have a larger one still."
 cp_layla_vox.1051.a:0 "Wrap the loaves."

 cp_layla_vox.1052.t:0 "She Refuses"
 cp_layla_vox.1052.d:0 "Effendim, she says, I will not sign a paper that does not yet feed me. Find me one that does."
 cp_layla_vox.1052.flavor:0 "It is a harder answer than she meant. She says it anyway. The ruler does not say anything. She turns. She walks back down the carpet. In the real kitchen she does not shape the loaves well tonight — her hands are still in the room — and the loaves come out slightly uneven, and she does not care. She will not vote on the day. She will watch her neighbour vote. She will not feel smug. She will feel a small discomfort, because she is suspicious of her own refusal. Maybe it was right. Maybe it was pride. She will not know until the government does or does not send a new road through the village."
 cp_layla_vox.1052.a:0 "Wrap the loaves crooked."

 cp_layla_vox.1053.t:0 "An Honest Number"
 cp_layla_vox.1053.d:0 "Effendim, she says, what does this vote buy me? Not the speech. The number."
 cp_layla_vox.1053.flavor:0 "He does not give a number. He gives a speech. She listens for a minute. She stops listening. She waits for the speech to end. When it ends she says — that was not a number, Effendim. He says — I do not have a number. She nods. She backs down the carpet. She will still vote, she thinks — probably — but she will not expect anything. Expecting things from a vote that has no number is a fast way to become bitter, and she does not want to become bitter before she is seventy."
 cp_layla_vox.1053.a:0 "Home."

 # cp_layla_vox.106 -- the old ruler
 cp_layla_vox.106.t:0 "The Old Ruler, Remembered"
 cp_layla_vox.106.d:0 "She has been through three of them now. Four, if she counts the old one whose name nobody says anymore."
 cp_layla_vox.106.flavor:0 "Tonight the ruler in the imagined room is [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName]. He is, she has been told, different from the last one. The last one was different from the one before. She has been a married woman under four of them. She remembers the first one dimly — she was a girl, the village was quieter, the bey was harder, the tax was a different shape. She remembers the second because her mother died that year, and any year with her mother's death in it is a year with a name. She remembers the third because the railway came through. She does not yet have a word for this one. Tonight she says to him — Effendim, you are not the first. You will not be the last. Which kind do you want to be?"
 cp_layla_vox.106.a:0 "She says it bitterly. She has been worn by the sequence."
 cp_layla_vox.106.b:0 "She says it hopefully. She has seen enough to believe each one can be better."
 cp_layla_vox.106.c:0 "She says it tired. The question is the question. She has no strength left for tone."

 cp_layla_vox.1061.t:0 "Bitterly"
 cp_layla_vox.1061.d:0 "You are the fourth I have carried in my back. My back is not what it was."
 cp_layla_vox.1061.flavor:0 "She says it quietly. The room hears it anyway. The ruler does not answer. He cannot answer. She is not asking for an answer. She is speaking in the way an old peasant speaks to the weather — not because the weather will listen, but because the speaking is what is left. In the real kitchen her hands are in the dough and she has stopped thinking. The dough becomes bread on its own. She does not notice it rising. She does not notice it being shaped. Tomorrow she will eat it and not remember having made it. That is the bitterness. The bread is still good."
 cp_layla_vox.1061.a:0 "Bake it anyway."

 cp_layla_vox.1062.t:0 "Hopefully"
 cp_layla_vox.1062.d:0 "You can be the one under whom my grandchildren's knees do not crack at thirty. That would be a good thing."
 cp_layla_vox.1062.flavor:0 "She says it the way her mother would have laughed it — a small dry laugh, affectionate and demanding. The ruler does not know how to take it. That is his problem, not hers. She has set the standard — grandchildren's knees. He can meet it, or he can be another one she will one day count on her fingers to a granddaughter. She backs down the carpet humming. In the real kitchen the loaves rise higher than she expected. She is pleased with the day."
 cp_layla_vox.1062.a:0 "Shape the loaves."

 cp_layla_vox.1063.t:0 "Tired"
 cp_layla_vox.1063.d:0 "Which kind, Effendim. I do not have a song tonight. The question is the question."
 cp_layla_vox.1063.flavor:0 "She is tired and she says so. She is aware that speaking tired to a ruler is a privilege her grandmother did not have, and she is aware that the privilege is new, and fragile. She uses it sparingly. Tonight she uses it. The ruler, in the imagined room, does not answer. She backs down the carpet very slowly. Her knees are tired. Her shoulders are tired. Her hands, which have kneaded for eleven hours this week, are tired. She sits on the step of the kitchen when she comes out of the imagined room, and she breathes. The dough rises without her. The room in Cairo continues without her. The world continues. She continues. Tomorrow she will have some energy. Tonight she spent what she had in the room."
 cp_layla_vox.1063.a:0 "Sit on the step."

 # cp_layla_vox.109 -- fallback
 cp_layla_vox.109.t:0 "The Room Is Empty Tonight"
 cp_layla_vox.109.d:0 "The carpet is there. The desk is there. The secretary is there. The ruler is not."
 cp_layla_vox.109.flavor:0 "He has gone somewhere. She does not know where. The imagined room has its secretary, who writes nothing, and its carpet, which leads nowhere. She stands at the end of the carpet for a minute. Nothing comes. She shrugs, in her imagined dress, and turns, and walks out. In the real kitchen her hands have continued the dough. The dough is ready. She shapes the first loaf. She is pleased that the room has no answer tonight, because it means the room is not her whole trouble. The oven is the trouble, and the oven is, at least, hers."
 cp_layla_vox.109.a:0 "Shape the loaf."
