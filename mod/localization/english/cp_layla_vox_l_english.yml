 # UM YUSUF (Coptic neighbour) -- cp_layla_vox.40..49
 # ---------------------------------------------------------------------------

 # cp_layla_vox.41 -- over the wall, morning chores
 cp_layla_vox.41.t:0 "Over the Wall"
 cp_layla_vox.41.d:0 "The wall between the yards is shoulder-high. Um Yusuf is hanging a dress. Layla is scattering grain to the hen."
 cp_layla_vox.41.flavor:0 "They have known each other since Layla came to this house as a bride — twenty years, almost. Um Yusuf is Coptic; her husband works for a cloth merchant in Mansura and comes home on Fridays. She and Layla have never discussed either of these things. They have discussed the weather, the price of oil, the two sisters-in-law who are difficult, the hen that would not lay, the woman at the end of the lane whose son drinks, the cholera that was mild this year, the flood that did not come. They have never, in twenty years, quarrelled. They have sometimes not spoken for a week because one of them was in the other end of the village, and both have pretended on resuming that no week passed. Tonight Um Yusuf is hanging a dress that she has clearly worn to a wedding, and Layla is scattering grain, and the sky is the colour of apricot. What does Layla say?"
 cp_layla_vox.41.a:0 "Small gossip: the woman at the end of the lane, the son who drinks."
 cp_layla_vox.41.b:0 "Silence. Just the two of them, with their chores, at the wall."
 cp_layla_vox.41.c:0 "A small gift: pass three eggs over the wall in a piece of cloth."

 cp_layla_vox.4101.t:0 "Small Gossip"
 cp_layla_vox.4101.d:0 "They do not call it gossip. They call it — did you hear."
 cp_layla_vox.4101.flavor:0 "Did you hear, Layla says, about Um Mahmoud's son. Um Yusuf nods without looking up. I heard, Um Yusuf says. He came home at the third hour drunk and broke the gate. He broke the gate. He slept in the lane. Um Mahmoud sent the younger son to pull him inside before the light came. Poor Um Mahmoud, Layla says, and means it. Poor Um Mahmoud, Um Yusuf says, and means it. They hang and scatter. The son is not a sympathetic boy, neither of them likes him, but they are sympathetic to the mother, because the mother is the one they have both been and will always be. A woman's solidarity with another woman's bad son is one of the oldest things on the lane. They talk of other small things. The apricot sky fades. The hen finishes her grain."
 cp_layla_vox.4101.a:0 "Go in when the light goes."

 cp_layla_vox.4102.t:0 "The Silence at the Wall"
 cp_layla_vox.4102.d:0 "They do not speak. The wall is shoulder-high. The two women work."
 cp_layla_vox.4102.flavor:0 "Not every moment of twenty years' friendship is a conversation. Sometimes it is the shared pause in a lane, the fact of the other woman being there with her hands also busy. Um Yusuf hangs. Layla scatters. Neither looks up. Neither feels the need. A dog barks at the end of the lane. A child calls for a mother. The sky turns. At some point Um Yusuf makes a small sound like a laugh — perhaps at a thought of her own — and Layla smiles without knowing what at. They finish. They nod once. They go in. The whole encounter is nothing, and it is also the architecture of both their lives."
 cp_layla_vox.4102.a:0 "Close the gate."

 cp_layla_vox.4103.t:0 "Three Eggs in Cloth"
 cp_layla_vox.4103.d:0 "The hen has had a good week. Layla folds three eggs into a piece of old cloth and hands them over the wall."
 cp_layla_vox.4103.flavor:0 "Take them, Layla says. Um Yusuf does not protest, because between them that would be an insult; she only takes the cloth and lifts it in acknowledgement. Next week, inshallah, Um Yusuf says — by which she means, next week I will pass something back. It is the traffic of a long friendship. The cloth is the same piece that Um Yusuf sent over last month with a small jar of jam. They pass the cloth back and forth, and what the cloth carries changes, and the cloth has become, by the accumulation, something like a small shared currency. Neither of them would describe it in those words. The gate closes. Um Yusuf goes in. The cloth will come back, full of something, by Friday."
 cp_layla_vox.4103.a:0 "Close the gate."

 # cp_layla_vox.42 -- the priest's son
 cp_layla_vox.42.t:0 "The Priest's Son"
 cp_layla_vox.42.d:0 "Um Yusuf is at the wall in the morning, very quiet. The priest's son, she says, has been arrested."
 cp_layla_vox.42.flavor:0 "The priest's son is twenty. He is a good boy. He is a clever boy — too clever, some say. He has been arrested in the market at Mansura, caught with a stack of papers that said something about the ruler. Um Yusuf does not know what the papers said; she cannot read. The priest is beside himself. The priest's wife has locked herself in the inner room and has not spoken to anyone in two days. Layla listens. Layla has known the priest's son since he was six, when he used to come down the lane with a wooden toy. What does she say?"
 cp_layla_vox.42.a:0 "Sympathy, plain. Say it gently. Say it like a kiss on the forehead."
 cp_layla_vox.42.b:0 "Wisdom, the village kind. Say what her mother would have said: they are young, they burn."
 cp_layla_vox.42.c:0 "Change the subject. The priest's wife cannot stand to have it said. The village talks too much as it is."

 cp_layla_vox.4201.t:0 "Sympathy, Plain"
 cp_layla_vox.4201.d:0 "May God be with them, Layla says. May God return him. The words are small and old."
 cp_layla_vox.4201.flavor:0 "Um Yusuf nods. The old words are enough. The old words are often the only thing. They are words both women were taught by women who knew what it was to wait, to wait for a son, to wait for a husband, to wait for a brother, to wait for news. Layla and Um Yusuf stand at the wall and say nothing else for a while. It is a Muslim sympathy and a Coptic acceptance and they meet in the shoulder-high stone. A child shouts in the lane. A kettle whistles somewhere. The morning continues. The priest's son is still in the Mansura jail. The two women on either side of the wall are, for this moment, one thing."
 cp_layla_vox.4201.a:0 "Press her hand on Um Yusuf's once."

 cp_layla_vox.4202.t:0 "They Are Young, They Burn"
 cp_layla_vox.4202.d:0 "Layla says it the way her mother would have. She does not mean it dismissively."
 cp_layla_vox.4202.flavor:0 "They are young, she says, they burn. It is a proverb, almost. It means — young men who care about the country cannot help burning about the country. It means — he is not a bad boy, he is a burning boy. It means — I am not afraid of his burning, I am afraid of the Mansura jail. Um Yusuf nods. Yes, she says. Yes, he burns. The priest cannot see it; the priest is a priest. But the mother sees. The wife is in the inner room because she has seen. Layla thinks of her own daughter and her own son-still-unborn, and thinks — what would I do if my burning boy came home with papers. She does not have the answer. She does not try to have the answer tonight. She nods to Um Yusuf. Um Yusuf nods back. They both know what they both know."
 cp_layla_vox.4202.a:0 "Go in."

 cp_layla_vox.4203.t:0 "Change the Subject"
 cp_layla_vox.4203.d:0 "It is a small cowardice. She does it anyway."
 cp_layla_vox.4203.flavor:0 "How is the oil, she says, at Mansura this week. Um Yusuf looks at her for one second. Um Yusuf understands — instantly, without a visible ripple — that Layla cannot bear the priest's son's name this morning, and so she will give her friend the oil instead. The oil is expensive. The oil is always expensive. They talk oil for two minutes, then cloth, then the cousin in Damanhur. Layla goes in feeling small. Um Yusuf goes in understanding. The priest's son is still in the Mansura jail. Tomorrow, perhaps, Layla will be able to say his name. Not today."
 cp_layla_vox.4203.a:0 "Close the gate behind her."

 # cp_layla_vox.43 -- the feast across faiths
 cp_layla_vox.43.t:0 "Her Feast, Not Yours"
 cp_layla_vox.43.d:0 "It is Um Yusuf's feast-day. The cloth hanging in her yard is the good cloth. The smell of something sweet from her oven is in the lane."
 cp_layla_vox.43.flavor:0 "Um Yusuf is making kahk for the church. Her daughter is there helping; her cousin is there helping; a great-niece is there making a mess. Layla, from her side of the wall, can hear all three voices and the small sounds of a kitchen at work. It is not her feast. It is Um Yusuf's. But the lane is the same lane, and the smell is the same smell as the smell from her own oven on her own feast-days, and the happiness in her neighbour's voice is not, she thinks, a happiness she is a stranger to. What does she do?"
 cp_layla_vox.43.a:0 "Send something over: dates, or a small bowl of honey, without ceremony."
 cp_layla_vox.43.b:0 "Stay on her side. Let Um Yusuf's feast be Um Yusuf's. She will have her own."
 cp_layla_vox.43.c:0 "Call over the wall — ask what she is baking, the way a neighbour asks."

 cp_layla_vox.4301.t:0 "The Bowl of Honey"
 cp_layla_vox.4301.d:0 "She does not make a ceremony. She passes it across the wall with a small gesture that means — eat it."
 cp_layla_vox.4301.flavor:0 "Um Yusuf takes it. She does not protest — between them that would be an insult. She says — I will send kahk back when they are ready. Layla says — eat yours first. They laugh, both, a small wall-laugh. The kahk is holy to Um Yusuf; the honey is a good thing from Layla's own jar. Neither of them believes that the other's religion is wrong. Neither of them has ever thought about it in the terms the imams and the priests use. They are simply two women on a lane, and a feast is a feast, and a neighbour is a neighbour. The honey goes in. The gate closes. Later: three small kahk will come back, wrapped in the cloth they both have been passing for years."
 cp_layla_vox.4301.a:0 "Wait for the kahk."

 cp_layla_vox.4302.t:0 "She Stays on Her Side"
 cp_layla_vox.4302.d:0 "It is not a hostility. It is a respect. Her feast. Her kitchen. Her cousins."
 cp_layla_vox.4302.flavor:0 "Layla is at her own oven. The kahk-smell reaches her. She thinks of Um Yusuf's daughter, whom she watched grow up, and who is there today helping. She thinks of her own daughter. She thinks that in two weeks it will be her own feast-day, and that Um Yusuf will probably send something over, and that they will do this again, reversed. A year is a circle of small kitchen events, two kitchens on one lane. She is not invited inside. She is not expected inside. She would not go if she were invited. This is the rule of neighbourliness, and the rule holds both women in its kindness. The kahk is holy to Um Yusuf. Layla's oven is warm. Both are true."
 cp_layla_vox.4302.a:0 "Turn her own loaf."

 cp_layla_vox.4303.t:0 "What Are You Baking"
 cp_layla_vox.4303.d:0 "She calls over the wall, in the bright voice of a neighbour."
 cp_layla_vox.4303.flavor:0 "What are you baking, Um Yusuf. There is a short pause; then Um Yusuf laughs — a happy laugh Layla has not heard in months — and says — kahk, Layla, so much kahk, my hands are lost in the kahk. I will send you one. Layla says — send me two. Um Yusuf laughs again. The great-niece, who is small, starts shouting something that might be kahk-kahk-kahk, and the cousin shushes her, and the daughter, who is fifteen, shouts something in answer that is joyful and impossible to make out. The lane is full of the sound of Um Yusuf's kitchen. Layla stands on her side, smiling, with her hand on the wall. It is a good day. Her feast is next month. That will be Um Yusuf's turn to stand on the other side with her hand on the wall."
 cp_layla_vox.4303.a:0 "Smile. Go in."

 # cp_layla_vox.44 -- a death in Um Yusuf's family
 cp_layla_vox.44.t:0 "The House Is Dark at Midday"
 cp_layla_vox.44.d:0 "Um Yusuf's brother has died. The house across the wall has been silent since dawn."
 cp_layla_vox.44.flavor:0 "The brother was the one who lived in Damanhur. He was younger than Um Yusuf by ten years; he was not sick; he was fifty-three. A letter came at dawn with the priest's oldest daughter on a mule. Um Yusuf opened the letter in the yard and sat down on the low stool and did not stand up again for two hours. The husband has been sent for. The daughter is in the house. The cousins have not come yet. Layla, who has heard it all through the wall, has been standing in her own kitchen with her hands in the dough for a long time. She has not moved. What does she do?"
 cp_layla_vox.44.a:0 "Go over. Sit with her. Do not bring food yet — the cousins will."
 cp_layla_vox.44.b:0 "Send the daughter over with a dish. Do not intrude in person while the house is still fresh."
 cp_layla_vox.44.c:0 "Wait until tomorrow. Give her the day for her own family."

 cp_layla_vox.4401.t:0 "Sitting, Nothing More"
 cp_layla_vox.4401.d:0 "She goes. She sits on the low stool beside Um Yusuf. She does not speak."
 cp_layla_vox.4401.flavor:0 "Um Yusuf does not speak either, for a long time. Then she says — he was small once, Layla. He had a tooth gap here — and she touches her own front tooth — and he would not smile with it showing, and our mother could not make him. Layla nods. She knows about tooth gaps. Um Yusuf continues. She talks for half an hour about a boy fifty years gone. Layla, who never met the brother, knows him by the end of the half-hour. She knows him in the particular way that the dead can be known after they are dead, through a sister's talk, in a yard, on a feast-day that is no longer a feast. Layla stays until the cousins come. She stands. She kisses Um Yusuf once on the top of the head, which is a thing they do not usually do, and goes home."
 cp_layla_vox.4401.a:0 "Go home. Light the oven. The evening will need bread."

 cp_layla_vox.4402.t:0 "The Daughter with the Dish"
 cp_layla_vox.4402.d:0 "She sends her daughter over with a dish of rice and lentils. The daughter is old enough to know not to speak."
 cp_layla_vox.4402.flavor:0 "The daughter comes back with the empty dish and a small bundle of almonds Um Yusuf pressed into her hand, because grief in a village takes the form of a refusal to let a kindness go one way. The daughter says — she is sitting in the yard, Mama, with her head down. Layla says — did you say anything. The daughter says — I said, may God be with you, and gave her the dish. Um Yusuf said, thank you, my dear, and kissed me here — the daughter touches her forehead. Layla nods. The daughter has done it right. Layla is prouder than she can say. Tomorrow Layla will go herself. Tonight the dish has gone, and the almonds have come back, and the lane has done its small work."
 cp_layla_vox.4402.a:0 "Put the almonds in the jar for Friday."

 cp_layla_vox.4403.t:0 "Wait Until Tomorrow"
 cp_layla_vox.4403.d:0 "She does not go. She does not send the daughter. She waits."
 cp_layla_vox.4403.flavor:0 "A day for her own family, her mother used to say. The cousins must come first. The husband must arrive first. The priest must come first. The neighbour comes last, on the second day, with something small. Layla keeps the rule tonight. She kneads. She does not hum. She is aware, across the wall, of Um Yusuf's silence. She is aware that Um Yusuf, hearing the silence of Layla's kitchen tonight, knows that Layla is observing the rule, and that this is itself a kind of presence. The wall between them is thin. It is also thick. Layla sleeps badly. Tomorrow she will go."
 cp_layla_vox.4403.a:0 "Blow out the lamp."

 # cp_layla_vox.49 -- fallback
 cp_layla_vox.49.t:0 "The Wall, Quiet Today"
 cp_layla_vox.49.d:0 "Um Yusuf is not at her side of the wall. The yard is empty. The hen is quiet."
 cp_layla_vox.49.flavor:0 "Some days a wall is just a wall. Um Yusuf is in Damanhur, perhaps, or at the market, or sleeping, or ill. Layla puts her hand on the top stone, which is warm from the sun, and stands for a few breaths in the way one stands beside a friend's empty chair. She will be there tomorrow. Or the day after. Or Friday. The friendship is twenty years old. It does not need a wall-encounter every day to continue. Layla goes back in."
 cp_layla_vox.49.a:0 "Back to the oven."

 # ---------------------------------------------------------------------------
 # UMM MARIAM (landless neighbour) -- cp_layla_vox.50..59
 # Class contrast -- gated on Layla owning land. Umm Mariam is the woman who
 # does not, today, hold paper.
 # ---------------------------------------------------------------------------

 # cp_layla_vox.51 -- Umm Mariam works Layla's field
 cp_layla_vox.51.t:0 "She Is at the Edge of the Field"
 cp_layla_vox.51.d:0 "Umm Mariam is working the north strip with two of her boys. The strip is Layla's, on paper. The work is Umm Mariam's."
 cp_layla_vox.51.flavor:0 "Since the homesteading year, Layla has been the one with the paper. Umm Mariam has not. Umm Mariam works Layla's field for a share of the harvest, which they agreed on at Friday prayer in the first spring, and which Layla has not raised or lowered since. Umm Mariam was in the same lane growing up. They played at the same well. They were married in the same year, within a month of each other. And now Layla owns a field and Umm Mariam works it, and there is, between them, a silence the shape of the field. Tonight Layla walks the boundary, as she does at the end of every working day, to see what has been done. Umm Mariam is wiping her forehead with the back of her arm. What does Layla do about the count?"
 cp_layla_vox.51.a:0 "Pay her more than the share. Not charity — a correction."
 cp_layla_vox.51.b:0 "Pay her exactly the share. It is what they agreed. Honour is in the agreement."
 cp_layla_vox.51.c:0 "Forget to pay today. Apologize tomorrow. Make it a small accident."

 cp_layla_vox.5101.t:0 "Pay Her More"
 cp_layla_vox.5101.d:0 "She adds a handful. Then another. She does not look Umm Mariam in the eye as she hands it over."
 cp_layla_vox.5101.flavor:0 "Umm Mariam looks at the extra and looks at Layla. Umm Mariam has been a woman of the village for as long as Layla has, and she understands instantly what the extra is. She takes it. She does not say thank you — which would be to accept it as gift — but she does not hand it back either, because to hand it back would be to refuse what they both know is a kind of private debt being paid. The transaction is over in four seconds. Nothing has been said. Layla walks back along the boundary. Umm Mariam wipes her forehead again and calls her boys. The field, which is Layla's on paper, feels tonight to Layla like something she is holding for Umm Mariam, rent-free, until God decides. She does not say this to anyone. She does not, in later years, say it aloud even to herself. But she keeps paying more."
 cp_layla_vox.5101.a:0 "Walk home with the accounts book in hand."

 cp_layla_vox.5102.t:0 "The Share, Exact"
 cp_layla_vox.5102.d:0 "She counts it in the palm. She hands it across. The count is exact."
 cp_layla_vox.5102.flavor:0 "We agreed on this, Layla tells herself. The agreement is what honour sits on. To pay more today is to unmake the agreement, and to unmake the agreement is to confuse the lane. Umm Mariam takes the share and nods. The nod is small. The nod is — I know what was agreed, and you have honoured it, and I thank you for not inventing your own charity on my head. They part. Layla walks back thinking — she did not want more. She was not asking. She was only wiping her forehead. I read in her something that was not there. I must trust her to speak when she needs to speak. I must not decide for her. This is a harder kindness than I have been practising."
 cp_layla_vox.5102.a:0 "Write the amount in the book."

 cp_layla_vox.5103.t:0 "A Small Accident"
 cp_layla_vox.5103.d:0 "She puts the pouch in her sleeve and does not take it out. She says goodnight. She walks back."
 cp_layla_vox.5103.flavor:0 "She does not know why she did it. Tomorrow she will knock at Umm Mariam's gate and say — I forgot yesterday, forgive me — and she will pay the share plus a handful as apology. The handful will feel different than a pre-planned handful. It will feel like a thing the accident made possible. Perhaps she will do this again next week. Perhaps this is how she will pay more, by arranging accidents. She is aware, walking home in the dusk, that she is telling herself a small lie, and that the lie is wrapped around a real mercy, and that she does not know if she is a better woman for the mercy or a worse one for the lie. She will think about it tomorrow. Tonight the oven."
 cp_layla_vox.5103.a:0 "Home."

 # cp_layla_vox.52 -- Umm Mariam asks about the paper
 cp_layla_vox.52.t:0 "She Asks About the Paper"
 cp_layla_vox.52.d:0 "Umm Mariam at her own gate, a basket of onions on her hip. She asks casually. The question is not casual."
 cp_layla_vox.52.flavor:0 "So, Layla — the paper, is it the same kind they gave Abu Suleiman? Layla knows why the question is being asked. Abu Suleiman also has paper. Abu Suleiman's neighbour, Hag Farouk, does not. Umm Mariam is asking because there has been a rumour — there is always a rumour — that a second round of distributing papers is being prepared at the district office. Umm Mariam is asking because Umm Mariam does not know how to go to the district office, and has heard that Layla went, and would like to know the shape of it. Layla is aware of all of this at once. What does she say?"
 cp_layla_vox.52.a:0 "Speak plainly. Tell her exactly how she got the paper. Who she saw. What she signed."
 cp_layla_vox.52.b:0 "Deflect. Say the process is complicated. Say she does not remember the exact steps."
 cp_layla_vox.52.c:0 "Lie by omission. Say the paper was a one-time thing and she does not know of another round."

 cp_layla_vox.5201.t:0 "Plain Speech"
 cp_layla_vox.5201.d:0 "She says it all. The walk to Mansura. The clerk with the ledger. The four signatures, the stamp."
 cp_layla_vox.5201.flavor:0 "Umm Mariam listens. The onions slide in the basket. When Layla is done Umm Mariam says only — thank you. She does not say — I will go tomorrow, or — I will try next week. She does not commit aloud. Layla does not press her. Layla understands — Umm Mariam will go, or will not go, according to things Layla is not part of: what her husband says, what money she can afford for the clerk's small bribe, whether the eldest son can be trusted to watch the younger ones for a day. The knowledge has been handed over cleanly. What Umm Mariam does with it is hers. That is the whole of kindness sometimes — to tell the truth and not decide."
 cp_layla_vox.5201.a:0 "Walk home. Say nothing to anyone about this conversation."

 cp_layla_vox.5202.t:0 "Deflection"
 cp_layla_vox.5202.d:0 "It is complicated, Layla says. I do not remember the steps. Some of it was Ahmed, the clerk, I was not paying attention."
 cp_layla_vox.5202.flavor:0 "Umm Mariam nods. Umm Mariam knows it is a deflection. Layla knows Umm Mariam knows. The knowing is itself a second conversation, running beneath the first. Umm Mariam says — of course, Layla, it must have been very confusing. She shifts the onions. She says — the sun is high, I should go in. She goes in. Layla stands at the gate for a second longer than she meant to. She is not sure why she deflected. Perhaps because she did not want to feel that her paper was a thing she owed to others. Perhaps because her paper feels fragile to her still, and explaining it aloud would make it more fragile. Perhaps because she is a small woman in a small part of her heart tonight. She walks home slower than usual."
 cp_layla_vox.5202.a:0 "Sit on the step for a while before going in."

 cp_layla_vox.5203.t:0 "A Small Lie"
 cp_layla_vox.5203.d:0 "It was a one-time thing, Layla says. I have not heard of another round. I am sorry."
 cp_layla_vox.5203.flavor:0 "She has heard of another round. She heard yesterday at the market, from the same rumour-source. She says what she says because her heart has decided, in a second too fast for her conscience to catch, that she cannot bear to watch Umm Mariam get paper too — or she cannot bear to watch Umm Mariam not get paper despite trying. Both are cowardices. She is aware of this even as she speaks. Umm Mariam nods slowly. The nod is slow because Umm Mariam, who has also heard the rumour, is filing the small lie away, not for revenge — Umm Mariam does not revenge — but for a future conversation, to be had one evening years from now, when Layla has grown bigger inside her own skin and can be told. Layla walks home. She feels smaller than she has felt in a long time. This is how it feels to be the one who has."
 cp_layla_vox.5203.a:0 "Close the gate behind her harder than usual."

 # cp_layla_vox.53 -- her child and Umm Mariam's child
 cp_layla_vox.53.t:0 "Two Boys in the Lane"
 cp_layla_vox.53.d:0 "Umm Mariam's younger boy and Layla's younger are playing at the well with sticks. Both are barefoot. Only one has a shirt that is not torn."
 cp_layla_vox.53.flavor:0 "It is a small tear. It is not a tear the boy would notice. But Layla has noticed. She has noticed the way a mother notices — from across a yard, through a kitchen window, in the time it takes to fold a cloth. She has a shirt that her own son outgrew last month, folded in the chest, perfectly usable, with one button missing but easily replaced. It would fit Umm Mariam's boy. She has been meaning to take it across for a week. She has not. What does she do now?"
 cp_layla_vox.53.a:0 "Take the shirt across. Casually. Say — I had this set aside, I thought of your younger."
 cp_layla_vox.53.b:0 "Keep it in the chest. A torn shirt is Umm Mariam's business, and a woman's pride should be respected."
 cp_layla_vox.53.c:0 "Invite both boys in for bread. The shirts are not the subject. The bread is."

 cp_layla_vox.5301.t:0 "The Shirt, Casual"
 cp_layla_vox.5301.d:0 "She takes it across. She does not make a gesture of it. She hands it over at the gate as if it were a small market item."
 cp_layla_vox.5301.flavor:0 "Umm Mariam takes it. She holds it up. She says — oh — and then she says — thank you, my friend. The thank you is a rare word between them; it is said only for things that cannot be repaid in the ordinary cloth-and-jar traffic. Layla has done the right thing, without ceremony, without condescension. The shirt will be on Umm Mariam's younger boy by tomorrow. Layla walks back. She has been a woman of the village in the way a woman of the village can be at her best — practical, kind, private, and without a fanfare."
 cp_layla_vox.5301.a:0 "Close the gate behind her lightly."

 cp_layla_vox.5302.t:0 "In the Chest It Stays"
 cp_layla_vox.5302.d:0 "She does not take it across. She tells herself that Umm Mariam's pride is hers to manage."
 cp_layla_vox.5302.flavor:0 "There is a version of this argument that is right, and there is a version of this argument that is the face her cowardice wears when it is trying to look like something better. Layla cannot tell, tonight, which version is hers. The shirt stays in the chest. The torn shirt stays on the boy. Next week the tear will be larger. The month after, the shirt will be replaced — or it will not. Umm Mariam will never ask Layla for it. That is the way. Layla will not forgive herself for the chest for a long time, and not completely, even later, when Umm Mariam has died and everyone is old."
 cp_layla_vox.5302.a:0 "Close the chest."

 cp_layla_vox.5303.t:0 "Both Boys for Bread"
 cp_layla_vox.5303.d:0 "She calls from the gate. Both boys look up. They come running."
 cp_layla_vox.5303.flavor:0 "Bread with honey tonight, she says. Tell your mothers you are staying with Auntie Layla for half an hour. The boys shout in joy. They eat at her table. They are equally boys. The torn shirt is not mentioned. Umm Mariam, next door, hears her son's laugh through the wall and smiles at the saucepan she is scouring. Layla has found a way that does not require either woman to speak a word about the shirt. The dignity of the not-speaking is shared. Both boys come back with honey on their chins and are scolded for it, affectionately, from both kitchens."
 cp_layla_vox.5303.a:0 "Wipe the table down."

 # cp_layla_vox.54 -- a gift refused
 cp_layla_vox.54.t:0 "She Has Refused the Jar"
 cp_layla_vox.54.d:0 "Layla tried to pass a jar of olive oil across the wall. Umm Mariam said — no, keep it. It is too much."
 cp_layla_vox.54.flavor:0 "Something has shifted. The cloth-and-jar traffic between them has been steady for twenty years. Tonight, for the first time, Umm Mariam has refused. The olive oil was a good jar — the one from the Nazer press — and it was more than the usual. Layla has pushed it too hard; she knows this as she stands at the wall with the jar still in her hand. The refusal was gentle but it was clear. Umm Mariam has gone in. The wall is the same wall. What does Layla do?"
 cp_layla_vox.54.a:0 "Insist. Go around to the gate. Put the jar on her step."
 cp_layla_vox.54.b:0 "Withdraw. Take the jar home. Use it herself. The refusal was a message."
 cp_layla_vox.54.c:0 "Pretend to accept the refusal, and later leave the jar with a different pretext — a recipe, a question."

 cp_layla_vox.5401.t:0 "She Goes Around"
 cp_layla_vox.5401.d:0 "She carries the jar around the wall to the front gate. She puts it on the step."
 cp_layla_vox.5401.flavor:0 "She does not knock. She does not call. She does not need to. She places the jar on the step and walks back home. Inside her own kitchen she waits. After twenty minutes she hears Umm Mariam's door open and close. The jar is inside. No one has said a word. Tomorrow at the wall Umm Mariam will say — Layla, you are a stubborn woman. Layla will say — I am. They will laugh a small wall-laugh, and the friendship will be restored, the stubbornness will have been absorbed, and the oil will, in time, be returned in kind."
 cp_layla_vox.5401.a:0 "Wait for the wall tomorrow."

 cp_layla_vox.5402.t:0 "She Takes It Home"
 cp_layla_vox.5402.d:0 "She goes inside with the jar. She sets it on her own shelf. The refusal was a message."
 cp_layla_vox.5402.flavor:0 "Pride has its rules. Umm Mariam has signalled that the cloth-and-jar traffic has a limit, and that the limit has been approached, and that Layla must respect it. Layla respects it. She does not push. The jar goes on her own shelf. Their traffic will resume tomorrow, smaller, back at the customary weight. Something small has cracked, however. Both women know. Neither will name it. It will be there for some weeks, a thin line in the wall."
 cp_layla_vox.5402.a:0 "Put the jar on the high shelf."

 cp_layla_vox.5403.t:0 "A Different Pretext"
 cp_layla_vox.5403.d:0 "Tomorrow she goes over with a question about a recipe — and the jar with her, small, as if incidental."
 cp_layla_vox.5403.flavor:0 "Umm Mariam, I have forgotten how your mother made the molokhiya — was it a spoonful of oil at the end, or two. Umm Mariam laughs. It was always two, Layla. And she accepts the jar that Layla has placed absently on the step between them, because the jar is now about molokhiya, not about charity, and because molokhiya is between them always. The pretext is a small kindness and a small cunning, and both women know the cunning is a respect. The jar has crossed. The rules have been honoured. The lane continues. Next week Umm Mariam will send back a small bundle of green coriander, with a pretext of her own."
 cp_layla_vox.5403.a:0 "Go home to cook."

 # cp_layla_vox.59 -- fallback
 cp_layla_vox.59.t:0 "Umm Mariam Does Not Appear"
 cp_layla_vox.59.d:0 "Her gate is closed. Her yard is empty. Perhaps she has gone to Mansura with her eldest."
 cp_layla_vox.59.flavor:0 "There are weeks in a long friendship when the other woman is simply not there. The lane is quiet. The field — Layla's, on paper — is being worked by the older of Umm Mariam's boys, who is capable and silent. Layla walks the boundary. She notes that the north strip has been done well. She leaves without the small wall-chat. The oven needs her."
 cp_layla_vox.59.a:0 "Home."

 # ---------------------------------------------------------------------------
 # THE BEY -- cp_layla_vox.60..69
 # ---------------------------------------------------------------------------

 # cp_layla_vox.61 -- he rides up to the field
 cp_layla_vox.61.t:0 "The Mare on the Canal Road"
 cp_layla_vox.61.d:0 "The Bey is on the canal road. The mare is grey. She sees him before he sees her."
 cp_layla_vox.61.flavor:0 "She is bent over the water furrow with a stick, clearing it. Her back is to the road. The sound of the mare comes before the sight — the particular heavy walk of a horse that is well-fed on a road that is dry — and she knows, without turning, that he is coming. He comes every fortnight. He comes on the fortnight that she does not expect, always; he has a bailiff's sense of which fortnight. He stops at the edge of the strip. He does not dismount. She straightens. Her shawl is wet where her hand has been. The mare snorts. What does she do?"
 cp_layla_vox.61.a:0 "Stand. Face him. Meet his eye."
 cp_layla_vox.61.b:0 "Kneel. The old gesture. The one her mother taught."
 cp_layla_vox.61.c:0 "Keep working. Do not acknowledge him until he speaks."

 cp_layla_vox.6101.t:0 "Stand and Face"
 cp_layla_vox.6101.d:0 "She stands. She turns. She looks up at him on the mare. The sun is behind him."
 cp_layla_vox.6101.flavor:0 "It is not defiance. It is not not-defiance. It is simply her, wet-handed, looking at him. The Bey blinks once. He is unused to this. The women of this village do not look. The men avoid his eye as well, out of respect or fear or both, and the Bey is used to looking down on uncovered hair. Layla's hair is covered, but her eyes are not, and they are not down. For a second there is something like an exchange between them. He says — the water is late in the north strip. She says — it is. He says — tell your husband. She says — I will. He rides on. She kneels again to the furrow. Her hands shake for a minute. Then they stop. Then they work."
 cp_layla_vox.6101.a:0 "Finish the furrow."

 cp_layla_vox.6102.t:0 "The Old Gesture"
 cp_layla_vox.6102.d:0 "She kneels. Her mother taught her this. The kneel is not for him; it is for the lineage of women who have knelt."
 cp_layla_vox.6102.flavor:0 "The kneel is a peace with what the day requires. Her mother knelt when the old bey came; her grandmother knelt when the soldiers came; her great-grandmother knelt for the tax collector under the first Mohammed Ali. The kneel is not servility. The kneel is an endurance. The Bey, above her on the mare, does not like the kneel, interestingly — the new beys prefer nods, which they imagine are more modern — but he accepts it. He says — the water is late. She says — yes, Effendim. He rides on. She rises. Her knees hurt. She has bought a week."
 cp_layla_vox.6102.a:0 "Rise. Back to the furrow."

 cp_layla_vox.6103.t:0 "She Keeps Working"
 cp_layla_vox.6103.d:0 "She does not turn. She does not stand. The stick in her hand continues to move."
 cp_layla_vox.6103.flavor:0 "It is a small rudeness. She has never done it before. She has the sense, as she does it, that her mother is watching, and that her mother is not disapproving, and this surprises her. The Bey waits at the edge of the strip for a measured length of time. He does not speak. Eventually he says — your husband. She says — in the house, Effendim. He says — tell him the water is late. She says — I will. He rides on. She does not turn to watch him go. The water continues to move in the furrow. She knows that the next visit will be worse. She accepts this."
 cp_layla_vox.6103.a:0 "Finish the furrow."

 # cp_layla_vox.62 -- he asks after her husband
 cp_layla_vox.62.t:0 "He Asks After Ahmed"
 cp_layla_vox.62.d:0 "He does not dismount. His voice is mild. The mildness is the shape of the question."
 cp_layla_vox.62.flavor:0 "And your husband, Layla — he is well? The question is not a question. The question is a mechanism. He asks after the husband on every visit, as if it were the politeness of an English gentleman, which he imagines himself to be — he has visited London once, he has mentioned it to the villagers through his bailiff. Layla understands the mechanism. She has understood it since she was twenty. The mechanism is: he is asking whether the husband is well enough to pay, whether the husband is strong enough to resist, whether the husband has any intentions he should know about. She has three answers she has used over the years. Tonight which?"
 cp_layla_vox.62.a:0 "He is well, Effendim. The usual answer. Do not complicate."
 cp_layla_vox.62.b:0 "The truth. He has a cough. He is tired. The harvest was short."
 cp_layla_vox.62.c:0 "Say nothing. Lower her eyes. Let the silence be her answer."

 cp_layla_vox.6201.t:0 "He Is Well"
 cp_layla_vox.6201.d:0 "The customary answer. She has given it hundreds of times. She gives it again tonight."
 cp_layla_vox.6201.flavor:0 "The Bey nods. The mechanism has been satisfied. He rides on. The answer is not a lie; Ahmed is, in the main, well. The answer is a refusal to give the Bey any material beyond what the ritual requires. Layla has learned that the Bey takes what he is given and does not press; the pressing is what he wants, because the pressing is what tells him something about the household. She gives no pressing. She gives the customary. He leaves. She bends back to the furrow. A small victory for not offering the extra."
 cp_layla_vox.6201.a:0 "Work the water."

 cp_layla_vox.6202.t:0 "The Truth"
 cp_layla_vox.6202.d:0 "She gives him the cough, the tiredness, the short harvest. She is not sure why. Perhaps she is tired tonight herself."
 cp_layla_vox.6202.flavor:0 "The Bey leans forward. His eyes brighten, not with pity, with interest. He says — a short harvest, is it. I should speak with him about this. She realises — three seconds too late — that she has handed him a thread, and that he will pull the thread at his leisure, and that Ahmed will be summoned tomorrow or the day after, and that the summoning will be for an adjustment of the arrangement, and that the adjustment will not be in Ahmed's favour. She has failed the lineage of women who have stood at this furrow. She walks home with a weight. She tells Ahmed. Ahmed does not blame her. Ahmed's not-blaming is worse than the blaming would be."
 cp_layla_vox.6202.a:0 "Bear the weight home."

 cp_layla_vox.6203.t:0 "Silence, Lowered Eyes"
 cp_layla_vox.6203.d:0 "She does not answer. She lowers her eyes at the stick in her hand."
 cp_layla_vox.6203.flavor:0 "The Bey waits. The wait is longer than usual. The mare shifts her weight. The Bey is considering whether to make the silence into something. He does not. He says — well. Tell him I asked. He rides on. Layla exhales. Silence has a cost tonight. Tomorrow — she does not know. Perhaps nothing. Perhaps something. She has saved Ahmed from an interview, but she has given the Bey a thing to ponder. She bends to the furrow. The work is what it was. The work is what it will be."
 cp_layla_vox.6203.a:0 "Straighten the stick."

 # cp_layla_vox.63 -- the ledger at the planting
 cp_layla_vox.63.t:0 "The Ledger at the Planting"
 cp_layla_vox.63.d:0 "Planting day. The Bey's bailiff has the book open on a flat stone. The Bey is reading aloud the allotment."
 cp_layla_vox.63.flavor:0 "The allotment is what each household in the village is to plant. The allotment is decided by the Bey, with advice from the bailiff, on criteria that are not shown to the villagers. This year Ahmed's allotment is three-quarters cotton, one-quarter wheat. Last year it was two-thirds cotton. Next year it will be more cotton still, because the port wants cotton, and the Bey's sons want new things. Ahmed is beside her. The other men are behind. The Bey finishes reading Ahmed's allotment and looks at them. She sees Ahmed's jaw move once and settle. What does she do?"
 cp_layla_vox.63.a:0 "Nod. Agree. Do not make this a fight. Not here, not with the bailiff watching."
 cp_layla_vox.63.b:0 "Step forward. Say — Effendim, the wheat. We cannot feed on cotton alone."
 cp_layla_vox.63.c:0 "Ask for a smaller parcel — less cotton, same wheat. A compromise she knows he will refuse."

 cp_layla_vox.6301.t:0 "She Nods"
 cp_layla_vox.6301.d:0 "She nods. Ahmed, beside her, nods. They do not fight it in the open."
 cp_layla_vox.6301.flavor:0 "Later, at home, they will speak of it. Later they will adjust. Later the wheat will come from another source — bought, traded, borrowed — and the household will eat, as it has always eaten. The nod in public is the face that the Bey's ledger requires, and the ledger is the Bey's system, and the system is what they are inside tonight. To fight the ledger in public is to invite a visit from the Bey's men within the week. Layla has seen households who fought and the week that followed. She does not want the week. She nods. The Bey closes the book. The planting begins."
 cp_layla_vox.6301.a:0 "Walk home with Ahmed."

 cp_layla_vox.6302.t:0 "The Wheat"
 cp_layla_vox.6302.d:0 "She steps forward. Her voice is steady. Effendim, she says, the wheat — we cannot feed on cotton alone."
 cp_layla_vox.6302.flavor:0 "The bailiff's pen stops. The Bey looks at her as if he has not seen her before. The other men step back one small step, visibly, as if distancing themselves. The Bey says — you will buy wheat at the market, Um Layla. She says — the market wheat is expensive, Effendim. The Bey says — then plant less cotton on the western half and take the loss. You have spoken. Your neighbours have heard. This is their penalty as well as yours. He rides off. Layla is small inside her own skin on the walk home. Ahmed says — next year we eat. This year we do not eat. I love you. She cries, for a minute, where only he can see. She does it again anyway if the day repeats."
 cp_layla_vox.6302.a:0 "Walk home."

 cp_layla_vox.6303.t:0 "A Compromise"
 cp_layla_vox.6303.d:0 "She asks for less cotton and the same wheat. A small mercy. She knows it will be refused."
 cp_layla_vox.6303.flavor:0 "Effendim, she says, a smaller strip of cotton on the east would be easier — the water is better there for the wheat. The Bey considers. The bailiff shakes his head very slightly — a movement only Layla catches — and the Bey says — no, Um Layla. The book has the allotment. The book stands. The moment has passed. She has not won the compromise, but she has, by asking, told the bailiff and the Bey that she is a woman who asks. Next year, perhaps, they will not allot her as hard. Or perhaps they will. A small risk, a small reward, a small probability."
 cp_layla_vox.6303.a:0 "Walk home beside Ahmed."

 # cp_layla_vox.64 -- he comes after homesteading
 cp_layla_vox.64.t:0 "He Comes Less, Now"
 cp_layla_vox.64.d:0 "Since she has paper, the Bey comes less. Tonight he has come. The mare is at the gate."
 cp_layla_vox.64.flavor:0 "In the old arrangement he came every fortnight. Since the homesteading law, he has come twice a year, on errands the bailiff could easily have run. She understands. He comes because he needs to, for his own reasons. He comes because he was someone to her before she had paper, and he is not sure what he is to her after. Nor is she sure. She stands at her own gate — her own gate — with her own field behind her. She is aware of the strangeness of the phrase, which she has been aware of every day for a year. What does she do?"
 cp_layla_vox.64.a:0 "Offer tea. Make the offering formal. He is a guest at her gate now."
 cp_layla_vox.64.b:0 "Refuse to receive him. Say — he may speak to Ahmed when Ahmed is home."
 cp_layla_vox.64.c:0 "Stand. Be silent. Let him speak first, on her ground."

 cp_layla_vox.6401.t:0 "Tea, Formal"
 cp_layla_vox.6401.d:0 "Please, Effendim. I will make tea. Ahmed will be home at sunset. Please, sit."
 cp_layla_vox.6401.flavor:0 "She makes tea. She serves it in the good glass. She sits on the low stool across from him and does not speak until he speaks. It is the first time she has served him tea on her own step. It is also, perhaps, the last. She is aware throughout of her own posture, which is a new posture — host, not subject — and he is aware too, and the two awarenesses sit between them like a third cup. He says small things. The weather. The river. He does not ask after Ahmed. He leaves when his glass is empty. She rinses the glass three times before putting it back on the shelf."
 cp_layla_vox.6401.a:0 "Shelve the glass."

 cp_layla_vox.6402.t:0 "He May Speak to Ahmed"
 cp_layla_vox.6402.d:0 "She does not open the gate. She speaks through the slats. Effendim, Ahmed is at the mosque. Come back at sunset."
 cp_layla_vox.6402.flavor:0 "It is a small firmness. It is a firmness she has wanted for twenty years. She has the paper now. The paper allows the firmness. The Bey is surprised — not angered, surprised — and he nods, and says — I will come at sunset, and rides off. At sunset he does not come back. He sends a message the next day saying the matter has been settled. She does not know what the matter was. She does not ask. Ahmed does not ask. The gate is closed and it was closed by her."
 cp_layla_vox.6402.a:0 "Go inside."

 cp_layla_vox.6403.t:0 "Her Silence, His First Word"
 cp_layla_vox.6403.d:0 "She does not speak. She lets him stand at the gate. The mare shifts."
 cp_layla_vox.6403.flavor:0 "For a longer minute than he expects, she says nothing. She is not rude; she is not welcoming. She is waiting. He understands — eventually — that the ground has changed, that she is no longer the woman who spoke first at the furrow, and that the paper means that he must, if he wants to conduct business, begin the business. He says — Um Layla, about the canal. She says — yes, Effendim. The conversation proceeds. She gives him less than she would have given at the furrow. He takes what he is given. The mare shifts again. He rides off. She walks inside and does not exhale until the gate clicks. Then she exhales."
 cp_layla_vox.6403.a:0 "Sit on the step for a minute."

 # cp_layla_vox.65 -- his son, his family, his politics
 cp_layla_vox.65.t:0 "News of His Son"
 cp_layla_vox.65.d:0 "Um Hassan has told her. The Bey's son has come back from Paris. He has strange ideas. The old Bey is angry."
 cp_layla_vox.65.flavor:0 "The son studied in Paris for four years. The son came back last month with books and a soft hat and a stack of arguments his father cannot answer. The son has been seen talking to the schoolteacher — the one who reads al-Ahram — and has been seen not going to Friday prayer for three weeks. The village is watching. Um Hassan whispers about it at the wall. The old Bey has ridden out to Mansura twice this month on business no one can name. Tonight Layla is kneading. She is turning the news in her head. What does she think of the Bey's son?"
 cp_layla_vox.65.a:0 "Sympathy for the old Bey. Sons can wound. That is a weight she knows."
 cp_layla_vox.65.b:0 "Sympathy for the son. He saw a bigger world. He brought it back. The old Bey will lose this fight."
 cp_layla_vox.65.c:0 "It is not her business. The rich man's son does not change the village's tomorrow."

 cp_layla_vox.6501.t:0 "The Old Bey's Weight"
 cp_layla_vox.6501.d:0 "She finds herself, for the first time, thinking of the Bey as a father, not as a bailiff on a mare."
 cp_layla_vox.6501.flavor:0 "She has a daughter. The daughter has said she will not marry the cousin's son. The daughter reads aloud in the evenings from a thin book with a blue cover. Layla knows — in a way she did not know before tonight — what it is to be the old person whose child has come home larger than the house. The Bey is an old man. The Bey was cruel to her, not in the big ways, but in the small daily ways for twenty years. Tonight she grants him, in her head, one second's fellow feeling. It does not reach her face. It does not reach her hands. But it is there, briefly, in the dough. It surprises her. She does not cherish it. She does not refuse it."
 cp_layla_vox.6501.a:0 "Knead on."

 cp_layla_vox.6502.t:0 "The Son Will Win"
 cp_layla_vox.6502.d:0 "The old Bey cannot answer the son's books. The old Bey will try, and lose, and know he is losing."
 cp_layla_vox.6502.flavor:0 "The world is moving. Layla has felt this through the railway, through the new law, through the mill's whistle, through her daughter's reading. The Bey's son is, in his soft hat, only one of the ways the world is moving. The old Bey — her Bey — is on the losing side. She does not exactly cheer this. She has lived inside his ledger all her life; she does not know what life beyond the ledger will look like; she will not be the one to benefit most, because the benefits will go to her daughter and her grandchildren. But the ledger is going. She is on the side of its going. She kneads harder, not in anger. In hope."
 cp_layla_vox.6502.a:0 "Bring in the loaf."

 cp_layla_vox.6503.t:0 "Not Her Business"
 cp_layla_vox.6503.d:0 "The rich fight their own fights. The poor do not benefit from taking sides."
 cp_layla_vox.6503.flavor:0 "Her mother used to say this. Layla has said it herself many times. Tonight she says it again, in her head, to stop herself from caring. It does not entirely work. The Bey's son is in her head whether she wants him there or not; the old Bey is too. The village is in their fight whether the village is invited or not. But she can refuse to spend any more of her own tired evening on them. She bakes. She eats. She sleeps. The fight is elsewhere. The fight will arrive eventually. When it does she will have a position. She does not need to have one tonight."
 cp_layla_vox.6503.a:0 "Put the loaf aside."

 # cp_layla_vox.69 -- fallback
 cp_layla_vox.69.t:0 "No Mare Today"
 cp_layla_vox.69.d:0 "The canal road has been empty of him for a month. The absence is its own small presence."
 cp_layla_vox.69.flavor:0 "Some fortnight the Bey does not come. In the old days this was never a relief — she spent the extra fortnight waiting harder. These days it is different. The absence is a kind of being-let-be. She clears the furrow. The water moves. No horse stops at her back. She permits herself, briefly, the pleasure of finishing work on her own time. She does not celebrate. Celebrating would be to grant him more than he deserves. She only finishes. She goes home."
 cp_layla_vox.69.a:0 "Home."

 # ---------------------------------------------------------------------------
 # THE FACTORY OWNER -- cp_layla_vox.70..79
 # ---------------------------------------------------------------------------

 # cp_layla_vox.71 -- the gate before shift
 cp_layla_vox.71.t:0 "At the Gate Before Shift"
 cp_layla_vox.71.d:0 "Five a.m. The mill gate is open. The owner is standing at it in a coat of dark wool, though it is not cold."
 cp_layla_vox.71.flavor:0 "She has not seen him at the gate before. The gate is usually the foreman's domain — the foreman with the runner's legs who takes a fast count as the workers come in. Today the owner is there. He is not tall. He has a soft face that is not, to her surprise, a cruel face. He watches the workers stream in. He is, Layla realises, counting them himself — not with a ledger, with his eyes, as if he wants to know in his body how many bodies come through his gate each morning. She is three paces away. His eye will pass over her. What does she do?"
 cp_layla_vox.71.a:0 "Head down. Walk past. This is not a day for being looked at."
 cp_layla_vox.71.b:0 "Meet his eye. Not a smile. Not a challenge. Just — see me."
 cp_layla_vox.71.c:0 "Walk past him. Do not look at the gate. Pretend he is a pillar."

 cp_layla_vox.7101.t:0 "Head Down"
 cp_layla_vox.7101.d:0 "She walks past with her head down. Her shawl is over her hair. Her feet know the path."
 cp_layla_vox.7101.flavor:0 "The head down is the village's old posture. It is the posture of the woman on the canal road. It is the posture she has used at the market, at the mosque, at the feast. It has kept her safe. She uses it. The owner's eye passes over her and does not stop. She is inside the mill. The shift begins. The dust of raw cotton settles in her throat within ten minutes. Her head stays down for most of the shift and not because of him. It stays down because that is where a workwoman's head is at the mill. Tonight, at home, she will think — I did not meet his eye. I will not meet it tomorrow either. This is my survival."
 cp_layla_vox.7101.a:0 "Begin the shift."

 cp_layla_vox.7102.t:0 "She Looks"
 cp_layla_vox.7102.d:0 "Three paces out. Their eyes meet. The exchange is a second, maybe two."
 cp_layla_vox.7102.flavor:0 "His face does not change. Hers does not either. There is, however, something in the exchange — small, not pleasant — that signals to both of them that she knows he is the owner, and he knows she knows, and that the line between them is now visible. He has thought of her, for a second, as a person. She has thought of him, for a second, as a man in a coat. She walks in. The shift begins. All morning she is aware that she has put a small coin down somewhere — she has spent a small currency. She will have to see if she gets something in return, or if the coin was lost. The owner, for his part, remembers the face. He does not know her name. Not yet."
 cp_layla_vox.7102.a:0 "Begin the shift."

 cp_layla_vox.7103.t:0 "He Is a Pillar"
 cp_layla_vox.7103.d:0 "She looks past him. She does not register him at all. She walks into her place."
 cp_layla_vox.7103.flavor:0 "It takes a practiced absence to do this properly. She has practiced. She has been ignoring overseers and bailiffs and bey's-men since she was fifteen. The owner is only the newest in a line. She walks as if the air beside him were the only air there is. He notices — her refusal to notice is its own kind of notice — and he files it. Some mornings are like that. She has spent her coin and kept her coin, both, by the same gesture. The shift begins."
 cp_layla_vox.7103.a:0 "Begin the shift."

 # cp_layla_vox.72 -- the ledger, she is a line
 cp_layla_vox.72.t:0 "A Line in the Ledger"
 cp_layla_vox.72.d:0 "The paymaster has called her name from the ledger. She has come to the table. The ledger is open."
 cp_layla_vox.72.flavor:0 "She is a line. The line says her name, her father's name, her husband's name, the shift count for the month, the piastres owed. She cannot read the line. She has to take what she is given. The owner — not the foreman, the owner himself this month — is at the other end of the long table, approving the payments, signing a ledger of his own. The paymaster hands her the coins. She counts them once in her palm. The count is twelve piastres short of what she expected. The owner has not looked up. What does she do?"
 cp_layla_vox.72.a:0 "Ask about the twelve piastres. At the table. Loud enough for the owner to hear."
 cp_layla_vox.72.b:0 "Trust the number. If the ledger says twelve less, it says twelve less. Take it home."
 cp_layla_vox.72.c:0 "Ask the foreman quietly after. He will know. He may or may not tell her."

 cp_layla_vox.7201.t:0 "She Asks"
 cp_layla_vox.7201.d:0 "She counts them again. She looks at the paymaster. She says — this is twelve short, effendim."
 cp_layla_vox.7201.flavor:0 "The paymaster looks at the ledger. The paymaster's finger moves down a column. The paymaster says — fine for the cracked bobbin in the third week. Layla says — the bobbin was cracked when I took the post. The paymaster does not answer. The owner, at the far end of the table, looks up. The paymaster does not know what to do. The owner says — pay her. The paymaster hesitates. The owner says — pay her. The paymaster counts out twelve more piastres. She takes them. She does not smile. She walks out. Behind her the paymaster will be scolded. She knows this, and she does not care, and also a little she does care. She has made the owner look up."
 cp_layla_vox.7201.a:0 "Leave."

 cp_layla_vox.7202.t:0 "Trust the Number"
 cp_layla_vox.7202.d:0 "She does not argue. She takes the short pay. She walks out with it."
 cp_layla_vox.7202.flavor:0 "Twelve piastres is a small bread and a small oil. She will make it work. Ahmed will not ask where the twelve went; she will say the count was low this month, which is not untrue. She tells herself it is better not to make a scene, better not to mark herself as a woman-who-argues, better to keep the job. All three are true. It is also true that she has been cheated, and that the paymaster knows she was cheated, and that the owner — whose coat is dark wool — knows too. She carries the smallness home. The smallness is also a kind of saving. No one noticed her. No one will fire her. Twelve piastres."
 cp_layla_vox.7202.a:0 "Home."

 cp_layla_vox.7203.t:0 "The Foreman, Quietly"
 cp_layla_vox.7203.d:0 "She waits until the line is done. She goes to the foreman. She asks quietly."
 cp_layla_vox.7203.flavor:0 "The foreman is the one with the runner's legs. The foreman has always been, to her, a decent man — harassed, tired, caught between the floor and the office. He looks at the ledger for her. He says — the bobbin. She says — the bobbin was cracked when I took it. He nods slowly. He says — I will talk to him about it. She says — do not lose your post for my twelve piastres. He says — I will talk. They look at each other for a second longer than they have ever looked. She goes home. The twelve piastres may or may not come back next week. The foreman is a decent man. She hopes he keeps his post."
 cp_layla_vox.7203.a:0 "Home."

 # cp_layla_vox.73 -- the accident
 cp_layla_vox.73.t:0 "A Hand Caught in the Loom"
 cp_layla_vox.73.d:0 "The woman at the loom three over. Her hand was caught at the third hour. The scream ran through the hall and out."
 cp_layla_vox.73.flavor:0 "The foreman stopped the machine. Two men pulled the woman's hand free. The hand is — Layla does not know. She did not look. No one looked. The woman was carried out. The machines started again within a minute. The owner was not in the mill that day. The next day she will come back on shift and will not know, at the start, whether the woman died or lived. What does she do this evening?"
 cp_layla_vox.73.a:0 "Report it. Tell the imam. Tell the schoolteacher who writes. Tell anyone who will tell."
 cp_layla_vox.73.b:0 "Silence. Tomorrow more cotton, less talk. This is the price. The neighbourhood knows."
 cp_layla_vox.73.c:0 "Take the day. She cannot go back tomorrow. Not yet."

 cp_layla_vox.7301.t:0 "Report"
 cp_layla_vox.7301.d:0 "She goes to the schoolteacher. She says the woman's name. She says what she saw. The schoolteacher writes."
 cp_layla_vox.7301.flavor:0 "The schoolteacher is young and has opinions. The schoolteacher takes notes. The schoolteacher says — this goes in the paper this week, Um Layla, if the paper is brave. Some weeks the paper is brave. The schoolteacher's hands are shaking a little — not from fear, from fury. Layla walks home with a small lightness she does not associate with the day. She has put her name — silently, indirectly — against the owner's name. The neighbourhood will find out. The owner will find out. Tomorrow at the gate she will keep her head down. The shift will go on. Something may change in a year, or five. She has done what she could."
 cp_layla_vox.7301.a:0 "Home."

 cp_layla_vox.7302.t:0 "Silence"
 cp_layla_vox.7302.d:0 "She does not tell. She does not light the lamp at the schoolteacher's house. The shift tomorrow needs her."
 cp_layla_vox.7302.flavor:0 "The silence is not indifference. The silence is a calculation. She has a daughter. Ahmed is not well this winter. A month without the mill wage is a month they cannot have. She bends her head over the loom tomorrow as she bent it yesterday. The woman with the hand does not come back. A new woman takes the loom three over. The new woman is from the next village. The new woman keeps her own head down. Layla nods to her. The new woman nods back. This is how a floor works."
 cp_layla_vox.7302.a:0 "Sleep."

 cp_layla_vox.7303.t:0 "She Cannot Go"
 cp_layla_vox.7303.d:0 "She tells Ahmed. She says — I cannot go tomorrow. I cannot put my hand near that machine."
 cp_layla_vox.7303.flavor:0 "Ahmed does not say — you must. Ahmed does not say — we need the wage. Ahmed looks at her for a long moment and says — take the day. Layla takes the day. She sits on the step of her own house for a long time. She watches the lane. A dog goes past. A boy. The sun moves. She is aware of the exact time the shift ends at the mill, because her body has learned it; she is aware of it from four streets away. She does not go tomorrow. She does go the day after. The owner's coat is in the office; the woman with the hand is not in the mill. The world has continued without her for a day. The world would continue without her for longer. She has learned this too."
 cp_layla_vox.7303.a:0 "Go back on the second day."

 # cp_layla_vox.74 -- he speaks her name
 cp_layla_vox.74.t:0 "He Knows My Name"
 cp_layla_vox.74.d:0 "The owner passes through the hall. He says — Layla. He says it as if he has always known it."
 cp_layla_vox.74.flavor:0 "He has not always known it. He has looked her up in the ledger. He has looked her up because she is the one who asked about the twelve piastres, or because she is the one who spoke to the schoolteacher, or because the foreman mentioned her in passing, or simply because she is the shape he remembers. He passes her and says — Layla — and does not stop, does not look directly — and continues. It is a small claim. It is a claim that says — I have you by name. She keeps working. What does she think?"
 cp_layla_vox.74.a:0 "Correct him next time. Say — Um Layla, effendim. Take her name back from his mouth."
 cp_layla_vox.74.b:0 "Accept the name. Let him say it. It costs her less than the fight would."
 cp_layla_vox.74.c:0 "Ask the foreman for a transfer to the further hall. He will not learn her there."

 cp_layla_vox.7401.t:0 "She Corrects Him"
 cp_layla_vox.7401.d:0 "The next time he passes. She says — Um Layla, effendim. She is respectful. She is firm."
 cp_layla_vox.7401.flavor:0 "He stops. His eyebrows rise, very slightly. He says — Um Layla, forgive me. He walks on. She has taken her name back. She has also made a small enemy — perhaps. She has also, perhaps, made herself a small respect. The owner's floor knows what she did by end of shift. Two women who would not usually look at her look at her at the gate. They do not speak. A small current has started. She is not sure what the current will do. She is glad to have spent the coin. Her name is hers."
 cp_layla_vox.7401.a:0 "Home."

 cp_layla_vox.7402.t:0 "She Accepts"
 cp_layla_vox.7402.d:0 "She does not correct him. She lets him say Layla. She lets her name sit in his mouth."
 cp_layla_vox.7402.flavor:0 "It is not free. It costs her something. A man who calls her by her given name is a man who has reduced her to a line. She tells herself — it is only the mill. It is not the lane. At the lane I am Um Layla. At the mill I am Layla. A woman can be two names at once. She is not sure this is true. She is not sure her mother would have accepted the division. She walks home tired. Ahmed does not know. She does not tell him. The coin is spent. She does not like how the coin was spent. She will think about it again next week, when the coin comes up again."
 cp_layla_vox.7402.a:0 "Home."

 cp_layla_vox.7403.t:0 "Ask for Transfer"
 cp_layla_vox.7403.d:0 "She goes to the foreman. She asks quietly. Move me to the further hall. I will take the smaller loom."
 cp_layla_vox.7403.flavor:0 "The foreman looks at her. He does not ask why. He nods. It is done the next week. She is further from the office. Her wage is slightly less. Her back is better, actually, at the smaller loom. The owner will not remember her name after three months; his memory is for things he can see; she has removed herself from his line of sight. This is a small, practical victory and she does not make a thing of it. The further hall is quieter. The dust is the same."
 cp_layla_vox.7403.a:0 "Home."

 # cp_layla_vox.75 -- a strike at the gate
 cp_layla_vox.75.t:0 "The Gate, This Morning"
 cp_layla_vox.75.d:0 "The strike is in its third day. The foreman is in his office and will not come out. The owner is at the gate."
 cp_layla_vox.75.flavor:0 "Four women stand across the gate with their arms linked. Behind them, a dozen men. The women's arms are wet from the rain. They have been there since the first call to prayer. They are waiting for the rest of the shift to arrive. When each worker comes, they do not shout — the village has no habit of shouting at its own — they say, quietly, walk with us. Some have walked. Some have gone through. The owner, at the gate, is saying nothing. He is letting the choice happen. Layla is three paces away. What does she do?"
 cp_layla_vox.75.a:0 "Walk through. The daughter needs the wage. Her body knows the shift."
 cp_layla_vox.75.b:0 "Stand with them. Link her arm into the line. She has waited forty years for the line to form."
 cp_layla_vox.75.c:0 "Go home. Do not work and do not stand. The line is not hers to be in; neither is the machine."

 cp_layla_vox.7501.t:0 "She Walks Through"
 cp_layla_vox.7501.d:0 "She says — forgive me, sisters. She walks through. She does not look at their faces."
 cp_layla_vox.7501.flavor:0 "The women do not shame her. They do not shame any of the ones who go through. They know — the way women who have held out a morning for three days in rain know — that some of their sisters cannot afford the line. Layla cannot afford the line. Her daughter's school fees. Ahmed's cough. The short harvest. She walks in. The machine starts. The day is long. On the way out, the line is smaller, and she cannot look. At home she sits on the step for a long time before going in. She is on the wrong side of the line. She knows this. She will be on the wrong side again tomorrow. She does not know how to change it. She does know. She just cannot, yet."
 cp_layla_vox.7501.a:0 "Go in eventually."

 cp_layla_vox.7502.t:0 "She Stands"
 cp_layla_vox.7502.d:0 "She steps up. She links her arm into the end of the line. Her arm is wet against a stranger's arm."
 cp_layla_vox.7502.flavor:0 "It is not a decision she has made for weeks. It is a decision she has made in the four seconds it took to cross the gate. The woman beside her — a younger woman, thin, with red on her lower eyelid from not sleeping — says, under her breath, God bless you, mother. Layla nods. The owner, at the gate, sees her join. He does not change his face. He files the face. She knows she has done something that will cost her. She does not yet know the shape of the cost. The morning continues. Two more women join. Five more men. The line thickens. The gate, at the tenth hour, is closed."
 cp_layla_vox.7502.a:0 "Stand."

 cp_layla_vox.7503.t:0 "Home"
 cp_layla_vox.7503.d:0 "She does not walk through. She does not stand with them. She turns around and goes home."
 cp_layla_vox.7503.flavor:0 "A woman can be neither in the factory nor at the line. She can simply go home, eat her bread, hold her daughter, wait for the strike to end. This too is a choice, and it is the choice she makes. She is not proud of it and she is not ashamed of it. She is tired. The day is long without work and without protest. She is aware of the silence of her own kitchen, and of the distant silence of the mill, and of the wet silence of the line, all at once. She does not sleep well. Tomorrow: either the mill opens or the line grows. Either way she will make the same decision again, or a different one."
 cp_layla_vox.7503.a:0 "Sleep."

 # cp_layla_vox.79 -- fallback
 cp_layla_vox.79.t:0 "The Owner Did Not Come to the Floor"
 cp_layla_vox.79.d:0 "Today the foreman is at the gate. The owner is not. A whole shift without his coat."
 cp_layla_vox.79.flavor:0 "Some days the factory is only the factory. The foreman takes the count. The machines turn. The dust settles in her throat. She finishes the shift. She walks out at dark with her shawl over her hair. The lane home is quiet. Nothing has happened. This is the mill's version of rest — an absence of trouble — and she will take it, because trouble will come again soon enough."
 cp_layla_vox.79.a:0 "Home."

 # ---------------------------------------------------------------------------
 # THE STRANGER -- cp_layla_vox.80..89
 # Single-exchange scenes. The world reaches her through strangers.
 # ---------------------------------------------------------------------------

 # cp_layla_vox.81 -- a man at the well
 cp_layla_vox.81.t:0 "The Man at the Well"
 cp_layla_vox.81.d:0 "He is not from this village. His shoes are wrong for the road. His Arabic is Delta-accented but not local."
 cp_layla_vox.81.flavor:0 "He has come to the well for water. He is not a servant of anyone; he is an ordinary traveller, on his way to Mansura, perhaps, or further. He asks the way to the coast road. She is drawing water and her bucket is almost full. She looks at him once. He is young. His face is tired in the way a face is tired when one has been walking two days. He says — sister, the road that goes left at the minaret — does it reach the sea? What does she say?"
 cp_layla_vox.81.a:0 "#italic Left at the minaret, past the three palms. Past the canal. Two days on foot.#!"
 cp_layla_vox.81.b:0 "Fill the bucket. Nod once toward the road. Say nothing."

 # cp_layla_vox.82 -- news
 cp_layla_vox.82.t:0 "A Traveler with News"
 cp_layla_vox.82.d:0 "At the market, a man from Alexandria is telling the cloth-seller about a fight in the port. The cloth-seller does not want to listen."
 cp_layla_vox.82.flavor:0 "The traveller is a small man with a big mouth and a grievance. The fight in the port was about a foreign ship that was loading cotton without paying the proper tax, and about a crowd that gathered, and about a group of soldiers who came, and about three men who did not come home. He is telling it as if he had been there; perhaps he was. The cloth-seller keeps trying to sell cloth. Layla stands with her basket. What does she do?"
 cp_layla_vox.82.a:0 "Listen until he is done. Three men did not come home."
 cp_layla_vox.82.b:0 "Turn back to the cloth-seller. The news is not dinner."

 # cp_layla_vox.83 -- the beggar
 cp_layla_vox.83.t:0 "A Beggar at the Door"
 cp_layla_vox.83.d:0 "A man, thin, with a bandage on his foot, at her gate in the dust of the afternoon. He does not call out. He stands."
 cp_layla_vox.83.flavor:0 "He is not one of the village's beggars — she knows all of those by face, and has her small routines with each. He is a stranger. He does not say what he wants. He stands at the gate with his eyes somewhere below her feet. He has come two days without food, perhaps, or three; she cannot tell exactly, but she can tell the shape of it. What does she do?"
 cp_layla_vox.83.a:0 "Break a loaf. Hand him half."
 cp_layla_vox.83.b:0 "Shake her head. Close the gate."
 cp_layla_vox.83.c:0 "Bring a cup of water. That is what she can do."

 # cp_layla_vox.84 -- a woman with a story
 cp_layla_vox.84.t:0 "A Woman Sitting on the Canal Stone"
 cp_layla_vox.84.d:0 "On the path back from the well. A woman older than Layla is sitting on the canal stone with her head in her hands."
 cp_layla_vox.84.flavor:0 "Layla slows. The woman looks up. Her face is red around the eyes, and the way it is red is the way a face is red after a long walk and crying at intervals. She says — sister, sit for a moment. She does not say what is wrong. She only looks at Layla the way a person looks when they would like someone to sit."
 cp_layla_vox.84.a:0 "Sit with her. Listen to what comes."
 cp_layla_vox.84.b:0 "The bread is rising. Forgive me, sister."

 # cp_layla_vox.85 -- a child lost on the road
 cp_layla_vox.85.t:0 "A Child at the Crossroads"
 cp_layla_vox.85.d:0 "A boy, maybe five. Alone. No one on the road for the last ten minutes. He is crying without making a sound."
 cp_layla_vox.85.flavor:0 "She does not know this boy. He is not from the village; his clothes are not the village's clothes. He has wet his shoes. He is not speaking, but when she crouches in front of him he looks at her and his breath stutters and he nods slightly and does not move. What does she do?"
 cp_layla_vox.85.a:0 "Take him home. Send the neighbour's boy for the imam."
 cp_layla_vox.85.b:0 "Walk to the imam's house herself. He must be found by witnesses."

 # cp_layla_vox.86 -- a man with papers
 cp_layla_vox.86.t:0 "A Man with a Clipboard"
 cp_layla_vox.86.d:0 "He has come to the door. His clipboard has a stamp on the top. He says he is from the district office."
 cp_layla_vox.86.flavor:0 "The stamp is official. The man's hands are soft. He is not the tax collector; she knows the tax collector. He is not the recruitment man; she knows that uniform. He is a census man, or an insurance man, or a man from the new water authority, or a ministry man; she cannot tell. He would like to record her name, her husband's name, her children, the size of the household, the size of the field. He has a pencil poised. What does she say?"
 cp_layla_vox.86.a:0 "Sign. The state that writes you is the state that finds you when you need it."
 cp_layla_vox.86.b:0 "Refuse. Come back when my husband is here."
 cp_layla_vox.86.c:0 "What is this for, effendim? Tell me."

 # cp_layla_vox.89 -- fallback
 cp_layla_vox.89.t:0 "The Road, Empty Today"
 cp_layla_vox.89.d:0 "No strangers. No news. No faces not-of-the-village. A quiet afternoon."
 cp_layla_vox.89.flavor:0 "Some days the world stays beyond the horizon. She does the bread. She does the oven. She does the yard. A fly bothers her. A dog goes past. The village is at its ordinary pulse. She is aware, with some surprise, that she is a little grateful for a day without strangers, and that a day without strangers is a day she will not remember a year from now, and that she does not mind."
 cp_layla_vox.89.a:0 "To the oven."

