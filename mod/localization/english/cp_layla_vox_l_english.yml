 # ---------------------------------------------------------------------------
 # AHMED -- cp_layla_vox.10..19
 # ---------------------------------------------------------------------------

 # cp_layla_vox.11 -- at war, the letter hasn't come
 cp_layla_vox.11.t:0 "The Letter That Has Not Come"
 cp_layla_vox.11.d:0 "She is folding cloth at the window. The post came this morning and went on past the house."
 cp_layla_vox.11.flavor:0 "Eight weeks. She has counted them the way she counts the beans in the pot, flat-palmed, twice over. The last letter came in the month of the date harvest and was four lines long — he was well, the captain was strict, the bread in camp was bad, he thought of her. She has read those four lines until the paper softened at the folds. Tonight she is folding a shirt of his that she keeps washed because not washing it would be an admission. Ahmed, she says in her head — she is not a woman who speaks aloud to an empty room — Ahmed, where are you tonight. She imagines him imagining her. She imagines him between two things, a sentry's post and a bowl of camp soup, not thinking of her at all, because a man at war is a man who thinks only of the ground under his feet, and she is glad for that, because a husband who thinks of home too much is a husband who does not come home. She holds the shirt against her face for one second, two. She does not cry. She folds it the way he folded them when they were first married — corners first, the way his mother taught him — and she puts it in the chest."
 cp_layla_vox.11.a:0 "Say nothing. Let the silence be its own message."
 cp_layla_vox.11.b:0 "Go to the neighbour and ask if her son's letter came this month."
 cp_layla_vox.11.c:0 "Write something to him in her head, and never send it."

 cp_layla_vox.1101.t:0 "The Silence That Is Prayer"
 cp_layla_vox.1101.d:0 "The shirt is folded. The chest is closed. The oil lamp has not been lit yet; the room is dim in the way a room is dim just before a woman lights the lamp."
 cp_layla_vox.1101.flavor:0 "Some kinds of prayer are the refusal of words. She has learned this from her mother, who spent the last year of her life not saying the thing she thought about her husband, not saying the thing she thought about her daughter's marriage, not saying the thing she thought about the field. Her mother held those unsaid things like stones in a pocket, and the pocket did not tear. Layla has a smaller pocket. She is not sure it does not tear. She stands at the window. A boy goes past on a mule. The mule is the colour of ashes. She watches until the mule is at the end of the lane, and then she lights the lamp."
 cp_layla_vox.1101.a:0 "Close the shutters."

 cp_layla_vox.1102.t:0 "Um Hassan Has Had No Letter Either"
 cp_layla_vox.1102.d:0 "She crosses the lane. Um Hassan is at her own door, winnowing. The old gesture, the sieve against the hip."
 cp_layla_vox.1102.flavor:0 "Nothing from Cairo this month, sister, Um Hassan says before Layla asks. Nothing from the north either. A cousin of the grocer's said there was a fight somewhere near Damietta, but a cousin of the grocer's said there was a flood in the mountains last year, and there is no flood in the mountains. Do not go from this on every rumour, sister. Eat. If he is not well, you will hear. That is the way. She squeezes Layla's wrist once and lets go. Layla walks home and knows, without being told, something she did not know before — that other women in other houses on this lane are counting the weeks too, each in her own kitchen, each alone. There is a small company in this. Not comfort. Company."
 cp_layla_vox.1102.a:0 "Go home and start the second loaf."

 cp_layla_vox.1103.t:0 "A Letter in the Head"
 cp_layla_vox.1103.d:0 "She writes it on the way to the oven. She writes it back from the oven. It is a letter she cannot send because she cannot write and because she does not know where to send it."
 cp_layla_vox.1103.flavor:0 "My husband. The hen laid this week, two eggs. Your mother asked after you on Friday and I told her you were well. I have not told her otherwise because she is old and it would be a wound, and a wound in an old woman is a wound that does not close. Your tobacco tin is on the sill where you left it. I have not opened it. I will not open it. When you come back you will see it there and you will know I kept it the way you kept it. Do not come back thin. Do not come back angry. Come back as you were, or come back changed — I will take the changed man — but come back. The bread is good this week. The flour we bought in Nazer. It made me think of that year when you came with the cart and the axle broke near the canal. We laughed at that. Remember? I am laughing a little, remembering. Come back, Ahmed. That is the only letter. That is the whole letter."
 cp_layla_vox.1103.a:0 "Close the oven. Start again tomorrow."

 # cp_layla_vox.12 -- newly married, the first year
 cp_layla_vox.12.t:0 "The First Year"
 cp_layla_vox.12.d:0 "She is still a young wife. She is still surprising herself. The house is still a house they are learning."
 cp_layla_vox.12.flavor:0 "They have been married not quite a year. In the mornings there is still a strangeness to seeing his shoes by the door that were not there a year ago. In the evenings there is still a strangeness to his silence, which is a different kind of silence than her brother's was or her father's, and which she is learning. She has burned the bread twice this month. The first time he said nothing and ate it. The second time he laughed once, quietly, and said that it was the pan. She knows it was not the pan. She knows he knows it was not the pan. She knows they will not speak of it. There is a kindness in what they do not speak of. She watches him at the rim of the oven tonight, testing the heat with the back of his hand — her grandfather tested heat that way too — and she feels something she cannot name and will not try to name. What does she think of tonight?"
 cp_layla_vox.12.a:0 "The way his hand was on hers longer than it had to be, that morning."
 cp_layla_vox.12.b:0 "The way he said Layla on the second night, quietly, as if the word were a door."
 cp_layla_vox.12.c:0 "The bread burned the second time, and what he did not say."

 cp_layla_vox.1201.t:0 "The Second Too Long"
 cp_layla_vox.1201.d:0 "A small thing. A hand on hers at the door with the bucket. One second longer than the handing-over required."
 cp_layla_vox.1201.flavor:0 "She has turned this second over many times, not to examine it, but because it is a warm stone in her palm. She does not believe a man lives his whole marriage at that pitch; she was not raised to expect it. Her mother did not. Her grandmother did not. But she had the second. She has kept it. She is aware that to keep a second is the whole project of a woman's memory — that her mother's memory was a string of seconds, one in a wedding, one in a field, one in the kitchen on the day the second daughter was born — and that she is now building her own string. This one is hers. She puts it in the pocket she does not know she has."
 cp_layla_vox.1201.a:0 "Carry the bucket in."

 cp_layla_vox.1202.t:0 "The Way He Said Layla"
 cp_layla_vox.1202.d:0 "Not the way her brothers said it. Not the way her father said it. A new way, which is its own thing."
 cp_layla_vox.1202.flavor:0 "The word is the same word. But there is a way a man says a woman's name that is asking her permission, and there is a way a man says a woman's name that is not asking. Ahmed's way, that second night, had been neither. It had been something else, something she did not have a word for, and which she did not want to have a word for, because having a word for it would have taken the shape off it. She is aware, in the way young wives are sometimes cruelly aware, that the word as he said it had been simply — Layla, I am here. She had not known that was a way. She had known the declaring and the asking. She had not known the being-here. She turns it in her head in the lamplight and does not look at him, and he, across the small room, turns a page in his cousin's letter and does not look at her."
 cp_layla_vox.1202.a:0 "Let the lamp burn a little longer."

 cp_layla_vox.1203.t:0 "The Bread Burned a Second Time"
 cp_layla_vox.1203.d:0 "The smell of it was in the house for two days afterward. The loaf she had bought from Um Hassan, while the true one cooled in shame on the ledge."
 cp_layla_vox.1203.flavor:0 "What he did not say was the entire size of the marriage. A worse man would have joked. A harder man would have gone quiet — the hard quiet, not the kind quiet. He had gone the kind quiet. He had picked up the burned loaf and set it on the ledge, and gone to the door, and come back with the bought loaf, and said, in his steady voice — well, the pan's getting old. The pan was not getting old. The pan was nine months old and made by her uncle. Ahmed knew this. Ahmed was saying a thing that was not true so that another thing would not have to be said. Her grandmother had taught her that a man who says an untrue thing to protect a woman is a kind of prayer. She had been impatient with her grandmother at the time. Tonight, many months later, at the window with the shirt folded, she understands."
 cp_layla_vox.1203.a:0 "Turn from the window."

 # cp_layla_vox.13 -- home from the fields
 cp_layla_vox.13.t:0 "Salt on His Neck"
 cp_layla_vox.13.d:0 "He comes in from the west field with the sun behind him. He has not spoken yet. He will wash first."
 cp_layla_vox.13.flavor:0 "The way a man comes in from a day of cutting is not the way a man comes in from a day of nothing. His shoulders are a particular height. His hands hang a particular way. He sits on the threshold to unlace his shoes because the room is still clean and he is not. She brings him the water. He drinks half of it and pours the rest over his neck, and she watches the salt come off him in a dark line on the threshold. She has watched this a thousand times. She will watch it, she hopes, a thousand times more. He looks up at her. He says — the eastern strip is ready. She does not answer immediately. A man who says a thing about the field is a man who is not saying a thing about himself. She has learned the waiting."
 cp_layla_vox.13.a:0 "Sit on the step beside him without speaking."
 cp_layla_vox.13.b:0 "Ask about the harvest: how much, how good, how late."
 cp_layla_vox.13.c:0 "Go in and bring the bread out instead of waiting."

 cp_layla_vox.1301.t:0 "The Step, Shared"
 cp_layla_vox.1301.d:0 "She sits. She does not put her hand on him. The threshold is warm from the sun."
 cp_layla_vox.1301.flavor:0 "They sit. A bird goes past, low, over the lane. A child shouts in a yard four houses down and is shushed by a mother. The light in the west field goes from gold to copper to the colour of cold tea. He puts his hand, palm up, on his own knee. It is an invitation without a word. She puts her hand in his. She feels the cut on his thumb he did not tell her about. They sit until the light is gone. She says — the bread is inside. He says — in a moment. In a moment is what he says when he means, let me have you, still, for a little longer."
 cp_layla_vox.1301.a:0 "A little longer."

 cp_layla_vox.1302.t:0 "How Much, How Good"
 cp_layla_vox.1302.d:0 "She asks because a woman asks. She also asks because not asking would tell him she knew the answer was bad."
 cp_layla_vox.1302.flavor:0 "Three sacks, he says, short of what it should be. The bailiff will take two. The third will be split with the water-share. She does the math the way her mother taught her, silent, on the steps of the kitchen — enough for three months of bread if they are careful, two if they are generous with the neighbours, and there will not be enough to be generous with the neighbours. She does not say this. He does not say this. They both know. The bad year is already a word in the air between them, and they have agreed, without agreeing, not to say it before the oven is lit."
 cp_layla_vox.1302.a:0 "Start the second loaf."

 cp_layla_vox.1303.t:0 "The Bread, Brought Out"
 cp_layla_vox.1303.d:0 "She does not wait for him to come inside. She brings the whole plate out to the step."
 cp_layla_vox.1303.flavor:0 "It is a small, sudden gesture and she does not know why she made it. Perhaps it was the way the salt came off his neck. Perhaps it was the light in the west field, which was already going. She sits down next to him and the plate is between them and she tears the loaf and hands him half. He looks at the half in his palm as if it is a curious thing. He eats. She eats. Across the lane a dog barks once and is quiet. After the bread he says — I thought we would eat inside tonight. She says — we can. We did. A kind of laugh goes between them that is not quite a laugh. She will remember this step, this bread, this not-quite-laugh. She does not know it. But she will."
 cp_layla_vox.1303.a:0 "Carry the empty plate in."

 # cp_layla_vox.14 -- the mill
 cp_layla_vox.14.t:0 "Oil on His Shirt"
 cp_layla_vox.14.d:0 "He has come from the mill. He smells of oil and of a kind of quiet that is not the village quiet."
 cp_layla_vox.14.flavor:0 "The mill has changed him in a way she cannot yet name. He used to come in from the fields loud — not loud in words, loud in body, his shoulders telling her what the day had been. He comes in from the mill small. He hangs the coat with the oil stain on it on the peg by the door and does not look at her before he sits. The coat used to be one coat. It is now the coat-for-the-mill and the coat-for-Friday, and she washes the mill coat alone in a pot with lye because the oil will not come out with soap. She has a small cut on her thumb from the lye. She shows him nothing. He shows her nothing. They eat."
 cp_layla_vox.14.a:0 "Ask about the child who coughs at the door."
 cp_layla_vox.14.b:0 "Look at the coat on the peg. Not at him."
 cp_layla_vox.14.c:0 "Take the tobacco tin off the sill and set it beside his plate."

 cp_layla_vox.1401.t:0 "The Child at the Gate"
 cp_layla_vox.1401.d:0 "There is a boy who coughs on the gate of the mill at shift-change. Ahmed has mentioned him twice. She has noted the twice."
 cp_layla_vox.1401.flavor:0 "What is the boy's name, she asks. He looks up. He does not want to say the name. He says it. She repeats it once. The cough was worse this week, he says. I think it is the dust. The dust is the dust of raw cotton, he says — and she understands, suddenly, that he has been breathing it too, that the stain on the coat is not just oil, that the quiet is not just fatigue. He eats. She eats. She says — bring him bread tomorrow if he is there. He says — all right. He does not say the rest. The rest is that he will bring the boy bread and the boy will cough less for two days and then cough more."
 cp_layla_vox.1401.a:0 "Wash the mill coat again tomorrow."

 cp_layla_vox.1402.t:0 "The Coat on the Peg"
 cp_layla_vox.1402.d:0 "She looks at the coat instead. A political thing. She does not know yet that it is a political thing."
 cp_layla_vox.1402.flavor:0 "The coat says several things. It says there is a man somewhere who owns the mill. It says that man does not wash his own coat. It says the coat is stained because the oil the machines use is not the oil a kinder machine would use. It says — and this is the thing she feels forming in her like a second loaf rising, slower — that the hours Ahmed spends at the mill are hours he does not spend at home, that the village knows this, that the village has opinions about this, that the bey who comes less now comes less because the money is going somewhere else and the somewhere else is the mill, and that the mill is a kind of bey of its own kind, and that she does not yet have a word for a bey that is not a man. She has only the coat on the peg. She looks at the coat. She looks at Ahmed. She says nothing."
 cp_layla_vox.1402.a:0 "Take the plate away."

 cp_layla_vox.1403.t:0 "The Tin, Beside the Plate"
 cp_layla_vox.1403.d:0 "She takes it from the sill and sets it down. A small offering, wordless."
 cp_layla_vox.1403.flavor:0 "He looks at the tin. He looks at her. For a moment he does not understand, and then he understands, and he does not say what he understands because the understanding is the gift. He reaches for the tin and rolls a cigarette, and lights it, and leans back against the wall of the house and smokes slowly. The oil smell of the coat mixes with the tobacco smell and becomes, for a breath, not-the-mill. She sits across from him. Neither of them speaks. This is a marriage. Someone watching from outside would not see it. It does not matter."
 cp_layla_vox.1403.a:0 "Refill the cup."

 # cp_layla_vox.15 -- before sleep
 cp_layla_vox.15.t:0 "The Room, Dark"
 cp_layla_vox.15.d:0 "The lamp is out. The door to the lane is ajar for the draft. She is lying with her back to him and her face to the wall."
 cp_layla_vox.15.flavor:0 "In daylight a marriage is a house and a kitchen and a door and two bodies moving between them in a sequence. In the dark it is a different kind of house. He is breathing behind her, slowly, not yet asleep. She can tell by the weight of the breath. He turns once. The mat creaks. She does not move. There is a way of lying beside a man that is asking, and a way of lying that is telling him not to ask, and a way that is simply being there. She is being there. The draft through the door is cool on the top of her head. A dog barks twice, far. She thinks — not in words, not quite — that this is the shape of her life. The wall in front of her. The man behind her. The door ajar. The dog. The dark."
 cp_layla_vox.15.a:0 "Reach back and put her hand on his shoulder without turning."
 cp_layla_vox.15.b:0 "Lie awake. Listen to him slip down into sleep."
 cp_layla_vox.15.c:0 "Think of the door she left ajar today and did not close."

 cp_layla_vox.1501.t:0 "Her Hand, Behind Her"
 cp_layla_vox.1501.d:0 "She reaches back without turning. He is there."
 cp_layla_vox.1501.flavor:0 "He covers her hand with his. He is not asleep after all. For a while they breathe at the same rate, in an accident that will pass. Then she is asleep. Then he is asleep. The dog barks again. The wall in front of her fades. Nothing in the room changes. Everything in the room has changed. A woman of the city would say — we held hands. A woman of the village would not say anything. The village does not have a word for it because the village has other words that work better. Ahmed's hand is heavier than hers. His hand is drier. His hand smells faintly of the oil from the mill, even after the washing. She does not mind. She does not mind any of it."
 cp_layla_vox.1501.a:0 "Sleep."

 cp_layla_vox.1502.t:0 "The Slow Falling"
 cp_layla_vox.1502.d:0 "She does not sleep. She listens. He does not know she is listening."
 cp_layla_vox.1502.flavor:0 "His breathing changes in stages. First the steady slow of a man who is still thinking. Then the deeper slow of a man who has stopped thinking but not yet gone over. Then the softer, smaller breath, almost like a child's, of a man who has gone over. She has listened to him make this journey a thousand nights. She could draw it on paper if she could draw. She cannot draw. She can only lie with her face to the wall and listen to him slip, stage by stage, into sleep, and know — as a woman knows a thing by the shape of it, without words — that she is the only other person in the world who knows the sound of him going. That is a kind of property. A kind of paper. With her name on it."
 cp_layla_vox.1502.a:0 "Close her eyes."

 cp_layla_vox.1503.t:0 "The Door, Ajar"
 cp_layla_vox.1503.d:0 "She had meant to close it. The draft has been good. She has forgotten."
 cp_layla_vox.1503.flavor:0 "The door ajar is a small thing. It is also a larger thing. In a year the door was always closed, because she was a new wife and everything had to be right. In year three she left it ajar once. He closed it. In year seven she leaves it ajar sometimes and he does not close it. It is a door that has learned her. She thinks, lying with her face to the wall — has he changed, or have I changed, or have we changed the door. Probably the door. Probably all three. She falls asleep with the question in her mouth, and the door open, and the dog far, and her husband behind her, and the wall in front."
 cp_layla_vox.1503.a:0 "Close her eyes."

 # cp_layla_vox.16 -- old age
 cp_layla_vox.16.t:0 "His Knees on the Mat"
 cp_layla_vox.16.d:0 "He is praying at the second call. The mat is the good one, the one from her mother's house. His knees crack when he kneels."
 cp_layla_vox.16.flavor:0 "She has watched him pray since they were newly married, and he has watched her, and in that time neither of them has remarked on it. This week, twice, she has noticed the crack of his knees on the mat. It is not a thing she has heard before. A woman of the village would say — his knees are getting old, God preserve him. She does not say it. She only watches, sitting by the door where she has been since he began. His back is still straight. His shoulders are still a particular height. But the knees. The knees are new. She is aware, watching him, that she is watching — somewhere in the far distance — an old man. Not today. Not next year. But the road is there, and he is walking it, and one day she will see him walk it at an angle she does not yet know."
 cp_layla_vox.16.a:0 "Bring him water when he is done, as she always has."
 cp_layla_vox.16.b:0 "Tell him the old joke about her grandfather's knees. Make him laugh once."
 cp_layla_vox.16.c:0 "Be still beside him after the prayer, and say nothing."

 cp_layla_vox.1601.t:0 "The Cup, as Always"
 cp_layla_vox.1601.d:0 "She brings the water in the brass cup. He drinks half, gives her the rest."
 cp_layla_vox.1601.flavor:0 "The ritual is the marriage. She has not understood this until tonight. A younger woman would have said — the love is the marriage. An older woman would have said — the cooking is the marriage. Tonight she understands that the ritual is the marriage, that the half-cup-and-the-rest-to-her is the marriage, that the moment he passes her the cup without looking is the marriage. She takes the cup with both hands, which she has not always done. She drinks. He watches her drink. They do not speak. The mat is rolled up and set behind the door. The cup is rinsed and dried and put back."
 cp_layla_vox.1601.a:0 "Put the mat away."

 cp_layla_vox.1602.t:0 "Her Grandfather's Knees"
 cp_layla_vox.1602.d:0 "The old joke. Her grandfather, she says, swore his knees were a weather station — they told him when it would rain. He laughs quietly, once."
 cp_layla_vox.1602.flavor:0 "He laughs from the belly. It is a small laugh, it does not carry past the walls, but it is the laugh. She has not heard it this week. She has not heard it often this month. She knows — in the way a wife knows, not by counting but by a thing like a barometer in the chest — that the laugh is what she has been low on. He wipes one eye with the back of his hand. He says — and so, are your knees a weather station. She says — they are a calendar. He laughs again. The knees crack when he stands. Neither of them says it."
 cp_layla_vox.1602.a:0 "Fold the mat."

 cp_layla_vox.1603.t:0 "Stillness Beside Him"
 cp_layla_vox.1603.d:0 "She does not speak. She does not bring water. She sits."
 cp_layla_vox.1603.flavor:0 "It is a kind of prayer of her own. Not the words of the prayer — she does not know all the words anymore, and when she tries she realises her mother's rhythm is louder in her head than the imam's. She sits in the after-prayer silence that is his, because forty-five years of marriage has taught her that a man after prayer is a man between two rooms, and the kindest thing she can do is not to interrupt either room. He puts his hand, palm up, on the mat. She puts her hand on his. His hand is drier than it was. Hers is drier too. They sit until the evening call. Then the evening call. Then his hand pulls gently away, and he rolls up the mat, and the world returns to its chores."
 cp_layla_vox.1603.a:0 "Start the supper."

 # cp_layla_vox.19 -- fallback
 cp_layla_vox.19.t:0 "Tonight He Is Only Ahmed"
 cp_layla_vox.19.d:0 "Nothing is happening. He is by the door. The tobacco is in the tin on the sill."
 cp_layla_vox.19.flavor:0 "Some nights a husband is just a husband. The mill was today, it will be tomorrow; the field was last week, it will be next week; the cough in his chest was there last year and will be there next. Tonight he is none of those. He is the man who set his shoes in the usual corner. She watches him from the oven. He looks up. He smiles a small smile. She smiles back. Neither of them smiles quite like that at anyone else. This is not a political thing. It is not a narrative thing. It is a Tuesday."
 cp_layla_vox.19.a:0 "A small, ordinary evening."

