 # DAUGHTER -- cp_layla_vox.20..29
 # ---------------------------------------------------------------------------

 # cp_layla_vox.21 -- a question she cannot answer
 cp_layla_vox.21.t:0 "Why Does the Bey Come"
 cp_layla_vox.21.d:0 "The daughter is seven. She is sitting on the step with a stick, drawing in the dust. She has asked the question without looking up."
 cp_layla_vox.21.flavor:0 "The question is exact, the way a child's question is exact. Why does the bey come, Mama, on the day you are at the oven. Layla is at the oven. The fire is low. Her daughter is drawing a horse that looks more like a dog. The dust around the horse-dog is the dust the bey's mare left last week. A lesser mother would say — he comes because the field is not ours. A more frightened mother would say — do not ask such things. Layla is neither. Layla is the mother who knows that the answer she gives tonight is the answer the girl will carry into her own marriage, into her own oven, into her own dust. What does she say?"
 cp_layla_vox.21.a:0 "Tell her the truth: the field is ours but the paper is not, and that is why he comes."
 cp_layla_vox.21.b:0 "Tell her not to ask such things. There is a price to questions."
 cp_layla_vox.21.c:0 "Tell her a story instead — the one about the heron and the fisherman."

 cp_layla_vox.2101.t:0 "The Field Is Ours"
 cp_layla_vox.2101.d:0 "She says it quietly. She does not kneel. She does not soften. She says it the way she would say the day of the week."
 cp_layla_vox.2101.flavor:0 "The field is ours. The paper is not. The paper is in Cairo, in a drawer. The bey has the paper. The paper is a piece of cloth with black marks on it. The black marks say the field is the paper's. The field is older than the paper. Grandmother is older than the paper. The paper will die one day. The field will not. The daughter looks up from her horse-dog. She does not ask the next question. She has understood the only question she needed to understand — that there are two kinds of ownership in the world, and that her mother knows them both. The bey will come again tomorrow. She will be ready."
 cp_layla_vox.2101.a:0 "Go back to the oven."

 cp_layla_vox.2102.t:0 "Do Not Ask"
 cp_layla_vox.2102.d:0 "She softens the rebuke. She cannot help it. But she says it: do not ask such things."
 cp_layla_vox.2102.flavor:0 "A mother's hand on the top of a daughter's head. The girl does not understand but also understands. She goes back to drawing. The horse becomes a boat. The boat becomes another dog. Layla turns to the oven and does not cry. She has said the thing her mother said to her and her grandmother said to her mother. She has extended the silence by a generation. She tells herself this is prudence. She hopes it is prudence. She is not sure it is prudence. The bread blackens on one side before she remembers to turn it."
 cp_layla_vox.2102.a:0 "Turn the loaf."

 cp_layla_vox.2103.t:0 "The Heron and the Fisherman"
 cp_layla_vox.2103.d:0 "She tells the story. The heron is clever. The fisherman is patient. The river is the longer one."
 cp_layla_vox.2103.flavor:0 "The daughter knows this story. The daughter likes this story. Layla has told it to her a dozen times. The daughter laughs at the fisherman's patience and claps for the heron's cleverness and falls silent at the end, when the heron flies away with the fish and the fisherman goes home with nothing but a wet shirt. The daughter says — but Mama, who is the heron. Layla says — sometimes we are the heron. Sometimes we are the fisherman. Today we are kneading bread. Tomorrow who knows. The daughter laughs and returns to her stick in the dust. She does not ask again why the bey comes. Perhaps tomorrow. Perhaps in ten years. But not tonight. Tonight the bread is almost ready."
 cp_layla_vox.2103.a:0 "Shape the second loaf."

 # cp_layla_vox.22 -- teaching her to knead
 cp_layla_vox.22.t:0 "The First Loaf"
 cp_layla_vox.22.d:0 "The daughter is nine. The dough is too dry. The girl's hands are smaller than Layla remembers her own being."
 cp_layla_vox.22.flavor:0 "Her mother taught her on a table that was too high. She had to stand on a box. The box was a wooden one that had held raisins once, and the raisin-smell was still in the wood, and even now — thirty years later — the smell of a raisin is the smell of learning to knead. Her daughter has no box. The table is the right height. The dough is too dry because the girl was afraid to add water, and Layla did not help, because there is a shape to a first loaf that must be shaped by the hands of the person learning, and not by the hands of the person teaching. The girl is about to give up. She looks at her mother. What does Layla do?"
 cp_layla_vox.22.a:0 "Praise the dough. Let her keep going. She is doing well enough."
 cp_layla_vox.22.b:0 "Take it back. Redo it. Show her what it should look like."
 cp_layla_vox.22.c:0 "Say nothing. Add water to her own dough — a silent correction she can follow."

 cp_layla_vox.2201.t:0 "It Is Becoming Bread"
 cp_layla_vox.2201.d:0 "She says it in the small voice she uses when she means it. Not the everyday voice."
 cp_layla_vox.2201.flavor:0 "It is becoming bread, she says. The daughter looks up. The daughter is too young to know that bread can become other things too — cake, biscuit, a rockfall by the oven wall — and she hears the word only. Becoming bread. She pushes the dough again. It is still too dry. Layla watches. The dough will be bread, just. It will be a tighter loaf than Layla's own. The family will eat it for breakfast. The father will say — this is a good loaf. He will not know his daughter made it. She will tell him. He will take her into his arms and hold her against his chest the way he held Layla once, after her first loaf, thirty years ago. The kitchen is a continuous thing. It goes on without asking."
 cp_layla_vox.2201.a:0 "Wipe her hands on the apron."

 cp_layla_vox.2202.t:0 "Again"
 cp_layla_vox.2202.d:0 "She takes the loaf back. She kneads it herself, quickly, with water. She hands it back."
 cp_layla_vox.2202.flavor:0 "Again, she says. She does not mean it to sound harsh. It sounds harsh. The daughter's face goes briefly still. She takes the dough. She kneads it. It is better now, because Layla fixed it, not because the daughter fixed it. The loaf is bread. The daughter does not eat much of it at dinner. Ahmed notices. He looks at Layla. Layla looks away. She did not mean the again to be that kind of again. But the daughter heard it as that kind of again. She will have to undo it tomorrow. She is not sure she can."
 cp_layla_vox.2202.a:0 "Clean the table."

 cp_layla_vox.2203.t:0 "Add Water to Her Own"
 cp_layla_vox.2203.d:0 "She says nothing. She reaches for her own bowl. She adds a spoonful of water. The daughter watches without seeming to watch."
 cp_layla_vox.2203.flavor:0 "A minute passes. Two. The daughter's hand, without her seeming to decide, goes to the water jar. A spoonful into her bowl. The dough changes. Her mother, who is watching without watching, does not look up. The kneading continues. The daughter is kneading a loaf that she added water to of her own accord, which she will remember in twenty years, which she will teach her own daughter to do, without ever being told — add water if the dough is dry. It is a secret and it is not a secret. It is the way knowledge goes from hand to hand in a country where the women cannot read."
 cp_layla_vox.2203.a:0 "Let her finish."

 # cp_layla_vox.23 -- the daughter reads aloud
 cp_layla_vox.23.t:0 "She Reads to Me"
 cp_layla_vox.23.d:0 "The daughter has a thin book from the school. She has read two pages of it aloud tonight at the lamp."
 cp_layla_vox.23.flavor:0 "Layla cannot read. She has never read. She has looked at the shapes on the coffee tin and the market scales and the registry-clerk's ledger without understanding, and she has made her peace with not understanding. Tonight the shapes have come into her house. The book is thin, with a blue cover and a drawing of a boy and a donkey. The boy is learning letters from the donkey. Her daughter is learning letters from the boy. Her daughter is reading to her — in a voice so clear, so unhurried, so unlike her mother's — that Layla is aware, sitting in the corner, that she is in the presence of a thing she did not make. Which is a mother's first humility and her last pride. What does she do?"
 cp_layla_vox.23.a:0 "Pretend to understand the whole passage. Nod at the right places."
 cp_layla_vox.23.b:0 "Ask the daughter to read it again, slowly, because it was beautiful."
 cp_layla_vox.23.c:0 "Say she is proud. Say it aloud. Say it even if it shakes."

 cp_layla_vox.2301.t:0 "The Nodding"
 cp_layla_vox.2301.d:0 "She nods. She looks at her hands. The daughter, at the lamp, is pleased."
 cp_layla_vox.2301.flavor:0 "A pretence is a cowardice. She knows this. She nods anyway, because the alternative is to say — I do not understand what you just read — and she does not want to say that in front of the child tonight. Not yet. Later. When the girl is older, when the girl already knows. She nods at the right places because she has listened to the cadence, because the cadence is a thing you can read without reading, because her own mother nodded at the cadence of the imam in a mosque whose words her mother also did not understand. It is an old nod. She has inherited it. She will not pass it on. Tomorrow, perhaps, she will say — read it to me slowly, child. Tomorrow. Not tonight. Tonight the lamp is bright and the girl is pleased and the house is quiet."
 cp_layla_vox.2301.a:0 "Blow out the lamp."

 cp_layla_vox.2302.t:0 "Again, Slowly"
 cp_layla_vox.2302.d:0 "She asks. The daughter looks up. The daughter understands."
 cp_layla_vox.2302.flavor:0 "Read it to me again, the mother says, and slowly, because it was beautiful. The daughter does not say — you did not understand it, did you. The daughter says — of course, Mama. The daughter reads it again, the way a child reads to a grandmother, slower, with the vowels held, with a small ceremony. Layla catches three words this time. Three words in a passage of many. The three words are — the boy returned home. She will remember those three words for the rest of her life. She will think of them on the night her husband does not come back from the mill, and the night her grandson goes away to Cairo, and the night she herself closes her eyes for the last time. The boy returned home. A sentence she did not know she was keeping. A sentence her daughter gave her."
 cp_layla_vox.2302.a:0 "Hold the daughter's hand for a moment."

 cp_layla_vox.2303.t:0 "I Am Proud"
 cp_layla_vox.2303.d:0 "She says it with the shake in it. She does not pretend the shake is not there."
 cp_layla_vox.2303.flavor:0 "I am proud of you, she says. The girl looks up. There is a second in which the girl is about to say — I know, Mama — in the way a child does, lightly. Instead the girl sees something in her mother's face and does not say it. The girl puts the book down. The girl comes across the room and puts her arms around her mother's neck. Her mother does not cry — she has decided not to cry — but the girl feels the decision in her mother's shoulders and does not let go for a long time. When she lets go, the mother says — read it to me again tomorrow. The girl says — I will read it every night. The mother says — do not promise. The girl says — I promise. The lamp burns down. Neither of them blows it out."
 cp_layla_vox.2303.a:0 "Go to sleep later than usual."

 # cp_layla_vox.24 -- the daughter leaving
 cp_layla_vox.24.t:0 "The Bag at the Door"
 cp_layla_vox.24.d:0 "The bag is the one Layla carried when she was married and came to this house. Her daughter is taking it tomorrow."
 cp_layla_vox.24.flavor:0 "The daughter is sixteen. Or eighteen. Or old enough for the mother to have lost the count in the way a mother loses the count when the count begins to hurt. There is a husband waiting three villages over, or a position with a teacher in Cairo, or a brother-in-law who will take her to the railway. The destination does not matter. The bag is the same bag. Inside the bag is a folded cloth from Layla's own mother — three folds, always three — and a small brass comb that was her grandmother's, and a note Layla cannot write, so there is no note. There is, instead, a pomegranate in the bag that will not survive the journey but will be eaten at the first stop. The daughter is asleep. The bag is by the door. What does Layla do?"
 cp_layla_vox.24.a:0 "Let her go tomorrow. Do not keep her. Kiss her hair and send her."
 cp_layla_vox.24.b:0 "Ask her to stay one more night. One more morning. One more something."
 cp_layla_vox.24.c:0 "Take the mother's shawl from the chest and put it in the bag."

 cp_layla_vox.2401.t:0 "Let Her Go"
 cp_layla_vox.2401.d:0 "She lets her go. In the morning she kisses the hair. She does not cry at the door. She cries later, at the oven."
 cp_layla_vox.2401.flavor:0 "To let a daughter go is an act of marriage with the future. A mother who keeps her keeps her own child against her own child's life. Layla is not that mother. Her mother was not that mother. It is the inheritance she is passing down — not the comb, not the cloth, but the letting go. The daughter walks the lane with the bag. The boy from three houses down is waiting with the mule. The mule is the colour of ashes. The daughter turns once at the corner and waves. Layla waves. The corner takes her. Layla stands at the door for a moment, then the oven, then the corner. The corner is empty. It will be empty a long time."
 cp_layla_vox.2401.a:0 "Begin the bread."

 cp_layla_vox.2402.t:0 "One More Night"
 cp_layla_vox.2402.d:0 "She goes to where the daughter is sleeping. She sits on the edge of the mat."
 cp_layla_vox.2402.flavor:0 "She does not wake her. She knows, kneeling, that she will not ask for one more night. She knows this the way a woman knows the weight of a thing she has decided not to pick up. She sits. She watches the girl breathe — the girl's breath is exactly Ahmed's breath, in exactly his rhythm, which she had not noticed before, or had noticed and not let herself notice. She leans down and kisses the girl's forehead. The girl does not wake. The girl's breath changes slightly and goes back. The mother stands, her knees complaining, and goes back to the other room, and does not say, tomorrow, what she had thought about saying. One more night was a thing for herself, not for the daughter. She did not take it. This is who she is."
 cp_layla_vox.2402.a:0 "Close the inner door softly."

 cp_layla_vox.2403.t:0 "The Mother's Shawl"
 cp_layla_vox.2403.d:0 "She takes it from the bottom of the chest. The smell of it is the smell of her own mother's house."
 cp_layla_vox.2403.flavor:0 "The shawl was her grandmother's before her mother's. It has been folded in this chest for twenty years. The colour has faded in the folds — there is a deep plum at the edges, and a pale plum at the centre — and the edge is fraying where the grandmother's hand always went. Layla knew exactly where the grandmother's hand went. She has taken the shawl out once a year, on the day of her own mother's death, and aired it, and folded it back. Tonight she is folding it into the bag. It will smell of her grandmother when the daughter unpacks it in whatever room she opens it in. The daughter will smell it and know — without being told, because some kinds of knowing do not need telling — who has sent her off. The shawl, the comb, the cloth, the pomegranate. What a woman sends into the future."
 cp_layla_vox.2403.a:0 "Close the bag."

 # cp_layla_vox.25 -- disagreement
 cp_layla_vox.25.t:0 "She Does Not Want the Match"
 cp_layla_vox.25.d:0 "The match was the cousin's son, from two villages over. The daughter has said no. She has said it once, clearly, and not changed."
 cp_layla_vox.25.flavor:0 "The cousin's son is a good boy. The cousin's son has a shop. The cousin's son is not, in Layla's daughter's eyes, the man for her, and the daughter has said this in the particular way a girl who knows her own mind says it — not with a scene, not with tears, but with a small repeated sentence that does not change. Ahmed is in favour of the match. Ahmed is not rigid about it; he is simply in favour. Layla is not in favour. Layla has not said this to Ahmed. The daughter looks at her mother across the kitchen tonight. The daughter is asking her mother with her face. What does the mother do?"
 cp_layla_vox.25.a:0 "Argue for the match. Tell her the cousin's son is a good boy and she is being a fool."
 cp_layla_vox.25.b:0 "Retreat. Say it is between her and her father. Do not take a side in front of the child."
 cp_layla_vox.25.c:0 "Concede. Tell her — quietly, not in front of Ahmed — that she too does not think the cousin's son is the match."

 cp_layla_vox.2501.t:0 "A Good Boy Is a Good Boy"
 cp_layla_vox.2501.d:0 "She argues for the match. She hears her own voice and does not entirely recognise it."
 cp_layla_vox.2501.flavor:0 "A good boy is a good boy, she says, and you will not find better in three villages. The daughter does not answer. The daughter's silence is the hardest kind of silence. Layla keeps talking. She talks herself into a position she did not begin in. By the end of it she has said things she does not fully mean — that a woman does not always marry the man she loves, that love is a thing that comes later, that her own mother did not love her own father at the beginning, that she herself did not love Ahmed at the beginning. Two of those four things are not true. She does not say so. The daughter goes to bed without speaking. Layla stands at the oven with a weight in her chest. The weight does not lift in the night. It will not lift for years."
 cp_layla_vox.2501.a:0 "Blow out the lamp."

 cp_layla_vox.2502.t:0 "Not in Front of the Child"
 cp_layla_vox.2502.d:0 "She refuses the fight. It is between you and your father, she says. She does not meet her daughter's eye."
 cp_layla_vox.2502.flavor:0 "The daughter knows what her mother has done. The daughter is not a fool. The daughter goes back to her work. The refusal is a form of betrayal the daughter will not name, and Layla will not name, and which will sit between them for months without a name. Ahmed, who notices these things, notices. He does not ask. He waits for Layla to say it. Layla does not say it. The cousin's son will come tomorrow for tea. The daughter will pour. The daughter will be polite. The mother will pour a second cup for herself to keep her hands busy. A marriage is an endurance, and tonight she has shortened her daughter's by not taking a side."
 cp_layla_vox.2502.a:0 "Start the rice."

 cp_layla_vox.2503.t:0 "Quietly"
 cp_layla_vox.2503.d:0 "She waits until Ahmed goes to the well. Then she says it. The words are small."
 cp_layla_vox.2503.flavor:0 "I do not think he is the one, she says. The daughter looks up. The daughter's relief is a visible thing, which is the point. Layla, who has been loyal to Ahmed in every visible way for twenty years, does not feel she has been disloyal to him tonight. She has been loyal to the daughter, and there is another kind of loyalty, to the older and the quieter one — loyalty to whatever it was her own mother did not do for her. She tells her daughter — do not tell your father I said this. The daughter nods. She will not tell. Ahmed will find out anyway, because he is not a fool, and the conversation they will have will be one of the good ones, because he is not rigid, because they have been married a long time. The cousin's son will not be the match. Somewhere, two villages over, he is washing his hands for no match. He will be all right. He will marry someone else."
 cp_layla_vox.2503.a:0 "Put the kettle on."

 # cp_layla_vox.29 -- fallback
 cp_layla_vox.29.t:0 "The Child Asleep"
 cp_layla_vox.29.d:0 "She is asleep. The night is quiet. There is no scene in this."
 cp_layla_vox.29.flavor:0 "Some nights a daughter is just a daughter asleep in the other room. Layla stands at the doorway with the lamp low. The girl's breath is steady. One arm is thrown above her head the way it was at two and five and twelve and still now. The hair is a darker brown than Layla's was at her age. The face is Ahmed's, except when she smiles, and then it is her grandmother's. Layla watches for a long minute. Then she goes back to the kitchen."
 cp_layla_vox.29.a:0 "Lower the wick."

