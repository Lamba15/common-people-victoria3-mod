 # cp_layla_vox.31 -- kneading, her mother's rhythm
 cp_layla_vox.31.t:0 "The Rhythm of Her Mother's Hands"
 cp_layla_vox.31.d:0 "She is kneading. Her hands are her own. Her rhythm is not."
 cp_layla_vox.31.flavor:0 "Turn, fold, press. Turn, fold, press. She has been kneading since she was eleven. At some point — she does not remember when, twenty years ago, fifteen — the rhythm stopped being a thing she had to think about, and became a thing that happened in her arms without her. Tonight she realises, with the flour on her wrist to the bone, that the rhythm is not hers. It is her mother's. Turn, fold, press — the slight extra press at the end, the tiny lift-and-drop on the turn — these are her mother's. Her own innovation, if she has one, is a small counterclockwise tilt at the fold, and even that might have been her grandmother's, who did the same tilt, and whose mother also. She is a century of women pressing dough. The dough does not know. The dough only rises."
 cp_layla_vox.31.a:0 "Notice the rhythm. Let the noticing be its own small grief."
 cp_layla_vox.31.b:0 "Say aloud something her mother said, in her mother's cadence. Just to hear it."
 cp_layla_vox.31.c:0 "Change the rhythm. Try. See if she can."

 cp_layla_vox.3101.t:0 "The Small Grief"
 cp_layla_vox.3101.d:0 "It is not an unhappiness. It is a weight behind the sternum that does not sit with any one word."
 cp_layla_vox.3101.flavor:0 "She lets it settle. She has learned, since her mother's death, that there are griefs which are not griefs exactly — griefs which are recognitions, acknowledgements that a person is gone who used to stand where a hand now stands alone. Her mother would have called this nothing. Her mother was not given to naming her own weather. But Layla names it, in the secret of her own head, without ceremony: a small grief. The dough does not care. The dough rises. The grief rises with it and sits in the loaf and is baked in and is eaten at breakfast, and the family does not know, and the grief is good for the bread."
 cp_layla_vox.3101.a:0 "Shape the second loaf."

 cp_layla_vox.3102.t:0 "Her Mother's Words"
 cp_layla_vox.3102.d:0 "She says, aloud — bless the flour and the hand that turns it. Her mother said this. No one else in the house does."
 cp_layla_vox.3102.flavor:0 "The words come out in her mother's voice. This is a thing Layla has not practised. She has not said these words aloud in years. But the cadence is exact — the pause after the bless, the slight drop on the turns it — and it is as if her mother is standing behind her, leaning against the same table, watching the same dough. Her hands do not stop. She says the blessing again, because she can. Because no one is here to hear. Because saying it twice is a kind of double prayer, and her mother would have approved."
 cp_layla_vox.3102.a:0 "Continue the kneading."

 cp_layla_vox.3103.t:0 "The Attempt to Change"
 cp_layla_vox.3103.d:0 "She tries. She tries to knead without the small extra press at the end. Her hands refuse."
 cp_layla_vox.3103.flavor:0 "It is like trying to walk differently than one has walked since childhood. The hands go through the motion she asks them to go through — turn, fold, press, no extra press — for one cycle, two. On the third her mother's hands return. Layla is not sure she wills this. Perhaps the dough wills it. Perhaps the rhythm is a property of the dough, older than any one woman's mother. Perhaps it is simply that she does not want to knead without her mother. The attempt is brief and is her private one and is her own. Nothing changes. The bread is her mother's. The bread is hers. Both are true."
 cp_layla_vox.3103.a:0 "Let the dough be."

 # cp_layla_vox.32 -- a dream
 cp_layla_vox.32.t:0 "A Dream"
 cp_layla_vox.32.d:0 "She wakes at the third hour. The dream was her mother at the canal, holding a small fish."
 cp_layla_vox.32.flavor:0 "The canal in the dream was not the real canal; it was the canal of her childhood, which was narrower and clearer and had a different tree above it than the one that stands there now. Her mother was young in the dream. Her mother was younger than Layla is now. Her mother was holding a fish the length of her palm and laughing the way she had laughed before the bad years, which was a laugh Layla has not thought about in a long time. The fish flicked. Her mother said — go home, Layla, before your father wonders. Then Layla woke. She is lying in the dark with the phrase in her ears. Go home, Layla. She does not know which home."
 cp_layla_vox.32.a:0 "Wake fully. Do not return to it. Dreams you chase you lose."
 cp_layla_vox.32.b:0 "Close her eyes. Try to go back. See the fish again."
 cp_layla_vox.32.c:0 "Watch her mother walk past the dream's canal without turning."

 cp_layla_vox.3201.t:0 "She Does Not Chase"
 cp_layla_vox.3201.d:0 "She opens her eyes. She sits up. The dream is already fraying at the edges."
 cp_layla_vox.3201.flavor:0 "Her mother told her once — dreams you chase you lose. She did not understand until the year after her mother's death, when she kept trying to dream her mother back, and dreamed instead of empty rooms. Tonight she does not chase. She sits up. She puts her feet on the cool floor. She looks at the window where the moon is going. She accepts — as a woman accepts the end of a good meal — that the fish and the canal and her mother's laugh are already going. She will keep what she kept. She cannot keep more. She stands. She goes to the water jar and drinks a little."
 cp_layla_vox.3201.a:0 "Return to sleep without the dream."

 cp_layla_vox.3202.t:0 "Trying to Go Back"
 cp_layla_vox.3202.d:0 "She closes her eyes. She breathes the way the imam taught for calm. She goes back."
 cp_layla_vox.3202.flavor:0 "It does not come. The canal is not there. Her mother is not there. There is an image of a blue door Layla has never seen in her life, and a man's voice she does not know, saying something in a language that is close to hers but not hers. She opens her eyes and laughs, very quietly, at herself. The things we try to keep are the things that leave us; the things we do not try to keep come back. Her mother, who knew this, would have laughed at her daughter tonight and said — silly girl, go to sleep. So she goes to sleep. With nothing. Which is, in fact, something."
 cp_layla_vox.3202.a:0 "Sleep."

 cp_layla_vox.3203.t:0 "She Walks Past"
 cp_layla_vox.3203.d:0 "In the dream's last shred her mother turns from the canal and walks the lane and does not look back."
 cp_layla_vox.3203.flavor:0 "It is a harder ending than she wanted. Her mother has walked past her once before — on the day she died, which was not really a walking past but a closing of the eyes, and which Layla has turned in her head a thousand times. Tonight the dream gives her the walking again, cleaner, with the mother's back straight and the lane dusty and the tree at the canal green as spring. She lets it happen. She does not call out. She knows — in the half-sleep she knows many things she does not know awake — that a mother's walking past is also a mother's permission. She turns in the bed. The dream ends. The morning begins, some hours away."
 cp_layla_vox.3203.a:0 "Sleep until the call."

 # cp_layla_vox.33 -- the grave
 cp_layla_vox.33.t:0 "The Stone at the Edge"
 cp_layla_vox.33.d:0 "She has walked to the grave in the old cemetery. The stone is the small one. The edge is white with dust."
 cp_layla_vox.33.flavor:0 "It is Thursday. She has brought nothing, which is the custom and also the truth — she has nothing to bring. She stands. The cemetery is nearly empty. Two women in the far corner are weeping the way women of the village weep, which is with small sounds that do not carry, and a boy is sweeping the path. She looks at the stone. The name on it is her mother's, written in the hand of the clerk who made it, and Layla cannot read the name but knows where the letters are and what order they go in, and that is a kind of reading. She is aware, standing, that more of her life is after her mother than was before. She is also aware that this is not true. Her mother is in the way she kneads, in the way she folds, in the way she speaks to her daughter. Her mother is not at the stone. The stone is only a stone. But it is the stone."
 cp_layla_vox.33.a:0 "Leave a small stone on top, as the custom goes."
 cp_layla_vox.33.b:0 "Say nothing. Stand. Leave."
 cp_layla_vox.33.c:0 "Recite the short Fatiha in her mother's cadence."

 cp_layla_vox.3301.t:0 "The Small Stone"
 cp_layla_vox.3301.d:0 "She finds one at the path's edge. She places it carefully on top of the larger stone."
 cp_layla_vox.3301.flavor:0 "The small stone says — I was here. It does not say much else. It does not have to. She has placed a small stone on her mother's grave every year for fifteen years. There is a row of them along the top. In time, wind and rain will take them. She will put new ones. This is also a kind of writing. A kind of letter. She does not sign it."
 cp_layla_vox.3301.a:0 "Walk home the long way."

 cp_layla_vox.3302.t:0 "She Says Nothing"
 cp_layla_vox.3302.d:0 "She stands for the length of a slow breath, and then another. She leaves."
 cp_layla_vox.3302.flavor:0 "Some visits are silent ones. Her mother taught her that a silence at a grave is a prayer in a different language, and that the dead understand both. She believes this and also does not believe it. What matters is that she came. That the path from her house to the cemetery was walked. That the stone was seen. On the way home she passes the well, where two girls are drawing water and laughing, and she thinks that the dead like the sound of girls laughing at a well. She does not tell anyone this. It is the kind of thing a woman keeps."
 cp_layla_vox.3302.a:0 "Turn at the corner toward the bread house."

 cp_layla_vox.3303.t:0 "The Short Fatiha"
 cp_layla_vox.3303.d:0 "She recites. Not in the imam's cadence. In her mother's."
 cp_layla_vox.3303.flavor:0 "Her mother's Fatiha was always a little slower than the imam's, with the third verse held for a beat longer, and with the sixth verse said almost under the breath. Layla has never known whether this was a piety or a mistake, and has never asked. Tonight — at the stone, under the bright sun — she says it her mother's way, and it is her mother's recitation that rises, and her mother's hands that she feels at her own shoulders, and it is done before she is aware she has begun. She opens her eyes. The cemetery is still. The two women in the far corner have gone. The boy has moved his broom to another path. She folds her palms. She walks home. At home the oven is ready for the first loaf."
 cp_layla_vox.3303.a:0 "Begin the bread."

 # cp_layla_vox.34 -- what her mother would say
 cp_layla_vox.34.t:0 "What Her Mother Would Say"
 cp_layla_vox.34.d:0 "There is a thing happening in the village this week. She does not know what her mother would have said to it."
 cp_layla_vox.34.flavor:0 "It might be the new law, or the new railway, or the factory's hiring, or the strike at the mill, or the bey's son's politics, or the letter the imam read at Friday prayer about the ruler. The thing does not matter to the asking. The asking is — what would my mother have said. Her mother was a quiet woman. Her mother had strong opinions that she did not often share. Her mother had a way of sitting with a new thing for a month before saying anything about it, and then of saying something that was both small and exact. Layla is trying tonight to guess the small exact thing. She has three guesses."
 cp_layla_vox.34.a:0 "Her mother would have said: this is the way of the world, sit with it."
 cp_layla_vox.34.b:0 "Her mother would have said: they will take more before they are done. Watch."
 cp_layla_vox.34.c:0 "Her mother would not have said anything. She would have looked at me a long time."

 cp_layla_vox.3401.t:0 "The Way of the World"
 cp_layla_vox.3401.d:0 "It is the oldest answer. It is the answer that kept three generations alive."
 cp_layla_vox.3401.flavor:0 "Her mother would have said — it is the way of the world, Layla, sit with it. And she would have meant — do not spend yourself on what you cannot change. And she would have meant — keep your daughter fed. And she would have meant — there will be good years. The answer is a loyalty to survival. Layla is tired tonight, and the loyalty to survival is the loyalty she picks up. Tomorrow she will perhaps pick up another. Tonight this one is enough. She is not ashamed of it. A woman who has kept her family alive through famine and war and the bey and the mill has earned her answers."
 cp_layla_vox.3401.a:0 "Sit with it."

 cp_layla_vox.3402.t:0 "They Will Take More"
 cp_layla_vox.3402.d:0 "Her mother said this twice in her life. Layla heard both times. Both times her mother was right."
 cp_layla_vox.3402.flavor:0 "The first time was the year the land tax doubled. The second was the year the wheat was sent down the railway. Her mother did not raise her voice for either. She said — they will take more — in the kitchen, to the wall, while stirring. She said it once and did not say it again. Both times she was right. Tonight, with the new thing in the village, Layla hears her mother saying it over her shoulder, not for comfort but for warning. Layla does not disagree with her mother. She will prepare. She will tell Ahmed. She will set aside what she can. The warning is a gift. She takes it."
 cp_layla_vox.3402.a:0 "Set aside what she can."

 cp_layla_vox.3403.t:0 "The Long Look"
 cp_layla_vox.3403.d:0 "The hardest answer. Her mother's long look, across the kitchen, without words."
 cp_layla_vox.3403.flavor:0 "There were some things her mother did not say because she did not yet know them, and some things she did not say because she did not want Layla to carry them, and some things she did not say because there was nothing to say. The long look was for the third kind. Tonight the thing in the village is the kind her mother would have met with the long look. Layla gives herself the look. It is a hard mercy. It does not solve anything. It tells her — you are alone with this, daughter, and you may sit with it, but you may not pretend that your mother has an answer you can borrow. She puts the stirring spoon down and wipes her hands on the apron and sits on the step for a while, alone, with the long look."
 cp_layla_vox.3403.a:0 "Rise, eventually, and begin the evening."

 # cp_layla_vox.35 -- the child they lost. Ported from cp_conversation.150-153.
 cp_layla_vox.35.t:0 "The One We Lost"
 cp_layla_vox.35.d:0 "She has not rehearsed this speech. She has rehearsed every other topic; this one she has been refusing to rehearse for forty years, because to rehearse it would be to admit it into the category of things that can be said."
 cp_layla_vox.35.flavor:0 "Ummi, she says — her voice is quieter than it has ever been in any of these imagined rooms — I have come tonight about the child we lost. She does not, at first, intend to say the child's name. The child's name is a thing she keeps for her own mouth, for Ahmed's mouth, for the mouth of her mother who said it during the three days the child had it to be said — for those mouths, and no others. In the dream, however, her mother is waiting. Her mother is not, in the dream, impatient. Her mother has the face she had at forty, which is the face Layla has been carrying in her head since her mother died. She says the name. She surprises herself by saying it. The saying of it in this dream — across a kitchen whose table is the kitchen-table of her childhood, before a woman who does not, strictly, exist in a room outside her own head — is, she realises, the first time she has said the name aloud in many years. The name is short. It does not take long to say. After she says it, the dream is quiet for a moment. She continues: the child was ill for three days. The doctor did not come. The reason is complicated; the reason involves the cost of doctors, and the absence of a doctor in this village, and the weather that day which closed the road for the first of the three days. I do not know which of these reasons, Ummi, was the one that mattered. I have spent forty years not knowing. I have come to ask you, tonight, to sit with me in the not-knowing for one minute."
 cp_layla_vox.35.a:0 "Her mother says the comforting sentence — the one Layla has said to other women a dozen times."
 cp_layla_vox.35.b:0 "Her mother does not speak. She sits with Layla on the bench, in the not-knowing."
 cp_layla_vox.35.c:0 "Her mother says a name of her own — the older sister Layla never met."

 cp_layla_vox.3501.t:0 "The Comforting Sentence"
 cp_layla_vox.3501.d:0 "Her mother says the sentence she is supposed to say. The sentence is not wrong. The sentence is also not sufficient."
 cp_layla_vox.3501.flavor:0 "She knows the sentence. She has said it herself — she has said it a dozen times, perhaps more — to other women in the lane when their children were the ones that did not live. She said it to Um Yusuf in the winter of a bad year. She said it to her cousin's wife on a Friday afternoon under the palm at the edge of the courtyard. She said it, once, to a woman she did not even know, at the market, because the woman was standing very still at the vegetable cart and her eyes gave the thing away. The sentence is true. The sentence is also not enough. Her mother, saying it now in the dream, has said it with love, and has said it with the cadence that belongs to mothers who have buried children, and has still said it pre-prepared — because it is the sentence the whole village knows, and her mother was of the village, and her mother's limits are the village's limits. Layla accepts the sentence. She does not argue with a dream. She bows her head. She wakes, some hours later, carrying the child's name in her chest as she carried it in, and carrying now, in addition, the specific disappointment of having let the name out of her chest to a woman who was not, in the end, prepared to catch it."
 cp_layla_vox.3501.a:0 "Wake in the dark."

 cp_layla_vox.3502.t:0 "The Silence"
 cp_layla_vox.3502.d:0 "Her mother does not speak. She does not pretend to. She sits with Layla, in the not-knowing. It is a response Layla had not known to expect, or to hope for."
 cp_layla_vox.3502.flavor:0 "The silence lasts a long time. In the dream — because it is her dream, and because the dream permits this — the silence lasts as long as she needs it to. She does not fill it. Her mother does not fill it. The kitchen, which is the kitchen of her childhood, seems to become, as the silence continues, slightly smaller. After what would have been, in the waking world, perhaps three minutes — an impossibly long silence by any standards she was raised to — her mother says: thank you for telling me her name. Her mother does not say the child's name back to her. Her mother does not ask for the details. Her mother does not offer an explanation, or a blame, or a consolation. Her mother has simply received the name. Her mother has kept it. She will — Layla trusts, in the dream — remember it for some span of time Layla cannot verify, and that is enough, for tonight. She bows more deeply than she had planned to. She wakes. She is crying; she had not expected to cry; she is crying the quiet kind of tears that a woman of her age cries when something has been, for the first time in years, properly heard."
 cp_layla_vox.3502.a:0 "Wake with the dream keeping its word."

 cp_layla_vox.3503.t:0 "Her Mother's Own"
 cp_layla_vox.3503.d:0 "Her mother says the name of her own first child, a sister of Layla's who was born before Layla and did not live. The two of them sit in the dream-kitchen, each holding the name of a daughter."
 cp_layla_vox.3503.flavor:0 "My own — her mother begins, and says a name Layla has heard perhaps three times in her entire life, always spoken at a burial or a remembrance or in a whisper when her father was out of the room. Her mother does not finish the sentence. She does not need to. Layla understands. She understands that in the kitchen she has made — or perhaps outside it, in the lineage she was born into, where women have in fact had children who did not live for as long as there have been villages — the grief she has carried is not a grief that stands alone. Grief is an inheritance. Grief does not ask permission before being handed down. Her mother stands at the far end of the table, holding her firstborn's name. Layla sits at the near end, holding the child she did not bring to his fourth month. For a long moment the two names hang in the air like two lamps in a corridor, and then — in the soft fade of a dream coming to its end — the lamps are blown out, one by one, by the wind that blows through every kitchen whose windows cannot quite be closed. Layla wakes. She does not remember, precisely, which name her mother said. But in the months that follow, she finds — when she thinks of the child who did not live — that the chest-weight is a fraction lighter than it was before the dream. A fraction. Not more. But — at her age, after this many decades — a fraction is a great deal."
 cp_layla_vox.3503.a:0 "Wake with the fraction."

 # cp_layla_vox.39 -- fallback
 cp_layla_vox.39.t:0 "A Rhythm She Cannot Place"
 cp_layla_vox.39.d:0 "She is sweeping. A rhythm comes to her from the broom. It is not hers. It is a rhythm from very early."
 cp_layla_vox.39.flavor:0 "Her mother's, probably. Or her grandmother's. Or some woman in the lineage, from before she was born, whose hand is still in hers. She sweeps. The rhythm takes. She does not analyse it. A woman who analyses an inherited rhythm loses it. She sweeps until the dust is out of the room and into the lane, and then she stops, and the rhythm also stops, and she goes in and washes her hands."
 cp_layla_vox.39.a:0 "Rinse the broom."

