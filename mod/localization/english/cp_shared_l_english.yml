 cp_debug_strong_ig_desc:0 "Temporarily amplified by a debug cheat for testing law enactment."

 # ----- Journal entry: cp_je_common_people -----
 cp_je_common_people:0 "Common People"
 cp_je_common_people_reason:0 "[ROOT.GetCountry.GetCustom('cp_common_people_active_body')]"
 cp_je_common_people_status_gathering:0 "No Common People life is active yet."
 cp_je_common_people_status_quiet:0 "For the moment the country is quiet, which is not the same thing as empty."
 cp_je_common_people_status_qa:0 "A queued Common People scene is waiting to be opened."
 cp_je_common_people_status_personal:0 "The journal is following the active lives. Use the name buttons below for personal check-ins."

 cp_common_people_active_body:0 "[ROOT.GetCountry.GetCustom('cp_common_people_active_slot_1')]\n\n[ROOT.GetCountry.GetCustom('cp_common_people_active_slot_2')]\n\n[ROOT.GetCountry.GetCustom('cp_common_people_active_slot_3')]"
 cp_common_people_active_body_empty:0 "No one has stepped forward yet. The first visible Common People scene will make one life active here."
 cp_common_people_active_slot_empty:0 ""

 cp_roster_layla_line_alive:0 "#b Layla al-Sharif#!\n#v Occupation#! peasant household manager and field worker\n#v Home#! Mīt al-Nakhla, Lower Egypt\n#v State#! [Country.MakeScope.Var('cp_layla_state_pointer').GetState.GetStateRegion.GetName]\n#v Work#! courtyard, canal, and family field\n@clock! age #v [Country.MakeScope.Var('cp_layla_age').GetValue|D]#!  SoL #v [Country.MakeScope.Var('cp_layla_sol').GetValue|1]#!  @popularity! hope #v [Country.MakeScope.Var('cp_layla_hope').GetValue|D]#!  @paper! literacy #v [Country.MakeScope.Var('cp_layla_literacy').GetValue|D]%#!\n[ROOT.GetCountry.GetCustom('cp_roster_layla_current')]\nShe is a Delta peasant woman whose household turns policy into bread, water, children, land papers, and absence. Land reform, war, welfare, schooling, and women's rights reach her as things she can touch or things men keep from her name."
 cp_roster_nour_line_alive:0 "#b Nour#!\n#v Occupation#! shopkeeper and widow\n#v Home#! Mansoura market rooms, Lower Egypt\n#v State#! [Country.MakeScope.Var('cp_nour_state_pointer').GetState.GetStateRegion.GetName]\n#v Work#! counter, chest, rent book, and account paper\n@clock! age #v [Country.MakeScope.Var('cp_nour_age').GetValue|D]#!  SoL #v [Country.MakeScope.Var('cp_nour_sol').GetValue|1]#!  @popularity! hope #v [Country.MakeScope.Var('cp_nour_hope').GetValue|D]#!  @paper! literacy #v [Country.MakeScope.Var('cp_nour_literacy').GetValue|D]%#!\n[ROOT.GetCountry.GetCustom('cp_roster_nour_current')]\nHer life is the small room where money, respectability, widowhood, and property law meet. She watches every receipt because a name on paper can be the difference between a household and a room someone else can take."
 cp_roster_mina_line_alive:0 "#b Mina#!\n#v Occupation#! printer's apprentice\n#v Home#! Faggala church courtyard, Cairo\n#v State#! [Country.MakeScope.Var('cp_mina_state_pointer').GetState.GetStateRegion.GetName]\n#v Work#! print shop, proofs, notices, and type cases\n@clock! age #v [Country.MakeScope.Var('cp_mina_age').GetValue|D]#!  SoL #v [Country.MakeScope.Var('cp_mina_sol').GetValue|1]#!  @popularity! hope #v [Country.MakeScope.Var('cp_mina_hope').GetValue|D]#!  @paper! literacy #v [Country.MakeScope.Var('cp_mina_literacy').GetValue|D]%#!\n[ROOT.GetCountry.GetCustom('cp_roster_mina_current')]\nHe learns the country through ink before he has the power to answer it. Schools, notices, forms, newspapers, and rumors pass through his hands, so education and public information change the meaning of his work."
 cp_roster_zaynab_line_alive:0 "#b Zaynab#!\n#v Occupation#! midwife and sickroom authority\n#v Home#! Mīt al-Nakhla women's courtyards, Lower Egypt\n#v State#! [Country.MakeScope.Var('cp_zaynab_state_pointer').GetState.GetStateRegion.GetName]\n#v Work#! births, fevers, basins, and doorways\n@clock! age #v [Country.MakeScope.Var('cp_zaynab_age').GetValue|D]#!  SoL #v [Country.MakeScope.Var('cp_zaynab_sol').GetValue|1]#!  @popularity! hope #v [Country.MakeScope.Var('cp_zaynab_hope').GetValue|D]#!  @paper! literacy #v [Country.MakeScope.Var('cp_zaynab_literacy').GetValue|D]%#!\n[ROOT.GetCountry.GetCustom('cp_roster_zaynab_current')]\nFamilies call her before they admit fear has entered the house. Public health, hospitals, disease, and trust pass through basin, cloth, fever, and the women who decide when help is safe enough to invite inside."

 cp_roster_bey_line_alive:0 "#b Hassan Bey al-Sayyid#!\n#v Occupation#! landowner and estate master\n#v Home#! al-Sayyid estate outside Mīt al-Nakhla\n#v State#! [Country.MakeScope.Var('cp_bey_state_pointer').GetState.GetStateRegion.GetName]\n#v Work#! tenants, steward, accounts, and visitors' cards\n@clock! age #v [Country.MakeScope.Var('cp_bey_age').GetValue|D]#!  SoL #v [Country.MakeScope.Var('cp_bey_sol').GetValue|1]#!  @popularity! hope #v [Country.MakeScope.Var('cp_bey_hope').GetValue|D]#!  @paper! literacy #v [Country.MakeScope.Var('cp_bey_literacy').GetValue|D]%#!\n[ROOT.GetCountry.GetCustom('cp_roster_bey_current')]\nHe is a landed master watching the old order shrink, still certain that care and command are the same thing. Land reform, tenant laws, factories, and public authority decide whether he adapts or hardens."
 cp_roster_nabil_line_alive:0 "#b Nabil#!\n#v Occupation#! night watchman\n#v Home#! Bab al-Khalq police quarter, Cairo\n#v State#! [Country.MakeScope.Var('cp_nabil_state_pointer').GetState.GetStateRegion.GetName]\n#v Work#! bakery corner, station, square, and complaint bench\n@clock! age #v [Country.MakeScope.Var('cp_nabil_age').GetValue|D]#!  SoL #v [Country.MakeScope.Var('cp_nabil_sol').GetValue|1]#!  @popularity! hope #v [Country.MakeScope.Var('cp_nabil_hope').GetValue|D]#!  @paper! literacy #v [Country.MakeScope.Var('cp_nabil_literacy').GetValue|D]%#!\n[ROOT.GetCountry.GetCustom('cp_roster_nabil_current')]\nHe stands between the state and the street, close enough to hear both breathe. Assembly, policing, dissent, revolution, and disorder shape whether he fears the crowd, the uniform, or both."
 cp_roster_rashid_line_alive:0 "#b Rashid al-Katib#!\n#v Occupation#! low clerk\n#v Home#! Abdeen office quarter, Cairo\n#v State#! [Country.MakeScope.Var('cp_rashid_state_pointer').GetState.GetStateRegion.GetName]\n#v Work#! counter, seal, archive drawer, and copied names\n@clock! age #v [Country.MakeScope.Var('cp_rashid_age').GetValue|D]#!  SoL #v [Country.MakeScope.Var('cp_rashid_sol').GetValue|1]#!  @popularity! hope #v [Country.MakeScope.Var('cp_rashid_hope').GetValue|D]#!  @paper! literacy #v [Country.MakeScope.Var('cp_rashid_literacy').GetValue|D]%#!\n[ROOT.GetCountry.GetCustom('cp_roster_rashid_current')]\nHe knows how a life can become a line, and how a line can be copied badly. Bureaucracy, records, identity papers, and office discipline turn the state into a desk directly in front of him."
 cp_roster_salma_line_alive:0 "#b Salma Farag#!\n#v Occupation#! switchboard clerk\n#v Home#! Ataba exchange rooms, Cairo\n#v State#! [Country.MakeScope.Var('cp_salma_state_pointer').GetState.GetStateRegion.GetName]\n#v Work#! wires, plugs, night bell, and borrowed voices\n@clock! age #v [Country.MakeScope.Var('cp_salma_age').GetValue|D]#!  SoL #v [Country.MakeScope.Var('cp_salma_sol').GetValue|1]#!  @popularity! hope #v [Country.MakeScope.Var('cp_salma_hope').GetValue|D]#!  @paper! literacy #v [Country.MakeScope.Var('cp_salma_literacy').GetValue|D]%#!\n[ROOT.GetCountry.GetCustom('cp_roster_salma_current')]\nShe works where private voices become infrastructure. Wires, light, offices, electricity, telephones, and radio decide when her life becomes visible and what privacy costs in a modern room."

 cp_roster_samier_line_alive:0 "#b Samier#!\n#v Occupation#! factory laborer\n#v Home#! Bulaq workers' lodging, Cairo\n#v State#! [Country.MakeScope.Var('cp_samier_state_pointer').GetState.GetStateRegion.GetName]\n#v Work#! gate, shift bell, machine floor, and pay line\n@clock! age #v [Country.MakeScope.Var('cp_samier_age').GetValue|D]#!  SoL #v [Country.MakeScope.Var('cp_samier_sol').GetValue|1]#!  @popularity! hope #v [Country.MakeScope.Var('cp_samier_hope').GetValue|D]#!  @paper! literacy #v [Country.MakeScope.Var('cp_samier_literacy').GetValue|D]%#!\n[ROOT.GetCountry.GetCustom('cp_roster_samier_current')]\nHe learns politics through the body before slogans give it words. Shift bells, fines, hunger, unsafe machines, and worker protections decide whether the factory is wage, injury, or organized anger."
 cp_roster_tarek_line_alive:0 "#b Tarek al-Rashidi#!\n#v Occupation#! factory owner and former landed son\n#v Home#! Fayoum family estate and Bulaq town house\n#v State#! [Country.MakeScope.Var('cp_tarek_state_pointer').GetState.GetStateRegion.GetName]\n#v Work#! mill ledger, boiler, gate, and account book\n@clock! age #v [Country.MakeScope.Var('cp_tarek_age').GetValue|D]#!  SoL #v [Country.MakeScope.Var('cp_tarek_sol').GetValue|1]#!  @popularity! hope #v [Country.MakeScope.Var('cp_tarek_hope').GetValue|D]#!  @paper! literacy #v [Country.MakeScope.Var('cp_tarek_literacy').GetValue|D]%#!\n[ROOT.GetCountry.GetCustom('cp_roster_tarek_current')]\nHe is a landed son turned factory owner, grieving the old estate while building a harsher room. Industry, labor law, and property reform decide what kind of master he becomes."
 cp_roster_karim_line_alive:0 "#b Karim al-Nahhas#!\n#v Occupation#! machinist\n#v Home#! Bulaq workshop quarter, Cairo\n#v State#! [Country.MakeScope.Var('cp_karim_state_pointer').GetState.GetStateRegion.GetName]\n#v Work#! tool bench, gauges, engines, steel, and broken fingers\n@clock! age #v [Country.MakeScope.Var('cp_karim_age').GetValue|D]#!  SoL #v [Country.MakeScope.Var('cp_karim_sol').GetValue|1]#!  @popularity! hope #v [Country.MakeScope.Var('cp_karim_hope').GetValue|D]#!  @paper! literacy #v [Country.MakeScope.Var('cp_karim_literacy').GetValue|D]%#!\n[ROOT.GetCountry.GetCustom('cp_roster_karim_current')]\nHe stands close enough to the gears to hear what will fail. Machine tools, engines, safety, strikes, and skilled wages are his pressure points because each one reaches the hand first."
 cp_roster_mansur_line_alive:0 "#b Mansur al-Mahalla#!\n#v Occupation#! migrant textile worker\n#v Home#! al-Mahalla al-Kubra rented bed\n#v State#! [Country.MakeScope.Var('cp_mansur_state_pointer').GetState.GetStateRegion.GetName]\n#v Work#! loom room, meal tin, wage token, and remittance line\n@clock! age #v [Country.MakeScope.Var('cp_mansur_age').GetValue|D]#!  SoL #v [Country.MakeScope.Var('cp_mansur_sol').GetValue|1]#!  @popularity! hope #v [Country.MakeScope.Var('cp_mansur_hope').GetValue|D]#!  @paper! literacy #v [Country.MakeScope.Var('cp_mansur_literacy').GetValue|D]%#!\n[ROOT.GetCountry.GetCustom('cp_roster_mansur_current')]\nHe is young enough for the factory to look like escape and tired enough to learn its price quickly. Manufacturing, city growth, first wage, bed rent, remittance, and hunger decide whether work becomes a future or a trap."

 cp_roster_soldier_line_alive:0 "#b Yusuf ibn Mahmud#!\n#v Occupation#! soldier and conscript\n#v Home#! Kafr al-Gindi family house, Lower Egypt\n#v State#! [Country.MakeScope.Var('cp_soldier_state_pointer').GetState.GetStateRegion.GetName]\n#v Work#! barracks, ration line, rifle, and road\n@clock! age #v [Country.MakeScope.Var('cp_soldier_age').GetValue|D]#!  SoL #v [Country.MakeScope.Var('cp_soldier_sol').GetValue|1]#!  @popularity! hope #v [Country.MakeScope.Var('cp_soldier_hope').GetValue|D]#!  @paper! literacy #v [Country.MakeScope.Var('cp_soldier_literacy').GetValue|D]%#!\n[ROOT.GetCountry.GetCustom('cp_roster_soldier_current')]\nHe measures the state by notice, ration, rifle, and letter. War and demobilization decide whether the country is uniform, hunger, road dust, or the home he is trying to return to."
 cp_roster_farid_line_alive:0 "#b Farid al-Haddad#!\n#v Occupation#! railway porter and errand runner\n#v Home#! Tanta station road, Lower Egypt\n#v State#! [Country.MakeScope.Var('cp_farid_state_pointer').GetState.GetStateRegion.GetName]\n#v Work#! platform, lamps, parcel bag, telegraph wire, and carriage step\n@clock! age #v [Country.MakeScope.Var('cp_farid_age').GetValue|D]#!  SoL #v [Country.MakeScope.Var('cp_farid_sol').GetValue|1]#!  @popularity! hope #v [Country.MakeScope.Var('cp_farid_hope').GetValue|D]#!  @paper! literacy #v [Country.MakeScope.Var('cp_farid_literacy').GetValue|D]%#!\n[ROOT.GetCountry.GetCustom('cp_roster_farid_current')]\nHe meets modernization as weight, distance, and orders shouted across a platform. Railways, telegraphy, lamps, parcels, and bruised shoulders turn infrastructure into his daily body."
 cp_roster_dawud_line_alive:0 "#b Dawud Hanna#!\n#v Occupation#! dockworker\n#v Home#! Alexandria port quarter\n#v State#! [Country.MakeScope.Var('cp_dawud_state_pointer').GetState.GetStateRegion.GetName]\n#v Work#! quay, rope, salt floor, manifest room, cranes, and steamships\n@clock! age #v [Country.MakeScope.Var('cp_dawud_age').GetValue|D]#!  SoL #v [Country.MakeScope.Var('cp_dawud_sol').GetValue|1]#!  @popularity! hope #v [Country.MakeScope.Var('cp_dawud_hope').GetValue|D]#!  @paper! literacy #v [Country.MakeScope.Var('cp_dawud_literacy').GetValue|D]%#!\n[ROOT.GetCountry.GetCustom('cp_roster_dawud_current')]\nHe knows trade from the end that burns the hands. Rope burn, salt, manifests, cranes, steamships, cargo smoke, and port growth decide when commerce becomes ordinary labor."
 cp_roster_huda_line_alive:0 "#b Huda al-Matariya#!\n#v Occupation#! lodger and day laborer\n#v Home#! al-Matariya upstairs room, Cairo\n#v State#! [Country.MakeScope.Var('cp_huda_state_pointer').GetState.GetStateRegion.GetName]\n#v Work#! streets, planks, roof patch, water stairs, and rent book\n@clock! age #v [Country.MakeScope.Var('cp_huda_age').GetValue|D]#!  SoL #v [Country.MakeScope.Var('cp_huda_sol').GetValue|1]#!  @popularity! hope #v [Country.MakeScope.Var('cp_huda_hope').GetValue|D]#!  @paper! literacy #v [Country.MakeScope.Var('cp_huda_literacy').GetValue|D]%#!\n[ROOT.GetCountry.GetCustom('cp_roster_huda_current')]\nShe lives where modernization becomes a bill, a leak, a road plank, or a stair to climb with water. Rented rooms, roof repairs, sewers, trade centers, and streets under repair decide what progress costs at night."

 # Shared JE current-life sentences
 cp_roster_layla_current_war:0 "Now: Ahmed is away with the army, and the house measures time by letters that do not come."
 cp_roster_layla_current_widow:0 "Now: Ahmed is gone, and the ordinary tasks have become the shape grief is allowed to take."
 cp_roster_layla_current_serfdom:0 "Now: the bey's hand is back over the village, so every errand is also a calculation."
 cp_roster_layla_current_land:0 "Now: the field is hers on paper, and she checks the borders as if paper can still be stolen by weather."
 cp_roster_layla_current_city:0 "Now: the city has entered her life through stairs, wages, crowded rooms, and the hour when work finally stops."
 cp_roster_layla_current_default:0 "Now: she is still in the Delta, counting bread, water, children, and the small private margin between worry and hope."
 cp_roster_bey_current_factory:0 "Now: factories and account books are making the estate feel less like inheritance and more like an argument."
 cp_roster_bey_current_commercialized:0 "Now: land is being priced in a language he understands too well and trusts too little."
 cp_roster_bey_current_serfdom:0 "Now: old obligations have returned to the village, and even his confidence has begun to sound like a defense."
 cp_roster_bey_current_visitors:0 "Now: visitors arrive with cards and calculations, measuring the estate as if lineage were already collateral."
 cp_roster_bey_current_homesteading:0 "Now: the field papers have made authority feel smaller, because ink can stand where his steward once stood."
 cp_roster_bey_current_default:0 "Now: the old order still stands near him, but it has begun to sound hollow when servants cross the room."
 cp_roster_soldier_current_war:0 "Now: he is under orders, and the state reaches him as ration, rifle, dust, and the next name on the roll."
 cp_roster_soldier_current_return:0 "Now: he has come back from service, but parts of the road home stayed inside him."
 cp_roster_soldier_current_arsenal:0 "Now: modern weapons have made the barracks less simple; metal, paperwork, and fear arrive together."
 cp_roster_soldier_current_letter:0 "Now: the folded letter is carried longer than it needs to be, because paper can be touched when home cannot."
 cp_roster_soldier_current_beans:0 "Now: supper in the barracks is ordinary again, which is how the army teaches waiting."
 cp_roster_soldier_current_notice:0 "Now: the first notice has made the uniform less an idea than a date written against his name."
 cp_roster_soldier_current_default:0 "Now: he waits in uniform or near it, close enough to war that peace feels temporary."
 cp_roster_nour_current_paper:0 "Now: she has paper enough to argue with a landlord, which is not safety but is no longer silence."
 cp_roster_nour_current_register:0 "Now: the public register has noticed her household, and being noticed has become both shield and risk."
 cp_roster_nour_current_key:0 "Now: the key under the pillow is still checked by touch before sleep."
 cp_roster_nour_current_morning:0 "Now: the morning account is counted twice, once for money and once for what can still be refused."
 cp_roster_nour_current_rent:0 "Now: the rent receipt is kept where smoke and children cannot reach it."
 cp_roster_nour_current_default:0 "Now: rent, account, widowhood, and property law meet in the small room where she keeps the chest."
 cp_roster_mina_current_schools:0 "Now: school primers pass through his hands, and the letters look less like work than future."
 cp_roster_mina_current_notices:0 "Now: public notices come off the press, carrying the state into courtyards where rumor used to go first."
 cp_roster_mina_current_catalogues:0 "Now: catalogues and office forms have made print orderly, profitable, and a little less innocent."
 cp_roster_mina_current_courtyard:0 "Now: the courtyard sheet is read aloud by someone else, and he listens for which words survive the room."
 cp_roster_mina_current_night:0 "Now: the night proof has left ink under his nails and a sentence he cannot stop correcting in his head."
 cp_roster_mina_current_default:0 "Now: ink, type, church bells, and city talk teach him which words travel fastest."
 cp_roster_zaynab_current_health:0 "Now: modern health measures have reached her basin and cloth, changing what families dare expect."
 cp_roster_zaynab_current_fever:0 "Now: fever has made her authority heavier; people call for her before they admit they are afraid."
 cp_roster_zaynab_current_night:0 "Now: the long night after the birth still clings to her hands when she washes them."
 cp_roster_zaynab_current_thread:0 "Now: the thread around the wrist is small enough to hide and serious enough to remember."
 cp_roster_zaynab_current_public_health:0 "Now: doctors and rules have entered the doorway, and she is deciding which kind of help families will trust."
 cp_roster_zaynab_current_default:0 "Now: she carries birth and sickness from doorway to doorway, trusted because she remains."
 cp_roster_samier_current_law:0 "Now: worker protections have entered the factory as words on paper, and he is measuring them against the bell."
 cp_roster_samier_current_injury:0 "Now: the red thread at the machine is remembered by every man who works too close to iron."
 cp_roster_samier_current_false:0 "Now: stolen minutes and fines have made the clock itself feel like management."
 cp_roster_samier_current_letters:0 "Now: letters after the bell have made the factory follow him home in other men's handwriting."
 cp_roster_samier_current_gate:0 "Now: bread at the gate has made hunger public, and public hunger is harder to dismiss."
 cp_roster_samier_current_default:0 "Now: factory smoke has made him visible, but not yet safe."
 cp_roster_tarek_current_law:0 "Now: labor law has put limits around command, and he is deciding whether limits are insult or warning."
 cp_roster_tarek_current_boiler:0 "Now: the new boiler makes profit sound like pressure under metal."
 cp_roster_tarek_current_gate:0 "Now: the locked gate has taught him what ownership looks like from the other side."
 cp_roster_tarek_current_chimney:0 "Now: the second chimney promises scale, and scale has begun to require a colder kind of attention."
 cp_roster_tarek_current_account:0 "Now: the account book is teaching him that mercy and loss can be written in the same column."
 cp_roster_tarek_current_default:0 "Now: he is caught between estate memory and factory arithmetic."
 cp_roster_farid_current_telegraph:0 "Now: telegraph wires have made the station feel attached to every distant order."
 cp_roster_farid_current_carriage:0 "Now: the new carriage runs smoother than the bodies that load it."
 cp_roster_farid_current_parcel:0 "Now: parcels, errands, lamps, and bruised shoulders have made infrastructure personal."
 cp_roster_farid_current_night:0 "Now: the night shift has taught him the station's sounds after officials stop listening."
 cp_roster_farid_current_rail:0 "Now: stones for the embankment have made the railway arrive first as weight."
 cp_roster_farid_current_default:0 "Now: the platform is his clock, his street, and the place where progress becomes weight."
 cp_roster_dawud_current_cranes:0 "Now: cranes and steam have changed the dock's rhythm, but rope burn still writes the day on his hands."
 cp_roster_dawud_current_tariff:0 "Now: tariffs and manifests pass over his head, then return as sacks to be lifted."
 cp_roster_dawud_current_manifest:0 "Now: the manifest room has shown him that cargo has names before labor touches it."
 cp_roster_dawud_current_salt:0 "Now: salt on the floor makes each step sting, and the ledger never learns that part of trade."
 cp_roster_dawud_current_steamship:0 "Now: the steamship has made the quay faster, louder, and no kinder to the hands tying it down."
 cp_roster_dawud_current_default:0 "Now: salt, rope, smoke, and shouted numbers decide how trade feels at ground level."
 cp_roster_rashid_current_id:0 "Now: identity papers have made names dangerous in a new, official way."
 cp_roster_rashid_current_archive:0 "Now: the archive room has taught him that a life can disappear if the drawer is wrong."
 cp_roster_rashid_current_seal:0 "Now: the new seal makes the office heavier; every stamp sounds like permission."
 cp_roster_rashid_current_drawer:0 "Now: the numbered drawer has made disorder look clean, which is the most frightening kind."
 cp_roster_rashid_current_ink:0 "Now: dust in the ink reminds him that even official words can smear before they harden."
 cp_roster_rashid_current_default:0 "Now: he copies names carefully because he has seen what a careless name can do."
 cp_roster_salma_current_radio:0 "Now: radio has widened the room beyond the wall, and voices arrive without asking permission."
 cp_roster_salma_current_light:0 "Now: electric light has lengthened the workday and sharpened every shadow under it."
 cp_roster_salma_current_fuse:0 "Now: the burned fuse has made her skill visible at the exact moment danger did."
 cp_roster_salma_current_crossed:0 "Now: the crossed line has left one voice in the wrong place, and she knows how quickly privacy can vanish."
 cp_roster_salma_current_night:0 "Now: the night bell makes the office feel less empty than watched."
 cp_roster_salma_current_default:0 "Now: she sits near the wires, close to other people's urgent voices."
 cp_roster_karim_current_engine:0 "Now: engines and machine tools are teaching his hands a newer, more dangerous grammar."
 cp_roster_karim_current_finger:0 "Now: the broken finger is still counted in the shop, even when the foreman does not count it."
 cp_roster_karim_current_gauge:0 "Now: the night gauge keeps him awake because numbers can fail before metal does."
 cp_roster_karim_current_steel:0 "Now: the color of the steel tells him what the foreman asks too late."
 cp_roster_karim_current_tool:0 "Now: the tool bench has become his school, strict and bright with oil."
 cp_roster_karim_current_default:0 "Now: he knows which gear sounds wrong before anyone else hears it."
 cp_roster_huda_current_water:0 "Now: clean water and sewers have reached the street, but the room upstairs still has its old damp smell."
 cp_roster_huda_current_rent:0 "Now: the rent book has made modernization monthly, exact, and hard to argue with."
 cp_roster_huda_current_roof:0 "Now: the roof patch holds for tonight, which is sometimes the whole demand of progress."
 cp_roster_huda_current_road:0 "Now: the white road is smooth under other people's shoes, and she remembers the dust it cost."
 cp_roster_huda_current_building:0 "Now: planks cover the open street, and every errand asks her to step around progress carefully."
 cp_roster_huda_current_default:0 "Now: city growth has found her as stairs, leaks, street work, and rent due before sleep."
 cp_roster_nabil_current_square:0 "Now: the square after the shouting is quieter than the square before it, and he trusts neither silence."
 cp_roster_nabil_current_rifles:0 "Now: rifles near the bakery have made order smell of bread and metal."
 cp_roster_nabil_current_station:0 "Now: the new station brings strangers, orders, and trouble with polished shoes."
 cp_roster_nabil_current_complaint:0 "Now: the complaint bench has taught him how anger changes when someone writes it down."
 cp_roster_nabil_current_lost:0 "Now: the lost boy remains in his mind as proof that disorder has a child's face before it has a slogan."
 cp_roster_nabil_current_default:0 "Now: he watches the street for the moment ordinary noise turns political."
 cp_roster_mansur_current_wage:0 "Now: the first wage token has made the factory both proof and debt."
 cp_roster_mansur_current_belt:0 "Now: the belt does not stop, and he has begun to understand that speed is a kind of command."
 cp_roster_mansur_current_rent:0 "Now: bed rent has made the city count him by the night."
 cp_roster_mansur_current_meal:0 "Now: the meal tin is clean too quickly, and hunger has learned the factory clock."
 cp_roster_mansur_current_remittance:0 "Now: money sent home has made absence useful, which does not make it lighter."
 cp_roster_mansur_current_default:0 "Now: the loom room is still new enough to feel like escape, and old enough to feel like hunger."

